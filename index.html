de elaborar sua Demonstração dos Fluxos de Caixa de acordo com o método direto ou com o método indireto. De acordo com a NBC TG 03 (R3) – DEMONSTRAÇÃO DOS FLUXOS DE CAIXA, a diferença entre as duas demonstrações elaboradas consiste somente na apresentação"}],"opts":["da atividade operacional.","da atividade de investimento.","da atividade de financiamento.","do caixa e equivalentes de caixa."],"gabStatus":"Definitivo","ass":"DFC (fluxo de caixa)","exp":"Os dois métodos diferem só na apresentação do fluxo das atividades operacionais: o direto mostra recebimentos e pagamentos brutos, e o indireto parte do lucro e ajusta. Investimento, financiamento e o saldo final de caixa são iguais nos dois."},{"id":"2024.2-21","ed":"2024.2","n":21,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Em 01/06/2024, uma joalheria adquiriu 40 anéis pelo valor unitário de R$ 800. O frete para a entrega e o seguro do transporte foram, respectivamente, de R$ 500 e R$ 1.600. Os valores foram pagos à vista pela joalheria. O custo do estoque no balanço patrimonial da joalheria, antes do início das vendas, é de"}],"opts":["R$ 32.000.","R$ 32.500.","R$ 33.600.","R$ 34.100."],"gabStatus":"Definitivo","ass":"Estoques (custo, PEPS, VRL)","exp":"O custo do estoque inclui compra, frete e seguro: 40 × 800 = 32.000, mais 500 de frete e 1.600 de seguro = 34.100."},{"id":"2024.2-22","ed":"2024.2","n":22,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Em 01/05/2022, uma loja de roupas pagou R$ 180.000 a terceiros, referentes ao aluguel antecipado de 3 anos do imóvel onde funcionava a sua loja, contados a partir da data de pagamento. Em 31/12/2023, a despesa antecipada de aluguel no ativo realizável a longo prazo da loja era"}],"opts":["zero.","R$ 20.000.","R$ 60.000.","R$ 80.000."],"gabStatus":"Definitivo","ass":"Operações básicas (competência, folha, lançamentos)","exp":"Aluguel de 180.000 por 36 meses = 5.000 ao mês. De 01/05/2022 a 31/12/2023 passaram 20 meses (100.000), sobrando 80.000, que cobrem 16 meses. Os próximos 12 meses (60.000) são curto prazo, e os 4 restantes (20.000) são realizável a longo prazo."},{"id":"2024.2-23","ed":"2024.2","n":23,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Em janeiro de 2024, a despesa relacionada a salários de uma sociedade empresária era de R$ 500.000. Desse valor, R$ 120.000 representava imposto de renda retido na fonte. Assinale a opção que indica o lançamento contábil realizado em 31/01/2024 para reconhecer os efeitos decorrentes do fato, considerando que os salários da entidade são pagos no 5º dia útil do mês seguinte ao do fato gerador."}],"opts":["D - Despesa de salários R$ 380.000 D - Despesa de IR R$ 120.000 C - salários a pagar R$ 500.000","D - Despesa de salários R$ 380.000 D - Despesa de IR R$ 120.000 C - IR na fonte a recolher R$ 120.000 C - salários a pagar R$ 380.000","D - Despesa de salários R$ 500.000 C - IR na fonte a recolher R$ 120.000 C - salários a pagar R$ 380.000","D - Despesa de salários R$ 500.000 C - salários a pagar R$ 500.000"],"gabStatus":"Definitivo","ass":"Operações básicas (competência, folha, lançamentos)","exp":"Despesa de salários pelo valor total (500.000), com crédito de IR retido a recolher (120.000) e salários a pagar (380.000). O IR retido é obrigação com o governo, não despesa da empresa."},{"id":"2024.2-24","ed":"2024.2","n":24,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Assinale a opção que indica uma conta do passivo de uma entidade que não deve ser classificada como passivo circulante de acordo com a NBC TG 26 (R5) – APRESENTAÇÃO DAS DEMONSTRAÇÕES CONTÁBEIS."}],"opts":["Imposto de renda diferido.","Empréstimo contraído de diretor.","Receita recebida antecipadamente.","Adiantamento recebido de sociedade controlada."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"A NBC TG 26 diz que ativos e passivos fiscais diferidos nunca são classificados como circulantes. Então o imposto de renda diferido fica no não circulante. As outras contas podem ser circulantes."},{"id":"2024.2-25","ed":"2024.2","n":25,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Uma loja de roupas funciona em um imóvel alugado de terceiros. A despesa com aluguel é classificada na Demonstração do Valor Adicionado da loja como"}],"opts":["insumos adquiridos de terceiros.","remuneração de capitais próprios.","remuneração de capitais de terceiros.","depreciação, amortização e exaustão."],"gabStatus":"Definitivo","ass":"DVA","exp":"Aluguel pago a terceiros é remuneração de capitais de terceiros na distribuição da riqueza, junto com juros. Remuneração de capitais próprios é lucro e dividendos."},{"id":"2024.2-26","ed":"2024.2","n":26,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"De acordo com a NBC TG 36 (R3) – DEMONSTRAÇÕES CONSOLIDADAS, o investidor, independentemente da natureza de seu envolvimento com a investida, deve determinar se é controlador avaliando se controla a investida. Em relação ao controle, considere os itens a seguir:"},{"t":"p","x":"I. Poder sobre a investida."},{"t":"p","x":"II. Exposição a, ou direitos sobre, retornos variáveis decorrentes de seu envolvimento com a investida."},{"t":"p","x":"III. Capacidade de utilizar seu poder sobre a investida para afetar o valor de seus retornos."},{"t":"p","x":"IV. Mais do que a metade das ações com poder de voto da investida. O investidor controla a investida se possuir os atributos apresentados em"}],"opts":["I, II e IV, somente.","I e III, somente.","II, III e IV, somente.","I, II e III, somente."],"gabStatus":"Definitivo","ass":"Investimentos, equivalência, consolidação, combinação","exp":"Controle exige poder sobre a investida, exposição a retornos variáveis e capacidade de usar o poder para afetar esses retornos (I, II e III). Ter mais da metade dos votos é um indício comum, mas não é o requisito."},{"id":"2024.2-27","ed":"2024.2","n":27,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Um hospital localizado no Centro da cidade adquiriu um terreno ao lado de seu prédio para a construção de um estacionamento para ser utilizado, exclusivamente, pelos pacientes, de modo a oferecer melhor atendimento. No Balanço Patrimonial do hospital, o terreno deve ser classificado como"}],"opts":["Ativo Imobilizado.","Ativo Realizável a Longo Prazo.","Propriedade para investimento.","Ativo não circulante mantido para a venda."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Terreno para estacionamento usado pelos pacientes, ou seja, apoiando a atividade do hospital, é imobilizado. Não é para aluguel ou valorização (propriedade para investimento), nem está à venda."},{"id":"2024.2-28","ed":"2024.2","n":28,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Com relação às Demonstrações Financeiras, de acordo com a Lei nº 6.404/76 e modificações, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa."},{"t":"p","x":"( ) As demonstrações de cada exercício serão publicadas com a indicação dos valores correspondentes das demonstrações do exercício anterior."},{"t":"p","x":"( ) Nas demonstrações, não poderá haver agrupamento de contas semelhantes."},{"t":"p","x":"( ) As demonstrações financeiras registrarão a destinação dos lucros segundo a proposta dos órgãos da administração, e o valor será considerado definitivo."},{"t":"p","x":"( ) As demonstrações serão complementadas por notas explicativas e outros quadros analíticos ou demonstrações contábeis necessárias para esclarecimento da situação patrimonial e dos resultados do exercício. As afirmativas são, respectivamente,"}],"opts":["V – V – F – F.","V – F – F – V.","F – V – F – V.","V – F – V – F."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"Verdadeiras: a publicação traz os valores do exercício anterior, e as demonstrações são complementadas por notas explicativas. Falsa: contas semelhantes podem ser agrupadas. Falsa: a destinação dos lucros é proposta da administração e depende da assembleia, então não é definitiva. Resposta: V, F, F, V."},{"id":"2024.2-29","ed":"2024.2","n":29,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"O ativo fiscal diferido é o valor do tributo sobre o lucro recuperável em período futuro relacionado ao que se afirma a seguir, com exceção de"}],"opts":["diferenças temporárias dedutíveis.","diferenças temporárias tributáveis.","compensação futura de prejuízos fiscais não utilizados.","compensação futura de créditos fiscais não utilizados."],"gabStatus":"Definitivo","ass":"Outras normas (AVP, arrendamento, instr. financeiros, tributos diferidos, câmbio, segmentos, mantido p/ venda)","exp":"Ativo fiscal diferido vem de diferenças temporárias dedutíveis, de prejuízos fiscais a compensar e de créditos fiscais não utilizados. Diferenças temporárias tributáveis geram passivo fiscal diferido, não ativo."},{"id":"2024.2-30","ed":"2024.2","n":30,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"A Cia. Verde Amarela é uma empresa brasileira que vende objetos relacionados à Seleção Masculina de Futebol. Em 31/12/2022, a empresa apresentou lucro líquido de R$ 800.000 em sua Demonstração do Resultado do Exercício. No entanto, estimou que o lucro apresentaria uma redução de 80% em 2023. Com a finalidade de segregar uma parcela do lucro em 2022, a Cia. Verde Amarela poderia constituir, em 31/12/2022,"}],"opts":["reserva para contingências.","reserva de lucros a realizar.","reserva de lucros para expansão.","ajuste de avaliação patrimonial."],"gabStatus":"Definitivo","ass":"DRE, receitas (TG 47), DRA","exp":"Para separar parte do lucro de 2022 prevendo queda em 2023, a empresa pode constituir reserva para contingências, que antecipa uma perda futura julgada provável. Reserva de lucros a realizar e de expansão têm outras finalidades, e ajuste de avaliação patrimonial nem é reserva de lucros."},{"id":"2024.2-31","ed":"2024.2","n":31,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Um curso de idiomas oferecia aulas de inglês, espanhol e japonês. Em 2024, a gerência do curso resolveu extinguir a oferta de aulas de japonês e espanhol, passando a oferecer apenas aulas de inglês. A reorganização dos cursos teve efeito material na natureza e no foco das operações do curso, de modo que foi constituída uma provisão para reestruturação. Assinale a opção que indica gastos que podem ser incluídos no valor da provisão."}],"opts":["Novo treinamento da equipe permanente.","Investimento em novos sistemas e redes de distribuição.","Gastos incrementais de marketing relacionado ao curso de inglês.","Indenização aos proprietários das salas onde eram ofertados os cursos e que deixaram de ser utilizadas."],"gabStatus":"Definitivo","ass":"Outras normas (AVP, arrendamento, instr. financeiros, tributos diferidos, câmbio, segmentos, mantido p/ venda)","exp":"A provisão de reestruturação inclui só gastos diretamente decorrentes da reestruturação e não ligados às atividades que continuam, como indenizações por rescisão de contratos. Treinamento da equipe que fica, marketing e novos sistemas ficam de fora."},{"id":"2024.2-32","ed":"2024.2","n":32,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Em 01/01/2020, uma sociedade empresária adquiriu uma van para transportar os seus empregados por R$ 300.000. A vida útil foi estimada em 15 anos e não foi considerado valor residual. Em 2023, essa van apresentou diversos problemas que ocasionaram gastos de R$ 24.000 com reparos. Por conta dos problemas, a sociedade empresária decidiu comprar uma nova van e, em 31/12/2023, vendeu a antiga por R$ 250.000. O lucro obtido com a venda da van, considerando que a sociedade empresária utiliza o método da linha reta para depreciar os seus ativos imobilizados, foi de"}],"opts":["R$ 6.000.","R$ 10.000.","R$ 28.000.","R$ 30.000."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Depreciação anual: 300.000 ÷ 15 = 20.000. De 2020 a 2023 são 4 anos, ou 80.000, e o valor contábil é 220.000. Venda por 250.000 dá lucro de 30.000. Os reparos de 24.000 são despesa de manutenção e não mudam o valor contábil."},{"id":"2024.2-33","ed":"2024.2","n":33,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Uma sociedade empresária elaborou a seguinte Demonstração do Resultado do Exercício:"},{"t":"pre","x":"Receita de Vendas                                                 100.000\nCusto dos produtos e serviços vendidos                            -50.000\nLucro bruto                                                        50.000\nOutras receitas                                                    20.000\nDespesas de vendas                                                 -5.000\nDespesas administrativas                                          -10.000\nOutras despesas                                                   -12.000\nResultado antes dos tributos                                       43.000"},{"t":"p","x":"De acordo com a NBC TG 26 (R5) – APRESENTAÇÃO DAS DEMONSTRAÇÕES CONTÁBEIS, a demonstração é elaborada de acordo com o método da"}],"opts":["função da despesa e não é necessária divulgação adicional.","natureza da despesa e não é necessária divulgação adicional.","função da despesa e a sociedade empresária deve divulgar informação adicional sobre a natureza das despesas.","natureza da despesa e a sociedade empresária deve divulgar informação adicional sobre a função das despesas."],"gabStatus":"Definitivo","ass":"DRE, receitas (TG 47), DRA","exp":"A DRE mostra custo dos produtos vendidos, despesas de vendas e administrativas, que é o método da função da despesa. Nesse método, a NBC TG 26 exige divulgar informação adicional sobre a natureza das despesas."},{"id":"2024.2-34","ed":"2024.2","n":34,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Em 31/12/2023, uma loja de cosméticos apresentava os seguintes saldos em seu Balanço Patrimonial: Disponibilidades: R$ 55.000; Estoques: R$ 30.000; Clientes: R$ 20.000; Equipamentos de Informática: R$ 45.000; Salários a pagar: R$ 15.000; Empréstimos: R$ 35.000; Capital Social: R$ 120.000; Prejuízos Acumulados: R$ 20.000. No primeiro trimestre de 2024, aconteceram os seguintes fatos:"},{"t":"p","x":"• Venda, à vista, de todo o estoque por R$ 80.000;"},{"t":"p","x":"• Recebimento do saldo dos clientes;"},{"t":"p","x":"• Venda, à vista, dos equipamentos de informática por R$ 60.000;"},{"t":"p","x":"• Pagamento dos salários do ano anterior;"},{"t":"p","x":"• Pagamento do empréstimo bancário contraído;"},{"t":"p","x":"• Reconhecimento e pagamento de despesas gerais por R$ 100.000. Em relação ao primeiro trimestre de 2024, é correto afirmar que a atividade operacional"}],"opts":["gerou fluxo líquido de caixa no montante de R$ 10.000.","gerou fluxo líquido de caixa no montante de R$ 45.000.","consumiu fluxo líquido de caixa no montante de R$ 15.000.","consumiu fluxo líquido de caixa no montante de R$ 35.000."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"Atividade operacional: venda de estoque 80.000 + recebimento de clientes 20.000 − pagamento de salários 15.000 − despesas gerais 100.000 = −15.000, ou seja, consumo de caixa. A venda de equipamentos é investimento e o pagamento do empréstimo é financiamento."},{"id":"2024.2-35","ed":"2024.2","n":35,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Avalie se as divulgações relacionadas aos estoques de uma sociedade empresária devem incluir:"},{"t":"p","x":"I. valor de estoques reconhecido como despesa durante o período;"},{"t":"p","x":"II. valor de estoques escriturados pelo valor justo menos os custos de venda;"},{"t":"p","x":"III. valor total escriturado em estoques e o valor registrado em outras contas apropriadas para a entidade. De acordo com a NBC TG 16 (R2) – ESTOQUES, está correto o que se afirma em"}],"opts":["I e II, somente.","I e III, somente.","II e III, somente.","I, II e III."],"gabStatus":"Definitivo","ass":"Estoques (custo, PEPS, VRL)","exp":"A NBC TG 16 exige divulgar o valor de estoques reconhecido como despesa no período, o valor de estoques escriturados pelo valor justo menos custos de venda e o valor total escriturado, com a classificação apropriada. As três estão certas."},{"id":"2024.2-36","ed":"2024.2","n":36,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"As Notas Explicativas são informações complementares às demonstrações contábeis exigidas pela Lei nº 6.404/76 e alterações. Sobre as Notas Explicativas, analise as seguintes afirmativas:"},{"t":"p","x":"I. As Notas Explicativas devem apresentar informações sobre a base de preparação das demonstrações financeiras e das práticas contábeis específicas selecionadas e aplicadas para negócios e eventos significativos."},{"t":"p","x":"II. É obrigatória a indicação de eventos subsequentes à data de encerramento do exercício, mesmo aqueles que não tenham efeito relevante sobre a situação financeira e os resultados futuros da companhia."},{"t":"p","x":"III. A entidade pode retificar políticas contábeis inadequadas por meio da divulgação de notas explicativas. Está correto o que se afirma em"}],"opts":["I, II e III.","I e II, apenas.","II e III, apenas.","I, apenas."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"Só a I está certa. A II erra: só se divulgam eventos subsequentes relevantes, e não os sem efeito relevante. A III erra: política contábil inadequada não se corrige por nota explicativa."},{"id":"2024.2-37","ed":"2024.2","n":37,"mat":"Custos","gab":"*","stem":[{"t":"p","x":"Uma empresa comercial apresentou, no mês de abril de X0, as seguintes movimentações em seu estoque:"},{"t":"p","x":"Data Movimentação 01.04 Estoque Inicial: 200 unidades por R$ 10 a unidade 08.04 Compras de 210 unidades por R$ 12 a unidade"},{"t":"pre","x":"10.04     Devolução de compras em 08.04: 50 unidades"},{"t":"p","x":"12.04 Vendas de 150 unidades por R$ 22 a unidade"},{"t":"pre","x":"17.04     Devolução de vendas de 10.04: 30 unidades"},{"t":"p","x":"22.04 Compras de 150 unidades por R$ 15 a unidade"},{"t":"p","x":"Considerando que a empresa utilize o método PEPS para controle de estoques, assinale a opção que contenha o Custo das Mercadorias vendidas para o período e o valor do estoque final em 30.04.X0, respectivamente. Desconsidere quaisquer aspectos tributários."}],"opts":["R$ 1.500; R$ 3.770.","R$ 1.200; R$ 4.970.","R$ 1.500; R$ 4.970.","R$ 1.200; R$ 3.770."],"gabStatus":"Definitivo"},{"id":"2024.2-38","ed":"2024.2","n":38,"mat":"Custos","gab":"B","stem":[{"t":"p","x":"Uma indústria fabrica um determinado produto cuja produção passa por dois departamentos até ser finalizada. Em junho de 2024 foram extraídos os seguintes dados dos controles internos dessa indústria:"},{"t":"pre","x":"                                 Departamento 1   Departamento 2\nSaldo inicial                            0                 0\nUnidades iniciadas em junho          100.000             80.000\nUnidades finalizadas em junho        80.000              40.000\nMatéria-prima (R$)                   120.000             80.000\nMatéria-prima (kg)                      100                40\nMão-de-obra direta (R$)              140.000             100.000\nMão-de-obra direta (hora)               120               180\nEstágio de fabricação                 60%                 10%"},{"t":"p","x":"Os custos indiretos de fabricação totalizaram R$ 500.000 e são apropriados aos departamentos com base na quantidade de horas de mão-de-obra direta. Considerando-se exclusivamente os dados acima e levando-se em consideração o conceito de equivalente de produção, o custo unitário da produção finalizada em junho de 2024 foi de"}],"opts":["R$ 15,91.","R$ 20,00.","R$ 22,00.","R$ 25,00."],"gabStatus":"Definitivo","exp":"Departamento 1: custo total 460.000 (MP 120.000 + MOD 140.000 + CIF 200.000, rateado por 120 das 300 horas) ÷ 92.000 unidades equivalentes (80.000 + 20.000 × 60%) = 5 por unidade. Departamento 2: custos próprios 480.000 (MP 80.000 + MOD 100.000 + CIF 300.000) mais 400.000 recebidos do departamento 1 = 880.000, dividido por 44.000 equivalentes (40.000 + 40.000 × 10%) = 20,00."},{"id":"2024.2-39","ed":"2024.2","n":39,"mat":"Custos","gab":"C","stem":[{"t":"p","x":"A empresa Montes Altos S.A., que planeja e controla seus custos utilizando o custo padrão, levantou as informações abaixo referentes ao mês de junho de 2024:"},{"t":"pre","x":"Itens                       Custo Padrão                  Custo Real\nMatéria prima               20 kg a R$ 10,00/kg           19 kg a R$ 11,00/kg\nMão de obra direta          2 h a R$ 20,00/h              3h a R$ 18,00/h\nEmbalagem                   10 folhas a R$ 1,00/folha     10 folhas a R$ 0,90/folha\nCustos indiretos            R$ 30.000,00                  R$ 32.000,00\nUnidades produzidas         15.000                        14.900"},{"t":"p","x":"Considerando apenas as informações apresentadas, a variação de preço unitária da matéria prima foi, em reais, de"}],"opts":["R$ 19,00 desfavorável.","R$ 19,00 favorável.","R$ 20,00 desfavorável.","R$ 20,00 favorável."],"gabStatus":"Definitivo","exp":"Pelo método usual em Custos, a variação de preço é a diferença de preço × quantidade padrão: (11 − 10) × 20 kg = 20 desfavorável (o preço real foi maior que o padrão). A variação de quantidade seria (19 − 20) × 10 = 10 favorável, e a mista é a diferença dos dois fatores multiplicados."},{"id":"2024.2-40","ed":"2024.2","n":40,"mat":"Análise / Gerencial / Controladoria","gab":"B","stem":[{"t":"p","x":"A empresa Recife Contabilidade e Assessoria Ltda. oferece dois tipos de serviços contábeis: Legalização de Empresas e Escrituração Contábil. A empresa projeta os seguintes volumes anuais de serviços para cada categoria: Legalização de Empresas: 10 projetos por ano; Escrituração Contábil: 20 empresas por ano. Os custos diretos e o preço cobrado por cada serviço são os seguintes:"},{"t":"pre","x":"Serviço                               Custos Diretos                              Preço do serviço\nLegalização de Empresa                R$ 2.500 por projeto                        R$ 10.000 por projeto\nEscrituração Contábil                 R$ 15.600 por empresa/ano                   R$ 36.000 por empresa/ano"},{"t":"p","x":"A empresa verificou que os custos indiretos, que totalizavam R$ 265.000 ao ano, se referiam às seguintes atividades:"},{"t":"p","x":"• Captação de clientes: R$ 25.000 por ano"},{"t":"p","x":"• Análise documental: R$ 50.000 por ano"},{"t":"p","x":"• Elaboração e emissão de relatórios: R$ 190.000 por ano"},{"t":"p","x":"A administração fez um levantamento dos direcionadores de custos anuais dessas atividades. São eles:"},{"t":"p","x":"Tempo de captação de clientes (em horas): Legalização de empresa = 12.960 (60%); Escrituração contábil = 8.640 (40%); Total = 21.600."},{"t":"p","x":"Número de lotes de documentação analisada: Legalização de empresa = 9.225 (25%); Escrituração contábil = 27.675 (75%); Total = 36.900."},{"t":"p","x":"Número de relatórios elaborados e emitidos: Legalização de empresa = 636 (1%); Escrituração contábil = 62.964 (99%); Total = 63.600."},{"t":"p","x":"Diante desses dados, o custo total anual do serviço Legalização de Empresa usando o Custeio Baseado em Atividades (ABC) é de"}],"opts":["R$ 31.900.","R$ 54.400.","R$ 29.400.","R$ 47.821."],"gabStatus":"Definitivo","exp":"ABC para Legalização. Custos diretos: 10 × 2.500 = 25.000. Captação: 60% × 25.000 = 15.000. Análise documental: 25% × 50.000 = 12.500. Relatórios: 1% × 190.000 = 1.900. Indiretos = 29.400. Total: 25.000 + 29.400 = 54.400."},{"id":"2024.2-41","ed":"2024.2","n":41,"mat":"Análise / Gerencial / Controladoria","gab":"B","stem":[{"t":"p","x":"Um analista realizou a análise horizontal do balanço patrimonial de dois supermercados com a finalidade de recomendar o investimento em um deles. Um fato que pode ser constatado diretamente por meio dessa análise é"}],"opts":["a diminuição das despesas de salários.","o aumento das obrigações com terceiros.","a mudança na composição do resultado obtido.","a abrangência do ativo circulante em relação ao total do ativo."],"gabStatus":"Definitivo","exp":"Análise horizontal compara o mesmo item ao longo do tempo (ou entre períodos). Dá para ver que as obrigações com terceiros (passivo exigível) subiram. Salários e resultado estão na DRE, e a participação do circulante no total do ativo é análise vertical."},{"id":"2024.2-42","ed":"2024.2","n":42,"mat":"Análise / Gerencial / Controladoria","gab":"A","stem":[{"t":"p","x":"Em 31/12/2023, um supermercado apresentava os seguintes saldos em seu Balanço Patrimonial: Clientes (60 dias): R$ 20.000; Estoque de produtos não perecíveis: R$ 30.000; Estoque de produtos com data de validade de até 90 dias: R$ 40.000; Disponibilidades: R$ 50.000; Estoque de produtos com data de validade de 91 a 360 dias: R$ 60.000; Fornecedores (90 dias): R$ 70.000; Empréstimos (720 dias): R$ 130.000; Móveis e utensílios: R$ 150.000; Patrimônio Líquido: R$ 150.000. A liquidez imediata do supermercado em 31/12/2023 foi de"}],"opts":["0,71.","1,00.","1,29.","0,25."],"gabStatus":"Definitivo","exp":"Liquidez imediata = Disponibilidades ÷ Passivo circulante. Passivo circulante: fornecedores a 90 dias = 70.000 (empréstimo de 720 dias é longo prazo). 50.000 ÷ 70.000 ≈ 0,71."},{"id":"2024.2-43","ed":"2024.2","n":43,"mat":"Setor Público","gab":"A","stem":[{"t":"p","x":"Em 01/01/2024, o Governo de um Estado assinou um contrato com uma entidade terceirizada para a construção de uma nova linha de metrô. De acordo com o contrato, o Governo deverá pagar R$ 800 milhões ao longo de dez anos, e a obra tem previsão de duração de 4 anos. No momento da assinatura do contrato, o impacto no Balanço Patrimonial do Governo será:"}],"opts":["nenhum.","aumento e diminuição de R$ 800 milhões no ativo.","aumento de R$ 800 milhões no ativo e no passivo.","diminuição de R$ 800 milhões no ativo e no patrimônio líquido."],"gabStatus":"Definitivo","exp":"O contrato é executório: as partes ainda não cumpriram nada. O ativo e o passivo vão sendo reconhecidos conforme a obra for executada e medida, então no momento da assinatura não há efeito no Balanço Patrimonial."},{"id":"2024.2-44","ed":"2024.2","n":44,"mat":"Setor Público","gab":"C","stem":[{"t":"p","x":"De acordo com o Manual de Contabilidade Aplicada ao Setor Público (MCASP), entre os objetivos do Plano de Contas Aplicado ao Setor Público está distinguir os registros de natureza patrimonial, orçamentária e de controle. A natureza de informação de controle registra, processa e evidencia os atos de gestão com função específica de controle, bem como aqueles"}],"opts":["cujos efeitos são apenas de longo prazo.","relacionados ao planejamento e à execução orçamentária.","cujos efeitos possam produzir modificações no patrimônio da entidade do setor público.","relacionados com a composição do patrimônio público e suas variações qualitativas e quantitativas."],"gabStatus":"Definitivo","exp":"No plano de contas do MCASP, a informação de controle registra atos de gestão com função específica de controle e também atos cujos efeitos possam produzir modificações no patrimônio. As alternativas B e D descrevem as naturezas orçamentária e patrimonial."},{"id":"2024.2-45","ed":"2024.2","n":45,"mat":"Setor Público","gab":"A","stem":[{"t":"p","x":"As receitas orçamentárias podem ser classificadas como Receitas Correntes e Receitas de Capital. Assinale a opção que indica apenas receitas correntes."}],"opts":["patrimonial e agropecuária.","patrimonial e alienação de bens.","operações de crédito e agropecuária.","alienação de bens e operações de crédito."],"gabStatus":"Definitivo","exp":"Receitas correntes: tributária, de contribuições, patrimonial, agropecuária, industrial, de serviços e transferências correntes. Alienação de bens e operações de crédito são receitas de capital."},{"id":"2024.2-46","ed":"2024.2","n":46,"mat":"Análise / Gerencial / Controladoria","gab":"C","stem":[{"t":"p","x":"Em relação a compliance, analise as afirmativas abaixo:"},{"t":"p","x":"I. Compliance é a busca permanente de coerência entre aquilo que se espera de uma organização e o que ela, de fato, pratica no dia a dia."},{"t":"p","x":"II. O programa de compliance de uma organização deve abranger um conjunto de mecanismos e procedimentos, políticas, diretrizes, código de conduta, canal de denúncias e demais instrumentos com o objetivo de prevenir, detectar e sanar desvios de conduta, fraudes, atos de corrupção, lavagem de dinheiro, atos ilícitos praticados contra a administração pública, dentre outras questões."},{"t":"p","x":"III. Os auditores externos (independentes) devem se comprometer e apoiar o fomento da cultura ética e o fortalecimento do programa de compliance da organização que auditam."},{"t":"p","x":"IV. O comitê de auditoria estatutário deve declarar ostensiva e publicamente a importância dos valores e das políticas que compõem o programa de compliance da organização, atuando sempre de maneira inequívoca e coerente com aquilo que pregam. Estão corretas as afirmativas"}],"opts":["I, II e III.","II e IV, apenas.","I e II, apenas.","III e IV, apenas."],"gabStatus":"Definitivo","exp":"Pelo gabarito, I e II estão corretas: compliance é coerência entre o esperado e o praticado, e o programa reúne políticas, código de conduta, canal de denúncias e mecanismos para prevenir, detectar e sanar desvios. III e IV não entram no gabarito."},{"id":"2024.2-47","ed":"2024.2","n":47,"mat":"Auditoria","gab":"D","stem":[{"t":"p","x":"A Estrutura Conceitual para Trabalhos de Asseguração define os objetivos e elementos essenciais dos serviços de auditoria, destacando a importância de uma abordagem sistemática e disciplinada na emissão de opiniões. Os dois tipos de trabalho de asseguração são"}],"opts":["a Direta e a Indireta.","a Limitada e a Direta.","a Razoável e a Indireta.","a Limitada e Razoável."],"gabStatus":"Definitivo","exp":"Os dois tipos de trabalho de asseguração são o de asseguração limitada e o de asseguração razoável."},{"id":"2024.2-48","ed":"2024.2","n":48,"mat":"Auditoria","gab":"C","stem":[{"t":"p","x":"O auditor João Batista, ao realizar um trabalho de auditoria para a AXT Ltda., constatou deficiências no controle interno da entidade e, ao aplicar testes, verificou que tais deficiências eram significativas, individualmente ou em conjunto. Considerando os postulados da NBC TA 265 – COMUNICAÇÃO DE DEFICIÊNCIAS DE CONTROLE INTERNO, o procedimento adequado a ser seguido por João Batista nessa situação é"}],"opts":["declarar isenção por se tratar de assuntos internos da entidade.","confrontar diretamente o Controle Interno.","reportar por escrito as deficiências encontradas tempestivamente a administração.","registrar em ata, e divulgar ao término da auditoria."],"gabStatus":"Definitivo","exp":"Deficiências significativas de controle interno devem ser comunicadas por escrito, tempestivamente, à administração (e aos responsáveis pela governança)."},{"id":"2024.2-49","ed":"2024.2","n":49,"mat":"Perícia","gab":"B","stem":[{"t":"p","x":"A perícia contábil é essencial para garantir uma solução justa e fundamentada em litígios, tanto judiciais quanto extrajudiciais, ao fornecer uma análise técnica e científica acerca dos fatos envolvidos. De acordo com a NBC TP 01 – PERÍCIA CONTÁBIL, o principal objetivo da perícia contábil no contexto judicial e extrajudicial é"}],"opts":["avaliar o desempenho financeiro das empresas envolvidas no litígio.","fornecer elementos de prova necessários para subsidiar a justa solução do litígio.","estabelecer a culpa das partes envolvidas no processo.","emitir pareceres financeiros para fins de auditoria interna."],"gabStatus":"Definitivo","exp":"O objetivo da perícia contábil, judicial ou extrajudicial, é levar elementos de prova necessários à justa solução do litígio. Não é avaliar desempenho nem apontar culpados."},{"id":"2024.2-50","ed":"2024.2","n":50,"mat":"Perícia","gab":"A","stem":[{"t":"p","x":"A sociedade empresária “Alfa e Ômega Ltda.” é uma sociedade limitada composta por três sócios: João, Maria e Pedro. Os percentuais de participação no capital social são os seguintes: João 40%, Maria 35%, e Pedro 25%. A sociedade empresária está avaliada com os seguintes valores em 31 de dezembro de 20XX: Ativo Circulante: R$ 1.200.000; Ativo Não Circulante: R$ 2.500.000; Passivo Circulante: R$ 800.000; Passivo Não Circulante: R$ 1.000.000; Patrimônio Líquido (excluindo o goodwill): R$ 1.900.000. Recentemente, foi acordado que Pedro deixará a sociedade. De acordo com o contrato social, a apuração de haveres deve considerar o valor de mercado dos ativos, incluindo o valor do goodwill da empresa, que foi avaliado em R$ 500.000. Além disso, o contrato prevê um deságio de 10% sobre o valor de mercado total apurado, considerando riscos associados ao futuro da empresa. Nesse caso, (i) o valor total de mercado da empresa antes de aplicar o deságio, (ii) o valor líquido de mercado da empresa após aplicar o deságio, (iii) o valor dos haveres de Pedro, considerando sua participação na sociedade e o valor líquido apurado da empresa e (iv) se Pedro também tivesse um empréstimo pessoal de R$ 150.000 junto à empresa, o valor final a ser recebido por ele após a compensação deste empréstimo seriam, respectivamente,"}],"opts":["(i) R$ 2.400.000 / (ii) R$ 2.160.000 / (iii) R$ 540.000 / (iv) R$ 390.000.","(i) R$ 1.400.000 / (ii) R$ 1.260.000 / (iii) R$ 315.000 / (iv) R$ 165.000.","(i) R$ 1.900.000 / (ii) R$ 1.710.000 / (iii) R$ 427.500 / (iv) R$ 227.500.","(i) R$ 1.400.000 / (ii) R$ 1.260.000 / (iii) R$ 315.000 / (iv) R$ 465.000. ESPAÇO PARA RASCUNHO ESPAÇO PARA RASCUNHO ESPAÇO PARA RASCUNHO ESPAÇO PARA RASCUNHO Realização"],"gabStatus":"Definitivo","exp":"Valor de mercado = PL sem goodwill 1.900.000 + goodwill 500.000 = 2.400.000. Com deságio de 10%: 2.160.000. Haveres de Pedro (25%): 540.000. Compensando o empréstimo pessoal de 150.000: 390.000."},{"id":"2025.1-1","ed":"2025.1","n":1,"mat":"Português","gab":"A","stem":[{"t":"p","x":"Um cartaz, na porta de um supermercado, dizia: “Compre hoje! Amanhã pode estar mais caro!” Esse cartaz"}],"opts":["aconselha o cliente a economizar.","dá ordem ao cliente para ganhar tempo.","chama a atenção do cliente para a possível falta de produtos.","pretende ensinar o cliente a controlar seu orçamento."],"gabStatus":"Definitivo","exp":"O cartaz alerta que o preço pode subir amanhã e sugere comprar hoje, ou seja, aconselha economizar. Não é ordem para ganhar tempo nem fala de falta de produtos."},{"id":"2025.1-2","ed":"2025.1","n":2,"mat":"Português","gab":"*","stem":[{"t":"p","x":"Um famoso escritor falou sobre a leitura: “A leitura é para a mente o que a ginástica é para o corpo.” Com essa frase, o autor quer dizer que"}],"opts":["exercícios físicos devem ser feitos todos os dias.","a leitura, como a ginástica, deve ser feita diariamente.","a leitura enriquece o nosso conhecimento.","exercícios físicos e leitura fortalecem o corpo."],"gabStatus":"Definitivo"},{"id":"2025.1-3","ed":"2025.1","n":3,"mat":"Mat. Financeira / Estatística","gab":"D","stem":[{"t":"p","x":"Uma caixa contém seis bolas brancas e quatro bolas azuis, todas de mesmo tamanho. Se sortearmos ao acaso 3 dessas bolas, sem reposição, a probabilidade de que todas sejam brancas é igual a"}],"opts":["1/3.","1/4.","1/5.","1/6."],"gabStatus":"Definitivo","exp":"Sem reposição: 6/10 × 5/9 × 4/8 = 120/720 = 1/6."},{"id":"2025.1-4","ed":"2025.1","n":4,"mat":"Mat. Financeira / Estatística","gab":"B","stem":[{"t":"p","x":"Em 2023, uma universidade tradicional que, até então, só ofertava cursos presenciais de graduação, resolveu se arriscar em um novo projeto. Tratava-se da abertura de seu primeiro curso 100% à distância a ser disponibilizado ao mercado. Para tal, ainda em 2023, foram investidos R$ 100.000,00 para a estruturação do referido curso. Além disso, foram estimadas despesas e receitas anuais conforme dados apresentados na sequência:"},{"t":"pre","x":" Ano           Receitas             Despesas\n2024         R$ 50.000,00         R$ 35.000,00\n2025         R$ 65.000,00         R$ 30.000,00\n2026         R$ 80.000,00         R$ 30.000,00\n2027         R$ 90.000,00         R$ 20.000,00\n2028         R$ 90.000,00         R$ 20.000,00"},{"t":"p","x":"Considerando as informações apresentadas, é possível determinar que o payback simples ocorreu em"}],"opts":["2025.","2026.","2027.","2028."],"gabStatus":"Definitivo","exp":"Fluxo líquido: 2024 = 15.000, 2025 = 35.000 (acumulado 50.000), 2026 = 50.000 (acumulado 100.000). O investimento de 100.000 é recuperado ao fim de 2026."},{"id":"2025.1-5","ed":"2025.1","n":5,"mat":"Direito","gab":"C","stem":[{"t":"p","x":"Avalie se os princípios da Administração Pública incluem:"},{"t":"p","x":"I. a legalidade;"},{"t":"p","x":"II. a moralidade;"},{"t":"p","x":"III. a livre concorrência;"},{"t":"p","x":"IV. a publicidade. São de fato princípios da Administração Pública os itens"}],"opts":["I e II, apenas.","II, III e IV, apenas.","I, II e IV, apenas.","I, II, III e IV."],"gabStatus":"Definitivo","exp":"Princípios expressos da Administração Pública (art. 37 da Constituição): legalidade, impessoalidade, moralidade, publicidade e eficiência. Livre concorrência é princípio da ordem econômica, não da Administração."},{"id":"2025.1-6","ed":"2025.1","n":6,"mat":"Direito","gab":"C","stem":[{"t":"p","x":"Entre as limitações ao poder de tributar, previstas na Constituição Federal de 1988, estão os princípios gerais do Direito Tributário que, além de estabelecer limites ao poder de tributar, garantem segurança jurídica e justiça fiscal. Sobre esse tema, assinale a afirmativa correta."}],"opts":["O princípio da anterioridade nonagesimal ou noventena estabelece que nenhum tributo pode ser cobrado antes de decorridos 90 dias da data da publicação da sua instituição ou majoração, exceto as contribuições sociais, que podem ser exigidas imediatamente.","O princípio da legalidade tributária determina que nenhum tributo pode ser instituído ou majorado sem previsão em lei complementar.","O princípio da isonomia garante tratamento igualitário a todos que se encontram em situação equivalente, sendo proibida qualquer distinção em razão de ocupação profissional ou função por eles exercida, independentemente da denominação jurídica dos rendimentos, títulos ou direitos.","O princípio da irretroatividade veda a aplicação da lei a ato ou fato pretérito, ainda que a lei seja expressamente interpretativa."],"gabStatus":"Definitivo","exp":"Isonomia: tratamento igual a quem está em situação equivalente, sem distinção por ocupação ou função. A está errada porque a contribuição social tem noventena própria (não é exigível imediatamente). B erra porque a regra geral é lei ordinária. D erra porque a lei interpretativa pode retroagir."},{"id":"2025.1-7","ed":"2025.1","n":7,"mat":"Direito","gab":"B","stem":[{"t":"p","x":"A empresa Alfa Indústria Ltda. realizou, ao final do mês de julho, o levantamento de suas obrigações tributárias, verificando os seguintes tributos devidos:"},{"t":"p","x":"• ICMS (Imposto sobre Circulação de Mercadorias e Serviços): incidente sobre as operações de vendas realizadas no período."},{"t":"p","x":"• ISS (Imposto sobre Serviços): devido pelos serviços prestados."},{"t":"p","x":"• IRPJ (Imposto sobre a Renda das Pessoas Jurídicas): apurado sobre a renda tributável do exercício."},{"t":"p","x":"Com base nessas informações, a contabilidade da empresa elaborou um demonstrativo das obrigações tributárias a pagar. De acordo com os conceitos de obrigação tributária e tributo, assinale a afirmativa correta."}],"opts":["O ISS e o ICMS são impostos de mesma competência tributária, pois ambos são devidos aos Estados.","A obrigação tributária principal consiste no pagamento do tributo devido, enquanto a obrigação tributária acessória está relacionada a deveres instrumentais, como a emissão de notas fiscais e declarações ao Fisco.","O IRPJ, por ser um imposto sobre a renda, é classificado como um tributo indireto, pois seu ônus pode ser repassado ao consumidor.","O fato gerador do ICMS ocorre quando a empresa apura seus lucros ao final do exercício contábil."],"gabStatus":"Definitivo","exp":"Obrigação principal é pagar o tributo (ou penalidade). Acessória são deveres instrumentais como emitir nota e entregar declarações. ISS é municipal e ICMS estadual, o IRPJ é direto, e o fato gerador do ICMS é a circulação da mercadoria."},{"id":"2025.1-8","ed":"2025.1","n":8,"mat":"Ética","gab":"B","stem":[{"t":"p","x":"De acordo com o CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR em seu item 3: “Este código de ética profissional do contador se aplica também ao _____, no exercício de suas prerrogativas profissionais.” A lacuna fica corretamente preenchida por"}],"opts":["empresário contábil.","técnico em contabilidade.","administrador de empresas.","gestor financeiro."],"gabStatus":"Definitivo","exp":"O Código de Ética vale também para o técnico em contabilidade, no exercício de suas prerrogativas profissionais."},{"id":"2025.1-9","ed":"2025.1","n":9,"mat":"Ética","gab":"D","stem":[{"t":"p","x":"A NBC PG 01 tem por objetivo fixar a conduta do contador, quando no exercício da sua atividade e nos assuntos relacionados à profissão e à classe. Com base na NBC PG 01 é correto afirmar que o contador pode"}],"opts":["se utilizar de posição ocupada em entidades de classe para benefício próprio ou para proveito pessoal.","fazer afirmações desproporcionais sobre os serviços que oferece, sua capacitação ou sobre a experiência que possui.","se apropriar de trabalhos, iniciativas ou de soluções encontradas por colegas, que deles não tenha participado, apresentando-os como próprios.","indicar, em qualquer modalidade ou veículo de comunicação, os títulos, as especializações, os serviços oferecidos, os trabalhos realizados e a relação de clientes, quando ela for autorizada por eles."],"gabStatus":"Definitivo","exp":"O contador pode indicar títulos, especializações, serviços, trabalhos e relação de clientes em qualquer meio, desde que os clientes autorizem. As demais condutas (usar cargo em benefício próprio, afirmações desproporcionais, apropriar-se do trabalho de colegas) são vedadas."},{"id":"2025.1-10","ed":"2025.1","n":10,"mat":"Contabilidade Geral","gab":"*","stem":[{"t":"p","x":"Para que um passivo se qualifique para reconhecimento, é necessário haver não somente uma obrigação presente, mas também a probabilidade de saída de recursos que incorporem benefícios econômicos para liquidar essa obrigação. No caso de uma Provisão, o reconhecimento se dá quando: (a) a entidade tem uma obrigação presente (legal ou não formalizada) como resultado de evento passado; (b) seja provável uma necessária saída de recursos que incorporem benefícios econômicos para liquidar a obrigação; e (c) possa ser feita uma estimativa confiável do valor da obrigação. Se essas condições não forem satisfeitas, nenhuma provisão deve ser reconhecida. Em relação ao reconhecimento de um PASSIVO CONTINGENTE, de acordo com a NBC TG 25 (R2), é correto afirmar que"}],"opts":["não é reconhecido e nem divulgado em notas explicativas.","não é reconhecido, mas é divulgado em notas explicativas.","é reconhecido e divulgado em notas explicativas.","é reconhecido, mas não é divulgado em notas explicativas."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação"},{"id":"2025.1-11","ed":"2025.1","n":11,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Um supermercado funciona na região sul do país. Em maio de 2024, devido às fortes chuvas, o supermercado perdeu todo o seu estoque. Nas demonstrações contábeis mensais, em 31/05/24, o supermercado optou por baixar todo o estoque, mesmo sem ter recebido um laudo oficial, de modo a tornar as demonstrações mais úteis aos tomadores de decisões. A informação apresenta a seguinte característica qualitativa:"}],"opts":["neutralidade.","materialidade.","verificabilidade.","tempestividade."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Baixar o estoque na data do balanço, antes do laudo oficial, para que a informação chegue a tempo de ajudar decisões, é tempestividade. É a característica de ter a informação disponível a tempo de influenciar quem decide."},{"id":"2025.1-12","ed":"2025.1","n":12,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"De acordo com a NBC TG Estrutura Conceitual- ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, as demonstrações contábeis consolidadas fornecem informações sobre os ativos, passivos, patrimônio líquido, receitas e despesas"}],"opts":["apenas das controladas.","apenas da controladora.","da controladora e de suas controladas, como entidades independentes.","da controladora e de suas controladas, como uma única entidade que reporta."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Demonstrações consolidadas apresentam controladora e controladas como se fossem uma única entidade que reporta. Não é só da controladora, não é só das controladas e não trata cada uma como independente."},{"id":"2025.1-13","ed":"2025.1","n":13,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"De acordo com a NBC TG Estrutura Conceitual - ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, patrimônio líquido é a participação nos ativos da entidade após"}],"opts":["a dedução de seus passivos.","a dedução de suas despesas.","o acréscimo de suas receitas.","o acréscimo de seus passivos."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Patrimônio líquido é a participação residual nos ativos depois de deduzidos todos os passivos. É a conta que fecha: PL = Ativo − Passivo."},{"id":"2025.1-14","ed":"2025.1","n":14,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Segundo a NBC TG ESTRUTURA CONCEITUAL, para a representação dos relatórios financeiros ser fidedigna ela precisa ser"}],"opts":["completa, neutra e isenta de erros.","confiável, tempestiva e com erros mínimos.","tempestiva, útil e comparável.","consistente, completa e compreensível."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Para ser fidedigna, a representação deve ser completa, neutra e isenta de erros. As outras opções misturam características de melhoria, como tempestividade, comparabilidade e compreensibilidade."},{"id":"2025.1-15","ed":"2025.1","n":15,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Segundo a NBC TG 26 (R5) - APRESENTAÇÃO DAS DEMONSTRAÇÕES CONTÁBEIS, quando da elaboração de demonstrações contábeis, a administração deve avaliar a capacidade de a entidade continuar em operação no futuro previsível, o que significa que as demonstrações contábeis devem ser elaboradas no pressuposto da"}],"opts":["continuidade, a menos que a administração tenha a intenção de liquidar a entidade ou cessar seus negócios, ou ainda não possua uma alternativa realista senão a descontinuidade de suas atividades.","competência, sendo os itens reconhecidos como ativos, passivos, patrimônio líquido, receitas e despesas, inclusive para a demonstração de fluxo de caixa.","materialidade e agregação, tendo a entidade que apresentar conjuntamente nas demonstrações contábeis cada classe material de itens semelhantes, aglutinando os de natureza ou função distinta mesmo que sejam materiais.","compensação de valores, ativos e passivos ou receitas e despesas devem ser compensados, exceto quando permitido exclusivamente por norma."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"A NBC TG 26 manda elaborar as demonstrações no pressuposto da continuidade, salvo intenção de liquidar ou cessar negócios, ou falta de alternativa realista. As outras opções falam de competência, materialidade e compensação, que são temas diferentes."},{"id":"2025.1-16","ed":"2025.1","n":16,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Sobre a classificação e mensuração de ativos não circulantes mantidos para a venda, de acordo com a NBC TG 31 (R4) - ATIVO NÃO CIRCULANTE MANTIDO PARA VENDA E OPERAÇÃO DESCONTINUADA, analise as seguintes afirmativas:"},{"t":"p","x":"I. Os ativos não circulantes mantidos para a venda, desde que satisfeitos os critérios de classificação, são realocados para o ativo circulante da entidade."},{"t":"p","x":"II. A classificação, a apresentação e a mensuração requeridas pela NBC TG 31 aplicáveis a ativo não circulante classificado como mantido para venda também se aplicam a ativo não circulante que seja classificado como destinado a ser distribuído aos sócios na sua condição de proprietários."},{"t":"p","x":"III. O ativo não circulante mantido para venda será mensurado pelo maior entre o seu valor contábil e o valor justo menos as despesas de venda. Está correto o que se afirma em"}],"opts":["I, somente.","I e II, somente.","I, II e III.","II, somente."],"gabStatus":"Definitivo","ass":"Outras normas (AVP, arrendamento, instr. financeiros, tributos diferidos, câmbio, segmentos, mantido p/ venda)","exp":"Certas: I (ativo mantido para venda vai ao circulante) e II (a norma vale também para ativos a distribuir aos sócios). Errada: III, porque a mensuração é pelo menor entre o valor contábil e o valor justo menos despesas de venda, não o maior."},{"id":"2025.1-17","ed":"2025.1","n":17,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"A NBC TG ESTRUTURA CONCEITUAL descreve uma série de conceitos utilizados para a elaboração de relatórios financeiros para fins gerais. Relacione cada elemento a seguir com sua correta definição segundo a Estrutura Conceitual."},{"t":"p","x":"Elementos:"},{"t":"p","x":"a. Despesa"},{"t":"p","x":"b. Patrimônio Líquido"},{"t":"p","x":"c. Receita"},{"t":"p","x":"Definições:"},{"t":"p","x":"I. Aumentos nos ativos, ou reduções nos passivos, que resultam em aumento no patrimônio líquido."},{"t":"p","x":"II. Reduções nos ativos, ou aumentos nos passivos, que resultam em reduções no patrimônio líquido."},{"t":"p","x":"III. Participação residual nos ativos da entidade após a dedução de todos os seus passivos."},{"t":"p","x":"Os elementos a, b e c correspondem, respectivamente, às definições"}],"opts":["II – III – I.","I – III – II.","II – I – III.","I – II – III."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Despesa é a redução de ativos ou aumento de passivos que reduz o PL (II). Patrimônio líquido é a participação residual após deduzir os passivos (III). Receita é o aumento de ativos ou redução de passivos que aumenta o PL (I). Ordem pedida, a–b–c: II, III, I."},{"id":"2025.1-18","ed":"2025.1","n":18,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"De acordo com a NBC TG 25 (R2) - PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, provisão é um passivo de prazo incerto ou de valor incerto. Considere que a sociedade empresária Beta tenha recebido laudo de seu advogado sobre um provável pagamento de processo trabalhista, entretanto com mensuração ainda não confiável. Nesse caso, o seu reconhecimento nas demonstrações financeiras deve ser"}],"opts":["como apropriação por competência no balanço patrimonial.","como provisão trabalhista no balanço patrimonial.","não realizar reconhecimento de provisão trabalhista no balanço patrimonial e não divulgar em nota explicativa.","não realizar reconhecimento de provisão trabalhista no balanço patrimonial, mas divulgar em nota explicativa como passivo contingente."],"gabStatus":"Definitivo","ass":"Provisões e contingências (TG 25)","exp":"Obrigação provável, mas sem estimativa confiável do valor, não pode virar provisão. Fica como passivo contingente e é divulgada em nota explicativa."},{"id":"2025.1-19","ed":"2025.1","n":19,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"De acordo com a NBC TG 09 (R1) - DEMONSTRAÇÃO DO VALOR ADICIONADO, a referida Demonstração (DVA) está relacionada com informações econômicas e com a comunicação de elementos ambientais, sociais e de governança (ASG), e tem por finalidade evidenciar a riqueza criada pela entidade e sua distribuição, durante determinado período. Nesse sentido, considerando que a sociedade empresária “B” possui reversão de perdas estimadas com créditos de liquidação duvidosa, essa informação deve ser apresentada, em sua DVA, do seguinte modo:"}],"opts":["em remuneração de capitais próprios, na segunda parte da DVA.","em remuneração de capitais de terceiros, na segunda parte da DVA.","em valor adicionado recebido em transferência, na primeira parte da DVA.","em riqueza criada pela própria entidade, na primeira parte da DVA."],"gabStatus":"Definitivo","ass":"DVA","exp":"A reversão de PECLD aumenta o valor adicionado gerado pela própria entidade e fica na primeira parte da DVA, em receitas (junto à constituição, que entra com sinal negativo). Não é distribuição nem valor recebido em transferência."},{"id":"2025.1-20","ed":"2025.1","n":20,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"A Demonstração do Valor Adicionado proporciona aos usuários das demonstrações contábeis informações relativas à riqueza criada pela entidade em determinado período e à forma como tais riquezas foram distribuídas. Na distribuição do valor adicionado, o total de “Remuneração de capitais próprios” deve ser igual"}],"opts":["às reservas de lucro reportadas no Balanço Patrimonial.","ao pagamento de dividendos reportado na Demonstração dos Fluxos de Caixa.","ao resultado líquido do exercício reportado na Demonstração do Resultado do Período.","à distribuição de dividendos reportada na Demonstração das Mutações do Patrimônio Líquido."],"gabStatus":"Definitivo","ass":"DVA","exp":"Na DVA, a remuneração de capitais próprios (dividendos, juros sobre capital próprio e lucros retidos) soma o resultado líquido do exercício que aparece na DRE. É isso que fecha a distribuição."},{"id":"2025.1-21","ed":"2025.1","n":21,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Uma loja que vende produtos de escritório apresentava os seguintes saldos em 31/12/2023:"},{"t":"p","x":"• Custo da mercadoria vendida (inclui os valores dos impostos recuperáveis): R$ 80.000,00"},{"t":"p","x":"• Despesa de depreciação dos ativos imobilizados: R$ 15.000,00"},{"t":"p","x":"• Perdas estimadas com crédito de liquidação duvidosa: R$ 6.000,00"},{"t":"p","x":"• Perdas por desvalorização dos ativos imobilizados: R$ 10.000,00"},{"t":"p","x":"• Receita de contrato com clientes: R$ 200.000,00"},{"t":"p","x":"Assinale a opção que indica o saldo do valor adicionado líquido produzido pela loja, apresentado em sua Demonstração do Valor Adicionado em 31/12/2023."}],"opts":["R$ 89.000,00.","R$ 114.000,00.","R$ 104.000,00.","R$ 194.000,00."],"gabStatus":"Definitivo","ass":"Estoques (custo, PEPS, VRL)","exp":"DVA: receitas 200.000 − PECLD 6.000 = 194.000. Insumos: CMV 80.000 + perda por desvalorização de ativos 10.000 = 90.000. Valor adicionado bruto = 104.000. Descontada a depreciação de 15.000, o valor adicionado líquido produzido é de 89.000."},{"id":"2025.1-22","ed":"2025.1","n":22,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"De acordo com a NBC TG 25 (R2) - PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, a entidade deve divulgar, em notas explicativas, para cada classe de passivo contingente na data do balanço, uma breve descrição da natureza do passivo contingente, a menos que a possibilidade de ocorrer qualquer desembolso na liquidação seja"}],"opts":["remota.","possível.","provável.","possível e provável."],"gabStatus":"Definitivo","ass":"Provisões e contingências (TG 25)","exp":"Passivo contingente é divulgado em nota, a menos que a possibilidade de saída de recursos seja remota. Se for remota, não há divulgação."},{"id":"2025.1-23","ed":"2025.1","n":23,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"A sociedade empresária Solar administra a carreira de influenciadores digitais. As empresas interessadas em divulgar o seu produto ou serviço por meio dos influenciadores devem pagar para a Solar R$ 20.000,00 por um pacote que consiste em oito inserções em redes socias, sendo quatro ao mês. Em 01/05/2024, a Cia Yellow assinou contrato e pagou, à vista, R$ 20.000,00 para a Cia Solar. Foram realizadas quatro inserções em junho e quatro em julho. A Cia Yellow estimou que, por conta da divulgação, o seu faturamento aumentou em R$ 15.000,00 em agosto e em R$ 18.000,00 em setembro. De acordo com o Regime de Competência, a despesa com a divulgação deve ser reconhecida pela Cia Yellow do seguinte modo:"}],"opts":["R$ 20.000,00 em maio.","R$ 10.000,00 em junho e R$ 10.000,00 em julho.","R$ 10.000,00 em agosto e R$ 10.000,00 em setembro.","R$ 5.000,00 em cada um dos meses de junho a setembro."],"gabStatus":"Definitivo","ass":"Operações básicas (competência, folha, lançamentos)","exp":"O regime de competência reconhece a despesa quando o serviço é prestado. As inserções foram em junho e julho, então 10.000 em cada mês. O pagamento antecipado em maio é só despesa antecipada, e o aumento de faturamento não define o momento da despesa."},{"id":"2025.1-24","ed":"2025.1","n":24,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Em 01/09/2024, uma sociedade empresária localizada em Belo Horizonte adquiriu aparelhos de informática de Manaus por R$ 40.000,00. O frete para a entrega por caminhão era de R$ 2.000,00. No entanto, para receber os aparelhos mais rápido, a sociedade empresária solicitou a entrega por avião e pagou o valor de R$ 5.500,00 pelo frete. A instalação dos aparelhos no escritório custou R$ 1.000,00. Ainda, foram gastos R$ 2.000,00 com testes para verificar se os aparelhos estavam funcionando corretamente. O valor dos aparelhos de informática a serem registrados no ativo imobilizado da sociedade empresária é de"}],"opts":["R$ 43.000,00.","R$ 45.000,00.","R$ 46.500,00.","R$ 48.500,00."],"gabStatus":"Definitivo","ass":"Estoques (custo, PEPS, VRL)","exp":"O custo do imobilizado inclui preço, frete até o local, instalação e testes. O frete aéreo (5.500) foi um gasto necessário para trazer o ativo e entra no custo, ao contrário do frete mais barato que não foi usado. Total: 40.000 + 5.500 + 1.000 + 2.000 = 48.500."},{"id":"2025.1-25","ed":"2025.1","n":25,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Em janeiro de 2025, um artista, que possui uma empresa, estava em um evento estratégico em um resort na Bahia. Ao voltar da viagem, descobriu que um influenciador digital, que também estava no evento, divulgou fotos e vídeos do artista em redes sociais. A empresa do artista entrou na justiça por quebra de privacidade contra o resort e contra o influenciador, pedindo, respectivamente, R$ 10.000,00 e R$ 15.000,00. Os advogados da empresa do artista julgaram que as chances de ganho das causas eram, respectivamente, remota e possível. Com base no julgamento dos advogados, a empresa deve apresentar, em suas demonstrações contábeis, um ativo contingente"}],"opts":["igual a zero.","de R$ 10.000,00.","de R$ 15.000,00.","de R$ 25.000,00."],"gabStatus":"Definitivo","ass":"Provisões e contingências (TG 25)","exp":"Ativo contingente não é reconhecido no balanço, e só se divulga em nota quando a entrada de benefícios é provável. Com chances remota e possível, o saldo reconhecido é zero."},{"id":"2025.1-26","ed":"2025.1","n":26,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"A Cia Lua atua no setor de comércio de relógios e tem 20 empregados. Todos os anos, na primeira semana de janeiro, a empresa contrata uma equipe de médicos para ir ao escritório realizar exames de rotina em seus empregados. Em janeiro de 2025, os gastos com os médicos foram de R$ 6.000,00. Do valor, 20% são pagos pelos empregados, enquanto o restante é pago pela empresa. O impacto do atendimento médico na Demonstração do Resultado da Cia Lua em janeiro de 2025, de acordo com o Regime de Competência, foi de"}],"opts":["-R$ 400,00.","-R$ 500,00.","-R$ 4.800,00.","-R$ 6.000,00."],"gabStatus":"Definitivo","ass":"Operações básicas (competência, folha, lançamentos)","exp":"A empresa paga 80% de 6.000 = 4.800, e essa é a despesa do período. Os 20% pagos pelos empregados não são despesa da empresa."},{"id":"2025.1-27","ed":"2025.1","n":27,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Em fevereiro de 2025, um hotel adquiriu um televisor de 98 polegadas para que os seus hospedes assistissem a cerimônia do Oscar, em março. O preço do televisor era de R$ 40.000,00. Na data da compra foi acordado com o fornecedor que o pagamento seria realizado por Pix e, em decorrência, o hotel obteve uma redução de 5% sobre o preço original. Assinale a opção que indica a contrapartida da diminuição de R$ 38.000,00 na conta “Disponibilidades”, nas demonstrações contábeis do hotel."}],"opts":["Ativo imobilizado de R$ 38.000,00.","Ativo imobilizado de R$ 40.000,00 e receita financeira de R$ 2.000,00.","Ativo imobilizado de R$ 40.000,00 e outras receitas de R$ 2.000,00.","Ativo imobilizado de R$ 40.000,00 e retificação do ativo imobilizado de R$ 2.000,00."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"O desconto de 5% por pagar via Pix é desconto comercial, que reduz o custo de aquisição. O imobilizado é registrado por 38.000. Não existe receita financeira nem retificadora nesse caso."},{"id":"2025.1-28","ed":"2025.1","n":28,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Uma empresa de doces e bolos possui em 31/12/X0 os seguintes saldos em seu Balanço Patrimonial:"},{"t":"p","x":"• Caixa e equivalentes de caixa: R$ 100.000,00;"},{"t":"p","x":"• Empréstimos a pagar de curto prazo: R$ 250.000,00;"},{"t":"p","x":"• Financiamentos a pagar de longo prazo: R$ 330.000,00;"},{"t":"p","x":"• Imobilizado: R$ 450.000,00;"},{"t":"p","x":"• Intangível: R$ 320.000,00;"},{"t":"p","x":"• Estoques: R$ 250.000,00;"},{"t":"p","x":"• Capital Social: R$ 540.000,00."},{"t":"p","x":"Com base nesses saldos, o valor do ativo não circulante da empresa é"}],"opts":["R$ 770.000,00.","R$ 350.000,00.","R$ 1.020.000,00.","R$ 450.000,00."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"Ativo não circulante: imobilizado 450.000 + intangível 320.000 = 770.000. Caixa e estoques são circulantes, e os empréstimos e o capital são passivo e PL."},{"id":"2025.1-29","ed":"2025.1","n":29,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"A empresa ABC S.A. comprou materiais, em agosto de X1, com a finalidade de utilizá-los em suas atividades. O pagamento foi realizado em novembro de X1, e os materiais foram utilizados na prestação de serviços em setembro de X1. Esses materiais devem ser reconhecidos como despesa no mês de"}],"opts":["novembro de X1.","setembro de X1.","agosto de X1.","dezembro de X1."],"gabStatus":"Definitivo","ass":"Operações básicas (competência, folha, lançamentos)","exp":"Pela competência, o material vira despesa quando é consumido, em setembro. A compra em agosto e o pagamento em novembro não definem o momento da despesa."},{"id":"2025.1-30","ed":"2025.1","n":30,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Relacione as contas contábeis do balanço patrimonial apresentadas a seguir com seus respectivas grupos contábeis."},{"t":"p","x":"1. Empréstimos a pagar após 12 meses."},{"t":"p","x":"2. Contas a receber em 5 meses."},{"t":"p","x":"3. Contas a pagar em 3 meses."},{"t":"p","x":"4. Imóveis para uso por 10 anos."},{"t":"p","x":"( ) Ativo Circulante."},{"t":"p","x":"( ) Ativo Não Circulante."},{"t":"p","x":"( ) Passivo Circulante."},{"t":"p","x":"( ) Passivo Não Circulante."},{"t":"p","x":"A relação correta, na ordem apresentada, é"}],"opts":["4 – 2 – 1 – 3.","2 – 4 – 3 – 1.","3 – 1 – 2 – 4.","1 – 3 – 4 – 2."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"Conta a receber em 5 meses é ativo circulante (2). Imóvel para uso por 10 anos é ativo não circulante (4). Conta a pagar em 3 meses é passivo circulante (3). Empréstimo a pagar após 12 meses é passivo não circulante (1). O corte é 12 meses ou o ciclo operacional. Ordem: 2, 4, 3, 1."},{"id":"2025.1-31","ed":"2025.1","n":31,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Assinale a opção que contempla apenas componentes do Patrimônio Líquido, descritos na Lei nº 6.404/76 e alterações posteriores."}],"opts":["Capital Social – Investimentos – Ações em Tesouraria.","Capital Social – Dividendos Obrigatórios a Pagar – Ajustes de Avaliação Patrimonial.","Reservas de Capital – Reservas de Lucros – Ações em Tesouraria.","Ajustes de Avaliação Patrimonial – Capital Social – Debêntures."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"O patrimônio líquido, pela Lei 6.404, tem capital social, reservas de capital, ajustes de avaliação patrimonial, reservas de lucros, ações em tesouraria (redutora) e prejuízos acumulados. Investimentos é ativo, e dividendos a pagar e debêntures são passivo."},{"id":"2025.1-32","ed":"2025.1","n":32,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"A companhia investidora Alfa S.A., obrigada legalmente a elaborar demonstrações financeiras consolidadas, possui a seguinte participação societária nas empresas:"},{"t":"pre","x":"Investida                    % de participação de Alfa S.A.         PL da investida em 31/12/2023\nKappa (controlada)                                          90                                R$ 1.000.000,00\nSigma (controlada)                                          70                                 R$ 700.000,00\nZeta (coligada)                                             25                                 R$ 600.000,00\nDelta (sem influência significativa)                        15                                 R$ 900.000,00"},{"t":"p","x":"Com base exclusivamente nas informações acima, o montante registrado na conta de participação de acionistas não controladores no balanço consolidado da investidora Alfa S.A. em 31/12/2023 deverá ser de"}],"opts":["R$ 100.000,00.","R$ 310.000,00.","R$ 760.000,00.","R$ 1.525.000,00."],"gabStatus":"Definitivo","ass":"Investimentos, equivalência, consolidação, combinação","exp":"Participação de não controladores só existe nas controladas. Kappa: 10% × 1.000.000 = 100.000. Sigma: 30% × 700.000 = 210.000. Total: 310.000. A coligada (Zeta) e a investida sem influência (Delta) não são consolidadas."},{"id":"2025.1-33","ed":"2025.1","n":33,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Uma empresa adquiriu uma máquina e registrou na contabilidade os seguintes dispêndios:"},{"t":"p","x":"• Preço de aquisição: R$ 500.000,00;"},{"t":"p","x":"• Imposto de importação: R$ 50.000,00 (não recuperável);"},{"t":"p","x":"• Preparação do local: R$ 100.000,00;"},{"t":"p","x":"• Custo com materiais consumido na realização de testes de funcionamento: R$ 50.000,00;"},{"t":"p","x":"• Honorários dos técnicos que realizaram os testes: R$ 60.000,00;"},{"t":"p","x":"• Vida útil estimada: 10 anos;"},{"t":"p","x":"• Valor residual: R$ 100.000,00. De acordo com a NBC TG 27 (R4) - ATIVO IMOBILIZADO, o custo da máquina, ou seja, o valor contábil de registro inicial desse imobilizado, será de"}],"opts":["R$ 500.000,00.","R$ 550.000,00.","R$ 650.000,00.","R$ 760.000,00."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Custo = preço 500.000 + imposto de importação não recuperável 50.000 + preparação do local 100.000 + materiais de testes 50.000 + honorários dos técnicos 60.000 = 760.000. Vida útil e valor residual não entram no custo, só na depreciação."},{"id":"2025.1-34","ed":"2025.1","n":34,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Uma empresa adquiriu uma máquina em 01/01/2020 pelo custo total de R$ 240.000,00. No registro inicial da máquina no imobilizado, a empresa estimou a vida útil da máquina em 8 anos, sem valor residual. Na data da aquisição, a empresa iniciou a depreciação pelo método linear. Em 31/12/2024, a empresa reavaliou a vida útil para 10 anos, aumentando em 2 anos a vida útil inicialmente estimada. Além disso, verificou que o valor residual da máquina passou a ser de R$ 40.000,00. Com base exclusivamente nos dados acima apresentados, o valor anual da despesa de depreciação a ser contabilizada a partir das alterações ocorridas em 31/12/2024 deve ser de"}],"opts":["R$ 40.000,00.","R$ 30.000,00.","R$ 18.000,00.","R$ 10.000,00."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Depreciação inicial: 240.000 ÷ 8 = 30.000 por ano, e em 5 anos (2020 a 2024) são 150.000. Valor contábil: 90.000. Nova vida total é 10 anos, então restam 5. Base depreciável: 90.000 − 40.000 (residual) = 50.000. Depreciação futura: 50.000 ÷ 5 = 10.000 por ano."},{"id":"2025.1-35","ed":"2025.1","n":35,"mat":"Custos","gab":"A","stem":[{"t":"p","x":"A Indústria Cadeiras Maceió Ltda. produz e comercializa cadeiras de escritório. No mês de setembro de X4, a empresa produziu 30.000 cadeiras e não possuía estoque inicial. No mês, vendeu 24.000 unidades a um preço unitário de R$ 100,00. Os custos variáveis totais, incluindo matéria-prima, mão de obra direta e outros custos variáveis, somaram R$ 1.800.000,00. Os custos fixos, compostos principalmente por aluguel da fábrica, depreciação do maquinário e salários fixos dos supervisores da produção, totalizaram R$ 200.000,00. As despesas fixas, como gastos com administração e vendas, somaram R$ 100.000,00. Com base nessas informações, o lucro obtido com as vendas, aplicando o método de custeio variável, foi de"}],"opts":["R$ 660.000,00.","R$ 960.000,00.","R$ 700.000,00.","R$ 300.000,00."],"gabStatus":"Definitivo","exp":"Custeio variável: receita 24.000 × 100 = 2.400.000. Custo variável unitário = 1.800.000 ÷ 30.000 = 60, então o custo variável vendido é 1.440.000. Margem de contribuição: 960.000. Menos custos fixos 200.000 e despesas fixas 100.000 = 660.000. Os custos fixos vão inteiros para o resultado, e não para o estoque."},{"id":"2025.1-36","ed":"2025.1","n":36,"mat":"Custos","gab":"C","stem":[{"t":"p","x":"Em janeiro de 2024, uma fábrica que produz bolas de futebol incorreu nos seguintes gastos: aluguel do imóvel e das máquinas: R$ 30.000,00; embalagens indispensáveis ao produto final: R$ 2.000,00; matéria-prima: R$ 10.000,00; seguro do imóvel: R$ 5.000,00. Assinale a opção que indica os custos fixos da fábrica no mês."}],"opts":["R$ 5.000,00.","R$ 30.000,00.","R$ 35.000,00.","R$ 45.000,00."],"gabStatus":"Definitivo","exp":"Custos fixos não variam com a produção: aluguel do imóvel e das máquinas (30.000) e seguro do imóvel (5.000) = 35.000. Embalagem e matéria-prima são variáveis."},{"id":"2025.1-37","ed":"2025.1","n":37,"mat":"Custos","gab":"B","stem":[{"t":"p","x":"Leia o fragmento a seguir: “Departamento é a unidade _____ administrativa para a Contabilidade de Custos, representada, na maioria dos casos, por pessoas e máquinas, em que se desenvolvem atividades _____.” Assinale a opção cujos itens completam corretamente as lacunas do fragmento."}],"opts":["padrão – heterogêneas","mínima – homogêneas","máxima – complementares","padrão – complementares"],"gabStatus":"Definitivo","exp":"Departamento é a unidade mínima administrativa da Contabilidade de Custos, onde se desenvolvem atividades homogêneas, geralmente com pessoas e máquinas."},{"id":"2025.1-38","ed":"2025.1","n":38,"mat":"Custos","gab":"C","stem":[{"t":"p","x":"Gasto pode ser definido como o sacrifício financeiro necessário para obter um produto ou serviço, representado pela entrega ou promessa de entrega de ativos. Assim, custos, despesas, investimentos e desembolsos são tipos de gastos. Em relação ao tema, analise as afirmativas a seguir."},{"t":"p","x":"I. Custo é um gasto diretamente relacionado a um bem ou serviço utilizado na produção de outros bens e serviços."},{"t":"p","x":"II. Despesa é um gasto com bens ou serviços consumidos direta ou indiretamente para obtenção de receitas."},{"t":"p","x":"III. Investimento é um gasto que se tornou um item do patrimônio líquido em função da expectativa de geração futura de caixa para a entidade ou em função de sua vida útil."},{"t":"p","x":"IV. Desembolso é um gasto que ocorre quando bens ou serviços são consumidos de forma anormal e/ou involuntária que afetam diretamente o resultado da entidade. Estão corretas as afirmativas"}],"opts":["III e IV, apenas.","I, II e III, apenas.","I e II, apenas.","II, III e IV, apenas."],"gabStatus":"Definitivo","exp":"Certas: I (custo é gasto ligado a bem ou serviço usado na produção) e II (despesa é gasto consumido para obter receitas). Erradas: III (investimento vira ativo, e não PL) e IV (o que descreve é perda, e desembolso é o pagamento)."},{"id":"2025.1-39","ed":"2025.1","n":39,"mat":"Análise / Gerencial / Controladoria","gab":"C","stem":[{"t":"p","x":"Em 01/01/2024, uma loja de teclados apresentava os seguintes saldos em seu balanço patrimonial:"},{"t":"p","x":"• Disponibilidades: R$ 60.000,00;"},{"t":"p","x":"• Estoque: R$ 240.000,00;"},{"t":"p","x":"• Patrimônio Líquido: R$ 300.000,00. O estoque era composto por 400 unidades de teclado, sendo que cada uma era vendida por R$ 1.000,00. No primeiro semestre de 2024, os gastos fixos, considerando a loja e o escritório, foram os seguintes:"},{"t":"p","x":"• Aluguel: R$ 36.000,00;"},{"t":"p","x":"• Depreciação: R$ 30.000,00;"},{"t":"p","x":"• Salários: R$ 60.000,00. Além disso, foi paga, antecipadamente, uma despesa de R$ 4.000,00 relacionada ao segundo semestre do ano. O ponto de equilíbrio contábil da loja, em unidades, no primeiro semestre de 2024, foi de"}],"opts":["240.","300.","315.","375."],"gabStatus":"Definitivo","exp":"Ponto de equilíbrio contábil = custos e despesas fixas ÷ margem de contribuição unitária. Fixos do semestre: aluguel 36.000 + depreciação 30.000 + salários 60.000 = 126.000. A despesa antecipada de 4.000 é do 2º semestre e fica fora. Custo unitário do teclado = 240.000 ÷ 400 = 600, então margem = 1.000 − 600 = 400. PE = 126.000 ÷ 400 = 315 unidades."},{"id":"2025.1-40","ed":"2025.1","n":40,"mat":"Análise / Gerencial / Controladoria","gab":"C","stem":[{"t":"p","x":"Acerca do Modelo de Determinação do Preço de Transferência, avalie as afirmativas a seguir."},{"t":"p","x":"I. No Modelo de Preço de Transferência Baseado em Custo Total Realizado (Full Cost), o bem/serviço é transferido pelo valor resultante do somatório dos custos totais incorridos (fixos e variáveis) dividido pelo volume de produção de um determinado período (custeio por absorção)."},{"t":"p","x":"II. No Modelo de Preço de Transferência Baseado em Negociação entre os Gestores, o bem/serviço é transferido pelo preço vigente no mercado, que pode ser um preço médio."},{"t":"p","x":"III. No Modelo de Preço de Transferência Baseado em Custo de Oportunidade, o preço do bem/serviço transferido estrutura- se a partir da premissa de que deveria refletir o valor do benefício possível de ser auferido na melhor alternativa econômica de obtenção dos insumos demandados. Está correto o que se afirma em"}],"opts":["I, apenas.","I e II, apenas.","I e III, apenas.","I, II e III."],"gabStatus":"Definitivo","exp":"I e III estão certas. II está errada: o modelo baseado em negociação define o preço pelo acordo entre os gestores, e a transferência pelo preço de mercado é outro modelo (baseado em mercado)."},{"id":"2025.1-41","ed":"2025.1","n":41,"mat":"Análise / Gerencial / Controladoria","gab":"B","stem":[{"t":"p","x":"Analise as contas do Balanço Patrimonial a seguir:"},{"t":"pre","x":"              ATIVO                           2023                            PASSIVO                            2023\nCaixa                                        R$ 5.000,00       Fornecedores                                   R$ 15.000,00\nAplicações financeiras                     R$ 10.000,00        Impostos a pagar                                R$ 5.000,00\nContas a receber                           R$ 15.000,00        Empréstimos de curto prazo                     R$ 10.000,00\nEstoques                                   R$ 30.000,00        Empréstimos de longo prazo                     R$ 20.000,00\nImobilizado                                R$ 10.000,00        Patrimônio líquido                             R$ 80.000,00\nIntangível                                 R$ 50.000,00\nInvestimentos                              R$ 10.000,00\nTOTAL                                     R$ 130.000,00        TOTAL                                        R$ 130.000,00"},{"t":"p","x":"O Índice de Liquidez Seca e o Índice de Liquidez Corrente são, respectivamente, iguais a"}],"opts":["2,00 e 1,00.","1,00 e 2,00.","1,00 e 2,60.","2,00 e 0,75."],"gabStatus":"Definitivo","exp":"Ativo circulante: caixa 5.000 + aplicações 10.000 + contas a receber 15.000 + estoques 30.000 = 60.000. Passivo circulante: 15.000 + 5.000 + 10.000 = 30.000. Corrente: 60 ÷ 30 = 2,00. Seca: (60.000 − 30.000) ÷ 30.000 = 1,00."},{"id":"2025.1-42","ed":"2025.1","n":42,"mat":"Setor Público","gab":"B","stem":[{"t":"p","x":"A Lei Orçamentária Anual de cada ente federado deverá conter todas as receitas e despesas de todos os Poderes, órgãos, entidades, fundos e fundações instituídas e mantidas pelo Poder Público. Esse princípio orçamentário é denominado"}],"opts":["Unidade.","Universalidade.","Exclusividade.","Orçamento Bruto."],"gabStatus":"Definitivo","exp":"O princípio da universalidade exige que a LOA contenha todas as receitas e despesas de todos os Poderes, órgãos, entidades, fundos e fundações. Unidade fala de um orçamento único por ente, e exclusividade veda matéria estranha ao orçamento."},{"id":"2025.1-43","ed":"2025.1","n":43,"mat":"Setor Público","gab":"C","stem":[{"t":"p","x":"De acordo com a NBC TSP ESTRUTURA CONCEITUAL - ESTRUTURA CONCEITUAL PARA ELABORAÇÃO E DIVULGAÇÃO DE INFORMAÇÃO CONTÁBIL DE PROPÓSITO GERAL PELAS ENTIDADES DO SETOR PÚBLICO, as informações financeiras e não financeiras são relevantes quando"}],"opts":["permitem que os usuários compreendam o seu significado.","retratam a substância da transação, a qual pode não corresponder, necessariamente, à sua forma jurídica.","são capazes de influenciar significativamente o cumprimento dos objetivos da elaboração e da divulgação da informação contábil.","estão disponíveis aos usuários a tempo de serem úteis para fins de prestação de contas, responsabilização e tomada de decisão."],"gabStatus":"Definitivo","exp":"Informação relevante é a que influencia de forma significativa o cumprimento dos objetivos da informação contábil. As demais alternativas definem compreensibilidade, representação fidedigna e tempestividade."},{"id":"2025.1-44","ed":"2025.1","n":44,"mat":"Setor Público","gab":"C","stem":[{"t":"p","x":"Com relação aos usuários dos Relatórios Contábeis de Propósito Geral das Entidades do Setor Público (RCPGs), avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa."},{"t":"p","x":"( ) Os RCPGs devem ser elaborados e divulgados, principalmente, para atender às necessidades de informações dos usuários dos serviços e dos provedores de recursos, quando estes detêm a prerrogativa de exigir que a entidade do setor público divulgue as informações que atendam às suas necessidades específicas."},{"t":"p","x":"( ) Os membros do Poder Legislativo são também usuários primários dos RCPGs e utilizam extensiva e continuamente os relatórios enquanto atuam como representantes dos interesses dos usuários de serviços e dos provedores de recursos."},{"t":"p","x":"( ) Alguns usuários dos serviços e alguns provedores de recursos que dependem dos RCPGs para obter informações que eles necessitam para os propósitos de prestação de contas e responsabilização e tomada de decisão podem não ser cidadãos, como, agências bilaterais ou multilaterais. De acordo com a NBC TSP ESTRUTURA CONCEITUAL- ESTRUTURA CONCEITUAL PARA ELABORAÇÃO E DIVUL
