do p/ venda)","exp":"Manter 2% quando a análise indica 5%, só para melhorar o resultado dos gestores, é viés. Falta neutralidade, que é requisito da representação fidedigna. Comparabilidade e tempestividade são características de melhoria, e não salvam a informação."},{"id":"2026.1-12","ed":"2026.1","n":12,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Em janeiro de 2026, uma entidade fabril assinou um contrato para a compra de uma máquina por R$ 50.000,00. O montante foi pago integralmente em fevereiro. A máquina foi recebida em março, quando foi instalada e disponibilizada para uso. No entanto, por decisão da entidade, a máquina começou a ser efetivamente utilizada em abril. No Balanço Patrimonial da entidade, a máquina deve ser reconhecida a partir de"}],"opts":["janeiro.","fevereiro.","março.","abril."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"O imobilizado é reconhecido quando a empresa passa a controlar o ativo e ele está disponível para uso, o que ocorreu em março (recebimento e instalação). O pagamento em fevereiro foi adiantamento. Começar a usar só em abril não adia o reconhecimento."},{"id":"2026.1-13","ed":"2026.1","n":13,"mat":"Contabilidade Geral","gab":"*","stem":[{"t":"p","x":"Em 01/03/2026, uma sociedade empresária adquiriu um equipamento de grande porte por um montante considerado relevante para ela. Para a aquisição, foram pagos R$ 100.000,00 à vista, e o restante tinha prazo para pagamento de 60 dias. Essa parcela complementar estava fixada em R$ 105.000,00, enquanto o seu valor presente na data da compra era de R$ 100.000,00. Assinale a opção que indica o custo histórico do passivo líquido no momento da compra, de acordo com a NBC TG ESTRUTURA CONCEITUAL (R2) – ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO:"}],"opts":["R$ 100.000,00.","R$ 105.000,00.","R$ 200.000,00.","R$ 205.000,00."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment"},{"id":"2026.1-14","ed":"2026.1","n":14,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Uma empresa S.A. atua no setor de bebidas e possui diversas unidades de negócios. Entre elas, destacam-se as operações de “Cervejas” e “Refrigerantes”. A administração da companhia utiliza regularmente informações de desempenho dessas unidades para fins de avaliação de resultados e alocação de recursos, sendo tais informações analisadas pelo principal responsável pela tomada de decisões operacionais da entidade (CODM – Chief Operating Decision Maker). A empresa avaliou os seguintes indicadores referentes ao exercício:"},{"t":"p","x":"• A unidade Cervejas representa 12% da receita combinada de todos os segmentos operacionais."},{"t":"p","x":"• A unidade Refrigerantes possui 9% da receita combinada, mas 11% dos ativos combinados dos segmentos operacionais."},{"t":"p","x":"• Ambas as unidades têm suas informações regularmente revisadas pelo principal responsável pela tomada de decisões operacionais."},{"t":"p","x":"Considerando as informações apresentadas e os preceitos da NBC TG 22 (R2) – INFORMAÇÕES POR SEGMENTO, é correto afirmar que"}],"opts":["apenas o segmento Cervejas deve ser divulgado separadamente, pois somente ele ultrapassa o limite de 10% da receita combinada dos segmentos operacionais.","apenas o segmento Refrigerantes, deve ser divulgado separadamente, pois o critério de ativos é suficiente para caracterizar segmento reportável.","ambos os segmentos devem ser divulgados separadamente, pois cada um atende a, pelo menos, um dos critérios quantitativos previstos para segmentação reportável.","nenhum dos segmentos deve ser divulgado separadamente, pois é necessário que o segmento atenda simultaneamente aos critérios de receita, resultado e ativos."],"gabStatus":"Definitivo","ass":"Outras normas (AVP, arrendamento, instr. financeiros, tributos diferidos, câmbio, segmentos, mantido p/ venda)","exp":"A NBC TG 22 exige divulgar o segmento que atinge 10% ou mais em pelo menos um critério: receita, resultado ou ativos. Cervejas tem 12% da receita, e Refrigerantes tem 11% dos ativos. Cada um atende a um critério, então ambos são reportáveis."},{"id":"2026.1-15","ed":"2026.1","n":15,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Uma empresa S.A. apresentou, em 31/12/2025, ativos fiscais diferidos decorrentes de prejuízos fiscais, bases negativas de contribuição social e diferenças temporárias dedutíveis, totalizando R$ 6.669.000,00 nas demonstrações individuais e R$ 7.121.000,00 nas demonstrações consolidadas. Conforme divulgado em nota explicativa, a realização desses ativos depende da geração futura de lucros tributáveis suficientes para permitir a compensação dos prejuízos fiscais e das bases negativas, bem como da reversão das diferenças temporárias dedutíveis. A administração elaborou projeções de resultados tributáveis futuros que suportam o reconhecimento desses ativos fiscais diferidos. O auditor independente incluiu, em seu relatório, parágrafo chamando a atenção para a nota explicativa, destacando a existência de incerteza relacionada ao prazo de realização dos ativos fiscais diferidos, mas afirmando que sua opinião não está ressalvada em relação a esse assunto. Considerando as informações apresentadas e os preceitos da NBC TG 32 (R4) – TRIBUTOS SOBRE O LUCRO, conclui-se que"}],"opts":["a existência de prejuízos fiscais acumulados impede o reconhecimento de ativos fiscais diferidos, devendo tais valores ser reconhecidos somente quando ocorrer efetivamente lucro tributável suficiente para sua compensação.","a entidade deve reconhecer ativo fiscal diferido decorrente de prejuízos fiscais, somente quando for provável a existência de lucro tributável futuro suficiente para sua compensação.","os ativos fiscais diferidos decorrentes de prejuízos fiscais podem ser reconhecidos com base em estimativas de lucros tributáveis futuros elaboradas pela administração, independente da avaliação de probabilidade de realização.","a inclusão de parágrafo, chamando a atenção no relatório do auditor, indica discordância quanto ao reconhecimento do ativo fiscal diferido e implica modificação na opinião de auditoria."],"gabStatus":"Definitivo","ass":"Outras normas (AVP, arrendamento, instr. financeiros, tributos diferidos, câmbio, segmentos, mantido p/ venda)","exp":"A NBC TG 32 permite reconhecer ativo fiscal diferido sobre prejuízos fiscais só quando for provável haver lucro tributável futuro suficiente. O parágrafo de ênfase do auditor chama atenção para a nota, mas não modifica a opinião."},{"id":"2026.1-16","ed":"2026.1","n":16,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Uma companhia aberta brasileira atua no comércio varejista de bens de consumo por meio de lojas físicas e de plataforma digital. Em suas vendas on-line, a entidade também realiza o transporte das mercadorias por meio de logística própria. Em determinado dia, um cliente adquiriu um livro por meio do website da companhia. O pagamento foi realizado instantaneamente via PIX, e a nota fiscal eletrônica foi imediatamente emitida e enviada ao cliente por e-mail. O livro foi separado no centro de distribuição da empresa e despachado em caminhão pertencente à própria companhia, responsável pela entrega ao consumidor final. Durante o trajeto, antes da entrega ao cliente, o caminhão sofreu um acidente e parte das mercadorias transportadas foi completamente destruída, incluindo o livro adquirido pelo cliente. Considerando-se as informações apresentadas e os preceitos da NBC TG 47 – RECEITA DE CONTRATO COM CLIENTE, a receita deve ser reconhecida"}],"opts":["quando o pagamento via PIX foi realizado, pois a contraprestação foi recebida e a nota fiscal emitida; a perda do livro deve ser reconhecida pelo cliente, que já havia quitado a compra.","no momento do despacho da mercadoria pelo centro de distribuição, pois a empresa já cumpriu sua obrigação principal; a perda decorrente do acidente deve ser reconhecida pelo cliente.","quando o livro for efetivamente entregue ao cliente, momento em que ocorre a transferência de controle do bem; como o acidente ocorreu antes da entrega, a perda do livro deve ser reconhecida pela própria companhia.","no momento da emissão da nota fiscal eletrônica, pois esse ato caracteriza a transferência jurídica do bem; a perda decorrente do acidente deve ser reconhecida como despesa operacional do cliente."],"gabStatus":"Definitivo","ass":"DRE, receitas (TG 47), DRA","exp":"A receita é reconhecida quando o controle do bem passa ao cliente, ou seja, na entrega. Pagamento e nota fiscal não bastam. Como o acidente ocorreu antes da entrega, a perda é da companhia, que também não reconhece a receita."},{"id":"2026.1-17","ed":"2026.1","n":17,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Com base na NBC TG 06 (R3) – OPERAÇÕES DE ARRENDAMENTO MERCANTIL, assinale a opção que apresenta o procedimento correto para a contabilização de um contrato de arrendamento de uma máquina celebrado entre a arrendatária ABC e a arrendadora XYZ."}],"opts":["O ativo de direito de uso deve ser mensurado inicialmente pelo valor justo da máquina, e posteriormente pelo mesmo valor contábil de máquinas similares de propriedade da ABC.","A empresa ABC, ao definir a vida útil para cálculo da depreciação do ativo de direito de uso, precisou definir se permanecerá ou não com a máquina permanentemente. Caso ela opte por não permanecer com a máquina ao final do contrato de arrendamento, a vida útil será a menor entre o prazo do arrendamento e a vida útil da máquina.","O reconhecimento do ativo de direito de uso pela ABC implica a baixa do ativo imobilizado pela XYZ, para evitar duplo reconhecimento do mesmo bem.","A depreciação do ativo de direito de uso na arrendatária ABC tem como contrapartida o passivo de arrendamento reconhecido junto à XYZ."],"gabStatus":"Definitivo","ass":"Outras normas (AVP, arrendamento, instr. financeiros, tributos diferidos, câmbio, segmentos, mantido p/ venda)","exp":"Na NBC TG 06, o direito de uso é depreciado pelo menor prazo entre o contrato e a vida útil, se o arrendatário não ficará com o bem no fim. A medição inicial é pelo valor do passivo mais custos, não pelo valor justo, e o arrendador não baixa o bem só por causa do contrato."},{"id":"2026.1-18","ed":"2026.1","n":18,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Em 2023, uma empresa de consultoria contábil pagou R$ 20.000,00 a título de juros sobre empréstimo bancário. De acordo com a NBC TG 03 (R3) – DEMONSTRAÇÃO DOS FLUXOS DE CAIXA, os juros pagos podem ser classificados, na Demonstração dos Fluxos de Caixa, como fluxos de caixa"}],"opts":["operacionais ou de investimento.","operacionais ou de financiamento.","de investimento ou de financiamento.","de financiamento ou de equivalentes de caixa."],"gabStatus":"Definitivo","ass":"DFC (fluxo de caixa)","exp":"A NBC TG 03 permite classificar os juros pagos como fluxo operacional ou de financiamento, desde que seja de forma consistente. Não são fluxo de investimento."},{"id":"2026.1-19","ed":"2026.1","n":19,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Na geração interna de um ativo intangível por uma sociedade empresária, foram gastos R$ 10.000,00 com atividades destinadas à obtenção de novo conhecimento, R$ 15.000,00 com formulação, projeto, avaliação e seleção final de alternativas possíveis para materiais e processos, e R$ 20.000,00 com o projeto, construção e teste de protótipos e modelos pré-produção. Sabe-se que estavam presentes todos os requisitos dispostos na NBC TG 04 (R4) – ATIVO INTANGÍVEL, para o reconhecimento dos gastos incorridos na fase de desenvolvimento de um Ativo Intangível. A vida útil estimada do ativo é de 10 anos e o valor residual é zero. Considerando que a sociedade empresária utiliza o método da linha reta para amortizar os seus ativos intangíveis, a despesa de amortização anual do ativo foi de"}],"opts":["R$ 0,00.","R$ 2.000,00.","R$ 3.500,00.","R$ 4.500,00."],"gabStatus":"Definitivo","ass":"Intangível","exp":"Pesquisa é despesa: obtenção de novo conhecimento (10.000) e avaliação e seleção de alternativas (15.000). Desenvolvimento pode ser capitalizado: projeto, construção e teste de protótipos (20.000). Amortização: 20.000 ÷ 10 anos = 2.000 por ano."},{"id":"2026.1-20","ed":"2026.1","n":20,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Uma loja de celulares utiliza o Custo Médio Ponderado móvel em base diária para valoração do estoque. Em julho de 2025, não havia estoque inicial do celular de modelo “XPTO”. No mês, houve a seguinte movimentação em relação a esse modelo de celular:"},{"t":"p","x":"• 02/07: compra de 20 unidades por R$ 3.000,00 cada;"},{"t":"p","x":"• 10/07: venda de 10 unidades por R$ 5.000,00 cada;"},{"t":"p","x":"• 15/07: compra de 15 unidades por R$ 3.200,00 cada;"},{"t":"p","x":"• 20/07: venda de 8 unidades por R$ 5.000,00 cada;"},{"t":"p","x":"• 27/07: venda de 5 unidades por R$ 5.200,00 cada. O estoque de “XPTO” da loja, em 31/07/2025, era de"}],"opts":["R$ 36.988,00.","R$ 37.200,00.","R$ 37.440,00.","R$ 61.200,00."],"gabStatus":"Definitivo","ass":"Estoques (custo, PEPS, VRL)","exp":"Custo médio móvel: 02/07 20 un a 3.000 (60.000); vende 10 (saldo 10 un, 30.000). 15/07 compra 15 por 48.000: 25 un, 78.000 (3.120 cada); vende 8 (saldo 17 un, 53.040). 27/07 vende 5 a 3.120 (15.600). Saldo final: 12 un, 37.440."},{"id":"2026.1-21","ed":"2026.1","n":21,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Em sua Demonstração do Valor Adicionado, uma sociedade empresária apresentou os seguintes saldos:"},{"t":"p","x":"• Despesas financeiras: R$ 35.000,00;"},{"t":"p","x":"• Assistência médica a empregados: R$ 80.000,00;"},{"t":"p","x":"• Aluguel: R$ 120.000,00;"},{"t":"p","x":"• Remuneração direta de empregados: R$ 240.000,00. O saldo apresentado em “Remuneração de Capitais de Terceiros”, na segunda parte da Demonstração do Valor Adicionado, de acordo com a NBC TG 09 (R1) – DEMONSTRAÇÃO DO VALOR ADICIONADO, foi de"}],"opts":["R$ 155.000,00.","R$ 235.000,00.","R$ 320.000,00.","R$ 475.000,00."],"gabStatus":"Definitivo","ass":"DVA","exp":"Remuneração de capitais de terceiros = despesas financeiras 35.000 + aluguel 120.000 = 155.000. Remuneração direta e assistência médica de empregados ficam em Pessoal."},{"id":"2026.1-22","ed":"2026.1","n":22,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Os saldos das contas de resultado do exercício da Cia. “G” S.A. em 31/12/X2 eram os seguintes:"},{"t":"p","x":"• Despesas com tributos sobre o lucro: R$ 510.000,00;"},{"t":"p","x":"• Despesas operacionais: R$ 20.000,00;"},{"t":"p","x":"• Receita bruta de serviços: R$ 1.500.000,00;"},{"t":"p","x":"• Impostos sobre serviços: R$ 40.000,00;"},{"t":"p","x":"• Descontos incondicionais: R$ 30.000,00;"},{"t":"p","x":"• Custo dos serviços prestados: R$ 400.000,00."},{"t":"p","x":"Com base nessas informações, é correto afirmar que a Cia. “G” S.A. apurou"}],"opts":["um lucro bruto de R$ 1.050.000,00.","uma receita líquida de serviços de R$ 1.030.000,00.","um lucro bruto de R$ 1.010.000,00.","um lucro líquido de R$ 500.000,00."],"gabStatus":"Definitivo","ass":"DRE, receitas (TG 47), DRA","exp":"Receita líquida = 1.500.000 − 40.000 (impostos) − 30.000 (descontos) = 1.430.000. Lucro bruto = 1.430.000 − 400.000 = 1.030.000. Menos despesas operacionais de 20.000: 1.010.000. Menos 510.000 de tributos sobre o lucro: lucro líquido de 500.000."},{"id":"2026.1-23","ed":"2026.1","n":23,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"A Cia. “C” S.A. possuía, em 31/12/X1, um ativo registrado em seu imobilizado mensurado como segue:"},{"t":"p","x":"• Custo de aquisição: R$ 105.000,00;"},{"t":"p","x":"• (–) Depreciação acumulada: R$ 20.000,00;"},{"t":"p","x":"• (–) Perda por redução ao valor recuperável reconhecida em X0: R$ 10.000,00. Antes da elaboração das demonstrações contábeis, a empresa realizou o teste de recuperabilidade do ativo, apurando os seguintes valores:"},{"t":"p","x":"• Valor justo líquido de despesas de venda: R$ 80.000,00;"},{"t":"p","x":"• Valor em uso: R$ 90.000,00."},{"t":"p","x":"Com base nos dados apresentados, é correto afirmar que"}],"opts":["o valor contábil líquido do ativo, antes do ajuste da perda, é de R$ 85.000,00.","o valor recuperável do ativo, no momento da avaliação, é de R$ 80.000,00.","o valor recuperável do ativo, no momento da avaliação, é de R$ 90.000,00.","a perda estimada para esse ativo é de R$ 25.000,00."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Valor contábil: 105.000 − 20.000 − 10.000 = 75.000 (a alternativa A diz 85.000, o que está errado). Valor recuperável é o maior entre valor justo líquido (80.000) e valor em uso (90.000), ou seja, 90.000. Como 90.000 é maior que 75.000, não há perda a reconhecer."},{"id":"2026.1-24","ed":"2026.1","n":24,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"A empresa “A” realizou a venda de 350.000 quadros de madeira (30x40 cm), totalizando R$ 250.000,00 em mercadorias vendidas. Sabe-se que o controle das mercadorias foi imediatamente transferido aos clientes. O recebimento foi distribuído da seguinte forma: 50% em Caixa, 25% em Banco, e 25% a prazo, com vencimento em 30 dias. Com base nesses dados, assinale a opção correta quanto à contabilização dessas operações."}],"opts":["Débito: Caixa R$ 125.000,00 Débito: Banco Conta Movimento R$ 62.500,00 Débito: Duplicatas a Receber R$ 62.500,00 Crédito: Receita de Vendas R$ 250.000,00","Débito: Caixa R$ 125.000,00 Débito: Duplicatas a Receber R$ 125.000,00 Crédito: Receita de Vendas R$ 250.000,00","Débito: Caixa R$ 250.000,00 Crédito: Receita de Vendas R$ 250.000,00","Débito: Caixa R$ 125.000,00 Débito: Banco R$ 125.000,00 Crédito: Receita de Vendas R$ 250.000,00"],"gabStatus":"Definitivo","ass":"DRE, receitas (TG 47), DRA","exp":"A empresa recebeu 50% em caixa (125.000), 25% em banco (62.500) e 25% a prazo (62.500, duplicatas a receber), e reconhece a receita total de 250.000 porque o controle foi transferido. Cada forma de recebimento vai na sua própria conta."},{"id":"2026.1-25","ed":"2026.1","n":25,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Em 01/07/2025, uma construtora iniciou a construção de um prédio formado por estúdios de 20 metros quadrados. O prazo estimado para a construção era de 18 meses. Nos primeiros três meses de obra, os gastos diretos, associados à construção, foram de R$ 500.000,00. Em 30/09/2025, um grupo de moradores entrou na Justiça contra a construtora para solicitar a suspensão da obra, já que consideravam que o tipo de apartamento seria prejudicial ao bairro. Além disso, pediam uma indenização de R$ 200.000,00. Na data, os advogados da construtora julgaram que perda da causa era possível. Ainda, por determinação da justiça, a obra foi suspensa e não havia sido retomada até 31/12/2025. Por conta do processo, com base na NBC TG 25 (R2) – PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, no Balanço Patrimonial da construtora, em 31/12/2025,"}],"opts":["houve uma provisão para contingências de R$ 200.000,00.","houve uma provisão para contingências de R$ 500.000,00.","houve uma provisão para contingências de R$ 700.000,00.","não houve impacto nos elementos patrimoniais."],"gabStatus":"Definitivo","ass":"DRE, receitas (TG 47), DRA","exp":"A perda da ação foi considerada apenas possível, o que é passivo contingente: só se divulga em nota, sem provisão. Os 500.000 gastos são custo da obra (ativo), e a suspensão não os transforma em provisão. Não há efeito no balanço."},{"id":"2026.1-26","ed":"2026.1","n":26,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Uma sociedade empresária apresentava a sua Demonstração dos Fluxos de Caixa de acordo com o método direto. Em 01/01/2025, resolveu começar a apresentar a demonstração de acordo com o método indireto. Desse modo, em 31/12/2025, a sociedade empresária divulgou a Demonstração dos Fluxos de Caixa de 31/12/2024, elaborada de acordo com o método indireto, para fins comparativos. Pôde-se constatar, a partir da demonstração, que as atividades operacional, de investimento e de financiamento geraram caixa para a sociedade empresária. Ao comparar o saldo de caixa gerado pelas três atividades na Demonstração dos Fluxos de Caixa, referente a 31/12/2024, de acordo com o método direto e indireto, pode-se verificar que"}],"opts":["o saldo de caixa gerado pelas três atividades permanece igual.","o saldo de caixa apresentado pelas três atividades apresenta mudança.","apenas o saldo de caixa gerado pela atividade operacional apresenta mudança.","apenas o saldo de caixa gerado pela atividade de financiamento apresenta mudança."],"gabStatus":"Definitivo","ass":"DFC (fluxo de caixa)","exp":"Método direto e indireto só diferem na forma de apresentar o fluxo operacional. O valor gerado pelas três atividades, e portanto a variação do caixa, continua exatamente igual."},{"id":"2026.1-27","ed":"2026.1","n":27,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Em 31/12/2025, a Cia. “X” e a Cia. “Y” apresentavam os seguintes saldos em seus Balanços Patrimoniais:"},{"t":"p","x":"• Cia “X”: Disponibilidades: R$ 80.000,00; Patrimônio Líquido: R$ 80.000,00;"},{"t":"p","x":"• Cia “Y”: Disponibilidades: R$ 40.000,00; Patrimônio Líquido: R$ 40.000,00. Sabe-se que os valores contábeis dos ativos líquidos das Cias. “X” e “Y” correspondem aos respectivos valores justos nessa data. Em 01/01/2026, a Cia. “X” adquiriu 90% da Cia. “Y” por R$ 42.000,00, à vista. A diferença entre o valor pago e o valor contábil foi atribuída à capacidade de geração de benefícios econômicos futuros."},{"t":"p","x":"Assinale a opção que indica o saldo do Ativo Circulante no Balanço Patrimonial Consolidado após a compra."}],"opts":["R$ 38.000,00.","R$ 74.000,00.","R$ 75.800,00.","R$ 78.000,00."],"gabStatus":"Definitivo","ass":"Investimentos, equivalência, consolidação, combinação","exp":"Disponibilidades consolidadas: X 80.000 − 42.000 pagos + Y 40.000 = 78.000. O pagamento de 42.000 sai do caixa de X, o caixa de Y entra, e a diferença de 6.000 (42.000 − 90% × 40.000 = 6.000) vai para ágio no intangível."},{"id":"2026.1-28","ed":"2026.1","n":28,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Ao preparar o encerramento do exercício, o setor de Contabilidade da companhia “B” S.A. listou as seguintes contas e seus respectivos saldos:"},{"t":"p","x":"1. Adiantamento a fornecedor: R$ 12.000,00;"},{"t":"p","x":"2. Adiantamento de clientes: R$ 8.000,00;"},{"t":"p","x":"3. Encargos financeiros a transcorrer (sobre empréstimos bancários obtidos): R$ 3.500,00;"},{"t":"p","x":"4. Ações de emissão própria em tesouraria: R$ 5.000,00;"},{"t":"p","x":"5. Juros sobre o capital próprio a pagar: R$ 4.500,00;"},{"t":"p","x":"6. Perdas estimadas com créditos de liquidação duvidosa: R$ 2.000,00."},{"t":"p","x":"Assinale a opção que indica o somatório correto, em valores absolutos, das contas de natureza devedora."}],"opts":["R$ 20.500,00.","R$ 15.500,00.","R$ 12.000,00.","R$ 20.000,00."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"Contas devedoras são ativos e retificadoras de passivo e de PL. Aqui: adiantamento a fornecedor (12.000), encargos financeiros a transcorrer (3.500, retificadora do passivo) e ações em tesouraria (5.000, retificadora do PL) = 20.500. Adiantamento de clientes e JCP a pagar são passivos credores, e a PECLD é retificadora do ativo, de natureza credora."},{"id":"2026.1-29","ed":"2026.1","n":29,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Uma empresa varejista adquiriu mercadoria à vista para revenda no curto prazo. Os dados relacionados a essa compra são:"},{"t":"p","x":"• Valor unitário: R$ 200,00;"},{"t":"p","x":"• Quantidade adquirida: 1.000 unidades;"},{"t":"p","x":"• Imposto de importação: R$ 10,00/unidade (por fora do preço de aquisição);"},{"t":"p","x":"• Seguro: R$ 6.000,00;"},{"t":"p","x":"• Transporte da mercadoria: R$ 4.000,00;"},{"t":"p","x":"• Imposto de circulação de mercadorias (ICMS): R$ 20,00/unidade (embutido no preço de aquisição);"},{"t":"p","x":"• Desconto comercial: R$ 15,00/unidade."},{"t":"p","x":"Considerando o ICMS como um tributo não recuperável pela empresa adquirente, e com base exclusivamente nos dados apresentados, o custo total do estoque adquirido é de"}],"opts":["R$ 205.000,00.","R$ 210.000,00.","R$ 220.000,00.","R$ 235.000,00."],"gabStatus":"Definitivo","ass":"Estoques (custo, PEPS, VRL)","exp":"Custo = 200 × 1.000 = 200.000 (ICMS já está embutido no preço e é não recuperável, então fica) + imposto de importação 10.000 + seguro 6.000 + transporte 4.000 − desconto comercial 15.000 = 205.000. Atenção: não some o ICMS de novo, ele já está no preço de aquisição."},{"id":"2026.1-30","ed":"2026.1","n":30,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"A empresa Alfa S.A. possui 70% de participação em Beta S.A., adquirida por R$ 5.000.000,00. No final do exercício atual, Beta S.A. apurou um lucro líquido de R$ 1.000.000,00, destinado da seguinte forma: R$ 800.000,00 para a constituição de reservas e R$ 200.000,00 para ser distribuído na forma de dividendos. Com base exclusivamente nas informações apresentadas, o valor de ganho com equivalência patrimonial, a ser reconhecido no resultado do exercício da empresa Alfa S.A., deverá ser de"}],"opts":["R$ 140.000,00.","R$ 560.000,00.","R$ 700.000,00.","R$ 3.500.000,00."],"gabStatus":"Definitivo","ass":"Investimentos, equivalência, consolidação, combinação","exp":"A equivalência patrimonial reconhece a parte do investidor no lucro da investida, independentemente de ser distribuído ou retido: 70% × 1.000.000 = 700.000. Os dividendos recebidos só reduzem o valor do investimento."},{"id":"2026.1-31","ed":"2026.1","n":31,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"A cidade Alfa foi atingida por uma enchente nos meses de janeiro e fevereiro de X6, afetando diversas empresas da região. Entre elas, a Metalúrgica “M” Ltda. sofreu perdas significativas, com a inutilização de 25% de seus estoques. No tratamento contábil a ser adotado pela Metalúrgica “M” Ltda. para o reconhecimento desse evento em sua contabilidade, essa perda deve ser reconhecida como"}],"opts":["Custo da Mercadoria Vendida (CMV), uma vez que impacta diretamente o volume de estoques disponíveis para venda.","despesa operacional (perdas por sinistro/enchente), sem necessidade de ajuste no saldo de estoques, tendo em vista a ausência de expectativa de recuperação dos itens.","normal no curso das operações da entidade, devendo ser apropriada ao resultado como custo, diluído entre as unidades produzidas.","despesa (perdas por sinistro/enchente), com a correspondente baixa no saldo de estoques, em função da inutilização dos bens e da ausência de expectativa de recuperação econômica."],"gabStatus":"Definitivo","ass":"Estoques (custo, PEPS, VRL)","exp":"Perda de estoque por sinistro, sem expectativa de recuperação, é baixada do estoque e reconhecida como despesa (perda por sinistro). Não é CMV, porque não houve venda, e não é custo de produção normal."},{"id":"2026.1-32","ed":"2026.1","n":32,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Uma empresa possuía, em seu ativo imobilizado, um prédio, classificado como de uso administrativo. O valor de custo desse ativo era R$ 500.000,00, sua vida útil estimada era de 20 anos e seu valor residual era R$ 100.000,00. Após 5 anos, no dia 05/01/2025, a empresa classificou esse prédio como ativo não circulante mantido para venda, pois concluiu que o seu valor contábil seria recuperado, principalmente, por meio de transação de venda em vez do uso contínuo. Além disso, todos os requisitos da NBC TG 31 (R4) – ATIVO NÃO CIRCULANTE MANTIDO PARA VENDA E OPERAÇÃO DESCONTINUADA haviam sido cumpridos para essa classificação. No entanto, um ano após a classificação, no dia 05/01/2026, a empresa desistiu da venda e voltou a classificar o prédio como seu ativo imobilizado. O contador apurou adicionalmente as seguintes informações:"},{"t":"p","x":"• Valor justo do prédio em 05/01/2025: R$ 500.000,00;"},{"t":"p","x":"• Despesas de vendas em 05/01/2025: R$ 50.000,00;"},{"t":"p","x":"• Valor em uso do prédio em 05/01/2025: R$ 300.000,00;"},{"t":"p","x":"• Valor justo do prédio em 05/01/2026: R$ 450.000,00;"},{"t":"p","x":"• Despesas de vendas em 05/01/2026: R$ 45.000,00;"},{"t":"p","x":"• Valor em uso do prédio em 05/01/2026: R$ 420.000,00."},{"t":"p","x":"Com base exclusivamente nos dados apresentados, a empresa deve mensurar o prédio na classificação como ativo imobilizado em 05/01/2026 pelo seguinte valor:"}],"opts":["R$ 380.000,00.","R$ 405.000,00.","R$ 420.000,00.","R$ 450.000,00."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Depreciação anual: (500.000 − 100.000) ÷ 20 = 20.000. Em 5 anos: 100.000, valor contábil 400.000. Voltando ao imobilizado, mede-se pelo menor entre o valor contábil antes da classificação, corrigido pela depreciação que teria ocorrido (400.000 − 20.000 = 380.000), e o valor recuperável na data da decisão (maior entre 405.000 e 420.000 = 420.000). O menor é 380.000."},{"id":"2026.1-33","ed":"2026.1","n":33,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Para aplicação do método de equivalência patrimonial, quando se trata de investimentos em investidas com influência significativa, a NBC TG 18 (R4) – INVESTIMENTO EM COLIGADA E EM EMPREENDIMENTO CONTROLADO EM CONJUNTO traz algumas situações em que se poderia considerar que a investidora detém uma influência significativa. Analise as seguintes afirmativas acerca de influência significativa:"},{"t":"p","x":"I. Presume-se que a investidora tenha influência significativa sobre a investida se detiver, direta ou indiretamente, 20% ou mais do poder de voto da investida, a menos que possa ser claramente demonstrado o contrário."},{"t":"p","x":"II. Caso a investidora detenha menos de 20% do poder de voto da investida, não é admissível supor influência significativa, em nenhuma hipótese."},{"t":"p","x":"III. A representação, no Conselho de Administração ou na diretoria da investida pela investidora, pode ser uma evidência de influência significativa da entidade investidora na investida. Está correto o que se afirma em"}],"opts":["I, apenas.","II e III, apenas.","I, II e III.","I e III, apenas."],"gabStatus":"Definitivo","ass":"Investimentos, equivalência, consolidação, combinação","exp":"Certas: I (20% ou mais do poder de voto presume influência) e III (representação no conselho ou diretoria é evidência). Errada: II, porque com menos de 20% a influência pode ser admitida se for demonstrada."},{"id":"2026.1-34","ed":"2026.1","n":34,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Uma companhia S.A., concessionária de serviços públicos, emitiu faturas a prazo no valor total de R$ 100.000,00, com vencimento em 12 meses. Em conformidade com a NBC TG 12 (R1) – AJUSTE A VALOR PRESENTE, a empresa calculou um ajuste a valor presente relevante e com efeito material de R$ 5.000,00, representando os juros embutidos no prazo das faturas. Considerando as informações apresentadas e os preceitos da NBC TG 12 (R1) – AJUSTE A VALOR PRESENTE, o lançamento contábil, no momento do reconhecimento da receita, é"}],"opts":["Débito: Clientes R$ 100.000,00 Crédito: Receita de Serviços R$ 100.000,00","Débito: Clientes R$ 95.000,00 Crédito: Receita Financeira a Apropriar R$ 5.000,00 Crédito: Receita de Serviços R$ 100.000,00","Débito: Clientes R$ 95.000,00 Débito: Juros a Apropriar R$ 5.000,00 Crédito: Receita de Serviços R$ 100.000,00","Débito: Clientes R$ 100.000,00 Crédito: Receita de Serviços R$ 95.000,00 Crédito: Juros a Apropriar R$ 5.000,00"],"gabStatus":"Definitivo","ass":"Outras normas (AVP, arrendamento, instr. financeiros, tributos diferidos, câmbio, segmentos, mantido p/ venda)","exp":"Ajuste a valor presente em venda a prazo: o cliente fica com 100.000 (valor nominal) a receber e a receita é de 95.000 (valor presente), porque 5.000 são juros embutidos. A conta de juros a apropriar é retificadora de Clientes e vai sendo apropriada como receita financeira ao longo dos 12 meses."},{"id":"2026.1-35","ed":"2026.1","n":35,"mat":"Custos","gab":"B","stem":[{"t":"p","x":"A Indústria “M” S.A. produz itens para cabelos crespos e cacheados. Ela utiliza como parâmetro de análise e tomada de decisão de custo, o custo padrão e o custo real. No mês de junho de 2024, ela apresentou os seguintes dados:"},{"t":"p","x":"Tensoativos: Padrão = quantidade 3,00, custo unitário 45,00, custo total 135,00; Real = quantidade 4,50, custo unitário 55,00, custo total 247,50."},{"t":"p","x":"Óleo de Argan: Padrão = quantidade 6,00, custo unitário 6,55, custo total 39,30; Real = quantidade 9,00, custo unitário 5,47, custo total 49,30."},{"t":"p","x":"Estabilizantes de espuma: Padrão = quantidade 255,00, custo unitário 0,15, custo total 38,25; Real = quantidade 127,50, custo unitário 0,11, custo total 14,03."},{"t":"p","x":"Espessantes: Padrão = quantidade 56,00, custo unitário 0,10, custo total 5,60; Real = quantidade 28,00, custo unitário 0,50, custo total 14,00."},{"t":"p","x":"A partir desses dados, em relação à variação dos itens dos insumos de produção da Indústria “M” S.A., é correto afirmar que"}],"opts":["o Óleo de Argan apresentou variações favoráveis para a Indústria “M” S.A..","os Estabilizantes de espuma apresentam variações favoráveis para a Indústria “M” S.A..","as variações de custo total do Estabilizantes de espuma e do Espessantes são desfavoráveis.","as variações de custo total dos Tensoativos e do Óleo de Argan são favoráveis."],"gabStatus":"Definitivo","exp":"Comparando padrão e real, só os estabilizantes de espuma têm custo total real (14,03) abaixo do padrão (38,25), ou seja, variação favorável. Tensoativos, óleo de argan e espessantes custaram mais que o padrão (desfavoráveis)."},{"id":"2026.1-36","ed":"2026.1","n":36,"mat":"Custos","gab":"D","stem":[{"t":"p","x":"Uma renomada empresa de fabricação de violinos para orquestra, a Violinos “K”, iniciou suas operações no mês de janeiro. Seu único violino produzido é vendido por R$ 2.000,00 cada. Em janeiro de X4, a empresa produziu 1.200 unidades e vendeu 900 unidades. Os custos variáveis no período totalizaram R$ 600,00 por violino. Os custos fixos e despesas fixas mensais da empresa foram os seguintes:"},{"t":"p","x":"• Salários dos supervisores de fábrica: R$ 150.000,00 por mês;"},{"t":"p","x":"• Salários do pessoal administrativo: R$ 30.000,00 por mês;"},{"t":"p","x":"• Depreciação das máquinas utilizadas na fabricação: R$ 39.800,00 por mês;"},{"t":"p","x":"• Aluguel do prédio da fábrica: R$ 15.000,00 por mês;"},{"t":"p","x":"• Custos diversos de manufatura: R$ 10.000,00 por mês;"},{"t":"p","x":"• Promoção e Propaganda: R$ 20.000,00 por mês. Não houve estoques de produtos em elaboração, e não são considerados tributos incidentes sobre a receita."},{"t":"p","x":"Assinale a opção que indica o Lucro Bruto da empresa pelo método de custeio por absorção."}],"opts":["R$ 1.061.397,00.","R$ 1.465.200,00.","R$ 1.045.200,00.","R$ 1.098.900,00."],"gabStatus":"Definitivo","exp":"Absorção: custos de produção = variáveis 600 × 1.200 = 720.000 + fixos de fábrica (150.000 + 39.800 + 15.000 + 10.000 = 214.800) = 934.800, ou 779 por violino. CPV de 900 = 701.100. Receita 1.800.000. Lucro bruto: 1.098.900. Salário administrativo e propaganda são despesas, e ficam fora do lucro bruto."},{"id":"2026.1-37","ed":"2026.1","n":37,"mat":"Custos","gab":"B","stem":[{"t":"p","x":"A companhia Indústria “K” S.A. possui, em sua planta de fábrica, os setores de Montagem (30 m²) e Acabamento (50 m²). Em determinado período, o custo com a energia elétrica da produção foi de R$ 25.000,00. O critério de rateio adotado pela empresa é por área ocupada. Sendo assim, o valor alocado ao setor de Montagem é de"}],"opts":["R$ 15.625,00.","R$ 9.375,00.","R$ 12.500,00.","R$ 10.000,00."],"gabStatus":"Definitivo","exp":"Rateio por área: Montagem tem 30 m² do total de 80 m² (30 + 50), ou seja, 37,5%. 37,5% × 25.000 = 9.375."},{"id":"2026.1-38","ed":"2026.1","n":38,"mat":"Custos","gab":"B","stem":[{"t":"p","x":"A seguir, encontram-se alguns dos eventos da Indústria J em um determinado período:"},{"t":"p","x":"• Consumo da matéria-prima X: R$ 17.900,00;"},{"t":"p","x":"• Depreciação do prédio do escritório: R$ 6.600,00;"},{"t":"p","x":"• Compra da matéria-prima X: R$ 100.000,00;"},{"t":"p","x":"• Depreciação das máquinas do parque fabril: R$ 8.500,00;"},{"t":"p","x":"• Remuneração dos funcionários do Faturamento (salários): R$ 23.000,00;"},{"t":"p","x":"• Aquisição da máquina XFG210 para o parque fabril: R$ 149.000,00."},{"t":"p","x":"Assinale a opção que apresenta os valores corretos de Custos, Despesas e Investimentos, de acordo com a terminologia contábil."}],"opts":["Custos: R$ 126.400,00; Despesas: R$ 29.600,00; Investimentos: R$ 149.000,00.","Custos: R$ 26.400,00; Despesas: R$ 29.600,00; Investimentos: R$ 249.000,00.","Custos: R$ 26.400,00; Despesas: R$ 52.600,00; Investimentos: R$ 149.000,00.","Custos: R$ 35.100,00; Despesas: R$ 29.600,00; Investimentos: R$ 228.000,00."],"gabStatus":"Definitivo","exp":"Custos (ligados à produção): consumo de matéria-prima 17.900 + depreciação das máquinas 8.500 = 26.400. Despesas: depreciação do escritório 6.600 + salários do faturamento 23.000 = 29.600. Investimentos (vão para o ativo): compra de matéria-prima 100.000 + máquina 149.000 = 249.000."},{"id":"2026.1-39","ed":"2026.1","n":39,"mat":"Análise / Gerencial / Controladoria","gab":"*","stem":[{"t":"p","x":"Analise as informações abaixo sobre a empresa “N” S.A.:"},{"t":"p","x":"• Ativo circulante: R$ 1.000.000,00;"},{"t":"p","x":"• Ativo total: R$ 1.800.000,00;"},{"t":"p","x":"• Passivo não circulante: R$ 400.000,00;"},{"t":"p","x":"• Índice de liquidez seca: 0,50;"},{"t":"p","x":"• Estoque médio de mercadorias: R$ 400.000,00."},{"t":"p","x":"Com base nos dados, o valor do patrimônio líquido dessa empresa é de"}],"opts":["R$ 200.000,00.","R$ 400.000,00.","R$ 1.200.000,00.","R$ 1.600.000,00."],"gabStatus":"Definitivo"},{"id":"2026.1-40","ed":"2026.1","n":40,"mat":"Análise / Gerencial / Controladoria","gab":"C","stem":[{"t":"p","x":"Uma empresa fornece componentes tecnológicos para outras indústrias. Essa empresa adquire sua matéria-prima sempre a prazo, com pagamento médio em 20 dias. Em média, a empresa leva 70 dias para fabricar, armazenar e vender seus produtos. Ela vende somente a prazo, com pagamento em até 90 dias após a venda e, em média, leva 80 dias para receber após as vendas. Com base exclusivamente nesses dados, o ciclo operacional dessa empresa é de"}],"opts":["70 dias.","90 dias.","150 dias.","160 dias."],"gabStatus":"Definitivo","exp":"Ciclo operacional = prazo médio de estoque + prazo médio de recebimento = 70 + 80 = 150 dias. O prazo de pagamento aos fornecedores entra no ciclo financeiro, não no operacional."},{"id":"2026.1-41","ed":"2026.1","n":41,"mat":"Análise / Gerencial / Controladoria","gab":"A","stem":[{"t":"p","x":"Uma joalheria vende relógios por R$ 300,00 cada. O custo variável do relógio é de R$ 170,00, e o ponto de equilíbrio contábil da loja é de 500 unidades. Os administradores da loja decidiram aumentar o preço dos relógios para R$ 330,00, a partir do segundo semestre de 2026. Considerando que os custos fixos e variáveis permanecerão iguais, o ponto de equilíbrio da loja, após esse aumento, será de"}],"opts":["407 unidades.","455 unidades.","475 unidades.","550 unidades."],"gabStatus":"Definitivo","exp":"Margem de contribuição antiga: 300 − 170 = 130. Custos fixos = 500 × 130 = 65.000. Nova margem: 330 − 170 = 160. PE = 65.000 ÷ 160 = 406,25, e arredondando para cima, 407 unidades."},{"id":"2026.1-42","ed":"2026.1","n":42,"mat":"Análise / Gerencial / Controladoria","gab":"A","stem":[{"t":"p","x":"Uma empresa estimou os níveis de atividade para o exercício seguinte e calculou seus prazos médios correspondentes. Os resultados estão apresentados a seguir:"},{"t":"p","x":"• Receitas com vendas a prazo: R$ 250.000,00;"},{"t":"p","x":"• Custo dos produtos vendidos: R$ 110.000,00;"},{"t":"p","x":"• Aquisição de matéria-prima a prazo: R$ 90.000,00;"},{"t":"p","x":"• Demais despesas operacionais: R$ 30.000,00;"},{"t":"p","x":"• Prazo médio de contas a receber: 38 dias;"},{"t":"p","x":"• Prazo médio dos estoques: 32 dias;"},{"t":"p","x":"• Prazo médio de contas a pagar: 34 dias;"},{"t":"p","x":"• Prazo médio de demais despesas operacionais a pagar: 22 dias."},{"t":"p","x":"Com base exclusivamente nos dados apresentados, a necessidade de capital de giro dessa empresa é de"}],"opts":["R$ 25.479,00.","R$ 26.027,00.","R$ 27.287,00.","R$ 35.671,00."],"gabStatus":"Definitivo","exp":"Necessidade de capital de giro = contas a receber + estoques − fornecedores − outras contas a pagar, cada item = valor × prazo ÷ 365. Receber: 250.000 × 38 ÷ 365 = 26.027. Estoques: 110.000 × 32 ÷ 365 = 9.644. Fornecedores: 90.000 × 34 ÷ 365 = 8.384. Demais despesas: 30.000 × 22 ÷ 365 = 1.808. NCG = 26.027 + 9.644 − 8.384 − 1.808 ≈ 25.479."},{"id":"2026.1-43","ed":"2026.1","n":43,"mat":"Setor Público","gab":"C","stem":[{"t":"p","x":"Em uma entidade do setor público, verificou-se que o empenho, que havia sido formalizado, foi anulado parcialmente. Um possível motivo para a anulação parcial do empenho é que"}],"opts":["o objeto do contrato não foi cumprido.","a nota de empenho foi emitida de modo incorreto.","o valor do empenho excedia o montante da despesa realizada.","o valor empenhado era insuficiente para atender à despesa a ser realizada."],"gabStatus":"Definitivo","exp":"Anulação parcial do empenho ocorre quando o valor empenhado excedeu a despesa realizada, e a sobra é cancelada. Erro de emissão ou objeto não cumprido levariam à anulação total, e a insuficiência de valor pede reforço do empenho."},{"id":"2026.1-44","ed":"2026.1","n":44,"mat":"Setor Público","gab":"D","stem":[{"t":"p","x":"À luz do disposto no Manual de Contabilidade Aplicada ao Setor Público (MCASP), quanto ao reconhecimento e à mensuração de ativos da concessão de serviços públicos, avalie as afirmativas a seguir."},{"t":"p","x":"I. A mensuração inicial dos ativos da concessão deve ser realizada pelo menor valor entre o custo histórico e o valor recuperável."},{"t":"p","x":"II. Quando o concedente não controla nem regula os serviços objeto da concessão, o ativo da concessão não deve ser por ele reconhecido."},{"t":"p","x":"III. Os ativos da concessão devem ser classificados nas contas patrimoniais de ativo intangível, sem necessidade de segregação em classes."},{"t":"p","x":"IV. Os ativos da concessão estão sujeitos à depreciação, reavaliação e redução a valor recuperável, quando aplicáveis, como os demais itens do ativo imobilizado. Estão corretas apenas as afirmativas"}],"opts":["I e IV.","III e IV.","II e III.","II e IV."],"gabStatus":"Definitivo","exp":"II e IV estão certas. I erra: a mensuração inicial dos ativos da concessão não é pelo menor valor entre custo histórico e valor recuperável. III erra: a classificação exige segregação em classes (e não é automaticamente tudo intangível)."},{"id":"2026.1-45","ed":"2026.1","n":45,"mat":"Setor Público","gab":"C","stem":[{"t":"p","x":"Durante a elaboração da Lei Orçamentária Anual (LOA), um determinado governo estadual decidiu incluir no orçamento receitas provenientes de um novo tributo, cuja criação ainda dependia de aprovação legislativa e regulamentação posterior. À luz dos princípios orçamentários aplicáveis ao setor público brasileiro, essa prática viola, principalmente, o princípio da"}],"opts":["universalidade.","exclusividade.","legalidade.","anualidade."],"gabStatus":"Definitivo","exp":"Incluir na LOA receita de tributo que ainda nem foi criado em lei fere a legalidade: a receita precisa ter amparo legal. Universalidade, exclusividade e anualidade tratam de outros aspectos."},{"id":"2026.1-46","ed":"2026.1","n":46,"mat":"Análise / Gerencial / Controladoria","gab":"D","stem":[{"t":"p","x":"Em uma organização contábil, o contador responsável definiu diretrizes gerais para qualidade e conformidade profissional; os gestores traduziram essas diretrizes em metas por setor; e a equipe executou rotinas diárias de escrituração e atendimento às exigências do CRC. Considerando a aplicação dos níveis de planejamento no exercício da profissão contábil, conforme a NBC PG 01 – CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR e a NBC PG 100 (R1) – CUMPRIMENTO DO CÓDIGO, DOS PRINCÍPIOS FUNDAMENTAIS E DA ESTRUTURA CONCEITUAL, associe corretamente os tipos de planejamento a seguir a suas respectivas descrições:"},{"t":"p","x":"1. Planejamento estratégico."},{"t":"p","x":"2. Planejamento tático."},{"t":"p","x":"3. Planejamento operacional."},{"t":"p","x":"I. Execução das rotinas diárias e procedimentos técnicos."},{"t":"p","x":"II. Definição de diretrizes gerais e objetivos de longo prazo."},{"t":"p","x":"III. Desdobramento das diretrizes em metas e ações setoriais. A correspondência correta é"}],"opts":["1–III; 2–II; 3–I.","1–I; 2–III; 3–II.","1–II; 2–I; 3–III.","1–II; 2–III; 3–I."],"gabStatus":"Definitivo","exp":"Estratégico (1) define diretrizes gerais e objetivos de longo prazo (II). Tático (2) desdobra as diretrizes em metas e ações setoriais (III). Operacional (3) executa as rotinas do dia a dia (I). Correspondência: 1–II, 2–III, 3–I."},{"id":"2026.1-47","ed":"2026.1","n":47,"mat":"Auditoria","gab":"D","stem":[{"t":"p","x":"Durante a execução dos trabalhos de campo de auditoria das demonstrações financeiras de uma empresa de médio porte, um Auditor, ao revisar os lançamentos contábeis no sistema de gestão, identificou diversas transações de vendas que não tinham respaldo em contratos ou faturas válidas. Aplicando os procedimentos previstos na norma de auditoria correspondente, que trata da responsabilidade do auditor em relação à fraude na auditoria de demonstrações contábeis, o Auditor aprofundou a investigação e constatou que um funcionário do setor financeiro havia registrado vendas fictícias para inflar as receitas da empresa, o que caracterizava fraude com a intenção de manipular os resultados financeiros. Frente à gravidade da situação, o Auditor deve, imediatamente,"}],"opts":["procurar a ajuda de especialistas.","renunciar ao trabalho.","fazer uma denúncia anônima para a Polícia Federal.","relatar ao Conselho de Administração."],"gabStatus":"Definitivo","exp":"Constatada fraude, o auditor comunica o assunto tempestivamente ao nível apropriado da administração e aos responsáveis pela governança (aqui, o Conselho de Administração). Não renuncia por conta própria nem faz denúncia anônima, porque o sigilo profissional se aplica."},{"id":"2026.1-48","ed":"2026.1","n":48,"mat":"Auditoria","gab":"D","stem":[{"t":"p","x":"Em um treinamento para novos auditores, o instrutor destacou que, mesmo após a execução adequada dos procedimentos, pode haver a emissão de uma opinião inadequada sobre as demonstrações contábeis. Esse cenário representa o conceito de risco de auditoria, que pode ser definido como"}],"opts":["julgamento técnico realizado com base na experiência do auditor, sujeito a diferentes interpretações.","erro natural ocorrido durante o processo contábil, sem intenção da administração, mas que afeta o resultado final.","probabilidade de falha nos procedimentos ou controles, levando a conclusões incorretas sobre as demonstrações contábeis.","possibilidade de o auditor emitir uma opinião inadequada sobre demonstrações contábeis que contenham distorções relevantes não detectadas."],"gabStatus":"Definitivo","exp":"Risco de auditoria é a possibilidade de o auditor emitir opinião inadequada quando as demonstrações contêm distorção relevante que não foi detectada."},{"id":"2026.1-49","ed":"2026.1","n":49,"mat":"Perícia","gab":"D","stem":[{"t":"p","x":"Um empregado foi admitido em 01/03/2021 e trabalhou até 31/03/2023. O salário mensal dele era de R$ 3.600,00. Durante o período trabalhado, o empregado gozou de 15 dias de férias e o restante dos dias foi acumulado como férias proporcionais. O adicional de 1/3 sobre as férias é aplicável. Com base nessas informações, o laudo do perito deve apresentar que precisa ser pago ao empregado, referente ao saldo de férias proporcionais ao término do contrato e incluindo o adicional de 1/3 (considere para as contas os meses com 30 dias), o valor igual a"}],"opts":["R$ 4.800,00.","R$ 5.200,00.","R$ 6.780,00.","R$ 7.600,00."],"gabStatus":"Definitivo","exp":"Períodos: 01/03/21 a 28/02/22 e 01/03/22 a 28/02/23 completos (30 dias cada) e março de 2023 proporcional (1/12 × 30 = 2,5 dias). Total 62,5 dias − 15 gozados = 47,5 dias. Dia = 3.600 ÷ 30 = 120, então 47,5 × 120 = 5.700. Adicional de 1/3 = 1.900. Total: 7.600."},{"id":"2026.1-50","ed":"2026.1","n":50,"mat":"Perícia","gab":"D","stem":[{"t":"p","x":"O contador “X” foi nomeado para atuar como perito contábil em âmbito judicial. O juiz “Y” definiu o prazo para entrega do laudo em 30 dias úteis. Apesar da pronta aceitação do contador “X”, ao longo do exercício da função nesse caso, uma série de dificuldades técnicas fez com que o prazo inicialmente disposto para a entrega do laudo se mostrasse inviável. Assim, o contador “X” solicitou a prorrogação do prazo ao juiz “Y”. De acordo com o Novo Código de Processo Civil (CPC/2015), é correto afirmar que o juiz “Y”"}],"opts":["poderá conceder, por uma vez, a prorrogação de mais 30 dias úteis, se lhe for apresentado um motivo justificado.","deverá conceder, por uma vez, a prorrogação de mais 15 dias úteis, se lhe for apresentado um motivo justificado.","deverá conceder, por uma vez, a prorrogação de mais 30 dias úteis, se lhe for apresentado um motivo justificado.","poderá conceder, por uma vez, a prorrogação de mais 15 dias úteis, se lhe for apresentado um motivo justificado. Realização"],"gabStatus":"Definitivo","exp":"No CPC/2015, o perito pode requerer prorrogação do prazo por uma vez, por no máximo metade do prazo originalmente fixado, e o juiz poderá conceder (não é obrigado). Metade de 30 dias úteis = 15 dias úteis."},{"id":"2026.2-1","ed":"2026.2","n":1,"mat":"Português","gab":"B","stem":[{"t":"p","x":"Nas frases abaixo foram feitas substituições, mantendo-se o mesmo sentido original. Assinale a opção em que a modificação não está adequada por alterar esse sentido original."}],"opts":["A música é a alma da geometria /A música é a essência da geometria.","Somente por meio do amor o homem pode ser liberado de si mesmo / Por meio do amor somente o homem pode ser liberado de si mesmo.","O amor é a capacidade de perceber o semelhante no dessemelhante / O amor é a capacidade de percepção do semelhante no dessemelhante.","Todas as paixões nos fazem cometer erros / Todas as paixões fazem que cometamos erros."],"gabStatus":"Definitivo","exp":"Mover \"somente\" muda o sentido: \"somente por meio do amor\" indica o único caminho para a liberação, e \"por meio do amor somente o homem\" restringe quem pode ser liberado (só o homem)."},{"id":"2026.2-2","ed":"2026.2","n":2,"mat":"Português","gab":"D","stem":[{"t":"p","x":"Assinale a única frase abaixo que se mostra gramaticalmente correta."}],"opts":["A polícia interviu na briga entre as torcidas, após o jogo.","Compras à crédito podem trazer problemas futuros.","Haviam muitos carros abandonados ne estrada por causa dos desabamentos.","Para mim, trabalhar é uma atividade prazerosa."],"gabStatus":"Definitivo","exp":"A) o correto é \"interveio\". B) é \"a crédito\", sem crase antes de palavra masculina. C) o verbo haver impessoal fica no singular: \"Havia muitos carros\" (e \"na\" estrada). D) está correta."},{"id":"2026.2-3","ed":"2026.2","n":3,"mat":"Mat. Financeira / Estatística","gab":"B","stem":[{"t":"p","x":"Um empréstimo no valor de R$ 500.000,00 será quitado segundo o Sistema de Amortização Constante (SAC). O contrato estabelece um prazo de 40 meses para a quitação, com parcelas mensais, postecipadas e juros fixos de 2% ao mês, incidentes sobre o saldo devedor remanescente do período imediatamente anterior. Sabe-se que uma das parcelas mensais terá valor de R$ 18.250,00. Desconsiderando-se quaisquer encargos adicionais, tais como IOF, seguros, moras e taxas, é correto concluir que esse é o valor do"}],"opts":["17º pagamento.","18º pagamento.","19º pagamento.","20º pagamento."],"gabStatus":"Definitivo","exp":"Amortização = 500.000 ÷ 40 = 12.500. A parcela k = 12.500 + 2% × saldo anterior, que dá 22.500 − 250 × (k − 1). Para 18.250: 250 × (k − 1) = 4.250, então k − 1 = 17 e k = 18."},{"id":"2026.2-4","ed":"2026.2","n":4,"mat":"Mat. Financeira / Estatística","gab":"D","stem":[{"t":"p","x":"Ao encerrar o exercício social, o contador de uma empresa identificou um excedente temporário de caixa no valor de R$ 25.000,00. A diretoria autorizou a aplicação desse valor em um investimento financeiro remunerado à taxa de 8% ao ano, sob o regime de juros compostos. Se o recurso permanecer aplicado por 2 anos, sem aportes ou resgates intermediários, o montante acumulado ao final do período de aplicação será de:"}],"opts":["R$ 26.000,00.","R$ 27.000,00.","R$ 28.160,00.","R$ 29.160,00."],"gabStatus":"Definitivo","exp":"Montante = 25.000 × 1,08² = 25.000 × 1,1664 = 29.160."},{"id":"2026.2-5","ed":"2026.2","n":5,"mat":"Direito","gab":"C","stem":[{"t":"p","x":"Em observância às formalidades constitucionais e legais aplicáveis à espécie, a autarquia Alfa publicou edital de licitação visando à celebração de futuro contrato administrativo. Busca-se, assim, a prestação de serviços públicos de forma descentralizada e especializada, em atendimento ao interesse público primário. Nesse cenário, considerando as disposições da Constituição Federal e o entendimento doutrinário dominante, é correto afirmar que a autarquia Alfa, por se tratar de uma pessoa jurídica de direito"}],"opts":["privado integrante da Administração Direta, teve a sua criação autorizada por lei específica.","público integrante da Administração Direta, teve a sua criação autorizada por lei específica.","público integrante da Administração Indireta, foi criada por lei específica.","privado integrante da Administração Indireta, foi criada por lei específica."],"gabStatus":"Definitivo","exp":"Autarquia é pessoa jurídica de direito público, integra a Administração Indireta e é criada diretamente por lei específica (empresas públicas e sociedades de economia mista é que têm criação autorizada por lei)."},{"id":"2026.2-6","ed":"2026.2","n":6,"mat":"Direito","gab":"B","stem":[{"t":"p","x":"Após a observância do contraditório e da ampla defesa, como consectários do devido processo legal, a autoridade pública competente, no âmbito da autarquia Alfa, editou ato administrativo punitivo em detrimento de Lucas, servidor público estatutário, a ele aplicando a sanção administrativa de suspensão, em razão de infração funcional outrora praticada. Nesse cenário, considerando o entendimento doutrinário dominante, é correto afirmar que a infração funcional praticada por Lucas é"}],"opts":["a finalidade do ato administrativo punitivo.","o motivo do ato administrativo punitivo.","o objeto do ato administrativo punitivo.","o móvel do ato administrativo punitivo."],"gabStatus":"Definitivo","exp":"Motivo é o pressuposto de fato e de direito que leva à prática do ato. Aqui, a infração funcional é o motivo da punição. O objeto é a suspensão em si, e a finalidade é o interesse público."},{"id":"2026.2-7","ed":"2026.2","n":7,"mat":"Direito","gab":"D","stem":[{"t":"p","x":"Ao analisar o teor da Constituição Federal, João, estudante, constatou que determinado princípio foi nela incluído por meio da Emenda Constitucional nº 19/1998, com o objetivo de substituir a Administração Pública burocrática pela Administração Pública gerencial. A ideia por trás desse princípio está intimamente relacionada com a necessidade de efetivação célere das finalidades públicas elencadas no ordenamento jurídico. Nesse cenário, considerando as disposições da Constituição Federal e o entendimento doutrinário dominante, é correto afirmar que se está fazendo referência ao princípio da"}],"opts":["impessoalidade.","moralidade.","legalidade.","eficiência."],"gabStatus":"Definitivo","exp":"O princípio da eficiência entrou no art. 37 da Constituição pela EC 19/1998, com a lógica da Administração gerencial."},{"id":"2026.2-8","ed":"2026.2","n":8,"mat":"Ética","gab":"D","stem":[{"t":"p","x":"A empresa Horizonte Ltda. enfrenta dificuldades financeiras e seus gestores solicitam ao contador que elabore relatórios financeiros para fins gerais “menos detalhados” para evitar questionamentos de credores e investidores. Considerando o papel da Contabilidade na sociedade e as disposições da NBC PG 01 – CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR e da NBC PG 100 (R1) – CUMPRIMENTO DO CÓDIGO, DOS PRINCÍPIOS FUNDAMENTAIS E DA ESTRUTURA CONCEITUAL, a atuação adequada do profissional deve refletir o princípio de que a Contabilidade"}],"opts":["serve exclusivamente como instrumento interno de controle gerencial.","atende prioritariamente aos interesses dos administradores da entidade, o que gera a necessidade de se balancear função social com interesses financeiros.","deve adaptar o nível de transparência das informações à conveniência da administração.","tem a função social de produzir informações úteis, fidedignas e transparentes para os diversos usuários, preservando o interesse público e a confiança na profissão contábil."],"gabStatus":"Definitivo","exp":"A contabilidade tem função social: produzir informação útil, fidedigna e transparente para os diversos usuários, preservando o interesse público. Não se ajusta a transparência à conveniência da administração."},{"id":"2026.2-9","ed":"2026.2","n":9,"mat":"Ética","gab":"D","stem":[{"t":"p","x":"Durante procedimento de fiscalização do CRC, verificou-se que um contador responsável técnico delegava integralmente a execução de serviços contábeis a terceiros não registrados, assinando posteriormente as demonstrações sem revisão técnica adequada. O contador alegava que a responsabilidade era apenas contratual perante o cliente. Considerando a Resolução CFC nº 1.612/2021 – REGULAMENTO GERAL DOS CONSELHOS DE CONTABILIDADE, a NBC PG 01 – CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR e a NBC PG 100 (R1) – CUMPRIMENTO DO CÓDIGO, PRINCÍPIOS FUNDAMENTAIS E DA ESTRUTURA CONCEITUAL, a conduta profissional adequada reconhece que a responsabilidade técnica é"}],"opts":["pessoal e indelegável, limitada ao vínculo contratual firmado com o cliente, exigindo supervisão efetiva, observância das normas profissionais e cooperação com a fiscalização para preservar o interesse público.","pessoal e delegável, exigindo supervisão seletiva, observância das normas profissionais e alinhamento automático com a fiscalização na preservação dos interesses particulares.","impessoal e delegável, exigindo supervisão seletiva, inobservância das normas profissionais e embate com a fiscalização a respeito do interesse público.","pessoal e indelegável, exigindo supervisão efetiva, observância das normas profissionais e cooperação com a fiscalização para preservar o interesse público."],"gabStatus":"Definitivo","exp":"A responsabilidade técnica é pessoal e indelegável. Exige supervisão efetiva, observância das normas e cooperação com a fiscalização. Ela não se limita ao vínculo contratual com o cliente, e é por isso que A erra."},{"id":"2026.2-10","ed":"2026.2","n":10,"mat":"Ética","gab":"A","stem":[{"t":"p","x":"O contador Marcos atua como Perito Contábil inscrito no CNPC. Em um ano-calendário, cumpriu 35 pontos de Educação Profissional Continuada (EPC), sendo 10 na diretriz de aquisição de conhecimento. Acreditando estar regular, inseriu seus comprovantes no sistema Web EPC do Conselho Federal de Contabilidade, no dia 20 de fevereiro do exercício subsequente. Nesse caso, com base na NBC PG 12 (R5) – EDUCAÇÃO PROFISSIONAL CONTINUADA, avalie se cada afirmativa a seguir é verdadeira (V) ou falsa (F)."},{"t":"p","x":"( ) A submissão à Educação Profissional Continuada é facultativa para Marcos, pois a obrigatoriedade normativa restringe-se aos auditores independentes e responsáveis técnicos."},{"t":"p","x":"( ) A pontuação alcançada por Marcos foi insuficiente, uma vez que a norma exige, no mínimo, 40 pontos anuais, sendo obrigatoriamente 12 pontos em aquisição de conhecimento."},{"t":"p","x":"( ) O envio da comprovação documental no sistema Web EPC foi intempestivo, visto que o prazo máximo determinado pela regulamentação é até 31 de janeiro do exercício subsequente. As afirmativas são, respectivamente,"}],"opts":["F – V – V.","V – F – F.","F – F – V.","V – V – F."],"gabStatus":"Definitivo","exp":"A EPC é obrigatória também para perito inscrito no CNPC (primeira, F). A exigência mínima é 40 pontos anuais, com 12 em aquisição de conhecimento (segunda, V: Marcos fez 35 e 10). O prazo para enviar a comprovação é até 31 de janeiro do exercício seguinte, então 20/02 foi fora do prazo (terceira, V)."},{"id":"2026.2-11","ed":"2026.2","n":11,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Em março de 2026, uma sociedade empresária publicou as suas demonstrações contábeis referentes a 31/12/2025. De acordo com a NBC TG ESTRUTURA CONCEITUAL – ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, as demonstrações contábeis são elaboradas para um período de tempo específico (período de relatório), para ajudar os usuários a identificar e avaliar mudanças e tendências e também"}],"opts":["calculam os principais indicadores de análise contábil.","apresentam projeções para, pelo menos, o exercício seguinte.","reproduzem as normas contábeis relacionadas a cada ponto apresentado.","fornecem informações comparativas de, pelo menos, um período de relatório anterior."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Além de cobrir um período específico, as demonstrações trazem informações comparativas de pelo menos um período anterior. Isso permite ver mudanças e tendências. Não trazem projeções, indicadores prontos nem reprodução de normas."},{"id":"2026.2-12","ed":"2026.2","n":12,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Com base nos conceitos de ativos, passivos, receitas e despesas e dos critérios necessários para reconhecimento apresentados na NBC TG ESTRUTURA CONCEITUAL, assinale a afirmativa correta."}],"opts":["A receita deve ser reconhecida quando o cliente realiza o pedido para a realização de um determinado serviço, com contrapartida em Contas a Receber de Clientes.","A distribuição de dividendos deve ser reconhecida como despesa financeira no resultado, em contrapartida ao passivo ou caixa.","O aumento de capital gera o reconhecimento de receitas em contrapartida ao registro em caixa.","O custo das mercadorias vendidas deve ser reconhecido quando ocorre a transferência de controle das mercadorias ao cliente, com a baixa dos estoques no ativo."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"O custo das mercadorias vendidas é reconhecido quando o controle passa ao cliente, com a baixa do estoque. Pedido não é receita, dividendo é distribuição ao PL (não despesa) e aumento de capital é aporte, não receita."},{"id":"2026.2-13","ed":"2026.2","n":13,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Uma companhia S.A. realizou recentemente sua oferta pública inicial de ações (IPO) e passou a negociar seus papéis em Bolsa de Valores. Em uma reunião do conselho de administração, o diretor de relações com investidores destacou a importância do relatório financeiro para fins gerais, afirmando que ele deve atender às necessidades informacionais dos diversos usuários externos da companhia. Durante a reunião, foram apresentadas algumas afirmações sobre o objetivo do relatório financeiro para fins gerais. Considerando-se os preceitos da NBC TG ESTRUTURA CONCEITUAL, é correto afirmar que"}],"opts":["o relatório financeiro para fins gerais destina-se a apresentar o valor de mercado da entidade que reporta.","a administração da companhia depende das informações do relatório financeiro para fins gerais para basear suas decisões estratégicas.","o relatório financeiro para fins gerais fornece todas as informações de que necessitam investidores, credores por empréstimos e administradores da companhia para a tomada de decisões.","o objetivo do relatório financeiro para fins gerais é fornecer informações úteis a investidores, credores por empréstimos e outros credores, existentes e potenciais, para decisões sobre o fornecimento de recursos à entidade."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"O objetivo do relatório para fins gerais é dar informação útil a investidores, credores por empréstimos e outros credores, existentes e potenciais, para decidirem sobre fornecer recursos. Ele não mostra valor de mercado, não é base das decisões da administração e não traz tudo que os usuários precisam."},{"id":"2026.2-14","ed":"2026.2","n":14,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Uma empresa S.A. tem como objeto a lavra, o processamento, o comércio e o transporte de petróleo proveniente de poço. Após o encerramento do exercício social de 2025, em 31/12/2025, e antes da data de autorização para emissão das demonstrações contábeis, uma plataforma de petróleo da empresa pegou fogo, gerando danos significativos ao ativo imobilizado. Considerando-se as informações apresentadas e os preceitos da NBC TG 24 (R2) – EVENTO SUBSEQUENTE, o incêndio"}],"opts":["deve ser desconsiderado como um evento subsequente, pois ocorreu fora do período contábil de 2025.","deve ser desconsiderado nas demonstrações contábeis, pois ainda não houve baixa da plataforma incendiada.","é um evento subsequente que representa condição surgida após a data-base, devendo ser divulgado em nota explicativa.","é um evento subsequente que exige ajuste nas demonstrações contábeis, pois evidencia uma condição existente na data- base."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"O incêndio aconteceu depois de 31/12/2025 e não evidencia condição que já existia na data-base. É evento subsequente que não gera ajuste: só se divulga em nota explicativa, por ser relevante."},{"id":"2026.2-15","ed":"2026.2","n":15,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"A empresa Cargas ABC S.A. possui em seu Ativo Imobilizado um veículo utilizado para entregas. Ao final do exercício de 2025, a empresa realizou o teste de recuperabilidade (impairment) para esse Ativo. O contador da empresa levantou as seguintes informações:"},{"t":"p","x":"• Valor Contábil (após depreciação): R$ 150.000,00."},{"t":"p","x":"• Valor Justo Líquido de despesas de venda: R$ 130.000,00."},{"t":"p","x":"• Valor em uso: R$ 145.000,00."},{"t":"p","x":"Com base nas disposições da NBC TG 01 (R4) – REDUÇÃO AO VALOR RECUPERÁVEL DE ATIVOS, o procedimento correto a ser adotado pela empresa é"}],"opts":["reconhecer uma perda por desvalorização no valor de R$ 20.000,00, pois o valor de venda é o menor dentre os valores apresentados.","não reconhecer nenhuma perda, pois o valor recuperável, de R$ 145.000,00, é maior do que o valor de venda.","reconhecer uma perda por desvalorização no valor de R$ 5.000,00, para ajustar o valor contábil ao valor recuperável.","ajustar o valor do ativo para R$ 130.000,00, em observância ao princípio da prudência."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Valor recuperável é o maior entre valor justo líquido (130.000) e valor em uso (145.000), ou seja, 145.000. Como o valor contábil é 150.000, a perda é de 5.000. O ajuste vai ao valor recuperável, não ao valor de venda."},{"id":"2026.2-16","ed":"2026.2","n":16,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"A Indústria Metalúrgica Aço S.A. adquiriu uma nova máquina para sua linha de produção. Durante o processo de aquisição e instalação, a empresa incorreu nos seguintes gastos:"},{"t":"p","x":"• Preço de compra da máquina: R$ 200.000,00."},{"t":"p","x":"• Gastos com frete e seguro para transporte até a fábrica: R$ 10.000,00."},{"t":"p","x":"• Gastos com a preparação do local e fundação para instalação da máquina: R$ 15.000,00."},{"t":"p","x":"• Treinamento dos funcionários para operar a nova máquina: R$ 5.000,00."},{"t":"p","x":"• Gastos com testes para verificar se o equipamento está funcionando adequadamente: R$ 3.000,00."},{"t":"p","x":"Com base nas disposições da NBC TG 27 (R4) – ATIVO IMOBILIZADO, o valor total que deve ser reconhecido inicialmente no Ativo da empresa referente a essa máquina é de"}],"opts":["R$ 228.000,00.","R$ 233.000,00.","R$ 200.000,00.","R$ 210.000,00."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Entram no custo: preço 200.000, frete e seguro 10.000, preparação do local 15.000 e testes 3.000, total de 228.000. Treinamento de funcionários é despesa e não faz parte do custo do imobilizado."},{"id":"2026.2-17","ed":"2026.2","n":17,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Uma empresa adquiriu uma marca com vida útil considerada indefinida, um software com vida útil definida e máquinas industriais. Considerando o que estabelecem a NBC TG 01 (R4) – REDUÇÃO AO VALOR RECUPERÁVEL DE ATIVOS, a NBC TG 04 (R4) – ATIVO INTANGÍVEL e a NBC TG 27 (R4) – ATIVO IMOBILIZADO, assinale a opção que apresenta o tratamento contábil correto para o caso."}],"opts":["A empresa inicia a amortização dos intangíveis apenas quando obtém a propriedade legal, mesmo que já esteja utilizando esses ativos.","A empresa amortiza a marca de vida útil indefinida a uma taxa anual fixa de 10%, por não ser possível estimar sua vida útil econômica.","A empresa não amortiza a marca de vida útil indefinida, mas realiza anualmente o teste de redução ao valor recuperável desse ativo.","A empresa utiliza as taxas de depreciação definidas pela legislação fiscal para registrar a depreciação das máquinas nas demonstrações contábeis societárias."],"gabStatus":"Definitivo","ass":"Intangível","exp":"Intangível de vida útil indefinida, como a marca, não é amortizado, mas passa por teste de recuperabilidade pelo menos uma vez por ano. Amortização começa quando o ativo está disponível para uso, e a depreciação contábil segue a vida útil econômica, não as taxas fiscais."},{"id":"2026.2-18","ed":"2026.2","n":18,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"A Sociedade Empresária “A” adquiriu mercadorias para revenda à vista pelo valor bruto de R$ 100.000,00, indicado na nota fiscal do fornecedor. Nessa operação, considere as seguintes informações para a empresa compradora: ICMS (imposto recuperável) incluído na nota fiscal: R$ 18.000,00. Frete para transporte das mercadorias até a empresa, pago pela Sociedade Empresária “A”: R$ 4.000,00. Considerando as regras da NBC TG 16 (R2) – ESTOQUES, o valor inicial a ser registrado na conta de Estoques é de"}],"opts":["R$ 86.000,00.","R$ 100.000,00.","R$ 82.000,00.","R$ 104.000,00."],"gabStatus":"Definitivo","ass":"Estoques (custo, PEPS, VRL)","exp":"Estoque entra pelo preço de compra, menos tributos recuperáveis, mais gastos para colocar a mercadoria no local. 100.000 − 18.000 de ICMS recuperável + 4.000 de frete = 86.000."},{"id":"2026.2-19","ed":"2026.2","n":19,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"O Departamento jurídico da Empresa Ltda. apresentou parecer acerca dos seguintes casos que envolvem situações jurídicas e fiscais em andamento:"},{"t":"p","x":"• CASO 1: Autuação Fiscal: Auto de infração recebido do fisco Federal. A probabilidade de perda é avaliada como PROVÁVEL, sendo possível fazer uma estimativa confiável do valor."},{"t":"p","x":"• CASO 2: Ação Cível: Processo movido por um cliente por danos morais. A probabilidade de perda é classificada como POSSÍVEL."},{"t":"p","x":"• CASO 3: Processo Trabalhista: Ação judicial movida por um empregado. Os advogados da empresa classificam a perda como REMOTA. De acordo com as informações do departamento jurídico da empresa e as determinações da NBC TG 25 (R2) – PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, assinale a opção correta a respeito da forma como a empresa deve proceder em relação ao reconhecimento contábil e à evidenciação em notas explicativas para os três casos apresentados."}],"opts":["CASO 1: Reconhecer a provisão no Passivo e divulgar em notas explicativas; CASO 2: Não reconhecer no Passivo, apenas divulgar como passivo contingente em nota explicativa; CASO 3: Não reconhecer e nem divulgar em notas explicativas.","CASO 1: Não reconhecer no Passivo, apenas divulgar como passivo contingente em nota explicativa; CASO 2: Reconhecer provisão no Passivo; CASO 3: Não reconhecer no Passivo, apenas divulgar como passivo contingente em nota explicativa.","CASO 1: Não reconhecer e nem divulgar em notas explicativas; CASO 2: Não reconhecer no Passivo, apenas divulgar como passivo contingente em nota explicativa; CASO 3: Reconhecer provisão no Passivo.","CASO 1: Reconhecer a provisão no Passivo; CASO 2: Não reconhecer e nem divulgar em notas explicativas; CASO 3: Não reconhecer e nem divulgar em notas explicativas."],"gabStatus":"Definitivo","ass":"Provisões e contingências (TG 25)","exp":"Caso 1 (perda provável com estimativa confiável): reconhece provisão e divulga. Caso 2 (perda possível): passivo contingente, só divulga em nota. Caso 3 (perda remota): nada a reconhecer nem divulgar."},{"id":"2026.2-20","ed":"2026.2","n":20,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Relacione os conceitos de bases de mensuração do valor atual previstos na NBC TG ESTRUTURA CONCEITUAL para relatório financeiro, apresentados na primeira coluna, com seus respectivos significados, descritos na segunda coluna."},{"t":"p","x":"Primeira coluna:"},{"t":"p","x":"1. Valor Justo"},{"t":"p","x":"2. Valor em uso"},{"t":"p","x":"3. Custo corrente"},{"t":"p","x":"4. Valor de cumprimento"},{"t":"p","x":"Segunda coluna:"},{"t":"p","x":"( ) É o preço que seria recebido pela venda de ativo ou que seria pago pela transferência de passivo em transação ordenada entre participantes do mercado na data de mensuração."},{"t":"p","x":"( ) É o valor presente do caixa, ou de outros recursos econômicos, que a entidade espera ser obrigada a transferir para cumprir a obrigação."},{"t":"p","x":"( ) É o valor presente dos fluxos de caixa, ou outros benefícios econômicos, que a entidade espera obter do uso de ativo e de sua alienação final."},{"t":"p","x":"( ) É a contraprestação que seria paga pelo ativo equivalente na data de mensuração mais os custos de transação que seriam incorridos nessa data, ou a contraprestação que seria recebida pelo passivo equivalente na data de mensuração menos os custos de transação que seriam incorridos nessa data."},{"t":"p","x":"A relação correta, na ordem apresentada, é:"}],"opts":["4 – 2 – 3 – 1.","1 – 4 – 2 – 3.","2 – 3 – 1 – 4.","3 – 4 – 2 – 1."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Valor justo é o preço recebido pela venda do ativo ou pago pela transferência do passivo (1). Valor de cumprimento é o valor presente do que a entidade espera transferir para cumprir a obrigação (4). Valor em uso é o valor presente dos fluxos do uso e da alienação final do ativo (2). Custo corrente é a contraprestação pelo ativo equivalente, mais custos de transação (3). Ordem: 1, 4, 2, 3."},{"id":"2026.2-21","ed":"2026.2","n":21,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Uma empresa comercial apresentou os seguintes dados e valores referentes à folha de pagamento de seus empregados do mês de agosto de 2026:"},{"t":"p","x":"• Salários Brutos: R$ 100.000,00, a serem pagos em setembro;"},{"t":"p","x":"• Contribuição Previdenciária retida dos empregados (INSS): R$ 11.000,00;"},{"t":"p","x":"• Imposto de Renda Retido na Fonte (IRRF): R$ 4.000,00."},{"t":"p","x":"Considerando exclusivamente essas informações, assinale a opção que apresenta corretamente o reconhecimento da apropriação dos salários e retenções no mês de agosto de 2026."}],"opts":["Débito – Despesa com Salários (R$ 85.000,00); Débito – Passivo Circulante – INSS a Recolher (R$ 11.000,00); Débito – Passivo Circulante – IRRF a Recolher (R$ 4.000,00), e Crédito – Passivo Circulante – Salários a Pagar (R$ 100.000,00).","Débito – Despesa com Salários (R$ 85.000,00); Débito – Despesa com INSS (R$ 11.0000,00); Débito – Despesa com IRRF (R$ 4.000,00), e Crédito – Passivo não Circulante – Salários a Pagar (R$ 100.000,00).","Débito – Passivo Circulante – Salários a Pagar (R$ 100.000,00); Crédito – Despesa com Salários (R$ 85.000,00); Crédito – Passivo Circulante – INSS a Recolher (R$ 11.000,00), e Crédito – Passivo Circulante – IRRF a Recolher (R$ 4.000,00).","Débito – Despesa com Salários (R$ 100.000,00); Crédito – Passivo Circulante – Salários a Pagar (R$ 85.000,00); Crédito – Passivo Circulante – INSS a Recolher (R$ 11.000,00), e Crédito – Passivo Circulante – IRRF a Recolher (R$ 4.000,00)."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"O salário bruto é a despesa inteira: 100.000. A empresa deve 85.000 ao empregado e retém 11.000 de INSS e 4.000 de IRRF, que viram obrigações a recolher. Débito em despesa de 100.000 e créditos de 85.000, 11.000 e 4.000 no passivo circulante."},{"id":"2026.2-22","ed":"2026.2","n":22,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Em junho de 2026, uma entidade contratou um professor externo para ministrar um curso sobre inteligência artificial a seus empregados, por R$ 12.000,00. O valor foi pago em três parcelas iguais, em junho, julho e agosto de 2026. Metade das aulas foi ministrada em junho, e o restante, em julho. De acordo com o Regime de Competência, a despesa com o professor na Demonstração do Resultado mensal da entidade, em 30/06/2026, foi"}],"opts":["zero.","R$ 4.000,00.","R$ 6.000,00.","R$ 12.000,00."],"gabStatus":"Definitivo","ass":"Operações básicas (competência, folha, lançamentos)","exp":"Pela competência, a despesa vem do serviço prestado: metade das aulas em junho = 6.000. A forma de pagamento (três parcelas) não muda o mês da despesa."},{"id":"2026.2-23","ed":"2026.2","n":23,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Em 31/12/2025, a Cia Gama reconheceu a distribuição de R$ 50.000,00 a título de dividendos mínimos obrigatórios. O valor foi pago aos acionistas da empresa em 2026. Ao analisar a Demonstração de Mutações do Patrimônio Líquido anual da Cia Gama, em 31/12/2025, pôde-se constatar que, em decorrência da distribuição dos dividendos obrigatórios, o total do patrimônio líquido"}],"opts":["diminuiu.","aumentou.","permaneceu o mesmo, assim como o saldo das contas.","permaneceu o mesmo, mas houve modificações nos saldos das contas."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"Reconhecer dividendos a distribuir em 31/12/2025 reduz o patrimônio líquido (saem de lucros acumulados) e cria um passivo. O pagamento em 2026 só baixa esse passivo contra caixa, sem mexer no PL."},{"id":"2026.2-24","ed":"2026.2","n":24,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Em 01/01/2025, a Cia XYZ comprou um veículo para utilizar em seus negócios por R$ 50.000,00, à vista. Na data, a entidade planejava utilizar o veículo durante cinco anos. No entanto, em 31/12/2025, os gestores da Cia XYZ constataram que o veículo era pouco utilizado e o venderam por R$ 42.000,00, à vista. A Cia XYZ utiliza o método da linha reta para depreciar os seus ativos imobilizados e considera valor residual nulo. Considerando apenas esses fatos, em 31/12/2025, na Demonstração dos Fluxos de Caixa anual da entidade, a atividade de investimento"}],"opts":["gerou líquido R$ 2.000,00.","gerou líquido R$ 42.000,00.","consumiu líquido R$ 8.000,00.","consumiu líquido R$ 10.000,00."],"gabStatus":"Definitivo","ass":"Imobilizado, deprec
