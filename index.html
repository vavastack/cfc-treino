iação, impairment","exp":"A DFC de investimento reflete a compra (saída de 50.000) e a venda (entrada de 42.000). O líquido é consumo de 8.000. A depreciação não afeta caixa."},{"id":"2026.2-25","ed":"2026.2","n":25,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Em 31/12/2025, a Cia. KMLK não apresentou, em sua Demonstração do Valor Adicionado, saldo no item “Valor Adicionado Recebido em Transferência”. O fato de a empresa não apresentar valor nesse item pode indicar que a Cia. KMLK"}],"opts":["presta as suas atividades em imóvel próprio.","não possui investimento em controladas e coligadas.","não reconheceu perda de recuperabilidade de seus ativos.","tem todo o serviço realizado por mão de obra contratada."],"gabStatus":"Definitivo","ass":"DVA","exp":"O valor adicionado recebido em transferência traz principalmente equivalência patrimonial, receitas financeiras e aluguéis recebidos. Saldo zero pode indicar que a empresa não tem investimentos em controladas e coligadas (sem equivalência)."},{"id":"2026.2-26","ed":"2026.2","n":26,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Em 31/12/2025, a Cia. Alfa apresentava os seguintes saldos em seu Balanço Patrimonial:"},{"t":"p","x":"• Disponibilidades: R$ 300.000,00;"},{"t":"p","x":"• Capital Social: R$ 300.000,00. Já a Cia. Beta apresentava os seguintes saldos:"},{"t":"p","x":"• Disponibilidades: R$ 12.000,00;"},{"t":"p","x":"• Terrenos: R$ 40.000,00;"},{"t":"p","x":"• Capital Social: R$ 52.000,00. Em 01/01/2026, a Cia. Alfa adquiriu 100% de participação na Cia. Beta por R$ 90.000,00, que corresponde ao valor justo dessa participação. Na data, foi avaliado que os terrenos tinham valor de mercado de R$ 45.000,00. Além disso, no processo de apropriação do preço pago, foi atribuído à marca da Cia. Beta um valor de R$ 18.000,00. Ainda, foi avaliado que a Cia. Beta possuía empregados bem treinados e com grande capacidade de geração de benefícios futuros."},{"t":"p","x":"Assinale a opção que indica o goodwill reconhecido pela Cia. Alfa na data da compra, em seu Balanço Patrimonial, de acordo com a NBC TG 15 (R4) – COMBINAÇÃO DE NEGÓCIOS."}],"opts":["R$ 15.000,00.","R$ 27.000,00.","R$ 33.000,00.","R$ 38.000,00."],"gabStatus":"Definitivo","ass":"Investimentos, equivalência, consolidação, combinação","exp":"Valor justo líquido dos ativos identificáveis: caixa 12.000 + terrenos a valor de mercado 45.000 + marca 18.000 = 75.000. Goodwill = 90.000 − 75.000 = 15.000. Empregados bem treinados não são reconhecidos como ativo separado, e já estão no goodwill."},{"id":"2026.2-27","ed":"2026.2","n":27,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"A companhia Delta possuía, em 31/12/2025: numerário em caixa no valor de R$ 40.000,00; valores a receber de no valor de R$ 10.000,00 referentes a vendas entregues; e patrimônio líquido no valor de R$ 50.000,00. Em janeiro de 2026, a diretoria da empresa aprovou a intenção de comprar novos equipamentos avaliados em R$ 30.000,00 no mês seguinte. Concomitantemente, a entidade firmou um contrato para serviços de manutenção, ainda não prestados, a terceiro, no valor de R$ 15.000,00. Nenhum valor foi recebido. Por fim, a contabilidade reconheceu uma dívida de R$ 25.000,00 referente à compra de matérias-primas que já foram recebidas no estoque. O contador da companhia apura os totais monetários que cumprem, rigorosamente, as definições contábeis exigidas pela norma. Em relação à classificação e à totalização dos elementos patrimoniais descritos, avalie se cada afirmativa a seguir é verdadeira (V) ou falsa (F)."},{"t":"p","x":"I. O total de ativos da entidade soma R$ 80.000,00, uma vez que a intenção de aquisição futura dos equipamentos atende à definição normativa de recurso econômico presente controlado por evento passado."},{"t":"p","x":"II. O passivo da entidade totaliza estritamente R$ 25.000,00, caracterizando-se como a única obrigação presente de transferir um recurso econômico resultante da ocorrência de um evento já passado."},{"t":"p","x":"III. O contrato de manutenção firmado eleva as obrigações para R$ 40.000,00, pois a assinatura documental por si só caracteriza o recebimento de benefícios econômicos e o surgimento de um passivo imediato. À luz das definições de ativos e passivos preconizadas pela NBC TG ESTRUTURA CONCEITUAL, está correto o que se afirma em"}],"opts":["I e III, apenas.","III, apenas.","II, apenas.","I e II, apenas."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Ativos: caixa 40.000 + a receber 10.000 + estoque 25.000 (matéria-prima já recebida) = 75.000, não 80.000. A intenção de comprar equipamentos não é ativo, pois não há direito presente. Passivo: só a dívida de 25.000. O contrato de manutenção ainda não prestado é contrato a executar, sem obrigação presente. Só a II é verdadeira."},{"id":"2026.2-28","ed":"2026.2","n":28,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Ao longo de 2021, a Controladora Alfa vendeu mercadorias para sua controlada Beta por R$ 500.000,00. O custo das mercadorias era de R$ 350.000,00. Em 31/12/2021, 40% dessas mercadorias permaneciam em estoque na controlada. Na elaboração das demonstrações consolidadas de acordo com a NBC TG 36 (R3) – DEMONSTRAÇÕES CONSOLIDADAS, o lucro não realizado que deverá ser eliminado é de"}],"opts":["R$ 60.000,00.","R$ 90.000,00.","R$ 120.000,00.","R$ 150.000,00."],"gabStatus":"Definitivo","ass":"Investimentos, equivalência, consolidação, combinação","exp":"O lucro na venda dentro do grupo é 500.000 − 350.000 = 150.000. Como 40% das mercadorias ainda estão em estoque na controlada, o lucro não realizado a eliminar é 40% × 150.000 = 60.000."},{"id":"2026.2-29","ed":"2026.2","n":29,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"A empresa “F” S.A. iniciou suas atividades em 01/11/2025 com as seguintes operações no primeiro mês:"},{"t":"p","x":"• Subscrição e integralização total de Capital no valor de R$ 200.000,00 em depósito bancário."},{"t":"p","x":"• Compra de mercadorias para revenda no valor de R$ 50.000,00, a prazo, para pagamento em 60 dias."},{"t":"p","x":"• Prestação de serviços a clientes no valor de R$ 30.000,00, recebida integralmente à vista, por PIX."},{"t":"p","x":"• Pagamento à vista de despesas gerais do mês no valor de R$ 5.000,00."},{"t":"p","x":"Considerando apenas as operações descritas e aplicando o regime de competência para a apuração do resultado do exercício, os valores do Ativo Total e do Patrimônio Líquido no Balanço Patrimonial de 30/11/2025 foram, respectivamente,"}],"opts":["R$ 225.000,00 e R$ 225.000,00.","R$ 275.000,00 e R$ 225.000,00.","R$ 275.000,00 e R$ 200.000,00.","R$ 225.000,00 e R$ 175.000,00."],"gabStatus":"Definitivo","ass":"Operações básicas (competência, folha, lançamentos)","exp":"Ativo: caixa 200.000 + 30.000 − 5.000 = 225.000 e estoque 50.000, total de 275.000. Passivo: fornecedores 50.000. PL: capital 200.000 + lucro (30.000 − 5.000 = 25.000) = 225.000. Confere: 275.000 = 50.000 + 225.000."},{"id":"2026.2-30","ed":"2026.2","n":30,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Em 10/06/2025, a empresa “CD” S.A. realizou, em 10/06/20X5, o pagamento em atraso de uma duplicata de sua responsabilidade no valor nominal de R$ 10.000,00. Em decorrência do atraso, a instituição bancária processou uma transferência eletrônica total no valor de R$ 10.500,00, sendo liquidadas as condições contratuais com a inclusão de R$ 500,00 relativos a juros de mora, uma despesa financeira. O contador, ao registrar a operação no livro diário, deve realizar o seguinte lançamento contábil:"}],"opts":["Débito: Duplicatas a pagar R$ 10.000,00 Débito: Despesas com juros R$ 500,00 Crédito: Bancos R$ 10.500,00","Débito: Duplicatas a pagar R$ 10.500,00 Crédito: Bancos R$ 10.500,00","Débito: Duplicatas a pagar R$ 11.000,00 Crédito: Despesas com juros R$ 500,00 Crédito: Bancos R$ 10.500,00","Débito: Bancos R$ 10.500,00 Crédito: Duplicatas a pagar R$ 10.000,00 Crédito: Despesas com juros R$ 500,00"],"gabStatus":"Definitivo","ass":"Operações básicas (competência, folha, lançamentos)","exp":"A dívida baixa pelo valor nominal (débito em Duplicatas a pagar de 10.000), os juros de mora são despesa financeira (débito de 500) e o crédito em Bancos é o total pago (10.500)."},{"id":"2026.2-31","ed":"2026.2","n":31,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"O departamento de contabilidade da empresa \"Qui” S.A. extraiu os seguintes saldos das suas contas patrimoniais em 31/12/20X5, antes da estruturação final do Balanço Patrimonial:"},{"t":"p","x":"• Caixa e equivalentes de caixa: R$ 15.000,00;"},{"t":"p","x":"• Duplicatas a receber (vencimento em até 60 dias): R$ 45.000,00;"},{"t":"p","x":"• Perdas estimadas com créditos de liquidação duvidosa: R$ 2.000,00;"},{"t":"p","x":"• Estoques de mercadorias para revenda: R$ 25.000,00;"},{"t":"p","x":"• Adiantamento a fornecedor de curto prazo: R$ 10.000,00;"},{"t":"p","x":"• Adiantamento de Clientes: R$ 14.000,00;"},{"t":"p","x":"• Veículos para uso nas entregas: R$ 50.000,00;"},{"t":"p","x":"• Fornecedores (vencimento em 90 dias): R$ 30.000,00."},{"t":"p","x":"Com base estritamente nas normas de apresentação e classificação do Balanço Patrimonial, assinale a opção que apresenta o valor total líquido a ser evidenciado no subgrupo do Ativo Circulante."}],"opts":["R$ 83.000,00.","R$ 93.000,00.","R$ 95.000,00.","R$ 97.000,00."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"Ativo circulante: caixa 15.000 + duplicatas 45.000 − PECLD 2.000 + estoques 25.000 + adiantamento a fornecedor 10.000 = 93.000. Adiantamento de clientes e fornecedores são passivos e veículos estão no não circulante."},{"id":"2026.2-32","ed":"2026.2","n":32,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"A empresa “Q” construiu uma máquina em 2024 para utilizar na fabricação do seu principal produto. Os custos para a construção foram de R$ 410.000,00. Esse ativo passou a estar em condições de funcionamento em 01/02/2025. Nesse momento, foi estimado que o ativo seria vendido ao final de sua vida útil por R$ 50.000,00. A vida útil estimada foi de 30 anos. Devido a uma mudança nas condições de mercado, em 01/11/2025 foi realizada uma nova estimativa de vida útil, que passou a ser de 25 anos, a partir da data da nova mensuração, enquanto o valor de venda estimado ao final da utilização do ativo passou para R$ 30.000,00. A empresa “Q” utiliza o método linear para o cálculo da depreciação e apura e divulga demonstrações contábeis mensalmente. Com base nessas informações, assinale a opção que apresenta a despesa de depreciação que deve ser registrada em 2025."}],"opts":["R$ 13.527,51.","R$ 13.933,33.","R$ 11.473,33.","R$ 11.000,00."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Depreciação mensal inicial: (410.000 − 50.000) ÷ 360 meses = 1.000. De fevereiro a outubro são 9 meses, ou 9.000. Valor contábil em 01/11: 401.000. Nova estimativa: (401.000 − 30.000) ÷ 300 meses = 1.236,67 por mês, e em nov e dez são 2.473,33. Total do ano: 11.473,33. (O gabarito preliminar indicava D, e o definitivo corrigiu para C.)"},{"id":"2026.2-33","ed":"2026.2","n":33,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Uma empresa possuía no início do mês saldo na conta de estoques no valor de R$ 8.000,00, representando 100 unidades. Ao longo do mês realizou as seguintes operações:"},{"t":"p","x":"• Dia 2: aquisição de 100 unidades por R$ 100,00 cada;"},{"t":"p","x":"• Dia 10: venda de 100 unidades por R$ 200,00 cada;"},{"t":"p","x":"• Dia 15: aquisição de 200 unidades por R$ 120,00 cada;"},{"t":"p","x":"• Dia 20: venda de 200 unidades por R$ 230,00 cada;"},{"t":"p","x":"• Dia 25: aquisição de 100 unidades por R$ 130,00 cada. Desconsiderando qualquer tributação sobre as operações e sabendo que a empresa adota o custo médio ponderado móvel como método de mensuração de seus estoques, o valor do saldo final de estoques dessa empresa é de"}],"opts":["R$ 21.000,00.","R$ 22.000,00.","R$ 24.000,00.","R$ 25.000,00."],"gabStatus":"Definitivo","ass":"Estoques (custo, PEPS, VRL)","exp":"Custo médio móvel: início 100 un a 8.000 e compra de 100 por 10.000 dão 200 un, 18.000 (90 cada); vende 100 (9.000), saldo 100 un, 9.000. Compra de 200 por 24.000: 300 un, 33.000 (110 cada); vende 200 (22.000), saldo 100 un, 11.000. Compra de 100 por 13.000. Saldo final: 200 un, 24.000."},{"id":"2026.2-34","ed":"2026.2","n":34,"mat":"Custos","gab":"A","stem":[{"t":"p","x":"A Fábrica de Utensílios Domésticos JP Ltda. realiza sua produção em um único departamento, fabricando dois tipos de colheres: colheres de sobremesa e colheres de sopa. Em determinado período, foram apurados os seguintes dados: Colheres de sobremesa:"},{"t":"p","x":"• Mão de obra direta (MOD): R$ 26.250,00;"},{"t":"p","x":"• Material direto: R$ 12.000,00;"},{"t":"p","x":"• Tempo de produção (horas/máquina): 22.400. Colheres de sopa:"},{"t":"p","x":"• Mão de obra direta (MOD): R$ 8.750,00;"},{"t":"p","x":"• Material direto: R$ 18.000,00;"},{"t":"p","x":"• Tempo de produção (horas/máquina): 9.600. O valor total dos Custos Indiretos de Produção (CIP) no período foi de R$ 140.000,00."},{"t":"p","x":"Com base nessas informações, assinale a afirmativa correta."}],"opts":["R$ 35.000,00 de CIP foram alocados às colheres de sopa, utilizando-se o critério da proporcionalidade ao custo de Mão de Obra Direta (MOD).","R$ 84.000,00 de CIP foram alocados às colheres de sobremesa, utilizando-se o critério da proporcionalidade ao custo de Material Direto.","R$ 98.000,00 de CIP foram alocados às colheres de sopa, utilizando-se o critério da proporcionalidade ao tempo de Horas/Máquina.","R$ 56.000,00 de CIP foram alocados às colheres de sobremesa, utilizando-se o critério da proporcionalidade ao custo de mão de obra direta (MOD)."],"gabStatus":"Definitivo","exp":"CIP de 140.000. A MOD soma 35.000 e a das colheres de sopa é 8.750, ou seja, 25%: 25% × 140.000 = 35.000 (A). Pelo material direto, sobremesa fica com 40% = 56.000, e não 84.000. Pelas horas-máquina, sopa fica com 30% = 42.000, e não 98.000. Pela MOD, sobremesa fica com 75% = 105.000, e não 56.000."},{"id":"2026.2-35","ed":"2026.2","n":35,"mat":"Custos","gab":"B","stem":[{"t":"p","x":"A empresa Roupas em Linho LTDA. produz camisas e camisetas. Os dados relacionados aos dois produtos são apresentados a seguir:"},{"t":"pre","x":"Descrição                 Camisas    Camisetas\nQuantidade Produzida        500        450"},{"t":"p","x":"A empresa fez o seguinte levantamento dos Custos das Atividades e Direcionadores"},{"t":"pre","x":"Departamento        Atividades                       Direcionadores              Custos\n(Direcionadores)                                                                              Camisas       Camisetas     Total\nCompras             Comprar Materiais                nº de pedidos              20.000,00        200            100         300\n                    Desenvolver Fornecedores         nº de fornecedores         12.000,00         4              6          10\nCorte e Costura     Cortar                           tempo de corte             25.000,00         6              6          12\n                    Colar                            tempo para colar           25.600,00         16             8          24\nAcabamento          Acabar                           tempo de acabamento        18.000,00         4             10          14\n                    Despachar Produtos               tempo de despacho          30.200,00         5              5          10"},{"t":"p","x":"Os custos unitários de matéria-prima são:"},{"t":"p","x":"• Camisa = R$ 20,00;"},{"t":"p","x":"• Camiseta = R$ 10,00. A partir da análise e observação das informações da empresa Roupas em Linho LTDA. assinale a opção que corresponde ao custo unitário para produzir Camisas e Camisetas, respectivamente, pelo método do Custeio ABC."}],"opts":["Camisas R$ 125,69; Camisetas R$ 116,13.","Camisas R$ 155,89; Camisetas R$ 149,68.","Camisas R$ 129,22; Camisetas R$ 134,87.","Camisas R$ 139,89; Camisetas R$ 139,65."],"gabStatus":"Definitivo","exp":"ABC: custo de cada atividade ÷ direcionador total × uso do produto. Camisas: pedidos 13.333 + fornecedores 4.800 + corte 12.500 + colagem 17.067 + acabamento 5.143 + despacho 15.100 = 67.943 de indiretos, mais matéria-prima 10.000 = 77.943 ÷ 500 = 155,89. Camisetas: 6.667 + 7.200 + 12.500 + 8.533 + 12.857 + 15.100 = 62.857, mais matéria-prima 4.500 = 67.357 ÷ 450 = 149,68."},{"id":"2026.2-36","ed":"2026.2","n":36,"mat":"Custos","gab":"A","stem":[{"t":"p","x":"Uma indústria realizou os seguintes eventos durante determinado período:"},{"t":"p","x":"Evento Valor (R$)"},{"t":"pre","x":"Compra de matéria-prima                                         18.000,00\nConsumo de matéria-prima na produção                            12.000,00\nAquisição de máquinas para a fábrica                            40.000,00\nDepreciação das máquinas utilizadas na produção                  2.500,00\nSalários das equipes jurídica e de marketing                     6.000,00\nComissão sobre vendas (remuneração dos vendedores)               3.000,00"},{"t":"p","x":"Com base nos conceitos de custos, despesas e investimentos, o valor total dos custos incorridos no período foi de"}],"opts":["R$ 14.500,00.","R$ 18.000,00.","R$ 17.500,00.","R$ 72.500,00."],"gabStatus":"Definitivo","exp":"Custos são gastos da produção: consumo de matéria-prima 12.000 + depreciação das máquinas 2.500 = 14.500. A compra de matéria-prima é estoque, a máquina é investimento, e salários jurídico/marketing e comissões são despesas."},{"id":"2026.2-37","ed":"2026.2","n":37,"mat":"Custos","gab":"A","stem":[{"t":"p","x":"Uma loja vendia mochilas. Em 01/08/2026 não havia mochilas em estoque. Na data, a loja adquiriu 200 mochilas pelo total de R$ 16.000,00. O frete pago para o recebimento das mochilas foi de R$ 400,00. Em agosto de 2026, 180 mochilas foram vendidas, sendo que a receita da loja foi de R$ 36.000,00. A loja paga comissão a seus vendedores de 5% sobre o preço da mochila vendida. A margem de contribuição unitária da mochila foi de"}],"opts":["R$ 108,00.","R$ 110,00.","R$ 118,00.","R$ 120,00."],"gabStatus":"Definitivo","exp":"Custo unitário da mochila: (16.000 + 400 de frete) ÷ 200 = 82. Preço: 36.000 ÷ 180 = 200. Comissão: 5% × 200 = 10. Margem de contribuição unitária = 200 − 82 − 10 = 108."},{"id":"2026.2-38","ed":"2026.2","n":38,"mat":"Análise / Gerencial / Controladoria","gab":"B","stem":[{"t":"p","x":"Uma empresa está estudando quais quantidades deve produzir para chegar aos seus pontos de equilíbrio contábil, econômico e financeiro. Para isso, seu contador levantou as seguintes informações referentes ao mês de junho de 2026:"},{"t":"p","x":"• Custos fixos: R$ 400.000,00;"},{"t":"p","x":"• Despesas fixas: R$ 100.000,00;"},{"t":"p","x":"• Custos variáveis: R$ 200,00/unidade;"},{"t":"p","x":"• Despesas variáveis: R$ 50,00/unidade;"},{"t":"p","x":"• Preço unitário de venda: R$ 750,00;"},{"t":"p","x":"• Custo de oportunidade: R$ 500.000,00;"},{"t":"p","x":"• Parcela não desembolsável dos custos: R$ 250.000,00."},{"t":"p","x":"Com base nos dados levantados pelo contador, os pontos de equilíbrio contábil, econômico e financeiro dessa empresa são, respectivamente,"}],"opts":["1.000 unidades, 1.800 unidades e 1.500 unidades.","1.000 unidades, 2.000 unidades e 500 unidades.","1.500 unidades, 1.800 unidades e 800 unidades.","1.500 unidades, 1.700 unidades e 300 unidades."],"gabStatus":"Definitivo","exp":"Margem de contribuição = 750 − (200 + 50) = 500. Contábil: (400.000 + 100.000) ÷ 500 = 1.000. Econômico: soma o custo de oportunidade, (500.000 + 500.000) ÷ 500 = 2.000. Financeiro: tira a parte não desembolsável, (500.000 − 250.000) ÷ 500 = 500."},{"id":"2026.2-39","ed":"2026.2","n":39,"mat":"Análise / Gerencial / Controladoria","gab":"C","stem":[{"t":"p","x":"Um administrador deseja verificar qual é a relação entre a receita de vendas e o custo das mercadorias vendidas. Para a obtenção da informação, é recomendável que seja realizada a análise"}],"opts":["vertical do Balanço Patrimonial.","horizontal do Balanço Patrimonial.","vertical da Demonstração do Resultado.","horizontal da Demonstração do Resultado."],"gabStatus":"Definitivo","exp":"A relação entre receita de vendas e CMV está dentro da DRE, e comparar um item com a receita (base 100%) é análise vertical. A horizontal compararia períodos."},{"id":"2026.2-40","ed":"2026.2","n":40,"mat":"Análise / Gerencial / Controladoria","gab":"D","stem":[{"t":"p","x":"Uma empresa, buscando captar um empréstimo junto a uma instituição financeira, apurou seus indicadores de liquidez para verificar sua capacidade de pagamento. O contador apurou o seguinte balanço patrimonial dos 2 últimos anos:"},{"t":"pre","x":"ATIVO                                 31/12/24           31/12/25\nDisponível                          R$ 300.000,00      R$ 400.000,00\nContas a Receber no Curto Prazo     R$ 500.000,00      R$ 600.000,00\nEstoques                            R$ 500.000,00      R$ 800.000,00\nRealizável a Longo Prazo            R$ 700.000,00     R$ 1.200.000,00\nTOTAL                              R$ 2.000.000,00    R$ 3.000.000,00\nPASSIVO + PL                        31/12/24           31/12/25\nFornecedores                     R$ 400.000,00      R$ 1.100.000,00\nEmpréstimos de Curto Prazo       R$ 100.000,00      R$ 500.000,00\nEmpréstimos de Longo Prazo       R$ 500.000,00      R$ 400.000,00\nPatrimônio Líquido               R$ 1.000.000,00    R$ 1.000.000,00\nTOTAL                            R$ 2.000.000,00    R$ 3.000.000,00"},{"t":"p","x":"Com base nesses dados, os indicadores de liquidez geral da empresa nos anos de 2024 e 2025 foram, respectivamente,"}],"opts":["1,0 e 1,0.","1,6 e 0,6.","2,6 e 1,1.","2,0 e 1,5."],"gabStatus":"Definitivo","exp":"Liquidez geral = (ativo circulante + realizável a longo prazo) ÷ (passivo circulante + exigível a longo prazo). 2024: (1.300.000 + 700.000) ÷ (500.000 + 500.000) = 2,0. 2025: (1.800.000 + 1.200.000) ÷ (1.600.000 + 400.000) = 1,5."},{"id":"2026.2-41","ed":"2026.2","n":41,"mat":"Setor Público","gab":"B","stem":[{"t":"p","x":"O Município ABC está desenvolvendo um projeto para reconhecimento dos bens do patrimônio cultural no Balanço Patrimonial. Nas reuniões para mensuração e evidenciação dos referidos ativos, foram mapeadas dificuldades em potencial na representação contábil do fenômeno de forma completa, neutra e livre de erro material. Com base na NBC TSP – ESTRUTURA CONCEITUAL, o reconhecimento dos bens do patrimônio cultural, nessas condições, descumpre a seguinte característica qualitativa da informação contábil:"}],"opts":["relevância.","representação fidedigna.","compreensibilidade.","verificabilidade."],"gabStatus":"Definitivo","exp":"A dificuldade de representar o fenômeno de modo completo, neutro e livre de erro material atinge a representação fidedigna."},{"id":"2026.2-42","ed":"2026.2","n":42,"mat":"Setor Público","gab":"C","stem":[{"t":"p","x":"Os Princípios Orçamentários visam estabelecer diretrizes norteadoras básicas, a fim de conferir racionalidade, eficiência e transparência para os processos de elaboração, execução e controle do orçamento público. Com base nos princípios orçamentários aplicáveis ao setor público brasileiro, conforme apresentados no Manual de Contabilidade Aplicada ao Setor Público (MCASP), analise os casos a seguir:"},{"t":"p","x":"• Caso 1: Um município elaborou dois documentos orçamentários para o mesmo exercício: uma Lei Orçamentária Anual para a administração direta e outro documento orçamentário separado para as autarquias municipais."},{"t":"p","x":"• Caso 2: A Lei Orçamentária Anual de um município foi elaborada para vigorar por dois anos consecutivos, prevendo receitas e despesas para o período de 2025 a 2026."},{"t":"p","x":"• Caso 3: Na elaboração da Lei Orçamentária Anual de determinado estado, as receitas e despesas de uma fundação pública estadual não foram incluídas na Lei Orçamentária Anual, sendo registradas apenas em relatórios internos da própria entidade. Os casos 1, 2 e 3 estão infringindo os seguintes princípios orçamentários, respectivamente:"}],"opts":["exclusividade; legalidade; e unidade ou totalidade.","universalidade; unidade ou totalidade; e exclusividade.","unidade ou totalidade; anualidade ou periodicidade; e universalidade.","legalidade; orçamento bruto; e unidade ou totalidade."],"gabStatus":"Definitivo","exp":"Caso 1 (dois orçamentos para o mesmo exercício) fere a unidade. Caso 2 (LOA para dois anos) fere a anualidade. Caso 3 (fundação fora da LOA) fere a universalidade."},{"id":"2026.2-43","ed":"2026.2","n":43,"mat":"Setor Público","gab":"B","stem":[{"t":"p","x":"Em junho de 2026, um posto de saúde aplicou 3.000 doses de vacina. Em julho, o posto foi acionado na Justiça por um grupo de pessoas que tiveram fortes reações atribuídas às vacinas e pediam uma indenização. A Procuradoria Jurídica da Secretaria de Saúde à qual o posto de saúde encontra-se vinculado emitiu parecer que considerou que a probabilidade da saída de recursos, em decorrência da causa judicial era remota, de modo que não houve reconhecimento em contas patrimoniais. Nesse caso, a divulgação em notas explicativas é"}],"opts":["proibida.","dispensada.","incentivada.","obrigatória."],"gabStatus":"Definitivo","exp":"Com saída de recursos remota, não há reconhecimento e não se exige divulgação, ou seja, a nota explicativa é dispensada. Não é proibida."},{"id":"2026.2-44","ed":"2026.2","n":44,"mat":"Setor Público","gab":"B","stem":[{"t":"p","x":"Ao encerrar o exercício financeiro, a equipe contábil de um município analisava os procedimentos de execução da despesa orçamentária. Em reunião, surgiram dúvidas acerca dos efeitos do empenho, das características da liquidação e dos requisitos para a realização do pagamento pela Administração Pública. Considerando esse contexto, analise as afirmativas a seguir."},{"t":"p","x":"I. O empenho da despesa cria para o Estado a obrigação de pagamento, pendente ou não de implemento de condição."},{"t":"p","x":"II. A liquidação da despesa consiste na verificação do direito adquirido pelo credor, com base nos títulos e documentos comprobatórios do respectivo crédito."},{"t":"p","x":"III. O pagamento da despesa pode ocorrer independentemente da liquidação prévia, desde que haja previsão contratual ou mera conveniência administrativa para a antecipação do desembolso."},{"t":"p","x":"IV. A etapa da execução da despesa orçamentária percorre, em regra, os estágios de empenho, liquidação e pagamento. Estão corretas as afirmativas"}],"opts":["I e II, apenas.","I, II e IV, apenas.","II, III e IV, apenas.","I, III e IV, apenas."],"gabStatus":"Definitivo","exp":"I, II e IV estão certas. III é falsa: não se paga sem liquidação prévia, que é o estágio de verificação do direito do credor."},{"id":"2026.2-45","ed":"2026.2","n":45,"mat":"Análise / Gerencial / Controladoria","gab":"B","stem":[{"t":"p","x":"Uma entidade deseja elaborar o seu orçamento de 2026, começando pela projeção da receita bruta de vendas. As seguintes informações foram estimadas para 2026:"},{"t":"p","x":"I. Projeção do número de unidades vendidas."},{"t":"p","x":"II. Projeção do preço a ser praticado."},{"t":"p","x":"III. Projeção do aluguel das lojas. Para estimar o valor da receita bruta de vendas, a entidade deve levar em consideração o que se apresenta em:"}],"opts":["I, somente.","I e II, somente.","I e III, somente.","II e III, somente."],"gabStatus":"Definitivo","exp":"A receita bruta de vendas é quantidade × preço, então só entram I e II. O aluguel das lojas é despesa, e não altera a receita."},{"id":"2026.2-46","ed":"2026.2","n":46,"mat":"Auditoria","gab":"C","stem":[{"t":"p","x":"Uma determinada empresa, do ramo de varejo, contratou uma firma de auditoria, para verificar as demonstrações contábeis do ano anterior. O presidente da empresa de ramo de varejo esperava que a asseguração de uma auditoria trouxesse credibilidade para sua empresa no ramo, por trazer um maior grau de confiança às demonstrações contábeis. Considerando os dizeres da NBC TA 200 (R1) – OBJETIVOS GERAIS DO AUDITOR INDEPENDENTE E A CONDUÇÃO DA AUDITORIA EM CONFORMIDADE COM NORMAS DE AUDITORIA, é correto afirmar que o presidente da empresa do ramo de varejo estava"}],"opts":["errado, pois a auditoria independente tem como objetivo assegurar a continuidade e a viabilidade do negócio analisado.","certo, porque a auditoria visa, principalmente, à verificação de fraudes e erros.","certo, pois o objetivo da auditoria é obter segurança razoável de que as demonstrações contábeis como um todo estão livres de distorção relevante.","errado, pois cabe à auditoria externa auxiliar a Administração na elaboração das demonstrações contábeis."],"gabStatus":"Definitivo","exp":"Segundo a NBC TA 200, o objetivo da auditoria é aumentar o grau de confiança dos usuários, obtendo segurança razoável de que as demonstrações como um todo estão livres de distorção relevante. Não é garantia de continuidade nem a busca principal de fraudes, e o auditor não elabora as demonstrações."},{"id":"2026.2-47","ed":"2026.2","n":47,"mat":"Auditoria","gab":"C","stem":[{"t":"p","x":"De acordo com a NBC TA 705 – MODIFICAÇÕES NA OPINIÃO DO AUDITOR INDEPENDENTE, quando o auditor prevê modificar a opinião no seu relatório, ele deve comunicar aos responsáveis pela governança as circunstâncias que levaram à modificação prevista e o texto proposto da modificação. Isso permite que os responsáveis pela governança, quando apropriado, tenham a oportunidade de"}],"opts":["aumentar os honorários previstos inicialmente.","comunicar, previamente, o fato às entidades reguladoras.","fornecer ao auditor informações e explicações adicionais sobre os assuntos que deram origem às modificações previstas.","contratar outra firma de auditoria para fornecer um relatório com informações e explicações que deram origem às modificações previstas."],"gabStatus":"Definitivo","exp":"Comunicar antes a modificação prevista dá aos responsáveis pela governança a chance de fornecer informações e explicações adicionais sobre os assuntos que levaram à modificação."},{"id":"2026.2-48","ed":"2026.2","n":48,"mat":"Auditoria","gab":"D","stem":[{"t":"p","x":"Durante a auditoria das demonstrações contábeis da Companhia Beta S.A., referentes ao exercício findo em 31 de dezembro de 2025, o auditor identificou que a entidade apresentou prejuízo de R$ 30 milhões no exercício e que o passivo circulante excedia o ativo circulante em R$ 35 milhões nas demonstrações contábeis individuais e em R$ 32 milhões nas demonstrações contábeis consolidadas. Essas condições estão adequadamente divulgadas na nota explicativa nº 3, na qual a administração também descreve as ações que está implementando para restabelecer o equilíbrio econômico-financeiro da companhia. O auditor concluiu que tais eventos indicam a existência de incerteza relevante que pode levantar dúvida significativa quanto à capacidade de continuidade operacional, mas verificou que a divulgação nas demonstrações contábeis é apropriada, adequada e suficiente. Nessas circunstâncias, o relatório do auditor independente deve conter"}],"opts":["opinião com ressalva, em razão da deterioração da posição financeira da companhia.","opinião adversa, em razão do prejuízo relevante apresentado no exercício.","abstenção de opinião, em razão da incerteza quanto à continuidade operacional.","parágrafo de ênfase, chamando a atenção para a nota explicativa que descreve a incerteza relacionada à continuidade operacional."],"gabStatus":"Definitivo","exp":"Incerteza relevante sobre continuidade, mas com divulgação adequada: a opinião não é modificada e o relatório chama atenção para a nota explicativa. O gabarito chama isso de parágrafo de ênfase (nas versões atuais da NBC TA 570, é uma seção própria sobre incerteza relevante, mas o efeito é o mesmo: sem ressalva, sem adversa e sem abstenção)."},{"id":"2026.2-49","ed":"2026.2","n":49,"mat":"Perícia","gab":"C","stem":[{"t":"p","x":"No âmbito de uma perícia judicial, o perito contábil nomeado, Dr. Y, concluiu os trabalhos e protocolou o laudo. O assistente técnico indicado pela parte autora, contador X, discordou dos critérios de avaliação patrimonial adotados e pretende elaborar seu parecer técnico contábil. Ocorre que a avaliação dos ativos imóveis foi realizada exclusivamente por engenheiro de avaliações, profissional de outra área, sem participação técnica de Dr. Y. O assistente X cogita subscrever o laudo do engenheiro como forma de validá-lo, para ampliar a força probatória da perícia. Considerando a NBC TP 01 (R2) – PERÍCIA CONTÁBIL, a conduta de X, ao subscrever o laudo do engenheiro, seria"}],"opts":["lícita, desde que X declare expressamente que se responsabiliza apenas pela parte contábil do documento.","lícita, pois o assistente técnico pode validar laudo de especialista de outra área quando o objeto da perícia for multidisciplinar.","vedada, pois é defeso ao assistente técnico validar, ratificar ou subscrever laudo elaborado por profissional de outra área; X deve oferecer seu próprio parecer técnico contábil.","vedada apenas se o laudo do engenheiro não tiver sido homologado pelo juízo, sendo lícita após a homologação."],"gabStatus":"Definitivo","exp":"A NBC TP 01 veda ao assistente técnico validar, ratificar ou subscrever laudo de profissional de outra área. Ele deve oferecer o seu próprio parecer técnico contábil."},{"id":"2026.2-50","ed":"2026.2","n":50,"mat":"Perícia","gab":"B","stem":[{"t":"p","x":"A perita contábil Dra. W foi contratada para realizar perícia extrajudicial voluntária, visando apurar haveres em dissolução parcial de sociedade empresária. Ao elaborar o laudo pericial contábil, W estruturou o documento com os seguintes elementos: identificação das partes; síntese do caso; síntese do objeto e do objetivo da perícia; relato das diligências; transcrição dos quesitos e respostas; e assinatura com número de CRC. Após análise técnica, a parte contrária apontou que o laudo carecia de elemento obrigatório previsto na NBC TP 01 (R2) – PERÍCIA CONTÁBIL. Nesse caso, o seguinte elemento obrigatório da estrutura mínima do laudo pericial contábil foi omitido por Dra. W:"}],"opts":["o cronograma das diligências realizadas durante a execução da perícia.","a fundamentação, contemplando o método científico adotado e a análise técnica e/ou científica realizada.","a ata das reuniões técnicas realizadas com os assistentes técnicos das partes.","o contrato de prestação de serviços firmado entre a perita e o contratante. Realização"],"gabStatus":"Definitivo","exp":"A estrutura mínima do laudo inclui identificação das partes, síntese do objeto, diligências, quesitos e respostas, e também a fundamentação, com o método científico e a análise técnica realizada. Dra. W omitiu a fundamentação."},{"id":"A1-01","ed":"Autoral 1","n":1,"mat":"Português","gab":"B","stem":[{"t":"p","x":"O ditado popular diz: “O dinheiro é bom servo, mas mau patrão.” Com essa frase, entende-se que o dinheiro"}],"opts":["só traz problemas a quem trabalha para outras pessoas.","é útil quando a pessoa o controla, mas prejudica quando passa a controlar a pessoa.","deve ser sempre economizado, nunca gasto.","serve apenas a quem tem posição de chefia."],"gabStatus":"Autoral","exp":"“Servo” indica o dinheiro a serviço da pessoa, e “patrão”, a pessoa dominada por ele. A ideia é de controle: bom quando a pessoa o domina, ruim quando ela é dominada.","aut":true},{"id":"A1-02","ed":"Autoral 1","n":2,"mat":"Português","gab":"B","stem":[{"t":"p","x":"Assinale a frase em que o uso do acento indicativo de crase está correto."}],"opts":["Entregue o documento à Vossa Senhoria.","Refiro-me à reunião de ontem.","O contador foi à pé até o escritório.","Fizemos referência à todos os sócios."],"gabStatus":"Autoral","exp":"Em “refiro-me à reunião” há a preposição “a” + o artigo “a”, então crase. Não há crase antes de pronome de tratamento (Vossa Senhoria), antes de palavra no plural sem artigo (“a todos”) e em “a pé”.","aut":true},{"id":"A1-03","ed":"Autoral 1","n":3,"mat":"Mat. Financeira / Estatística","gab":"D","stem":[{"t":"p","x":"Um capital de R$ 10.000,00 foi aplicado a juros compostos, à taxa de 5% ao mês, por 3 meses. O montante ao final do período é"}],"opts":["R$ 11.664,00.","R$ 11.025,00.","R$ 11.500,00.","R$ 11.576,25."],"gabStatus":"Autoral","exp":"M = 10.000 × 1,05³ = 10.000 × 1,157625 = 11.576,25. R$ 11.500 seria juros simples, e R$ 11.025 seria apenas 2 meses.","aut":true},{"id":"A1-04","ed":"Autoral 1","n":4,"mat":"Mat. Financeira / Estatística","gab":"B","stem":[{"t":"p","x":"Os faturamentos diários (em R$ mil) de uma loja em cinco dias foram 3, 4, 7, 9 e 22. A mediana desses valores é"}],"opts":["4.","7.","22.","9."],"gabStatus":"Autoral","exp":"Com os dados em ordem (3, 4, 7, 9, 22), a mediana é o valor central: 7. A média seria (3+4+7+9+22) ÷ 5 = 9, bem afetada pelo valor extremo.","aut":true},{"id":"A1-05","ed":"Autoral 1","n":5,"mat":"Direito","gab":"B","stem":[{"t":"p","x":"Um empregado com 5 anos completos de serviço na mesma empresa foi dispensado sem justa causa. De acordo com a Lei 12.506/2011, o aviso prévio a que ele tem direito é de"}],"opts":["35 dias.","45 dias.","30 dias.","60 dias."],"gabStatus":"Autoral","exp":"O aviso prévio proporcional é de 30 dias mais 3 dias por ano completo de serviço, até o máximo de 90 dias. Com 5 anos: 30 + 15 = 45 dias.","aut":true},{"id":"A1-06","ed":"Autoral 1","n":6,"mat":"Direito","gab":"D","stem":[{"t":"p","x":"Em licitações regidas pela Lei 14.133/2021, a modalidade obrigatória para a contratação de bens e serviços comuns é o(a)"}],"opts":["leilão.","concorrência.","concurso.","pregão."],"gabStatus":"Autoral","exp":"A Lei 14.133 define que o pregão é a modalidade para bens e serviços comuns, em que o critério de julgamento é o menor preço ou o maior desconto. Concorrência é para obras, serviços especiais e de engenharia, e concurso e leilão têm finalidades próprias.","aut":true},{"id":"A1-07","ed":"Autoral 1","n":7,"mat":"Direito","gab":"B","stem":[{"t":"p","x":"Na sociedade limitada, a responsabilidade dos sócios, segundo o Código Civil, é"}],"opts":["ilimitada e subsidiária em relação às dívidas da sociedade.","restrita ao valor de suas quotas, mas todos respondem solidariamente pela integralização do capital social.","limitada ao valor de suas quotas, sem qualquer responsabilidade pela integralização do capital dos demais.","idêntica à dos sócios da sociedade em nome coletivo."],"gabStatus":"Autoral","exp":"Na sociedade limitada, cada sócio responde até o valor de suas quotas, mas todos respondem solidariamente pela integralização do capital social, até que ele esteja totalmente integralizado.","aut":true},{"id":"A1-08","ed":"Autoral 1","n":8,"mat":"Ética","gab":"B","stem":[{"t":"p","x":"Segundo o Código de Ética Profissional do Contador, é permitido ao contador revelar informação que conheça em razão do exercício profissional"}],"opts":["para colegas de profissão, sem necessidade de autorização do cliente.","quando solicitado por autoridades competentes, entre elas os Conselhos Federal e Regionais de Contabilidade, ou nos casos previstos em lei.","quando o cliente estiver inadimplente com os honorários.","sempre que o contador julgar conveniente aos seus interesses."],"gabStatus":"Autoral","exp":"O sigilo é dever do contador, com exceção dos casos previstos em lei ou quando solicitado por autoridades competentes. Inadimplência do cliente ou conveniência do profissional não justificam a quebra.","aut":true},{"id":"A1-09","ed":"Autoral 1","n":9,"mat":"Ética","gab":"A","stem":[{"t":"p","x":"Um contador possui participação financeira relevante em uma empresa que é cliente de seus serviços. Segundo a NBC PG 100, a situação representa ameaça de"}],"opts":["interesse próprio.","autorrevisão.","defesa de interesses (advocacia).","intimidação."],"gabStatus":"Autoral","exp":"Quando o interesse financeiro do profissional pode influenciar seu julgamento sobre o cliente, há ameaça de interesse próprio. Autorrevisão é avaliar o próprio trabalho, intimidação vem de pressões e advocacia é defender posição do cliente.","aut":true},{"id":"A1-10","ed":"Autoral 1","n":10,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Uma informação financeira é considerada material quando"}],"opts":["tiver sido auditada por auditor independente.","for apresentada em valor superior a 10% do total do ativo.","for apresentada com uma casa decimal a mais que as demais.","sua omissão, distorção ou obscurecimento puder influenciar decisões dos usuários principais."],"gabStatus":"Autoral","exp":"Materialidade é um aspecto da relevância, e depende da natureza e/ou magnitude da informação para a entidade. Não existe um percentual fixo, nem depende da auditoria.","aut":true,"ass":"Estrutura Conceitual e qualidades da informação"},{"id":"A1-11","ed":"Autoral 1","n":11,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Em 31/12, a administração de uma empresa decidiu internamente comprar uma máquina em março do ano seguinte, sem assinar contrato com fornecedor. Com base na Estrutura Conceitual, em 31/12 a empresa"}],"opts":["reconhece passivo apenas se a decisão estiver registrada em ata.","reconhece passivo pelo valor estimado da máquina.","reconhece ativo, pois a intenção de compra é um recurso econômico.","não reconhece passivo, pois não há obrigação presente resultante de evento passado."],"gabStatus":"Autoral","exp":"Passivo exige obrigação presente decorrente de evento passado. A intenção de comprar no futuro, sem compromisso assumido, não cria obrigação nem ativo.","aut":true,"ass":"Estrutura Conceitual e qualidades da informação"},{"id":"A1-12","ed":"Autoral 1","n":12,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Segundo a Estrutura Conceitual, NÃO representa receita o seguinte evento:"}],"opts":["juros recebidos de aplicação financeira.","venda de mercadorias a prazo.","aluguel recebido de imóvel da empresa.","integralização de capital pelos sócios."],"gabStatus":"Autoral","exp":"Receita aumenta o PL, mas excluídas as contribuições dos donos. Aporte de capital aumenta o PL sem ser receita.","aut":true,"ass":"Estrutura Conceitual e qualidades da informação"},{"id":"A1-13","ed":"Autoral 1","n":13,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"O preço que seria recebido pela venda de um ativo em transação não forçada entre participantes do mercado, na data da mensuração, corresponde ao"}],"opts":["custo corrente.","valor em uso.","custo histórico.","valor justo."],"gabStatus":"Autoral","exp":"Essa é a definição de valor justo. Custo histórico é o preço da transação na aquisição, valor em uso é o valor presente dos fluxos esperados do uso, e custo corrente é o que se pagaria hoje para adquirir o ativo.","aut":true,"ass":"Estrutura Conceitual e qualidades da informação"},{"id":"A1-14","ed":"Autoral 1","n":14,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Em 01/04/X1, uma empresa adquiriu uma máquina por R$ 120.000,00, com vida útil de 10 anos e valor residual de R$ 20.000,00, depreciada pelo método linear. A depreciação acumulada em 31/12/X2 é de"}],"opts":["R$ 21.000,00.","R$ 15.000,00.","R$ 20.000,00.","R$ 17.500,00."],"gabStatus":"Autoral","exp":"Depreciável = 120.000 − 20.000 = 100.000, ou 10.000 por ano (833,33 por mês). De abril de X1 a dezembro de X2 são 21 meses: 21 × 833,33 = 17.500. R$ 21.000 ignora o residual, e R$ 20.000 considera 2 anos inteiros.","aut":true,"ass":"Imobilizado, depreciação, impairment"},{"id":"A1-15","ed":"Autoral 1","n":15,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"O valor contábil de um ativo é R$ 500.000,00. Seu valor justo líquido de despesas de venda é R$ 380.000,00 e seu valor em uso é R$ 420.000,00. A perda por redução ao valor recuperável (impairment) a ser reconhecida é de"}],"opts":["R$ 20.000,00.","zero.","R$ 80.000,00.","R$ 120.000,00."],"gabStatus":"Autoral","exp":"O valor recuperável é o maior entre o valor justo líquido de despesas de venda (380.000) e o valor em uso (420.000), ou seja, 420.000. Perda = 500.000 − 420.000 = 80.000.","aut":true,"ass":"Imobilizado, depreciação, impairment"},{"id":"A1-16","ed":"Autoral 1","n":16,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Deve ser capitalizado (adicionado ao custo do imobilizado) o gasto com"}],"opts":["troca periódica de óleo da máquina.","reforma que prolonga em cinco anos a vida útil do equipamento.","reparo de pequena avaria no veículo.","pintura rotineira do galpão."],"gabStatus":"Autoral","exp":"Gastos que ampliam a vida útil, a capacidade ou a eficiência do bem são capitalizados. Manutenção rotineira e reparos pequenos são despesas do período.","aut":true,"ass":"Imobilizado, depreciação, impairment"},{"id":"A1-17","ed":"Autoral 1","n":17,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Em 31/12/X3, a empresa revisou a vida útil restante de um equipamento, de 10 para 6 anos. O tratamento correto é"}],"opts":["ajustar os lucros acumulados pela diferença da depreciação passada.","não alterar, pois a vida útil, uma vez definida, é imutável.","reapresentar as demonstrações dos anos anteriores.","considerar mudança de estimativa e aplicá-la prospectivamente, a partir da revisão."],"gabStatus":"Autoral","exp":"A revisão da vida útil é mudança de estimativa contábil, com efeito prospectivo (somente a partir da revisão), sem retroagir.","aut":true,"ass":"Imobilizado, depreciação, impairment"},{"id":"A1-18","ed":"Autoral 1","n":18,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Uma empresa com ciclo operacional de 8 meses tem uma duplicata a receber de longo prazo, com vencimento em 18 meses. Na classificação do balanço, essa duplicata é"}],"opts":["ativo não circulante.","ativo circulante.","ativo circulante, pois está dentro do ciclo.","conta de compensação."],"gabStatus":"Autoral","exp":"Com ciclo operacional inferior a 12 meses, o limite é o prazo de 12 meses. Como a duplicata vence em 18 meses, vai para o não circulante (realizável a longo prazo).","aut":true,"ass":"Balanço, Lei 6.404, PL, dividendos, notas"},{"id":"A1-19","ed":"Autoral 1","n":19,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Uma S.A. apurou lucro líquido de R$ 400.000,00 no exercício e destinou 5% à reserva legal. O estatuto é omisso quanto ao dividendo. Nessa situação, o dividendo mínimo obrigatório é de"}],"opts":["R$ 95.000,00.","R$ 190.000,00.","R$ 380.000,00.","R$ 200.000,00."],"gabStatus":"Autoral","exp":"Reserva legal: 5% × 400.000 = 20.000. Lucro líquido ajustado = 380.000. Com o estatuto omisso, o dividendo obrigatório é 50% dessa base: 190.000.","aut":true,"ass":"Balanço, Lei 6.404, PL, dividendos, notas"},{"id":"A1-20","ed":"Autoral 1","n":20,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Na estrutura do patrimônio líquido, o ágio recebido na emissão de ações é classificado como"}],"opts":["reserva legal.","reserva estatutária.","reserva de capital.","reserva de lucros a realizar."],"gabStatus":"Autoral","exp":"O ágio na emissão de ações é valor recebido dos sócios acima do valor nominal, e é reserva de capital. As demais são reservas de lucros.","aut":true,"ass":"Balanço, Lei 6.404, PL, dividendos, notas"},{"id":"A1-21","ed":"Autoral 1","n":21,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Uma empresa comprou 100 unidades a R$ 10,00 em 10/01 e 100 unidades a R$ 12,00 em 12/01. Em 20/01, vendeu 150 unidades. Pelo método PEPS (primeiro a entrar, primeiro a sair), o custo das mercadorias vendidas é de"}],"opts":["R$ 1.500,00.","R$ 1.650,00.","R$ 1.600,00.","R$ 1.700,00."],"gabStatus":"Autoral","exp":"Pelo PEPS saem primeiro as mais antigas: 100 × 10 + 50 × 12 = 1.000 + 600 = 1.600. R$ 1.650 seria o custo médio, e R$ 1.700 seria o UEPS.","aut":true,"ass":"Estoques (custo, PEPS, VRL)"},{"id":"A1-22","ed":"Autoral 1","n":22,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Uma empresa tem um estoque com custo de R$ 80.000,00. O preço de venda estimado é R$ 90.000,00 e as despesas necessárias para vendê-lo somam R$ 15.000,00. O estoque deve ser apresentado no balanço por"}],"opts":["R$ 75.000,00.","R$ 65.000,00.","R$ 80.000,00.","R$ 90.000,00."],"gabStatus":"Autoral","exp":"O estoque é medido pelo menor entre o custo e o valor realizável líquido (VRL). VRL = 90.000 − 15.000 = 75.000, que é menor que 80.000, então reconhece-se perda de 5.000.","aut":true,"ass":"Estoques (custo, PEPS, VRL)"},{"id":"A1-23","ed":"Autoral 1","n":23,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Uma arrendatária assinou contrato de 5 anos com pagamentos anuais, postecipados, de R$ 10.000,00. A taxa de desconto é de 10% ao ano. O passivo de arrendamento inicial, segundo a NBC TG 06, é de, aproximadamente,"}],"opts":["R$ 12.092,00.","R$ 50.000,00.","R$ 41.699,00.","R$ 37.908,00."],"gabStatus":"Autoral","exp":"O passivo é o valor presente dos pagamentos: 10.000 × [(1 − 1,10⁻⁵) ÷ 0,10] = 10.000 × 3,7908 = 37.908. R$ 50.000 é a soma nominal, e 12.092 são os juros embutidos.","aut":true,"ass":"Outras normas (AVP, arrendamento, instr. financeiros, tributos diferidos, câmbio, segmentos, mantido p/ venda)"},{"id":"A1-24","ed":"Autoral 1","n":24,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Uma empresa deprecia o imobilizado de forma acelerada para fins fiscais, enquanto contabilmente a depreciação é linear. Segundo a NBC TG 32, essa diferença gera"}],"opts":["diferença permanente, sem efeito diferido.","diferença temporária dedutível e ativo fiscal diferido.","diferença temporária tributável e passivo fiscal diferido.","crédito tributário imediato a compensar."],"gabStatus":"Autoral","exp":"A depreciação fiscal maior reduz o imposto agora, mas a diferença vai se reverter e aumentar o imposto no futuro. Essa é diferença temporária tributável, que gera passivo fiscal diferido.","aut":true,"ass":"Outras normas (AVP, arrendamento, instr. financeiros, tributos diferidos, câmbio, segmentos, mantido p/ venda)"},{"id":"A1-25","ed":"Autoral 1","n":25,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"A empresa apresentou receita bruta de R$ 500.000,00, devoluções de R$ 20.000,00, ICMS sobre vendas de R$ 60.000,00 e descontos incondicionais de R$ 30.000,00. A receita líquida é de"}],"opts":["R$ 450.000,00.","R$ 390.000,00.","R$ 410.000,00.","R$ 420.000,00."],"gabStatus":"Autoral","exp":"Receita líquida = receita bruta − devoluções − tributos sobre vendas − descontos incondicionais = 500.000 − 20.000 − 60.000 − 30.000 = 390.000.","aut":true,"ass":"DRE, receitas (TG 47), DRA"},{"id":"A1-26","ed":"Autoral 1","n":26,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Na Demonstração do Resultado, depois do lucro bruto e antes do resultado financeiro, aparecem as"}],"opts":["deduções da receita bruta.","provisões para IR e CSLL.","despesas operacionais, como vendas e administrativas.","participações de empregados e administradores."],"gabStatus":"Autoral","exp":"A sequência é receita líquida, CPV, lucro bruto, despesas operacionais (vendas, administrativas), resultado financeiro, resultado antes do imposto, IR/CSLL e depois participações e lucro líquido.","aut":true,"ass":"DRE, receitas (TG 47), DRA"},{"id":"A1-27","ed":"Autoral 1","n":27,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"A Cia. A adquiriu 30% da Cia. B por R$ 300.000,00 (PL de B: R$ 800.000,00, com valor justo igual ao contábil), com influência significativa. No período, B apurou lucro de R$ 100.000,00 e distribuiu R$ 40.000,00 de dividendos. O saldo do investimento em A, ao final, é de"}],"opts":["R$ 288.000,00.","R$ 290.000,00.","R$ 318.000,00.","R$ 330.000,00."],"gabStatus":"Autoral","exp":"Equivalência: +30% × 100.000 = +30.000. Dividendos recebidos reduzem o investimento: −30% × 40.000 = −12.000. Saldo = 300.000 + 30.000 − 12.000 = 318.000 (o ágio de 60.000 está incluído no custo).","aut":true,"ass":"Investimentos, equivalência, consolidação, combinação"},{"id":"A1-28","ed":"Autoral 1","n":28,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"A controladora detém 80% do capital de uma controlada, cujo patrimônio líquido é de R$ 500.000,00. Nas demonstrações consolidadas, a participação dos não controladores no patrimônio líquido é de"}],"opts":["R$ 400.000,00.","R$ 500.000,00.","R$ 100.000,00.","zero."],"gabStatus":"Autoral","exp":"Os não controladores detêm 20% da controlada: 20% × 500.000 = 100.000, destacados no PL consolidado.","aut":true,"ass":"Investimentos, equivalência, consolidação, combinação"},{"id":"A1-29","ed":"Autoral 1","n":29,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"A empresa paga salário de R$ 5.000,00 a um empregado e tem encargos patronais de 20% de INSS e 8% de FGTS sobre o salário. A despesa total mensal com esse empregado é de"}],"opts":["R$ 5.000,00.","R$ 6.400,00.","R$ 5.400,00.","R$ 6.000,00."],"gabStatus":"Autoral","exp":"Encargos: 20% + 8% = 28% × 5.000 = 1.400. Despesa total = 5.000 + 1.400 = 6.400. Os descontos do empregado (INSS e IR retidos) não são despesa da empresa.","aut":true,"ass":"Operações básicas (competência, folha, lançamentos)"},{"id":"A1-30","ed":"Autoral 1","n":30,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Em 01/10, uma empresa pagou R$ 12.000,00 de prêmio de seguro, cobrindo 12 meses a partir dessa data. A despesa de seguros a ser reconhecida no exercício encerrado em 31/12 é de"}],"opts":["R$ 9.000,00.","R$ 1.000,00.","R$ 3.000,00.","R$ 12.000,00."],"gabStatus":"Autoral","exp":"Pela competência, 12.000 ÷ 12 = 1.000 por mês, e outubro a dezembro são 3 meses = 3.000. Os 9.000 restantes são despesa antecipada no ativo.","aut":true,"ass":"Operações básicas (competência, folha, lançamentos)"},{"id":"A1-31","ed":"Autoral 1","n":31,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Um processo tem saída de recursos provável, e a estimativa de perda está entre R$ 30.000,00 e R$ 50.000,00, sem valor mais provável dentro do intervalo. Segundo a NBC TG 25, a provisão a reconhecer é de"}],"opts":["R$ 30.000,00.","zero, apenas divulgação.","R$ 40.000,00.","R$ 50.000,00."],"gabStatus":"Autoral","exp":"Quando há intervalo de valores com a mesma probabilidade, a norma manda usar o ponto médio: (30.000 + 50.000) ÷ 2 = 40.000.","aut":true,"ass":"Provisões e contingências (TG 25)"},{"id":"A1-32","ed":"Autoral 1","n":32,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Uma empresa apresentou receitas de R$ 1.000,00, insumos adquiridos de terceiros de R$ 400,00, depreciação de R$ 50,00 e receita financeira recebida de R$ 30,00. O valor adicionado total a distribuir é de"}],"opts":["R$ 600,00.","R$ 550,00.","R$ 580,00.","R$ 630,00."],"gabStatus":"Autoral","exp":"Valor adicionado bruto = 1.000 − 400 = 600. Valor adicionado líquido = 600 − 50 (depreciação) = 550. Total a distribuir = 550 + 30 (recebido em transferência) = 580.","aut":true,"ass":"DVA"},{"id":"A1-33","ed":"Autoral 1","n":33,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Segundo a NBC TG 04, os gastos incorridos na fase de pesquisa de um novo produto devem ser reconhecidos como"}],"opts":["ativo imobilizado.","ativo diferido.","ativo intangível.","despesa do período em que forem incorridos."],"gabStatus":"Autoral","exp":"Na fase de pesquisa não é possível demonstrar benefício econômico futuro provável, então o gasto é despesa. Gastos de desenvolvimento só viram intangível se atenderem a todos os critérios.","aut":true,"ass":"Intangível"},{"id":"A1-34","ed":"Autoral 1","n":34,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Na Demonstração dos Fluxos de Caixa, a integralização de capital pelos sócios é classificada como atividade de"}],"opts":["operacional.","não faz parte da demonstração.","investimento.","financiamento."],"gabStatus":"Autoral","exp":"Entradas de recursos dos sócios e de terceiros (capital, empréstimos) e sua devolução são fluxos de financiamento. Compra e venda de imobilizado são investimento, e recebimentos de clientes são operacionais.","aut":true,"ass":"DFC (fluxo de caixa)"},{"id":"A1-35","ed":"Autoral 1","n":35,"mat":"Custos","gab":"B","stem":[{"t":"p","x":"Uma empresa produziu 1.000 unidades e vendeu 800 a R$ 40,00. O custo variável é de R$ 15,00 por unidade e os custos fixos de produção somaram R$ 20.000,00. Em relação ao custeio variável, o lucro pelo custeio por absorção é"}],"opts":["R$ 20.000,00 maior.","R$ 4.000,00 maior.","igual.","R$ 4.000,00 menor."],"gabStatus":"Autoral","exp":"Custo unitário por absorção: 15 + 20.000 ÷ 1.000 = 35. Há 200 unidades em estoque carregando 200 × 20 = 4.000 de custo fixo, que o variável lançou direto no resultado. Absorção maior em 4.000.","aut":true},{"id":"A1-36","ed":"Autoral 1","n":36,"mat":"Custos","gab":"D","stem":[{"t":"p","x":"O preço de venda é R$ 50,00, o custo e a despesa variável somam R$ 30,00 por unidade, e os custos e despesas fixos são R$ 60.000,00. Para obter lucro de R$ 20.000,00, devem ser vendidas"}],"opts":["5.000 unidades.","3.000 unidades.","2.000 unidades.","4.000 unidades."],"gabStatus":"Autoral","exp":"Margem de contribuição unitária = 50 − 30 = 20. Quantidade = (60.000 + 20.000) ÷ 20 = 4.000. O equilíbrio contábil seria 3.000.","aut":true},{"id":"A1-37","ed":"Autoral 1","n":37,"mat":"Custos","gab":"A","stem":[{"t":"p","x":"O padrão para fabricar uma unidade é de 2 horas de mão de obra a R$ 20,00 por hora. Foram produzidas 1.000 unidades, com 2.200 horas trabalhadas a R$ 19,00 por hora. A variação de eficiência da mão de obra foi de"}],"opts":["R$ 4.000,00 desfavorável.","R$ 4.000,00 favorável.","R$ 2.000,00 desfavorável.","R$ 2.200,00 favorável."],"gabStatus":"Autoral","exp":"Eficiência = (horas reais − horas padrão) × taxa padrão = (2.200 − 2.000) × 20 = 4.000. Usou mais horas que o padrão, então é desfavorável.","aut":true},{"id":"A1-38","ed":"Autoral 1","n":38,"mat":"Custos","gab":"C","stem":[{"t":"p","x":"Os custos indiretos de R$ 90.000,00 serão rateados entre os departamentos A e B com base nas horas-máquina, sendo 400 horas em A e 200 em B. O valor rateado a A é de"}],"opts":["R$ 30.000,00.","R$ 45.000,00.","R$ 60.000,00.","R$ 90.000,00."],"gabStatus":"Autoral","exp":"A usa 400 de 600 horas, ou 2/3: 2/3 × 90.000 = 60.000 (B fica com 30.000).","aut":true},{"id":"A1-39","ed":"Autoral 1","n":39,"mat":"Análise / Gerencial / Controladoria","gab":"C","stem":[{"t":"p","x":"A empresa tem ativo circulante de R$ 300.000,00, estoques de R$ 100.000,00 e passivo circulante de R$ 200.000,00. A liquidez seca é de"}],"opts":["2,00.","0,50.","1,00.","1,50."],"gabStatus":"Autoral","exp":"Liquidez seca = (ativo circulante − estoques) ÷ passivo circulante = (300.000 − 100.000) ÷ 200.000 = 1,00. A corrente seria 1,50.","aut":true},{"id":"A1-40","ed":"Autoral 1","n":40,"mat":"Análise / Gerencial / Controladoria","gab":"C","stem":[{"t":"p","x":"A receita da empresa foi de R$ 200.000,00 em 2023 e de R$ 250.000,00 em 2024. Na análise horizontal, com 2023 como base 100, o índice de 2024 é de"}],"opts":["150.","25.","125.","80."],"gabStatus":"Autoral","exp":"Índice = 250.000 ÷ 200.000 × 100 = 125, ou seja, crescimento de 25%.","aut":true},{"id":"A1-41","ed":"Autoral 1","n":41,"mat":"Análise / Gerencial / Controladoria","gab":"A","stem":[{"t":"p","x":"Uma empresa tem capital investido de R$ 1.000.000,00, custo do capital de 10% ao ano e lucro operacional após o imposto de R$ 120.000,00. O EVA (Valor Econômico Agregado) é de"}],"opts":["R$ 20.000,00.","R$ 120.000,00.","R$ 220.000,00.","R$ 100.000,00."],"gabStatus":"Autoral","exp":"EVA = lucro operacional após IR − (capital investido × custo do capital) = 120.000 − 100.000 = 20.000.","aut":true},{"id":"A1-42","ed":"Autoral 1","n":42,"mat":"Análise / Gerencial / Controladoria","gab":"D","stem":[{"t":"p","x":"No processo orçamentário de uma indústria, o orçamento que normalmente serve de ponto de partida para os demais é o de"}],"opts":["investimentos.","despesas administrativas.","caixa.","vendas."],"gabStatus":"Autoral","exp":"A projeção de vendas define quanto produzir, comprar e gastar, e dela decorrem os demais orçamentos (produção, materiais, despesas, caixa).","aut":true},{"id":"A1-43","ed":"Autoral 1","n":43,"mat":"Análise / Gerencial / Controladoria","gab":"A","stem":[{"t":"p","x":"O princípio de governança corporativa que se refere à disponibilização de informações aos interessados, e não apenas das que a lei exige, é a"}],"opts":["transparência.","prestação de contas.","equidade.","responsabilidade corporativa."],"gabStatus":"Autoral","exp":"Transparência é o desejo de informar, e vai além do que a legislação obriga. Equidade é tratamento justo aos sócios, prestação de contas é responder pelos atos, e responsabilidade corporativa é zelar pela sustentabilidade.","aut":true},{"id":"A1-44","ed":"Autoral 1","n":44,"mat":"Setor Público","gab":"D","stem":[{"t":"p","x":"Na execução da despesa orçamentária, o estágio em que se verifica o direito adquirido pelo credor, com base em títulos e documentos comprobatórios, é a"}],"opts":["empenho.","reserva.","dotação.","liquidação."],"gabStatus":"Autoral","exp":"Empenho cria a obrigação, liquidação verifica o direito do credor (entrega do bem ou serviço) e pagamento quita a obrigação.","aut":true},{"id":"A1-45","ed":"Autoral 1","n":45,"mat":"Setor Público","gab":"A","stem":[{"t":"p","x":"Assinale a receita orçamentária classificada como receita de capital."}],"opts":["Alienação de bens.","Receita de serviços.","Receita tributária.","Receita patrimonial."],"gabStatus":"Autoral","exp":"Alienação de bens, operações de crédito, amortização de empréstimos e transferências de capital são receitas de capital. As demais são correntes.","aut":true},{"id":"A1-46","ed":"Autoral 1","n":46,"mat":"Setor Público","gab":"A","stem":[{"t":"p","x":"O princípio orçamentário segundo o qual a lei orçamentária não conterá dispositivo estranho à previsão da receita e à fixação da despesa é o da"}],"opts":["exclusividade.","anualidade.","universalidade.","unidade."],"gabStatus":"Autoral","exp":"Exclusividade veda matéria estranha ao orçamento (com exceções como autorização para créditos suplementares e contratação de operações de crédito).","aut":true},{"id":"A1-47","ed":"Autoral 1","n":47,"mat":"Auditoria","gab":"B","stem":[{"t":"p","x":"O auditor não conseguiu obter evidência apropriada e suficiente sobre um saldo relevante, mas concluiu que os possíveis efeitos não são generalizados. Segundo a NBC TA 705, deve emitir"}],"opts":["abstenção de opinião.","opinião com ressalva.","opinião adversa.","opinião sem ressalva."],"gabStatus":"Autoral","exp":"Limitação de escopo relevante, mas não generalizada: opinião com ressalva. Se for relevante e generalizada, abstenção. Distorção relevante e generalizada: opinião adversa.","aut":true},{"id":"A1-48","ed":"Autoral 1","n":48,"mat":"Auditoria","gab":"C","stem":[{"t":"p","x":"O auditor acompanhou a contagem física dos estoques da empresa em 31/12. O procedimento de auditoria aplicado foi a"}],"opts":["reexecução.","confirmação externa.","observação.","recálculo."],"gabStatus":"Autoral","exp":"Observação é olhar o procedimento sendo realizado por outros, como a contagem de estoques. Recálculo confere cálculos, e reexecução repete procedimentos ou controles.","aut":true},{"id":"A1-49","ed":"Autoral 1","n":49,"mat":"Perícia","gab":"D","stem":[{"t":"p","x":"O documento elaborado pelo assistente técnico, em que analisa, ratifica ou contesta o laudo do perito nomeado, é o"}],"opts":["laudo pericial contábil.","quesito.","termo de diligência.","parecer pericial contábil."],"gabStatus":"Autoral","exp":"O perito nomeado emite laudo, e o assistente técnico emite parecer.","aut":true},{"id":"A1-50","ed":"Autoral 1","n":50,"mat":"Perícia","gab":"A","stem":[{"t":"p","x":"Na apuração de haveres, um sócio com 20% do capital se retira. O patrimônio líquido ajustado a valor de mercado é de R$ 1.500.000,00. O valor dos haveres desse sócio é de"}],"opts":["R$ 300.000,00.","R$ 150.000,00.","R$ 200.000,00.","R$ 1.200.000,00."],"gabStatus":"Autoral","exp":"Haveres = 20% × 1.500.000 = 300.000.","aut":true}];
var GUIDE=[{"key":"Estrutura Conceitual e qualidades da informação","titulo":"Estrutura Conceitual","grupo":"Contabilidade geral","cai":"27 questões nas 6 provas, em 6 das 6 edições (1 a 7 por prova).","regras":["Objetivo: informação útil a investidores, credores por empréstimo e outros credores para decidir sobre fornecer recursos à entidade.","Características fundamentais: relevância (valor preditivo, valor confirmatório, materialidade) e representação fidedigna (completa, neutra, livre de erros).","De melhoria: comparabilidade, verificabilidade, tempestividade e compreensibilidade. O custo é uma restrição.","Ativo: recurso econômico presente, controlado pela entidade, como resultado de eventos passados.","Passivo: obrigação presente de transferir recurso econômico, como resultado de eventos passados.","Patrimônio líquido: participação residual nos ativos depois de deduzidos todos os passivos.","Receita: aumento de ativo ou redução de passivo que aumenta o PL (exceto aportes dos donos). Despesa: o inverso (exceto distribuições aos donos).","Reconhecer um elemento exige informação relevante e representação fidedigna. Desreconhecer é retirar do balanço, total ou parcialmente, um ativo ou passivo já reconhecido.","Mensuração: custo histórico ou valor corrente (valor justo, valor em uso/valor de cumprimento, custo corrente).","Único pressuposto subjacente: continuidade operacional. Capital pode ser visto no conceito financeiro (o padrão) ou físico.","Siglas das normas: NBC TG (geral), TSP (setor público), TA (auditoria independente), TI (auditoria interna), TP (perícia), PG (profissional geral, inclui o Código de Ética), PA (auditor), PP (perito)."],"pegadinhas":["As alternativas trocam \"obrigação presente\" por \"possível\", e \"controle\" por \"propriedade\".","Relevância e materialidade não são a mesma coisa: materialidade é um aspecto da relevância.","Baixar um estoque perdido sem laudo oficial, para a informação ser mais útil, é questão de qualidade da informação (já caiu em 2025.1)."],"n":27},{"key":"Imobilizado, depreciação, impairment","titulo":"Imobilizado, depreciação e impairment","grupo":"Contabilidade geral","cai":"25 questões nas 6 provas, em 6 das 6 edições (3 a 5 por prova).","regras":["Custo = preço de compra + impostos de importação e não recuperáveis + custos diretos para colocar em uso (frete, seguro, instalação, testes) - descontos. Impostos recuperáveis não entram.","Depreciação linear = (custo - valor residual) / vida útil. Começa quando o ativo está disponível para uso. Terreno não se deprecia.","Mudou a vida útil, o residual ou o método? É mudança de estimativa e vale daqui para frente (prospectiva). Novo valor depreciável = valor contábil atual - novo residual, dividido pela vida útil restante.","Impairment: valor recuperável = o maior entre valor justo líquido de despesas de venda e valor em uso. Se o valor contábil for maior, reconhece a perda no resultado. A reversão é permitida, exceto para ágio.","Propriedade para investimento: mantida para aluguel ou valorização, não para uso na atividade.","Mantido para venda: valor contábil recuperado principalmente por venda. Mede pelo menor entre valor contábil e valor justo menos despesas de venda, e para de depreciar.","Manutenção de rotina é despesa. Substituição de peça que atende aos critérios é capitalizada, e a peça antiga é baixada."],"pegadinhas":["Frete e seguro da compra entram no custo. Treinamento de pessoal e custos administrativos, não.","No ano da compra, depreciar proporcional aos meses de uso.","Depois de mudança de vida útil, não recalcule os anos passados."],"n":25},{"key":"Balanço, Lei 6.404, PL, dividendos, notas","titulo":"Balanço, Lei 6.404, PL e dividendos","grupo":"Contabilidade geral","cai":"18 questões nas 6 provas, em 5 das 6 edições (0 a 6 por prova).","regras":["Circulante: realizável ou exigível até o fim do exercício seguinte (ou até o ciclo operacional, se maior). O que passa disso é não circulante.","O ativo é apresentado em ordem decrescente de liquidez.","Grupos do PL: capital social, reservas de capital, ajustes de avaliação patrimonial, reservas de lucros, ações em tesouraria e prejuízos acumulados.","Reservas de capital podem absorver prejuízos que ultrapassarem os lucros acumulados e as reservas de lucros.","Despesas antecipadas são ativo (circulante ou não circulante, conforme o prazo).","Dividendo mínimo obrigatório declarado no fim do exercício é passivo. O que passa do mínimo fica no PL até a deliberação.","Notas explicativas complementam as demonstrações: práticas contábeis, base de preparação, eventos relevantes."],"pegadinhas":["Cuidado com o prazo na questão: a aplicação que vence em 380 dias é não circulante, o estoque com venda em 60 dias é circulante.","Imóvel onde a empresa funciona é imobilizado, não é estoque."],"n":18},{"key":"Estoques (custo, PEPS, VRL)","titulo":"Estoques","grupo":"Contabilidade geral","cai":"14 questões nas 6 provas, em 6 das 6 edições (2 a 3 por prova).","regras":["Custo do estoque = preço + impostos não recuperáveis + transporte e seguro - descontos comerciais e impostos recuperáveis (desconto financeiro é receita financeira, não reduz o custo).","Métodos aceitos: PEPS e custo médio ponderado. UEPS não é permitido.","Mensura pelo menor entre custo e valor realizável líquido (VRL = preço de venda estimado - custos para vender).","CMV = estoque inicial + compras líquidas - estoque final. Compras líquidas = compras + frete na compra - devoluções - descontos comerciais - impostos recuperáveis.","Devolução de venda: reverte a receita e devolve a mercadoria ao estoque pelo custo."],"pegadinhas":["Estoque inicial superavaliado deixa o CMV maior e o lucro menor. Estoque final superavaliado deixa o CMV menor e o lucro maior.","Frete na venda é despesa, não entra no estoque.","No custo médio móvel, recalcule a média a cada compra."],"n":14},{"key":"DRE, receitas (TG 47), DRA","titulo":"DRE, receitas e DRA","grupo":"Contabilidade geral","cai":"12 questões nas 6 provas, em 4 das 6 edições (0 a 4 por prova).","regras":["Receita de contrato com cliente (5 passos): identificar o contrato, identificar as obrigações de desempenho, determinar o preço, alocar o preço e reconhecer a receita quando a obrigação é cumprida (transferência de controle).","Receita líquida = receita bruta - tributos sobre vendas, devoluções e abatimentos. Lucro bruto = receita líquida - CMV.","Recebimento antecipado vira passivo (receita diferida) até a entrega, como passagem aérea vendida antes do voo.","Resultado de equivalência patrimonial e receita financeira não são receita de vendas.","DRA = resultado do período + outros resultados abrangentes."],"pegadinhas":["Receita de vendas recebida ou não recebida: o que manda é a transferência de controle, não o caixa."],"n":12},{"key":"Investimentos, equivalência, consolidação, combinação","titulo":"Investimentos, equivalência e consolidação","grupo":"Contabilidade geral","cai":"11 questões nas 6 provas, em 6 das 6 edições (1 a 3 por prova).","regras":["Coligada: influência significativa, sem controle. Controlada: poder sobre a investida, exposição a retornos variáveis e capacidade de afetar esses retornos.","Equivalência patrimonial: resultado = percentual x lucro líquido da investida. Dividendo recebido reduz o investimento e não é receita.","Consolidação: elimina o investimento contra o PL da controlada, elimina saldos e transações entre as empresas e destaca a participação dos não controladores.","Lucro em venda entre empresas do grupo e ainda em estoque é eliminado (lucro não realizado).","Combinação de negócios: método de aquisição. Ágio por expectativa de rentabilidade futura = valor pago - valor justo dos ativos líquidos identificáveis. Não amortiza e passa por teste de impairment."],"pegadinhas":["Dividendos recebidos diminuem o investimento no método de equivalência.","Ao comprar 100% pelo valor justo dos ativos líquidos, não há ágio. Se pagou mais, a diferença é ágio."],"n":11},{"key":"Outras normas (AVP, arrendamento, instr. financeiros, tributos diferidos, câmbio, segmentos, mantido p/ venda)","titulo":"Outras normas","grupo":"Contabilidade geral","cai":"12 questões nas 6 provas, em 5 das 6 edições (0 a 5 por prova).","regras":["Ajuste a valor presente: vale para prazos longos e para curtos relevantes. Os juros são apropriados ao resultado ao longo do prazo.","Arrendamento (arrendatário): reconhece ativo de direito de uso e passivo de arrendamento. Exceções: contrato de até 12 meses e ativo de baixo valor.","Tributos diferidos: ativo fiscal diferido (prejuízo fiscal, diferença temporária dedutível) só quando provável lucro tributável futuro.","Mudança de estimativa: prospectiva. Mudança de política contábil e correção de erro: retrospectivas.","Câmbio: ativos e passivos monetários convertidos pela taxa de fechamento.","Instrumentos financeiros: o modelo de negócios e o fluxo de caixa contratual definem a mensuração (custo amortizado, valor justo no resultado ou em ORA).","Segmentos operacionais seguem as informações usadas pela gestão para decidir. Operação descontinuada e ativo mantido para venda têm tratamento próprio."],"pegadinhas":["Estimar inadimplência de novo, com base em fatos novos, é mudança de estimativa."],"n":12},{"key":"Operações básicas (competência, folha, lançamentos)","titulo":"Operações básicas e competência","grupo":"Contabilidade geral","cai":"11 questões nas 6 provas, em 4 das 6 edições (0 a 3 por prova).","regras":["Regime de competência: receita e despesa entram no período em que ocorrem, independentemente do caixa.","Folha: despesa de salários = valor bruto. Crédito em salários a pagar (líquido), INSS a recolher e IRRF a recolher.","Aluguel pago antecipado é ativo (despesa antecipada) apropriado mês a mês.","Serviço contratado e ainda não pago: despesa pelo período em que foi prestado, passivo pelo que falta pagar.","Despesa total de pessoal inclui salário e encargos patronais (INSS patronal, FGTS). Descontos do empregado (INSS e IR retidos) não são despesa da empresa.","Seguro pago antecipado: apropriar por mês a partir da vigência. Em 12 meses, a despesa do exercício é só a parcela dos meses decorridos."],"pegadinhas":["Pagamento parcelado não muda a competência: a despesa segue o serviço prestado."],"n":11},{"key":"Provisões e contingências (TG 25)","titulo":"Provisões e contingências","grupo":"Contabilidade geral","cai":"7 questões nas 6 provas, em 5 das 6 edições (0 a 3 por prova).","regras":["Perda provável e estimável: reconhece a provisão e divulga.","Perda possível: não reconhece, só divulga (passivo contingente).","Perda remota: não reconhece nem divulga.","Ativo contingente: não reconhece. Divulga se a entrada de benefícios for provável. Só reconhece quando for praticamente certo.","Provisão exige obrigação presente (legal ou construtiva), saída de recursos provável e estimativa confiável. Não se provisiona prejuízo operacional futuro.","Perda provável com estimativa confiável: provisão e divulgação. Possível: só divulga como passivo contingente. Remota: nada. Provável sem estimativa confiável: passivo contingente, só divulga.","Intervalo de valores com a mesma probabilidade: usar o ponto médio.","Ativo contingente não se reconhece. Só se divulga quando a entrada de benefícios é provável.","Evento subsequente que confirma condição já existente no balanço, e ocorre antes da autorização para emissão, exige ajuste."],"pegadinhas":["Autuação fiscal: o que decide é a probabilidade de perda, não o valor."],"n":7},{"key":"DVA","titulo":"DVA","grupo":"Contabilidade geral","cai":"6 questões nas 6 provas, em 5 das 6 edições (0 a 2 por prova).","regras":["Valor adicionado bruto = receitas - insumos adquiridos de terceiros.","Valor adicionado líquido = bruto - depreciação, amortização e exaustão.","Valor adicionado a distribuir = líquido + recebido em transferência (equivalência patrimonial, receitas financeiras).","Distribuição: pessoal, tributos, remuneração de capital de terceiros (juros e aluguéis) e remuneração de capital próprio (dividendos, JCP, lucros retidos).","Exemplo: receitas 1.000, insumos 400, depreciação 50 e receita financeira 30. Valor adicionado bruto 600, líquido 550 e total a distribuir 580."],"pegadinhas":["Aluguel e despesa financeira vão em capital de terceiros. Assistência médica a empregados vai em pessoal.","Equivalência patrimonial entra em valor adicionado recebido em transferência."],"n":6},{"key":"Intangível","titulo":"Intangível","grupo":"Contabilidade geral","cai":"3 questões nas 6 provas, em 3 das 6 edições (0 a 1 por prova).","regras":["Intangível: identificável, controlado, com benefícios econômicos futuros.","Pesquisa é despesa. Desenvolvimento só vira ativo se os critérios forem atendidos.","Ágio, marcas e listas de clientes gerados internamente não se reconhecem.","Vida útil definida: amortiza. Indefinida: não amortiza, com teste anual de impairment.","Gastos da fase de pesquisa de novo produto são despesa. Só gastos de desenvolvimento que cumprem todos os critérios viram intangível."],"pegadinhas":["Gastos com atividades de obtenção de novo conhecimento (pesquisa) vão para despesa."],"n":3},{"key":"DFC (fluxo de caixa)","titulo":"DFC","grupo":"Contabilidade geral","cai":"3 questões nas 6 provas, em 2 das 6 edições (0 a 2 por prova).","regras":["Três grupos: operacionais, de investimento e de financiamento.","Método direto: recebimentos e pagamentos. Método indireto: parte do lucro e ajusta por itens que não afetam o caixa.","Juros pagos: financiamento ou operacional. Juros e dividendos recebidos: investimento ou operacional. Dividendos pagos: financiamento ou operacional.","Caixa e equivalentes incluem aplicações de curtíssimo prazo e liquidez imediata.","Integralização de capital e empréstimos recebidos ou pagos: financiamento. Compra e venda de imobilizado: investimento. Recebimento de clientes, pagamento a fornecedores e compra de insumos consumidos: operacional."],"pegadinhas":["A norma permite escolhe
