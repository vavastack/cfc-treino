r a classificação de juros e dividendos, desde que seja mantida de forma consistente.","Alimentos e insumos comprados para consumo da atividade, mesmo estocados, são fluxo operacional."],"n":3},{"key":"Custos","titulo":"Custos","grupo":"Outras matérias contábeis","cai":"22 questões nas 6 provas, em 6 das 6 edições (3 a 4 por prova).","regras":["Custo primário = matéria-prima + mão de obra direta. Custo de transformação = mão de obra direta + custos indiretos.","Margem de contribuição unitária = preço - custos e despesas variáveis.","Ponto de equilíbrio contábil = (custos fixos + despesas fixas) / margem de contribuição unitária. Econômico: soma o custo de oportunidade. Financeiro: tira os custos não desembolsáveis (depreciação).","Absorção: todos os custos de produção vão para o produto. Variável: só os variáveis. Os fixos vão direto ao resultado.","Custo padrão: variação de preço = (preço real - padrão) x quantidade real. Variação de quantidade = (quantidade real - padrão) x preço padrão.","Custo dos produtos vendidos = estoque inicial de produtos + custo da produção do período - estoque final de produtos.","Rateio departamental: a base vem do enunciado (área, horas, energia). Calcule a proporção e aplique ao custo.","ABC: distribui os custos por atividades e direcionadores de custo, em vez de usar um rateio único."],"pegadinhas":["Preço mudou e a questão dá só o ponto de equilíbrio antigo? Descubra primeiro o custo fixo: custo fixo = ponto de equilíbrio x margem antiga.","Despesas fixas entram no ponto de equilíbrio, não no custo do produto."],"n":22},{"key":"Análise / Gerencial / Controladoria","titulo":"Análise, gerencial e controladoria","grupo":"Outras matérias contábeis","cai":"27 questões nas 6 provas, em 6 das 6 edições (4 a 5 por prova).","regras":["Liquidez corrente = AC / PC. Seca = (AC - estoques) / PC. Imediata = disponível / PC. Geral = (AC + RLP) / (PC + ELP).","Endividamento = (PC + ELP) / ativo total. Participação de capital próprio = PL / ativo total.","Margem líquida = lucro líquido / receita líquida. ROE = lucro líquido / PL. ROA = lucro líquido / ativo.","Prazos: estoque = estoque médio / CMV x 360. Recebimento = clientes / vendas x 360. Pagamento = fornecedores / compras x 360.","Ciclo operacional = prazo de estoque + prazo de recebimento. Ciclo financeiro = ciclo operacional - prazo de pagamento.","Análise vertical: cada item dividido por uma base (ativo total no balanço, receita líquida na DRE). Horizontal: variação entre períodos.","EVA incorpora o custo de oportunidade do capital, o que o ROI não faz.","Orçamento começa pela receita: quantidade vendida x preço, menos descontos. Aluguel não entra na projeção da receita.","Planos estratégico, tático e operacional se desdobram em cadeia. Compliance é aderência a normas e regras internas."],"pegadinhas":["Vertical e horizontal se confundem: vertical compara dentro do ano, horizontal compara entre anos.","Na seca, tire estoques do ativo circulante. Na corrente, não."],"n":27},{"key":"Setor Público","titulo":"Contabilidade pública","grupo":"Outras matérias contábeis","cai":"19 questões nas 6 provas, em 6 das 6 edições (3 a 4 por prova).","regras":["Receita: previsão, lançamento, arrecadação e recolhimento. Despesa: fixação, empenho, liquidação e pagamento.","Despesas correntes: pessoal, juros e encargos da dívida e outras. De capital: investimentos, inversões financeiras e amortização da dívida.","Receitas correntes: tributária, de contribuições, patrimonial, de serviços e transferências correntes. De capital: operações de crédito, alienação de bens e transferências de capital.","Regime orçamentário: receita pela arrecadação, despesa pelo empenho. Regime patrimonial: competência.","Princípios orçamentários: unidade, universalidade, anualidade, exclusividade, legalidade, publicidade, equilíbrio e não afetação de receitas.","A LOA reúne o orçamento fiscal, o da seguridade social e o de investimento das estatais.","Anulação de empenho: parcial ou total, quando o valor empenhado é maior que o devido."],"pegadinhas":["Empenho reserva dotação, mas não é pagamento. Liquidação é a verificação do direito do credor.","Receita e despesa orçamentárias não são o mesmo que resultado patrimonial."],"n":19},{"key":"Auditoria","titulo":"Auditoria","grupo":"Outras matérias contábeis","cai":"13 questões nas 6 provas, em 6 das 6 edições (2 a 3 por prova).","regras":["Opinião sem ressalva: demonstrações adequadas em todos os aspectos relevantes.","Com ressalva: distorção relevante, mas não generalizada (ou impossibilidade de obter evidência, com efeito relevante, mas não generalizado).","Adversa: distorção relevante e generalizada. Abstenção: impossibilidade de obter evidência, com possíveis efeitos relevantes e generalizados.","Risco de auditoria = risco de distorção relevante (inerente x controle) x risco de detecção.","Planejamento: o sócio e os membros-chave da equipe participam, e a estratégia global antecede o plano de auditoria.","Procedimentos: inspeção, observação, confirmação externa, recálculo, reexecução, analíticos e indagação.","Independência: assumir decisões de gestão do cliente cria ameaça de autorrevisão.","Amostragem: seleção aleatória dá a todos os itens a mesma chance de escolha.","Incerteza relevante sobre continuidade, bem divulgada: a opinião não é modificada. O relatório chama atenção para a nota (ênfase ou seção de incerteza). Não é ressalva, adversa nem abstenção.","Deficiência significativa de controle interno: comunicar por escrito e tempestivamente à administração (e aos responsáveis pela governança).","Fraude constatada: relatar à administração ou governança. O auditor não renuncia por conta própria nem faz denúncia anônima.","Antes de modificar a opinião, comunicar aos responsáveis pela governança as circunstâncias e o texto proposto, para que possam dar explicações adicionais.","Objetivo da auditoria: segurança razoável de que as demonstrações como um todo estão livres de distorção relevante. Tipos de asseguração: limitada e razoável.","Risco de auditoria: possibilidade de emitir opinião inadequada quando há distorção relevante não detectada.","A responsabilidade pela opinião é só do auditor. Usar especialista não reduz nem divide.","Ênfase: assunto já apresentado nas demonstrações, mas fundamental para o entendimento. Outros assuntos: o que não está nas demonstrações.","Exemplos de procedimento: acompanhar a contagem de estoque é observação, conferir a depreciação é recálculo, confirmar saldo e contrato com fornecedor é confirmação externa."],"pegadinhas":["Distorção só relevante é ressalva. Relevante e generalizada é adversa.","Ressalva, adversa e abstenção se decidem por duas perguntas: relevante ou generalizado, e houve evidência ou não."],"n":13},{"key":"Perícia","titulo":"Perícia contábil","grupo":"Outras matérias contábeis","cai":"12 questões nas 6 provas, em 6 das 6 edições (2 a 2 por prova).","regras":["Perito nomeado (pelo juiz) elabora o laudo pericial contábil. Perito-assistente (da parte) elabora o parecer pericial contábil.","Procedimentos periciais: exame, vistoria, indagação, investigação, arbitramento, mensuração, avaliação e certificação.","Honorários: o perito apresenta proposta de honorários antes de iniciar, com base no tempo e na complexidade estimados.","Contas de verbas trabalhistas: férias proporcionais = salário / 12 x meses, mais 1/3 constitucional.","Laudo: identificação das partes, síntese do objeto e do objetivo, relato das diligências, quesitos e respostas, fundamentação (método científico e análise técnica), conclusão e assinatura com número do CRC. Sem fundamentação o laudo fica incompleto.","Indagação é entrevista com quem conhece o fato. Arbitramento é determinar valores ou resolver controvérsia por critério técnico-científico. Exame é a análise de livros, registros e documentos. Vistoria é a diligência para examinar pessoas, bens ou locais.","Assistente técnico não pode validar, ratificar nem subscrever laudo feito por leigo ou por profissional de outra área. Deve oferecer o seu próprio parecer.","Laudo e parecer têm por limite o objeto da perícia deferida ou contratada. Se o laudo for assinado em conjunto, a responsabilidade é solidária entre os peritos que assinam.","Respostas aos quesitos: objetivas, completas e não lacônicas.","Competência: contador regular no CRC (não vale 'profissional equivalente') e com notório conhecimento da matéria.","Prazo: o perito pode pedir prorrogação por uma vez, de no máximo metade do prazo original (CPC). O juiz poderá conceder, e não é obrigado. Prazo de 30 dias úteis: até mais 15.","Impedimento ou suspeição: o perito deve declinar. Consentimento das partes não resolve.","Honorários: a proposta considera custo, tempo, relevância, risco e complexidade, e não quem é o juiz nem quem são as partes. Honorários fixados ou arbitrados e não pagos podem ser executados pelo perito.","Apuração de haveres: patrimônio líquido ajustado a valor de mercado (com goodwill, se o contrato mandar) × percentual do sócio, aplicando o deságio previsto e compensando o que o sócio deve à sociedade."],"pegadinhas":["Laudo é do perito, parecer é do assistente. A prova troca os dois.","Perito nomeado faz laudo. Assistente faz parecer. A banca troca os dois nas alternativas.","Segundo o gabarito de 2025.2, o parecer do assistente é emitido quando há divergência (parcial ou total) com o laudo.","Férias proporcionais em perícia trabalhista: some os períodos aquisitivos completos e o proporcional, tire os dias já gozados, calcule o dia (salário ÷ 30) e some 1/3."],"n":12},{"key":"Ética","titulo":"Ética profissional","grupo":"Matérias de apoio","cai":"16 questões nas 6 provas, em 6 das 6 edições (2 a 4 por prova).","regras":["Princípios fundamentais: integridade, objetividade, competência e zelo profissional, confidencialidade e comportamento profissional.","Ameaças: interesse próprio, autorrevisão, defesa de interesses, familiaridade e intimidação.","Pressão da administração para alterar um resultado: o contador deve manter integridade e objetividade, não ceder.","Honorários e propostas de serviço devem ser por escrito.","Contador responsável técnico não pode delegar tudo a quem não é registrado e assinar sem revisar.","Educação profissional continuada tem regras de pontos e prazos. Vale ler a norma.","Penalidades éticas: advertência reservada, censura reservada e censura pública. Não existe advertência pública.","Agravantes: gravidade da infração, punição ética anterior transitada em julgado, ação ou omissão que macule publicamente a imagem do contador. Salvaguardas não são agravante.","A proposta de honorários, por escrito, considera: tempo, possibilidade de ficar impedido de outros serviços, resultado lícito favorável ao contratante e a peculiaridade de o cliente ser eventual, habitual ou permanente. Deve conter serviços, valor de cada um, periodicidade e forma de reajuste.","Sigilo profissional: exceções só por lei ou quando solicitado por autoridades competentes (inclusive os Conselhos). Inadimplência do cliente não autoriza revelar.","Divulgação: pode indicar títulos, especializações, serviços, trabalhos e relação de clientes, se autorizados por eles. É vedado prometer resultado sem embasamento, fazer afirmações desproporcionais sobre a própria capacitação e se apropriar de trabalhos de colegas.","Responsabilidade técnica é pessoal e indelegável: exige supervisão efetiva e cooperação com a fiscalização. Não se limita ao vínculo contratual.","EPC (NBC PG 12): obrigatória também para perito inscrito no CNPC, com mínimo de 40 pontos anuais, 12 deles em aquisição de conhecimento, e comprovação até 31 de janeiro do ano seguinte.","Participação financeira relevante no cliente é ameaça de interesse próprio. Assumir decisões de gestão do cliente é ameaça de autorrevisão.","A função social da contabilidade: informação útil, fidedigna e transparente para os usuários, preservando o interesse público. Não se adapta a transparência à conveniência da administração."],"pegadinhas":["Itens 7, 8 e 20 do Código caíram em 2024.2. Leia o código item por item uma vez.","O Código de Ética cobra os itens por número (7, 8, 20 e outros). Leia uma vez o texto inteiro."],"n":16},{"key":"Direito","titulo":"Direito e legislação","grupo":"Matérias de apoio","cai":"18 questões nas 6 provas, em 6 das 6 edições (3 a 3 por prova).","regras":["Princípios da Administração Pública (CF art. 37): legalidade, impessoalidade, moralidade, publicidade e eficiência (a eficiência veio pela EC 19/98).","Tributo (CTN art. 3º): prestação pecuniária compulsória, em moeda, que não é sanção de ato ilícito, instituída em lei e cobrada por atividade administrativa vinculada.","Limitações ao poder de tributar: legalidade, anterioridade, noventena, irretroatividade, isonomia, vedação ao confisco e imunidades.","LC 123/2006: microempresa com receita bruta anual até R$ 360 mil. Empresa de pequeno porte: acima disso, até R$ 4,8 milhões.","Lei 14.133/2021: modalidades pregão, concorrência, concurso, leilão e diálogo competitivo. Registro de preços é procedimento auxiliar.","Férias: 30 dias, com adicional de 1/3. Proporcionais: 1/12 por mês trabalhado.","Aviso prévio proporcional: 30 dias + 3 por ano completo de serviço, até 90 dias (Lei 12.506/2011).","Direito positivo é o conjunto de normas postas. Direito objetivo é a norma. Direito subjetivo é a prerrogativa do titular.","Renúncia à prescrição: só vale depois de consumada, e pode ser expressa ou tácita.","Comoriência: se não se sabe quem morreu primeiro entre herdeiros um do outro, presume-se morte simultânea.","CTN: decisões administrativas com eficácia normativa entram em vigor 30 dias após a publicação, salvo disposição em contrário.","Imunidade de livros alcança impostos. Taxas e contribuições continuam devidas.","Contribuições sociais têm noventena própria (90 dias). Lei expressamente interpretativa pode retroagir. Isonomia: tratamento igual a quem está em situação equivalente.","Obrigação principal é p function $(s,r){return (r||document).querySelector(s);}
function el(tag,attrs){
  var e=document.createElement(tag);
  if(attrs){for(var k in attrs){var v=attrs[k];
    if(k==="class")e.className=v;
    else if(k==="on"){for(var ev in v)e.addEventListener(ev,v[ev]);}
    else if(v===true)e.setAttribute(k,"");
    else if(v!==false&&v!=null)e.setAttribute(k,v);}}
  for(var i=2;i<arguments.length;i++){add(e,arguments[i]);}
  return e;
}
function add(e,c){
  if(c==null||c===false)return;
  if(Array.isArray(c)){c.forEach(function(x){add(e,x);});return;}
  e.appendChild(c.nodeType?c:document.createTextNode(String(c)));
}

          var ids=shuffle(poolOf([x.g.key]).filter(function(q){var a=store.ans[q.id];return a&&!a.ok;})).map(function(q){return q.id;});
          startSession(ids,{title:"Revisão: "+x.g.titulo,back:"aulas"});
        }}},"Refazer erros")));
    });
    w.appendChild(wc);
  }
  w.appendChild(el("h2",null,"Dia a dia"));
  items.forEach(function(it){
    var dt=new Date(it.d+"T00:00:00"),k=aulaKind(it),done=!!store.sched[it.d];
    var f=fmtRound((aulasStore()[it.d]||{}).fix);
    var card=el("button",{class:"card day"+(it.d===t?" today":"")+(done?" done":""),style:"width:100%;text-align:left",on:{click:function(){go("aula",{d:it.d});}}},
      el("span",{style:"flex:1;min-width:0"},
        el("span",{class:"mut sm",style:"display:block"},WD[dt.getDay()]+" "+pad(dt.getDate())+"/"+pad(dt.getMonth()+1)+(it.d===t?" · hoje":"")+" · "+KIND_LABEL[k]),
        el("span",{style:"display:block;font-weight:600"},it.t),
        f?el("span",{class:"mut sm",style:"display:block"},"Fixação: "+f):null),
      el("span",{class:"mut"},done?"✓":"›"));
    w.appendChild(card);
  });
  return w;
}

    w.appendChild(el("button",{class:"full",on:{click:function(){go("guide");}}},"Abrir o guia de apoio"));

document.addEventListener("keydown",function(e){
  if(V!=="q"||!S)return;
  var t=e.target&&e.target.tagName;if(t==="INPUT"||t==="SELECT")return;
  var k=e.key.toLowerCase(),id=S.ids[S.i],q=QB[id];
  var map={a:"A",b:"B",c:"C",d:"D","1":"A","2":"B","3":"C","4":"D"};
  if(map[k]){pickOpt(q,map[k]);}
  else if(k==="enter"&&S.mode==="train"&&!S.ans[id]&&S.pend[id]&&store.confirm!==false){confirmAnswer(q);}
  else if(k==="arrowright"||k==="enter"){if(S.i<S.ids.length-1&&(S.mode!=="train"||S.ans[id])){S.i++;render();window.scrollTo(0,0);}}
  else if(k==="arrowleft"){if(S.i>0){S.i--;render();window.scrollTo(0,0);}}
});
