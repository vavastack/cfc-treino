GAÇÃO DE INFORMAÇÃO CONTÁBIL DE PROPÓSITO GERAL PELAS ENTIDADES DO SETOR PÚBLICO as afirmativas são, respectivamente,"}],"opts":["V – F – F.","V – F – V.","F – V – V.","V – V – F."],"gabStatus":"Definitivo","exp":"A primeira é falsa: os RCPGs são feitos para usuários que não têm a prerrogativa de exigir informações customizadas. As outras duas estão corretas (legislativo como usuário primário e usuários que não são cidadãos, como organismos internacionais). Sequência: F – V – V."},{"id":"2025.1-45","ed":"2025.1","n":45,"mat":"Análise / Gerencial / Controladoria","gab":"A","stem":[{"t":"p","x":"Em 2022, uma entidade tinha o seu desempenho financeiro analisado com base no Retorno sobre o Investimento. Em 2023, a administração da entidade determinou que o seu desempenho passasse a ser avaliado com base no EVA (Valor Econômico Agregado). Uma vantagem dessa substituição é a incorporação, na avaliação,"}],"opts":["do custo de oportunidade.","das receitas operacionais.","das despesas operacionais.","das receitas financeiras."],"gabStatus":"Definitivo","exp":"O EVA desconta do lucro operacional o custo do capital investido (custo de oportunidade), o que o retorno sobre o investimento não faz."},{"id":"2025.1-46","ed":"2025.1","n":46,"mat":"Análise / Gerencial / Controladoria","gab":"C","stem":[{"t":"p","x":"A Administração de uma empresa, na elaboração de seu plano estratégico, deve, na medida do possível, observar alguns aspectos de formalidade necessários dado a sua relevância e seu impacto nas operações da empresa. A respeito desse tema, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa."},{"t":"p","x":"( ) O Plano Estratégico deve ser executado pela Controladoria sob o comando da alta administração da empresa."},{"t":"p","x":"( ) Uma vez elaborado e aprovado, o Plano Estratégico não deve ser alterado ou ajustado."},{"t":"p","x":"( ) Planejamento Estratégico é a atividade que se ocupa da implementação do Plano Estratégico e assegura que os recursos necessários foram obtidos e também que estão sendo usados de maneira eficiente."},{"t":"p","x":"( ) A elaboração de um Planejamento Estratégico deve levar em consideração que todas as decisões são interdependentes, sejam elas simples ou complexas. Assim, um dos principais desafios dessa atividade é um ajustamento dessa cadeia sistêmica de decisões e a avaliação de suas consequências. As afirmativas são, respectivamente,"}],"opts":["F – V – V – F.","F – V – F – V.","V – F – F – V.","V – F – V – F."],"gabStatus":"Definitivo","exp":"Pelo gabarito: o plano é conduzido pela alta administração com a Controladoria (V); depois de aprovado pode e deve ser ajustado (F); a definição dada (implementação e uso eficiente de recursos) é de controle gerencial, não de planejamento estratégico (F); as decisões estratégicas são interdependentes (V). Sequência: V – F – F – V."},{"id":"2025.1-47","ed":"2025.1","n":47,"mat":"Auditoria","gab":"B","stem":[{"t":"p","x":"Uma empresa de auditoria independente precisou contratar o trabalho de um especialista na área de Tecnologia da Informação. Após receber as conclusões do especialista, foi constatado que esse trabalho era adequado para fins da auditoria. Com base na NBC TA 620 – UTILIZAÇÃO DO TRABALHO DE ESPECIALISTAS, assinale a afirmativa correta acerca da responsabilidade do auditor ao emitir a sua opinião."}],"opts":["O auditor tem sua responsabilidade dividida com o especialista em todo o trabalho.","O auditor é o único responsável por expressar opinião de auditoria, e essa responsabilidade não é reduzida pelo trabalho de especialista contratado pelo auditor.","O auditor é responsável pela parte contábil, e o especialista, pelo trabalho que fez.","O auditor, modificando sua opinião em virtude do trabalho do especialista, não terá nenhuma responsabilidade, sendo a responsabilidade transferida ao especialista."],"gabStatus":"Definitivo","exp":"A responsabilidade pela opinião é só do auditor. Contratar especialista não a reduz nem a divide, nem a transfere."},{"id":"2025.1-48","ed":"2025.1","n":48,"mat":"Auditoria","gab":"C","stem":[{"t":"p","x":"No exercício de 2024, uma sociedade empresária foi incluída em um Plano de Refinanciamento de Impostos. O fato foi apropriadamente divulgado nas demonstrações contábeis. Mesmo sendo divulgado o Plano de Refinanciamento de Impostos, o auditor julgou que o assunto é de importância fundamental para o entendimento pelos usuários das demonstrações contábeis. Assim, o auditor independente incluirá, em seu relatório,"}],"opts":["uma ressalva.","um fato relevante.","um parágrafo de ênfase.","um parágrafo de outros assuntos."],"gabStatus":"Definitivo","exp":"Assunto já bem divulgado nas demonstrações, mas tão importante que o auditor quer destacar para os usuários: vai em parágrafo de ênfase, sem modificar a opinião. Ressalva é para distorção ou limitação. Parágrafo de outros assuntos trata do que não está apresentado nas demonstrações."},{"id":"2025.1-49","ed":"2025.1","n":49,"mat":"Perícia","gab":"D","stem":[{"t":"p","x":"Julgue as afirmativas a seguir, com base na NBC TP 01 (R1) - PERÍCIA CONTÁBIL."},{"t":"p","x":"I. Concluídos os trabalhos periciais, o perito nomeado deve apresentar laudo pericial contábil, e o assistente técnico deve oferecer seu parecer pericial contábil, obedecendo aos respectivos prazos legais e/ou contratuais."},{"t":"p","x":"II. O assistente técnico não pode validar o laudo pericial quando o documento tiver sido elaborado por leigo ou profissional de outra área, devendo, nesse caso, oferecer o parecer pericial contábil sobre a matéria periciada."},{"t":"p","x":"III. Mesmo quando assinado em conjunto por peritos, a responsabilidade acerca do laudo pericial contábil é exclusiva do perito nomeado, não sendo passível a assunção de responsabilidade solidária pelos demais peritos assinantes no documento."},{"t":"p","x":"IV. As respostas aos quesitos devem ser objetivas, completas e não lacônicas. Estão corretas as afirmativas"}],"opts":["III e IV, apenas.","I e II, apenas.","I e III, apenas.","II e IV, apenas."],"gabStatus":"Definitivo","exp":"Pelo gabarito, as certas são II e IV. III é falsa: quando o laudo é assinado em conjunto, a responsabilidade é solidária entre os peritos que assinam. I é considerada incorreta pelo gabarito; confira a redação exata da NBC TP 01 (R1) se quiser aprofundar."},{"id":"2025.1-50","ed":"2025.1","n":50,"mat":"Perícia","gab":"A","stem":[{"t":"p","x":"A Norma Brasileira de Contabilidade Profissional – Perito (NBC PP 01) estabelece as diretrizes e os requisitos para a atuação dos contadores como peritos, incluindo qualificações, deveres, responsabilidades, normas de conduta e as situações que podem acarretar impedimento ou suspeição. Analise as afirmativas a seguir, com base na NBC PP 01, e assinale (V) para a afirmativa verdadeira e (F) para a falsa."},{"t":"p","x":"( ) Em casos de impedimento ou suspeição, o perito contábil tem a opção de continuar no caso desde que obtenha o consentimento expresso de todas as partes envolvidas e da autoridade competente."},{"t":"p","x":"( ) A NBC PP 01 permite que o perito utilize documentos externos aos autos processuais como elementos de prova, desde que previamente acordado com as partes e autorizado pelo juiz ou autoridade competente."},{"t":"p","x":"( ) O perito contábil deve elaborar a proposta de honorários periciais considerando não apenas os custos e o tempo necessário para a execução dos trabalhos, mas também levando em conta a relevância e o risco envolvidos no objeto da perícia. As afirmativas são, respectivamente,"}],"opts":["F – F – V.","V – F – F.","F – V – F.","V – V – V. Realização"],"gabStatus":"Definitivo","exp":"Impedimento ou suspeição: o perito deve declinar, e não há consentimento das partes que o mantenha (F). Documentos externos aos autos como prova não são permitidos nessa forma (F). A proposta de honorários deve considerar relevância, risco e complexidade, além de custo e tempo (V). Sequência: F – F – V."},{"id":"2025.2-1","ed":"2025.2","n":1,"mat":"Português","gab":"A","stem":[{"t":"p","x":"Os dicionários registram os diversos significados de um vocábulo; os dois textos abaixo definem o termo “contabilidade”, segundo, respectivamente, os dicionários de Antônio Houaiss (AH) e de Aurélio Buarque de Hollanda (ABH). (AH) Contabilidade: ciência teórica e prática que estuda os métodos de cálculo e registro da movimentação financeira de uma firma ou empresa. (ABH) Contabilidade: ciência que estuda e interpreta os registros dos fenômenos que afetam o patrimônio de uma entidade (empresa, instituição pública, pessoa física, instituição não lucrativa etc.). Sobre esses textos, assinale a afirmativa correta."}],"opts":["As definições começam sempre por uma palavra de conteúdo geral que, nesses casos, é representada pela palavra “ciência”.","Os termos “teórica e prática” e “cálculo e registro” são construídos com palavras antônimas, ou seja, de significados opostos.","Os termos entre parênteses da segunda definição mostram todos os tipos de entidades referidas na definição.","As duas definições mostram o mesmo objetivo da ciência “contabilidade”."],"gabStatus":"Definitivo","exp":"As duas definições começam com a palavra geral \"ciência\" (as definições de dicionário começam por um termo genérico). \"Teórica e prática\" e \"cálculo e registro\" não são antônimos, os parênteses trazem exemplos e não todos os tipos, e os dois textos não mostram o mesmo objetivo."},{"id":"2025.2-2","ed":"2025.2","n":2,"mat":"Português","gab":"B","stem":[{"t":"p","x":"As frases listadas nas opções a seguir foram reescritas de forma a eliminar-se o “que”, com substituição do verbo por um substantivo semanticamente correlato. Assinale a frase em que a substituição foi feita de forma adequada."}],"opts":["Cabral, que descobriu o Brasil, merece homenagens. / Cabral, o criador do Brasil, merece homenagens.","Caminha, que escreveu a carta, registrou o fato. / Caminha, o redator da carta, registrou o fato.","As caravelas, que atravessaram o oceano, resistiram a tempestades. / As caravelas, navegadoras do oceano, resistiram a tempestades.","A descoberta do Brasil, que ocorreu em 1500, ficou na história. / A descoberta do Brasil, ocorrente em 1500, ficou na história."],"gabStatus":"Definitivo","exp":"\"Caminha, que escreveu a carta\" vira \"o redator da carta\": o verbo escrever tem o substantivo correlato redator. Nas outras, o substantivo muda o sentido (descobriu → criador) ou não é correlato (ocorrente não é substantivo)."},{"id":"2025.2-3","ed":"2025.2","n":3,"mat":"Mat. Financeira / Estatística","gab":"B","stem":[{"t":"p","x":"A empresa Gama S.A. avalia um projeto com investimento inicial de R$ 300.000,00, a ser realizado na data zero. Estimam-se entradas de caixa ao final de cada ano, conforme segue:"},{"t":"p","x":"• 1º ano: R$ 121.000,00;"},{"t":"p","x":"• 2º ano: R$ 121.000,00;"},{"t":"p","x":"• 3º ano em diante: R$ 146.410,00 por ano. Chama-se payback descontado ao tempo necessário para que a soma dos fluxos de caixa descontados iguale o investimento inicial."},{"t":"p","x":"Considerando-se uma taxa de desconto de 10% ao ano, o payback do projeto está entre"}],"opts":["1 ano e 2 anos.","2 anos e 3 anos.","3 anos e 4 anos.","4 anos e 5 anos."],"gabStatus":"Definitivo","exp":"Valores presentes a 10%: 121.000 ÷ 1,10 = 110.000; 121.000 ÷ 1,21 = 100.000 (acumulado 210.000 em 2 anos); 146.410 ÷ 1,331 = 110.000 no 3º ano (acumulado 320.000). O investimento de 300.000 é coberto entre 2 e 3 anos."},{"id":"2025.2-4","ed":"2025.2","n":4,"mat":"Mat. Financeira / Estatística","gab":"C","stem":[{"t":"p","x":"A empresa VGF S.A. tomou um empréstimo bancário de R$ 14.560,00 para financiar a compra de equipamentos. O contrato de empréstimo estabelece que o valor tomado deve ser liquidado por meio de uma série postecipada de 3 pagamentos mensais, iguais e sucessivos. O regime de capitalização adotado é o de juros compostos, à taxa de 20% ao mês. Considerando essas informações, é correto afirmar que o valor das prestações mensais será de"}],"opts":["R$ 4.853,33.","R$ 6.400,00.","R$ 6.912,00.","R$ 7.280,00."],"gabStatus":"Definitivo","exp":"Prestação = PV ÷ fator de série, com fator = (1 − 1,20^−3) ÷ 0,20 ≈ 2,1065. 14.560 ÷ 2,1065 ≈ 6.912."},{"id":"2025.2-5","ed":"2025.2","n":5,"mat":"Direito","gab":"C","stem":[{"t":"p","x":"Para o contador que atua no setor público ou na fiscalização de contratos administrativos, o conhecimento da Lei nº 14.133, de 1º de abril de 2021 (Lei de Licitações e Contratos), é fundamental para a avaliação da legalidade e conformidade dos gastos públicos. O Art. 5º dessa Lei elenca diversos princípios que devem guiar a atuação das Administrações Públicas diretas, autárquicas e fundacionais da União, dos Estados, do Distrito Federal e dos Municípios. Com base no texto legal, avalie os seguintes princípios:"},{"t":"p","x":"I. Impessoalidade;"},{"t":"p","x":"II. Transparência;"},{"t":"p","x":"III. Racionalidade econômica;"},{"t":"p","x":"IV. Probidade administrativa. Estão expressamente listados no Art. 5º da Lei os princípios"}],"opts":["I e IV, apenas.","II e III, apenas.","I, II e IV, apenas.","I, II, III e IV."],"gabStatus":"Definitivo","exp":"O art. 5º da Lei 14.133 lista impessoalidade, transparência e probidade administrativa, entre outros. \"Racionalidade econômica\" não está na lista (o termo é economicidade)."},{"id":"2025.2-6","ed":"2025.2","n":6,"mat":"Direito","gab":"D","stem":[{"t":"p","x":"Um estudante de contabilidade, ao iniciar seus estudos em Direito Tributário, depara-se com o conceito fundamental de tributo. Para uma compreensão precisa, ele busca a definição legal contida no Código Tributário Nacional (Lei nº 5.172/1966). De acordo com esse diploma legal, assinale a opção que define corretamente o tributo."}],"opts":["Tributo é toda prestação pecuniária voluntária, em moeda ou cujo valor nela se possa exprimir, que não constitua sanção de ato ilícito, instituída por meio de medida provisória e cobrada mediante atividade administrativa com alguma discricionariedade.","Tributo é toda sanção de ato ilícito, cobrada compulsoriamente em bens ou serviços, instituída em lei e aplicada com base em decisões discricionárias da administração pública.","Tributo é toda prestação pecuniária compulsória, em bens ou cujo valor nela se possa exprimir, que não constitua sanção de ato ilícito, instituída por qualquer ato normativo e cobrada mediante atividade administrativa parcialmente vinculada.","Tributo é toda prestação pecuniária compulsória, em moeda ou cujo valor nela se possa exprimir, que não constitua sanção de ato ilícito, instituída em lei e cobrada mediante atividade administrativa plenamente vinculada."],"gabStatus":"Definitivo","exp":"Tributo, no CTN, é prestação pecuniária compulsória, em moeda ou valor que nela se exprima, que não seja sanção de ato ilícito, instituída em lei e cobrada por atividade administrativa plenamente vinculada."},{"id":"2025.2-7","ed":"2025.2","n":7,"mat":"Direito","gab":"B","stem":[{"t":"p","x":"De acordo com a Lei Complementar nº 123, de 14 de dezembro de 2006, que institui o Estatuto Nacional da Microempresa e da Empresa de Pequeno Porte, os limites de receita bruta anual para fins de enquadramento são informações essenciais para a atuação do contador. Considerando o que a lei estabelece sobre a definição de Microempresa (ME) e Empresa de Pequeno Porte (EPP), assinale a afirmativa correta."}],"opts":["Uma Microempresa (ME) aufere, em cada ano-calendário, receita bruta igual ou inferior a R$ 120.000,00, e uma Empresa de Pequeno Porte (EPP) aufere receita bruta superior a R$ 120.000,00 e igual ou inferior a R$ 1.200.000,00.","Uma Microempresa (ME) aufere, em cada ano-calendário, receita bruta igual ou inferior a R$ 360.000,00, e uma Empresa de Pequeno Porte (EPP) aufere receita bruta superior a R$ 360.000,00 e igual ou inferior a R$ 4.800.000,00.","Uma Microempresa (ME) aufere, em cada ano-calendário, receita bruta igual ou inferior a R$ 81.000,00, e uma Empresa de Pequeno Porte (EPP) aufere receita bruta superior a R$ 81.000,00 e igual ou inferior a R$ 4.800.000,00.","Os limites de receita bruta para ME e EPP são fixados anualmente por decreto do Comitê Gestor do Simples Nacional."],"gabStatus":"Definitivo","exp":"Pela LC 123, microempresa tem receita bruta anual até R$ 360.000, e empresa de pequeno porte de R$ 360.000,01 até R$ 4.800.000."},{"id":"2025.2-8","ed":"2025.2","n":8,"mat":"Ética","gab":"D","stem":[{"t":"p","x":"Um escritório contábil quer expandir sua clientela com campanha de marketing, mas tem dúvidas sobre publicidade e preços conforme o Código de Ética. Com base na NBC PG 01 – CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR, uma prática de divulgação e precificação eticamente correta é"}],"opts":["prometer redução garantida de tributos sem embasamento técnico.","comparar preços e criticar concorrentes.","divulgar clientes e faturamento sem autorização.","expor conhecimento técnico com artigos e estudos de caso."],"gabStatus":"Definitivo","exp":"Divulgar conhecimento técnico por artigos e estudos de caso é publicidade legítima. É vedado prometer resultado sem embasamento, criticar concorrentes por comparação de preços e divulgar clientes ou faturamento sem autorização."},{"id":"2025.2-9","ed":"2025.2","n":9,"mat":"Ética","gab":"B","stem":[{"t":"p","x":"Durante uma reunião com a diretoria de uma empresa cliente, o contador responsável apresentou os impactos financeiros de um novo contrato. Embora os dados estivessem tecnicamente corretos, os gestores demonstraram dúvidas e certa dificuldade em compreender a apresentação. Nesse cenário, a habilidade profissional que contribuiria para que o contador fosse mais eficaz, de acordo com a NBC PG 100 (R1) - CUMPRIMENTO DO CÓDIGO, DOS PRINCÍPIOS FUNDAMENTAIS E DA ESTRUTURA CONCEITUAL, seria"}],"opts":["realizar escuta ativa.","demonstrar clareza na exposição de dados.","revisar a legislação aplicável.","ignorar as dúvidas do cliente."],"gabStatus":"Definitivo","exp":"Os dados estavam corretos, mas os gestores não entenderam. A habilidade que falta é comunicar com clareza, adaptando a exposição ao público."},{"id":"2025.2-10","ed":"2025.2","n":10,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"De acordo com a NBC TG ESTRUTURA CONCEITUAL - ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, as características qualitativas fundamentais são relevância e representação fidedigna, sendo que, para ser representação fidedigna, a representação deve ser completa, neutra e isenta de erros. Uma informação neutra pode"}],"opts":["ser parcial.","ser prudente.","possuir inclinações.","ser tendenciosa na seleção de informações financeiras."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"A informação neutra não pode ser parcial, tendenciosa nem ter inclinação. A neutralidade é apoiada pelo exercício da prudência, então uma informação neutra pode, sim, ser prudente."},{"id":"2025.2-11","ed":"2025.2","n":11,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"De acordo com a NBC TG ESTRUTURA CONCEITUAL - ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, para ajudar os usuários das demonstrações contábeis a identificar e avaliar mudanças e tendências, as demonstrações contábeis"}],"opts":["são elaboradas com base na forma jurídica, em detrimento da essência das transações.","restringem a utilização de estimativas a casos em que poderá haver perdas financeiras do usuário.","incluem, apenas, informações que podem ser compreendidas, também, por usuários com pouco conhecimento das atividades comerciais e econômicas, sem auxílio de consultores.","fornecem informações comparativas de, pelo menos, um período de relatório anterior."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Para o usuário identificar mudanças e tendências, as demonstrações trazem informações comparativas de pelo menos um período anterior. Elas priorizam a essência sobre a forma e não eliminam estimativas."},{"id":"2025.2-12","ed":"2025.2","n":12,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Uma sociedade empresária presta serviços de perícia a terceiros. Em junho de 2024, aconteceram os seguintes fatos:"},{"t":"p","x":"• Compra de material de escritório para pagamento em 60 dias: R$ 5.000,00;"},{"t":"p","x":"• Recebimento antecipado pelos serviços que serão prestados no segundo semestre: R$ 10.000,00;"},{"t":"p","x":"• Reconhecimento do salário de seus empregados, para pagamento em 5 de julho: R$ 12.000,00. Em junho de 2024, o passivo da sociedade empresária aumentou em"}],"opts":["R$ 15.000,00.","R$ 17.000,00.","R$ 22.000,00.","R$ 27.000,00."],"gabStatus":"Definitivo","ass":"Operações básicas (competência, folha, lançamentos)","exp":"Passivo aumentou em: fornecedor de material de escritório 5.000 + recebimento antecipado de serviços 10.000 + salários a pagar 12.000 = 27.000."},{"id":"2025.2-13","ed":"2025.2","n":13,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"De acordo com a NBC TG ESTRUTURA CONCEITUAL - ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, com relação às implicações das características qualitativas para a escolha da base de mensuração, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa."},{"t":"p","x":"( ) Utilizar consistentemente as mesmas bases de mensuração para os mesmos itens, seja de período a período, na entidade que reporta ou em um único período para diferentes entidades, prejudica a comparabilidade das demonstrações."},{"t":"p","x":"( ) A mudança na base de mensuração pode tornar as demonstrações contábeis menos compreensíveis. Contudo, a mudança pode ser justificada se outros fatores compensarem a redução na compreensibilidade, por exemplo, se a mudança resulta em informações mais relevantes."},{"t":"p","x":"( ) A verificação é melhorada utilizando-se bases de mensuração que resultam em avaliações que podem ser independentemente corroboradas diretamente, por exemplo, observando os preços, ou indiretamente, por exemplo, verificando dados de entrada de modelo. As afirmativas são, respectivamente,"}],"opts":["V – V – V.","V – V – F.","V – F – V.","F – V – V."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Falso: usar as mesmas bases de mensuração de forma consistente melhora a comparabilidade, não a prejudica. Verdadeiro: trocar a base pode reduzir a compreensibilidade, mas se justifica se gerar informação mais relevante. Verdadeiro: bases que permitem corroboração independente, como preços observáveis, melhoram a verificabilidade. Resposta: F, V, V."},{"id":"2025.2-14","ed":"2025.2","n":14,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"A NBC TG 28 (R4) - PROPRIEDADES PARA INVESTIMENTO trata de definição, classificação e mensuração de propriedades para investimento. Sobre esse item, analise as seguintes afirmativas:"},{"t":"p","x":"I. Propriedade para Investimento é classificada dentro do subgrupo investimento no ativo circulante."},{"t":"p","x":"II. Propriedade para investimento é um terreno, edifício ou veículo mantido pela entidade para auferir aluguel ou valorização do capital."},{"t":"p","x":"III. Propriedade para investimento no momento da aquisição deve ser mensurada pelo seu custo. Está correto o que se afirma em"}],"opts":["II e III, apenas.","III, apenas.","I, II e III.","II, apenas."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Só a III está certa: na aquisição, a propriedade para investimento é medida pelo custo. A I erra ao colocá-la no ativo circulante, pois fica no não circulante (investimentos). A II erra ao incluir veículo: a norma fala de terreno ou edifício mantido para aluguel ou valorização."},{"id":"2025.2-15","ed":"2025.2","n":15,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Um ativo individual ou um grupo de ativos mantido para venda são ativos a ser alienados, por venda ou de outra forma, em conjunto como um grupo de ativos em uma só transação, e passivos diretamente associados a esses ativos que serão transferidos na transação. De acordo com a NBC TG 31 (R4) - ATIVO NÃO CIRCULANTE MANTIDO PARA VENDA E OPERAÇÃO DESCONTINUADA, a depreciação do ativo ou grupo de ativos mantidos para venda deve"}],"opts":["ser parcial, pois o ativo ou grupo de ativos ainda está operando.","ser mantida até a venda ser concretizada.","ser interrompida quando o ativo ou grupo de ativos for reclassificado como mantido para venda.","continuar como estava antes da reclassificação."],"gabStatus":"Definitivo","ass":"Outras normas (AVP, arrendamento, instr. financeiros, tributos diferidos, câmbio, segmentos, mantido p/ venda)","exp":"Quando o ativo é classificado como mantido para venda, a depreciação é interrompida, pois o valor será recuperado pela venda e não pelo uso."},{"id":"2025.2-16","ed":"2025.2","n":16,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"De acordo com a NBC TG 01 (R4) - REDUÇÃO AO VALOR RECUPERÁVEL DE ATIVOS, o valor em uso é o valor presente de fluxos de caixa futuros esperados que devem advir de um ativo ou de unidade geradora de caixa. Avalie se os seguintes elementos devem ser refletidos no cálculo do valor em uso do ativo:"},{"t":"p","x":"I. O valor pago na aquisição do ativo."},{"t":"p","x":"II. As expectativas acerca de possíveis variações no montante ou no período de ocorrência desses fluxos de caixa futuros."},{"t":"p","x":"III. As estimativas dos fluxos de caixa futuros que a entidade espera obter com esse ativo."},{"t":"p","x":"IV. O valor do dinheiro no tempo, representado pela atual taxa de juros livre de risco. Estão corretos os elementos"}],"opts":["I, II e III, apenas.","I e II, apenas.","III e IV, apenas.","II, III e IV, apenas."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"O valor em uso considera os fluxos de caixa futuros esperados, as variações esperadas nesses fluxos, e o valor do dinheiro no tempo (taxa livre de risco). O valor pago na aquisição não entra. São corretos II, III e IV."},{"id":"2025.2-17","ed":"2025.2","n":17,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"O ágio por expectativa de rentabilidade futura (goodwill) reconhecido em uma combinação de negócios é um ativo que representa benefícios econômicos futuros advindos de outros ativos adquiridos na combinação de negócios que não são identificados individualmente e não são reconhecidos separadamente. De acordo com a NBC TG 04 (R4) - ATIVO INTANGÍVEL e com a NBC TG 15 (R4) - COMBINAÇÃO DE NEGÓCIOS, a empresa adquirente deve reconhecer, na data da aquisição, separadamente do ágio derivado da expectativa de rentabilidade futura (goodwill) apurado em uma combinação de negócios, um ativo intangível da adquirida, independentemente de o ativo ter sido reconhecido pela adquirida antes da aquisição da empresa. A perda por desvalorização reconhecida para o ágio por expectativa de rentabilidade futura (goodwill) não deve ser revertida em período subsequente, pois"}],"opts":["não pode ser amortizada.","no plano de contas não há rubrica apropriada.","gera fluxos de caixa, independentemente de outros ativos ou grupos de ativos.","é equivalente ao goodwill gerado internamente."],"gabStatus":"Definitivo","ass":"Investimentos, equivalência, consolidação, combinação","exp":"A perda por impairment do ágio (goodwill) não se reverte porque um aumento posterior no valor recuperável seria, na prática, goodwill gerado internamente, que não pode ser reconhecido."},{"id":"2025.2-18","ed":"2025.2","n":18,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"A Demonstração do Valor Adicionado (DVA) busca evidenciar o valor e a distribuição da riqueza econômica gerada pelas atividades da sociedade empresária, incluindo também o valor adicionado recebido em transferência. A riqueza gerada é evidenciada na distribuição entre o capital (Remuneração de capital próprio e de terceiros), trabalho (Pessoal) e governo (Impostos, taxas e contribuições). Relacione cada item a seguir ao respectivo componente da distribuição da riqueza, conforme disposto na NBC TG 09 (R1) - DEMONSTRAÇÃO DO VALOR ADICIONADO."},{"t":"p","x":"( ) Fundo de Garantia por Tempo de Serviços (FGTS)"},{"t":"p","x":"( ) Aluguéis pagos"},{"t":"p","x":"( ) Dividendos distribuídos"},{"t":"p","x":"( ) Contribuição Social sobre o Lucro Líquido (CSLL)"},{"t":"p","x":"1. Pessoal"},{"t":"p","x":"2. Impostos, taxas e contribuições"},{"t":"p","x":"3. Remuneração de capital de terceiros"},{"t":"p","x":"4. Remuneração de capital próprio A relação correta, na ordem apresentada, é"}],"opts":["1 – 2 – 3 – 4.","2 – 3 – 4 – 1.","2 – 4 – 3 – 1.","1 – 3 – 4 – 2."],"gabStatus":"Definitivo","ass":"DVA","exp":"FGTS é Pessoal (1). Aluguéis pagos são remuneração de capital de terceiros (3). Dividendos distribuídos são remuneração de capital próprio (4). CSLL é Impostos, taxas e contribuições (2). Ordem: 1, 3, 4, 2."},{"id":"2025.2-19","ed":"2025.2","n":19,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"A empresa Delta S.A. adquiriu uma máquina por R$ 350.000,00 em 01/01/2020. No momento da aquisição, a administração de Delta S.A. estimou a vida útil desse ativo em 10 anos e um valor residual de R$ 50.000,00. A máquina estava disponível para uso em 01/01/2020 e a empresa adotou o método de depreciação linear. Em 31/12/2023, a empresa procedeu a uma revisão das suas estimativas, conforme previsto no NBC TG 27 (R4) - ATIVO IMOBILIZADO, e constatou as seguintes informações:"},{"t":"p","x":"• Vida útil remanescente: 9 anos;"},{"t":"p","x":"• Valor Residual: R$ 50.000,00."},{"t":"p","x":"Com base exclusivamente nas informações apresentadas, o valor da depreciação anual dessa máquina a partir de 01/01/2024 será de"}],"opts":["R$ 35.000,00.","R$ 30.000,00.","R$ 20.000,00.","R$ 15.000,00."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Depreciação inicial: (350.000 − 50.000) ÷ 10 = 30.000 por ano, e em 4 anos são 120.000. Valor contábil: 230.000. Base depreciável: 230.000 − 50.000 = 180.000. Dividindo pelos 9 anos restantes: 20.000 por ano."},{"id":"2025.2-20","ed":"2025.2","n":20,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"A NBC TG ESTRUTURA CONCEITUAL estabelece os conceitos dos elementos das demonstrações contábeis. Com base nessa norma, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa."},{"t":"p","x":"( ) Ativo é um recurso econômico presente de propriedade da entidade como resultado de eventos passados."},{"t":"p","x":"( ) Passivo é uma obrigação futura da entidade de transferir um recurso econômico como resultado de eventos passados."},{"t":"p","x":"( ) Receitas são aumentos nos ativos, ou reduções nos passivos, que resultam em aumento no patrimônio líquido, exceto aqueles referentes a contribuições de detentores de direitos sobre o patrimônio."},{"t":"p","x":"( ) Despesas são reduções nos ativos, ou aumentos nos passivos, que resultam em reduções no patrimônio líquido, exceto aqueles referentes a distribuições aos detentores de direitos sobre o patrimônio. As afirmativas são, respectivamente,"}],"opts":["F – F – V – V.","F – V – F – V.","V – F – V – F.","V – V – F – F."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Falso: ativo é um recurso econômico presente controlado pela entidade, e não precisa ser de propriedade dela. Falso: passivo é uma obrigação presente, e não futura. Verdadeiras: as definições de receita e de despesa, que excluem o que vem de ou vai para os sócios. Resposta: F, F, V, V."},{"id":"2025.2-21","ed":"2025.2","n":21,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"A empresa Alfa S.A. adquiriu, por R$ 1.300.000,00, no dia 01/01/2025, 80% do capital da empresa Beta S.A., adquirindo nessa data o seu controle. Na data da aquisição:"},{"t":"p","x":"1. o valor contábil do patrimônio líquido da empresa Beta S.A. era de R$ 1.000.000,00;"},{"t":"p","x":"2. o valor líquido dos ativos identificáveis e dos passivos da empresa Beta S.A. correspondentes a 100% de seu capital social, mensurados a valor justo, era de R$ 1.500.000,00."},{"t":"p","x":"Com base exclusivamente nos dados apresentados e na NBC TG 15 (R4) – COMBINAÇÃO DE NEGÓCIOS, avalie as afirmativas abaixo, com relação à contabilização ocorrida na empresa Alfa S.A.:"},{"t":"p","x":"I. Foi registrado um goodwill no valor de R$ 100.000,00."},{"t":"p","x":"II. Foi registrada uma compra vantajosa no valor de R$ 200.000,00."},{"t":"p","x":"III. Foi registrado um ágio ou mais-valia dos ativos no valor de R$ 400.000,00."},{"t":"p","x":"IV. Foi registrado um ágio ou mais-valia dos ativos no valor de R$ 500.000,00. Estão corretas as afirmativas"}],"opts":["I e III, apenas.","I e IV, apenas.","II e III, apenas.","II e IV, apenas."],"gabStatus":"Definitivo","ass":"Investimentos, equivalência, consolidação, combinação","exp":"Goodwill: pagou 1.300.000 e a parte da Alfa no valor justo líquido é 80% × 1.500.000 = 1.200.000, então goodwill de 100.000 (I). Mais-valia dos ativos (valor justo menos valor contábil): 1.500.000 − 1.000.000 = 500.000 para 100%, e 80% = 400.000 (III). Não houve compra vantajosa."},{"id":"2025.2-22","ed":"2025.2","n":22,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Influência significativa é o poder de participar das decisões sobre políticas financeiras e operacionais de uma investida, mas sem que haja o controle individual ou o conjunto dessas políticas. A NBC TG 18 (R4) - INVESTIMENTO EM COLIGADA determina que a existência de influência significativa por investidor geralmente é evidenciada por uma ou mais das seguintes formas, à exceção de uma. Assinale-a."}],"opts":["Indicação de funcionários para a investida.","Operações materiais entre o investidor e a investida.","Intercâmbio de diretores ou gerentes.","Fornecimento de informação técnica essencial."],"gabStatus":"Definitivo","ass":"Investimentos, equivalência, consolidação, combinação","exp":"Evidências de influência significativa: representação no conselho ou diretoria, participação nas decisões, operações materiais, intercâmbio de diretores ou gerentes, fornecimento de informação técnica essencial. Só indicar funcionários para a investida não é uma delas."},{"id":"2025.2-23","ed":"2025.2","n":23,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"A empresa ABCDE possui os seguintes registros referentes às movimentações em determinado período:"},{"t":"p","x":"• Compras: R$ 5.000,00."},{"t":"p","x":"• Estoque inicial: R$ 3.000,00."},{"t":"p","x":"• Estoque final: R$ 2.000,00."},{"t":"p","x":"• Vendas: R$ 30.000,00."},{"t":"p","x":"• Despesas gerais: R$ 1.000,00."},{"t":"p","x":"• Devolução de compras: R$ 500,00."},{"t":"p","x":"Com base nesses registros, é possível afirmar que a empresa obteve o Custo das Mercadorias Vendidas (CMV) de"}],"opts":["R$ 6.000,00.","R$ 7.500,00.","R$ 8.000,00.","R$ 5.500,00."],"gabStatus":"Definitivo","ass":"Estoques (custo, PEPS, VRL)","exp":"CMV = estoque inicial + compras líquidas − estoque final. As compras líquidas são 5.000 − 500 de devolução = 4.500. CMV = 3.000 + 4.500 − 2.000 = 5.500. Vendas e despesas gerais não entram."},{"id":"2025.2-24","ed":"2025.2","n":24,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"A empresa S.A. possuía, em 31/12/2024, obrigações presentes como resultados de eventos passados cuja saída de recursos envolvendo benefícios futuros na liquidação esteve sujeita à análise, com a classificação disposta na tabela a seguir:"},{"t":"p","x":"Garantia de venda: R$ 5.000,00; probabilidade de saída de recurso: provável."},{"t":"p","x":"Terreno contaminado e obrigação não formalizada: R$ 15.000,00; provável."},{"t":"p","x":"Processo Trabalhista I: R$ 10.000,00; remota."},{"t":"p","x":"Processo Trabalhista II: R$ 20.000,00; possível."},{"t":"p","x":"Processo Fiscal: há impossibilidade de estimar confiavelmente no momento; possível."},{"t":"p","x":"Com base nos dados, seguindo a NBC TG 25 (R2) - PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES, o montante a ser reconhecido como provisões no Balanço Patrimonial da empresa deve ser de"}],"opts":["R$ 20.000,00.","R$ 40.000,00.","R$ 30.000,00.","R$ 50.000,00."],"gabStatus":"Definitivo","ass":"Provisões e contingências (TG 25)","exp":"Provisão exige obrigação presente, saída provável e estimativa confiável. Entram: garantia de venda 5.000 e terreno contaminado 15.000 = 20.000. Processo remoto não é divulgado, e os dois classificados como possível são só passivos contingentes."},{"id":"2025.2-25","ed":"2025.2","n":25,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"A empresa Serviços S.A. encerrou seu exercício em 31/12/2024, deixando de efetuar o lançamento referente à receita de serviços prestados a um cliente em dezembro e ainda não recebidos, deixando de obedecer, assim, ao regime de competência. Como consequência do erro cometido pela ausência desse registro,"}],"opts":["o saldo da conta clientes ficou superavaliado.","o saldo do disponível ficou subavaliado.","a receita do exercício ficou superavaliada.","o lucro do exercício ficou subavaliado."],"gabStatus":"Definitivo","ass":"Operações básicas (competência, folha, lançamentos)","exp":"Faltou registrar a receita de dezembro: clientes e receita ficam subavaliados, e por isso o lucro também. O caixa não é afetado, porque a receita não foi recebida."},{"id":"2025.2-26","ed":"2025.2","n":26,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"A Cia. Gold vende pulseiras. Em 31/12/2024, não havia estoque inicial de pulseiras. No primeiro trimestre de 2025 aconteceram os seguintes fatos:"},{"t":"p","x":"• 05/01: compra de 20 pulseiras por R$ 10.000,00;"},{"t":"p","x":"• 25/01: venda de 10 pulseiras por R$ 1.200,00 cada;"},{"t":"p","x":"• 05/02: compra de 12 pulseiras por R$ 7.200,00;"},{"t":"p","x":"• 20/02: venda de 11 pulseiras por R$ 1.200,00 cada;"},{"t":"p","x":"• 10/03: compra de 8 pulseiras por R$ 5.200,00;"},{"t":"p","x":"• 27/03: venda de 5 pulseiras por R$ 1.400,00 cada."},{"t":"p","x":"Assinale a opção que indica o valor aproximado do estoque final de pulseiras da Cia. Gold em 31/03/2025, considerando que a empresa utiliza o método do Custo Médio Ponderado Móvel em base diária."}],"opts":["R$ 7.840,00.","R$ 8.326,00.","R$ 9.100,00.","R$ 10.905,00."],"gabStatus":"Definitivo","ass":"Estoques (custo, PEPS, VRL)","exp":"Custo médio móvel: após cada operação recalcula-se o custo unitário. Compra de 20 por 10.000 (500 cada); vende 10 (saldo 10 un, 5.000). Compra de 12 por 7.200: 22 un, 12.200 (554,55 cada); vende 11 (saldo 11 un, 6.100). Compra de 8 por 5.200: 19 un, 11.300 (594,74 cada); vende 5 (2.973,68). Saldo final: 14 un, cerca de 8.326."},{"id":"2025.2-27","ed":"2025.2","n":27,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Uma loja de cosméticos começou a funcionar em 01/07/2024. No segundo semestre de 2024, aconteceram os seguintes fatos:"},{"t":"p","x":"• Integralização de capital social em dinheiro: R$ 300.000,00."},{"t":"p","x":"• Compra à vista de móveis e utensílios para a loja: R$ 40.000,00."},{"t":"p","x":"• Compra à vista de estoque para revenda: R$ 80.000,00."},{"t":"p","x":"• Pagamento do aluguel do semestre: R$ 30.000,00."},{"t":"p","x":"• Pagamento antecipado do aluguel do primeiro trimestre de 2025: R$ 18.000,00."},{"t":"p","x":"• Venda de todo o estoque por R$ 400.000,00, sendo que metade do valor já foi recebido e o restante deverá ser recebido no primeiro semestre de 2025. A loja estima inadimplência de 5%."},{"t":"p","x":"• Reconhecimento e pagamento de despesas diversas: R$ 12.000,00."},{"t":"p","x":"• Reconhecimento da despesa de depreciação: R$ 4.000,00. O fluxo de caixa gerado pela atividade operacional em 2024, de acordo com as diretrizes da NBC TG 03 (R3) – DEMONSTRAÇÃO DOS FLUXOS DE CAIXA foi de"}],"opts":["R$ 20.000,00.","R$ 50.000,00.","R$ 60.000,00.","R$ 360.000,00."],"gabStatus":"Definitivo","ass":"Operações básicas (competência, folha, lançamentos)","exp":"Caixa operacional: recebimento das vendas 200.000 − compra de estoque 80.000 − aluguel do semestre 30.000 − aluguel antecipado 18.000 − despesas 12.000 = 60.000. Capital é financiamento, móveis é investimento, a parte a prazo e a depreciação não são caixa."},{"id":"2025.2-28","ed":"2025.2","n":28,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Em 01/12/2024, uma sociedade empresária apresentava, em seu Balanço Patrimonial, como ativo imobilizado, um terreno, cujo valor contábil era de R$ 80.000,00. Em 31/12/2024, a sociedade empresária realizou um teste de recuperabilidade em seus ativos imobilizados. Foi constatado que o valor em uso do terreno era de R$ 75.000,00. Para que não haja reconhecimento de perda de recuperabilidade do terreno, o valor justo líquido de despesa de venda deve ser"}],"opts":["menor do que R$ 75.000,00.","maior do que R$ 79.999,99.","entre R$ 72.000,00 e R$ 74.999,99.","entre R$ 75.000,00 e R$ 79.999,99."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Não há perda quando o valor recuperável (o maior entre o valor em uso e o valor justo líquido) é pelo menos igual ao valor contábil de 80.000. Como o valor em uso é só 75.000, o valor justo líquido precisa ser de 80.000 ou mais, ou seja, maior que 79.999,99."},{"id":"2025.2-29","ed":"2025.2","n":29,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Em junho de 2025, uma companhia aérea reconheceu as seguintes receitas:"},{"t":"p","x":"• com a marcação de assentos: R$ 150.000,00;"},{"t":"p","x":"• com equivalência patrimonial: R$ 200.000,00;"},{"t":"p","x":"• com a venda de passagens: R$ 900.000,00."},{"t":"p","x":"Nesse mês, a companhia aérea reconheceu como Receita, na primeira linha da Demonstração do Resultado do Exercício, o seguinte montante:"}],"opts":["R$ 900.000,00.","R$ 1.050.000,00.","R$ 1.100.000,00.","R$ 1.250.000,00."],"gabStatus":"Definitivo","ass":"DRE, receitas (TG 47), DRA","exp":"A primeira linha da DRE é a receita de contratos com clientes: marcação de assentos 150.000 + venda de passagens 900.000 = 1.050.000. A equivalência patrimonial é resultado de participações e vem mais abaixo."},{"id":"2025.2-30","ed":"2025.2","n":30,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Em 01/01/2025, uma livraria tinha em estoque 20 livros “Estatística Simples”. Cada livro tinha sido adquirido por R$ 80,00 e era vendido por R$ 140,00. No primeiro trimestre desse ano, a movimentação do livro foi a seguinte:"},{"t":"p","x":"• 28/01: venda de 10 livros por R$ 140,00."},{"t":"p","x":"• 05/02: compra de 15 livros por R$ 90,00."},{"t":"p","x":"• 25/02: venda de 18 livros por R$ 150,00."},{"t":"p","x":"• 05/03: compra de 20 livros por R$ 95,00."},{"t":"p","x":"• 28/03: venda de 25 livros por R$ 150,00. O custo das mercadorias vendidas no primeiro trimestre de 2025, considerando que a livraria utiliza o método PEPS para avaliação de estoque, foi de"}],"opts":["R$ 3.860,00.","R$ 4.220,00.","R$ 4.660,00.","R$ 5.035,00."],"gabStatus":"Definitivo","ass":"Estoques (custo, PEPS, VRL)","exp":"PEPS: saem primeiro os mais antigos. 28/01: 10 × 80 = 800. 25/02: 10 × 80 + 8 × 90 = 1.520. 28/03: 7 × 90 + 18 × 95 = 630 + 1.710 = 2.340. CMV total: 800 + 1.520 + 2.340 = 4.660."},{"id":"2025.2-31","ed":"2025.2","n":31,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"A compreensão dos conceitos e métodos relacionados à Demonstração do Resultado do Exercício (DRE) e à Demonstração do Resultado Abrangente (DRA) é fundamental para a adequada análise das variações do patrimônio líquido e para a tomada de decisões baseadas nos resultados operacionais. A respeito do tema, analise as seguintes afirmativas:"},{"t":"p","x":"I. A recompra de ações de emissão da própria entidade para manutenção em tesouraria afeta o resultado abrangente por representar uma redução no patrimônio líquido."},{"t":"p","x":"II. O resultado abrangente compreende todos os componentes da demonstração do resultado e dos outros resultados abrangentes."},{"t":"p","x":"III. Pelo método da natureza da despesa, as despesas são classificadas conforme sua função, como administrativas, comerciais e de produção, facilitando a análise do custo dos produtos vendidos."},{"t":"p","x":"IV. A informação sobre a natureza das despesas é útil para prever os fluxos de caixa futuros e requer divulgação adicional quando a classificação adotada na DRE for baseada no método da função das despesas."},{"t":"p","x":"V. A entidade deve apresentar rubricas ou itens de receitas ou despesas como itens extraordinários, quer na demonstração do resultado abrangente, quer na demonstração do resultado do período, quer nas notas explicativas. De acordo com a NBC TG 26 (R5) - APRESENTAÇÃO DAS DEMONSTRAÇÕES CONTÁBEIS, estão corretas as afirmativas"}],"opts":["II e IV, apenas.","I, III e V, apenas.","II, III e IV, apenas.","I, II, IV e V, apenas."],"gabStatus":"Definitivo","ass":"DRE, receitas (TG 47), DRA","exp":"Certas: II (resultado abrangente reúne a DRE e os outros resultados abrangentes) e IV (a informação sobre natureza das despesas exige divulgação adicional quando se usa o método da função). Erradas: I (recompra de ações reduz o PL, mas não passa pelo resultado abrangente), III (descreve o método da função, não o da natureza) e V (itens extraordinários são vedados)."},{"id":"2025.2-32","ed":"2025.2","n":32,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"A empresa S.A. é especializada na construção de galpões industriais sob encomenda de acordo com especificações exclusivas de cada cliente. Os contratos firmados pela empresa preveem que a construção ocorra no terreno do cliente, com pagamentos mensais vinculados ao andamento da obra, que pode durar de 6 a 10 meses. Considerando as informações apresentadas e os preceitos da NBC TG 47 – RECEITA DE CONTRATO COM CLIENTE, o reconhecimento da receita deve ocorrer"}],"opts":["somente após a emissão do certificado de aceitação técnica da obra pelo cliente.","no momento da conclusão da obra, quando todos os riscos e benefícios são transferidos.","no início do contrato, pois o pagamento mensal caracteriza o reconhecimento da receita.","ao longo do tempo, pois o desempenho da entidade cria ou melhora ativo que o cliente controla à medida que é construído."],"gabStatus":"Definitivo","ass":"DRE, receitas (TG 47), DRA","exp":"Em obra sob encomenda no terreno do cliente, o ativo é construído sob controle do cliente e há pagamento vinculado ao andamento. A receita é reconhecida ao longo do tempo, acompanhando o progresso da obra."},{"id":"2025.2-33","ed":"2025.2","n":33,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Uma empresa S.A. celebrou um contrato no valor de R$ 30.000,00 para utilizar um equipamento por um período de 10 meses, cujo ativo subjacente do contrato foi considerado de baixo valor pela empresa. A administração da empresa S.A. decidiu aplicar a isenção de reconhecimento autorizada pelo item 5 da NBC TG 06 (R3). Considerando-se as informações apresentadas e os preceitos da NBC TG 06 (R3) – ARRENDAMENTOS, o tratamento contábil para esse contrato é"}],"opts":["registrar o valor total do contrato antecipadamente como despesa no início do contrato.","capitalizar o valor do contrato como ativo imobilizado, amortizando ao longo do contrato.","reconhecer os pagamentos do arrendamento como despesa no resultado, de forma linear ou sistemática, ao longo do prazo do contrato.","reconhecer um ativo de direito de uso e um passivo de arrendamento, ambos, ao valor presente estipulado no contrato."],"gabStatus":"Definitivo","ass":"Outras normas (AVP, arrendamento, instr. financeiros, tributos diferidos, câmbio, segmentos, mantido p/ venda)","exp":"Pela NBC TG 06, contratos de curto prazo ou de ativo de baixo valor podem usar a isenção: os pagamentos viram despesa, de forma linear ou outra base sistemática, ao longo do prazo do contrato. Não se reconhece ativo de direito de uso nem passivo de arrendamento."},{"id":"2025.2-34","ed":"2025.2","n":34,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Uma empresa que atua na produção de medicamentos há 10 anos decidiu trocar dois de seus equipamentos (classificados como ativo imobilizado) mais relevantes por outros com tecnologia mais atualizada com o objetivo de redução nos seus custos de produção. As informações sobre os equipamentos retirados de operação são relatadas a seguir:"},{"t":"p","x":"Valor Contábil Líquido = R$ 500.000,00 Equipamento 1 Valor Justo Líquido = R$ 750.000,00"},{"t":"p","x":"Valor Contábil Líquido = R$ 1.500.000,00 Equipamento 2 Valor Justo Líquido = R$ 1.250.000,00"},{"t":"p","x":"Sabendo que os novos equipamentos adquiridos já estão em uso, um plano de venda desses ativos (Equipamentos 1 e 2) foi submetido e aprovado pelo Conselho de Administração, que considerou a venda altamente provável de ser concluída nos próximos 12 meses. Logo, segundo a NBC TG 31 (R3) – ATIVO NÃO CIRCULANTE MANTIDO PARA VENDA E OPERAÇÃO DESCONTINUADA, a mensuração subsequente dos equipamentos a ser adotada pela empresa a partir da decisão do Conselho de Administração é:"}],"opts":["Equipamento 1 por R$ 500.000,00 e Equipamento 2 por R$ 1.250.000,00.","Equipamento 1 por R$ 500.000,00 e Equipamento 2 por R$ 1.500.000,00.","Equipamento 1 por R$ 750.000,00 e Equipamento 2 por R$ 1.500.000,00.","Equipamento 1 por R$ 750.000,00 e Equipamento 2 por R$ 1.250.000,00."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Ativo mantido para venda é medido pelo menor valor entre o valor contábil e o valor justo líquido de despesas de venda. Equipamento 1: menor entre 500.000 e 750.000, então 500.000. Equipamento 2: menor entre 1.500.000 e 1.250.000, então 1.250.000."},{"id":"2025.2-35","ed":"2025.2","n":35,"mat":"Custos","gab":"A","stem":[{"t":"p","x":"A Contabilidade de Custos possui uma linguagem própria que permite ao profissional da contabilidade constituir o processo de análise, apuração e divulgação das informações relacionadas a custos, à medida que se mostrarem pertinentes de acordo com a necessidade informacional dos inúmeros stakeholders. Tomando por base esse processo de terminologias na contabilidade de custos, assinale a afirmativa correta."}],"opts":["Os gastos representam a compra de um produto ou serviço que tem por capacidade gerar o dispêndio de recursos financeiros por parte da empresa, a exemplo da aquisição de um imobilizado.","Os custos representam um sacrifício monetário referente ao pagamento dos gastos, a exemplo do consumo de matéria-prima.","As despesas podem ser entendidas como os recursos utilizados na constituição de bens ou serviços em uma indústria, como exemplo tem-se as despesas com vendas e comissões.","As perdas são gastos anormais e involuntários do processo produtivo e já estão incluídas no custo do produto."],"gabStatus":"Definitivo","exp":"Gasto é o sacrifício financeiro na aquisição de um bem ou serviço, como comprar um imobilizado (A). Custos são gastos na produção (B erra no exemplo e no conceito), despesas são gastos para obter receitas (C), e perdas são gastos anormais e involuntários que não entram no custo do produto, vão direto ao resultado (D)."},{"id":"2025.2-36","ed":"2025.2","n":36,"mat":"Custos","gab":"C","stem":[{"t":"p","x":"Uma empresa realizou a contagem de seus estoques, acabando por superavaliar o estoque inicial, mantendo o controle de compras e estoque final nos valores corretos. Em consequência da superavaliação do estoque inicial é correto afirmar que"}],"opts":["a receita de vendas do período corrente foi subavaliada.","o lucro acumulado do período corrente foi superavaliado.","o custo dos produtos vendidos do período corrente foi superavaliado.","o estoque final foi subavaliado."],"gabStatus":"Definitivo","exp":"CPV = estoque inicial + compras − estoque final. Se o estoque inicial foi superavaliado e o resto está certo, o CPV fica superavaliado, e o lucro fica subavaliado."},{"id":"2025.2-37","ed":"2025.2","n":37,"mat":"Custos","gab":"D","stem":[{"t":"p","x":"A Fazenda Laticínios Campo Verde Ltda. produz e comercializa queijos artesanais tipo minas frescal. No mês de julho de 2025, quando a empresa não possuía estoque inicial, foram produzidas 12.000 unidades de queijo. Nesse mesmo mês, vendeu 9.000 unidades a um preço unitário de R$ 25,00. Os custos variáveis totais somaram R$ 135.000,00 e os custos fixos totalizaram R$ 42.000,00. As despesas fixas totalizaram R$ 25.000,00, e as despesas variáveis com comissão aos vendedores corresponderam a 5% do valor de cada unidade vendida. Considerando os dados fornecidos e desconsiderando efeitos tributários, os lucros líquidos com as vendas em julho de 2025, utilizando, respectivamente, os métodos de custeio por absorção e custeio variável, foram de"}],"opts":["R$ 45.470,00 e R$ 11.750,00.","R$ 56.000,00 e R$ 56.000,00.","R$ 45.470,00 e R$ 112.500,00.","R$ 56.000,00 e R$ 45.500,00."],"gabStatus":"Definitivo","exp":"Absorção: receita 225.000. Custo unitário = (135.000 + 42.000) ÷ 12.000 = 14,75, e o CPV de 9.000 é 132.750. Lucro bruto: 92.250. Menos despesa fixa 25.000 e comissão 11.250 = 56.000. Variável: custo variável unitário 11,25, margem de contribuição 112.500 (já descontada a comissão); menos custos e despesas fixas (42.000 + 25.000) = 45.500."},{"id":"2025.2-38","ed":"2025.2","n":38,"mat":"Custos","gab":"D","stem":[{"t":"p","x":"A Indústria Paranaguá Ltda. utiliza o sistema de custeio baseado em atividades (ABC). No mês de junho de 2025, foram apuradas as seguintes informações para os produtos X, Y e Z:"},{"t":"p","x":"Produto X: material direto R$ 35.000,00; mão de obra direta R$ 18.000,00; pedidos de mudança 28; 12.000 kWh."},{"t":"p","x":"Produto Y: material direto R$ 40.000,00; mão de obra direta R$ 12.000,00; pedidos de mudança 20; 14.000 kWh."},{"t":"p","x":"Produto Z: material direto R$ 25.000,00; mão de obra direta R$ 10.000,00; pedidos de mudança 32; 14.000 kWh."},{"t":"p","x":"Total: material direto R$ 100.000,00; mão de obra direta R$ 40.000,00; pedidos de mudança 80; 40.000 kWh."},{"t":"p","x":"Os custos indiretos de manufatura totalizaram R$ 200.000,00, distribuídos entre as seguintes atividades:"},{"t":"p","x":"• Gerenciamento de mudanças de projeto (baseado em pedidos): R$ 140.000,00;"},{"t":"p","x":"• Geração e uso de energia operacional (baseado em kWh): R$ 60.000,00."},{"t":"p","x":"No período, foram produzidas 1.200 unidades do produto X, 1.500 unidades do produto Y e 2.000 unidades do produto Z."},{"t":"p","x":"Com base nesses dados, os custos unitários dos produtos X, Y e Z, respectivamente, são"}],"opts":["R$ 98,50; R$ 70,00; R$ 60,00.","R$ 90,00; R$ 80,00; R$ 65,00.","R$ 105,00; R$ 74,00; R$ 52,00.","R$ 100,00; R$ 72,00; R$ 56,00."],"gabStatus":"Definitivo","exp":"ABC: pedidos 140.000 ÷ 80 = 1.750 cada; kWh 60.000 ÷ 40.000 = 1,50. X: 35.000 + 18.000 + 49.000 + 18.000 = 120.000 ÷ 1.200 = 100. Y: 40.000 + 12.000 + 35.000 + 21.000 = 108.000 ÷ 1.500 = 72. Z: 25.000 + 10.000 + 56.000 + 21.000 = 112.000 ÷ 2.000 = 56."},{"id":"2025.2-39","ed":"2025.2","n":39,"mat":"Análise / Gerencial / Controladoria","gab":"A","stem":[{"t":"p","x":"Em 31/12/2023, uma sociedade empresária apresentava os seguintes saldos em seus ativos e passivos:"},{"t":"p","x":"• Ativo Circulante: R$ 50.000,00;"},{"t":"p","x":"• Ativo Realizável a Longo Prazo: R$ 30.000,00;"},{"t":"p","x":"• Ativo Imobilizado: R$ 120.000,00;"},{"t":"p","x":"• Passivo Circulante: R$ 40.000,00;"},{"t":"p","x":"• Passivo não Circulante: R$ 100.000,00. A proporção de capital próprio que financia o ativo da sociedade empresária foi igual a"}],"opts":["30%.","40%.","60%.","70%."],"gabStatus":"Definitivo","exp":"Ativo total = 50.000 + 30.000 + 120.000 = 200.000. Capital de terceiros = 40.000 + 100.000 = 140.000. Patrimônio líquido = 60.000, que é 60 ÷ 200 = 30% do ativo."},{"id":"2025.2-40","ed":"2025.2","n":40,"mat":"Análise / Gerencial / Controladoria","gab":"C","stem":[{"t":"p","x":"Uma fábrica produz e vende apenas malas de mão. O custo fixo mensal da fábrica é de R$ 10.000,00. As malas são produzidas em dois modelos: com duas rodinhas e com quatro rodinhas. As malas com duas rodinhas são vendidas por R$ 200,00 cada, enquanto as malas com quatro rodinhas são vendidas por R$ 370,00 cada. Além disso, o custo variável da mala com duas rodinhas é de R$ 80,00, e o custo variável da de quatro rodinhas é de R$ 140,00. No primeiro trimestre de 2025, a fábrica tinha em estoque 500 unidades de rodinhas e não era possível adquirir mais. No período, as demandas pela produção de malas com duas e quatro rodinhas eram, respectivamente, de 80 e de 100. Considerando que a fábrica tinha como objetivo maximizar o seu lucro, assinale a opção que indica a produção de malas de duas e quatro rodinhas, respectivamente, no período."}],"opts":["50 e 85.","50 e 100.","80 e 85.","80 e 100."],"gabStatus":"Definitivo","exp":"Recurso escasso: 500 rodinhas. Margem por rodinha: duas rodinhas (200 − 80) ÷ 2 = 60; quatro rodinhas (370 − 140) ÷ 4 = 57,50. Priorize as de duas rodinhas: 80 malas usam 160. As 340 restantes fazem 85 malas de quatro rodinhas (demanda 100)."},{"id":"2025.2-41","ed":"2025.2","n":41,"mat":"Análise / Gerencial / Controladoria","gab":"B","stem":[{"t":"p","x":"A empresa Gigulefere S.A. adota o custo padrão e verificou, em abril de 2025, alguns dados para analisar a variação ocorrida (realizado x orçado). Abaixo estão apresentados os dados apurados pelo contador:"},{"t":"p","x":"• a mão de obra direta efetivamente consumida foi 50 horas superior ao padrão estabelecido de 1.500 horas."},{"t":"p","x":"• o custo incorrido com a mão de obra direta, por unidade de tempo, ficou R$ 7,00 abaixo do valor previsto de R$ 150,00 por hora."},{"t":"p","x":"Com base exclusivamente nos dados apresentados pelo contador, as variações de taxa e eficiência, respectivamente, ocorridas no mês de abril de 2025, foram"}],"opts":["350 desfavorável e 225.000 favorável.","10.500 favorável e 7.500 desfavorável.","75.000 desfavorável e 225.000 favorável.","1.050 favorável e 75.000 desfavorável."],"gabStatus":"Definitivo","exp":"Pelo critério da banca, a variação de taxa é a diferença de preço × quantidade padrão: 7 × 1.500 = 10.500 favorável (a hora saiu mais barata). A variação de eficiência é a diferença de horas × taxa padrão: 50 × 150 = 7.500 desfavorável. A parte mista (7 × 50 = 350) não aparece nas alternativas."},{"id":"2025.2-42","ed":"2025.2","n":42,"mat":"Setor Público","gab":"C","stem":[{"t":"p","x":"Em janeiro de 2024, um município adquiriu computadores para o edifício-sede da Prefeitura por R$ 50.000,00, classificando- os como ativo imobilizado. O transporte do estabelecimento do fornecedor para o edifício foi de R$ 5.000,00, pagos pelo município. Além disso, os custos de preparação dos locais para a instalação dos computadores foram de R$ 10.000,00. Após estarem devidamente instalados, o município gastou R$ 8.000,00 para treinar os funcionários que utilizarão esses computadores. O valor a ser reconhecido a título desse ativo, inicialmente, é"}],"opts":["R$ 55.000,00.","R$ 63.000,00.","R$ 65.000,00.","R$ 73.000,00."],"gabStatus":"Definitivo","exp":"O custo do imobilizado inclui preço de compra, transporte e preparação do local: 50.000 + 5.000 + 10.000 = 65.000. Treinamento dos funcionários é despesa e não entra no custo."},{"id":"2025.2-43","ed":"2025.2","n":43,"mat":"Setor Público","gab":"D","stem":[{"t":"p","x":"Uma escola do setor público serve, diariamente, café da manhã e almoço a seus alunos. Para as refeições, a escola adquire, semanalmente, frutas e verduras, e trimestralmente, alimentos não perecíveis. Todas as compras são pagas à vista. Em julho, a escola gastou R$ 4.000,00 com frutas e verduras e R$ 20.000,00 com os produtos não perecíveis, para serem estocados e utilizados até setembro. Os caixas consumidos, respectivamente, pela Atividade Operacional e pela Atividade de Investimento, na Demonstração dos Fluxos de Caixa da escola, foram"}],"opts":["zero e R$ 24.000,00.","R$ 4.000,00 e R$ 20.000,00.","R$ 20.000,00 e R$ 4.000,00.","R$ 24.000,00 e zero."],"gabStatus":"Definitivo","exp":"Os alimentos, mesmo estocados por um trimestre, são consumidos na própria atividade da escola, então são fluxo operacional: 4.000 + 20.000 = 24.000. Fluxo de investimento é aquisição de ativos de longo prazo (imobilizado, intangível), e aqui é zero."},{"id":"2025.2-44","ed":"2025.2","n":44,"mat":"Setor Público","gab":"C","stem":[{"t":"p","x":"De acordo com a NBC TSP - RECEITA DE TRANSAÇÃO SEM CONTRAPRESTAÇÃO, quando uma entidade do setor público adquire um ativo por meio de uma transação sem contraprestação, esse ativo deve ser mensurado inicialmente"}],"opts":["pelo valor de ativo similar adquirido nos último três anos pela entidade pública.","pelo valor simbólico de R$ 1,00.","pelo valor justo do ativo na data de aquisição.","por valor nenhum, considerando que não houve pagamento na transação."],"gabStatus":"Definitivo","exp":"Ativo recebido em transação sem contraprestação é mensurado inicialmente pelo valor justo na data da aquisição."},{"id":"2025.2-45","ed":"2025.2","n":45,"mat":"Análise / Gerencial / Controladoria","gab":"A","stem":[{"t":"p","x":"No planejamento orçamentário, a projeção da receita líquida de vendas é fundamental para estimar os resultados financeiros do período. Para isso, devem ser consideradas as quantidades a serem vendidas, o preço unitário e eventuais descontos concedidos. Uma empresa projeta vender 4.000 unidades de seu produto no próximo trimestre. O preço de venda unitário é de R$ 120,00, e a empresa oferece um desconto comercial de 5% sobre o valor total. Considerando essas premissas, o valor estimado da receita líquida de vendas no orçamento trimestral será de"}],"opts":["R$ 456.000,00.","R$ 480.000,00.","R$ 484.000,00.","R$ 504.000,00."],"gabStatus":"Definitivo","exp":"Receita bruta: 4.000 × 120 = 480.000. Desconto comercial de 5%: 24.000. Receita líquida: 456.000."},{"id":"2025.2-46","ed":"2025.2","n":46,"mat":"Análise / Gerencial / Controladoria","gab":"D","stem":[{"t":"p","x":"Durante a reestruturação de uma empresa, o contador passou a atuar estrategicamente na controladoria e no compliance, contribuindo para o aprimoramento da gestão, monitorando indicadores e apoiando decisões. Ele também assegurou a conformidade com normas legais e regulatórias. Com isso, fortaleceu seu papel na governança e na transparência organizacional. Considerando essa atuação conjunta, uma atribuição que caracteriza adequadamente essa integração funcional é"}],"opts":["a mitigação de riscos.","o acompanhamento de metas.","o monitoramento da integridade dos controles internos.","o apoio à gestão com foco em desempenho e conformidade."],"gabStatus":"Definitivo","exp":"A integração entre controladoria e compliance é o apoio à gestão com foco em desempenho (controladoria) e conformidade (compliance). Mitigar riscos, acompanhar metas e monitorar controles internos são atribuições de um lado só."},{"id":"2025.2-47","ed":"2025.2","n":47,"mat":"Auditoria","gab":"C","stem":[{"t":"p","x":"Um Auditor foi contratado por uma determinada empresa S.A. para realizar auditoria independente e, na ocasião, deparou com a seguinte situação: nos demonstrativos auxiliares, verificou-se que a empresa adota o método linear de depreciação das máquinas e registra o lançamento mensalmente na contabilidade. Conforme a NBC TA 500 (R1) - EVIDÊNCIA DE AUDITORIA, o procedimento que deverá ser adotado para a confirmação da exatidão dos valores lançados é"}],"opts":["a confirmação externa.","a inspeção.","o recálculo.","a indagação."],"gabStatus":"Definitivo","exp":"Conferir a exatidão aritmética de valores (como a depreciação linear mensal) é o procedimento de recálculo: o auditor refaz a conta e compara."},{"id":"2025.2-48","ed":"2025.2","n":48,"mat":"Auditoria","gab":"B","stem":[{"t":"p","x":"De acordo com a NBC TA 300 (R1) – PLANEJAMENTO DA AUDITORIA DE DEMONSTRAÇÕES CONTÁBEIS, o envolvimento do sócio do trabalho e de outros membros-chave da equipe de trabalho no planejamento da auditoria"}],"opts":["garante o controle e o cumprimento das etapas necessárias, fornecendo agilidade ao processo de planejamento.","incorpora a sua experiência e seus pontos de vista, otimizando a eficácia e a eficiência do processo de planejamento.","aumenta a admiração e o respeito transferidos pela equipe, proporcionando sinergia para o processo de planejamento.","melhora a proximidade e o relacionamento com a equipe, contribuindo para a qualidade do processo de planejamento."],"gabStatus":"Definitivo","exp":"O envolvimento do sócio e dos membros-chave no planejamento incorpora a experiência deles e aumenta a eficácia e a eficiência do processo, segundo a NBC TA 300."},{"id":"2025.2-49","ed":"2025.2","n":49,"mat":"Perícia","gab":"*","stem":[{"t":"p","x":"Considerando as disposições da NBC TP 01 (R1) - PERÍCIA CONTÁBIL, avalie as assertivas a seguir."},{"t":"p","x":"I. A perícia contábil é o conjunto de procedimentos técnico-científicos destinados a levar à instância decisória elementos de prova necessários a subsidiar a justa solução do litígio ou constatação de fato, mediante laudo pericial contábil e/ou parecer pericial contábil, em conformidade com as normas jurídicas e profissionais e com a legislação específica no que for pertinente."},{"t":"p","x":"II. O laudo pericial contábil e o parecer pericial contábil não têm por limite o objeto da perícia deferida ou contratada."},{"t":"p","x":"III. A perícia contábil é de competência do contador em situação regular em Conselho Regional de Contabilidade ou de profissional equivalente, desde que seja detentor de notório conhecimento sobre a matéria."},{"t":"p","x":"IV. O planejamento da perícia é a etapa do trabalho pericial na qual o perito estabelece as diretrizes e a metodologia a serem aplicadas. Estão corretas apenas as assertivas"}],"opts":["I e II.","I e III.","II e III.","I e IV."],"gabStatus":"Definitivo"},{"id":"2025.2-50","ed":"2025.2","n":50,"mat":"Perícia","gab":"*","stem":[{"t":"p","x":"O Parecer Pericial Contábil é um documento elaborado pelo perito-contador assistente, destinado a analisar, comentar ou contestar o Laudo Pericial Contábil elaborado pelo perito-contador nomeado pelo juízo. O parecer deve ser redigido de forma clara, objetiva e técnica, seguindo rigorosamente as normas contábeis. Segundo a NBC TP 01 - PERÍCIA CONTÁBIL, uma condição para a emissão do Parecer Pericial Contábil é que o Parecer Pericial Contábil deve"}],"opts":["ser emitido, independentemente de concordância ou discordância com o Laudo Pericial Contábil.","ser emitido apenas quando houver concordância total com o Laudo Pericial Contábil.","ser emitido somente se houver divergência parcial ou total em relação ao Laudo Pericial Contábil.","ser emitido contendo uma análise sobre a conduta do perito-contador responsável pelo Laudo Pericial Contábil. Realização"],"gabStatus":"Definitivo"},{"id":"2026.1-1","ed":"2026.1","n":1,"mat":"Português","gab":"B","stem":[{"t":"p","x":"Observe o seguinte texto de Bertrand Russell: A matemática, vista corretamente, possui não apenas verdade, mas também suprema beleza – uma beleza fria e austera, como a da escultura. Assinale a opção que mostra uma afirmação correta sobre o texto."}],"opts":["A frase mostra simultaneamente aspectos positivos e negativos da matemática.","O emprego da expressão “não apenas verdade” abre a possibilidade de dizer-se “mas suprema beleza”.","A expressão “uma beleza fria e austera” nega a afirmação anterior de que a matemática possui suprema beleza.","Ao afirmar que a beleza da matemática é como a da escultura, a frase desvaloriza a escultura."],"gabStatus":"Definitivo","exp":"\"Não apenas verdade\" prepara a adição \"mas também suprema beleza\", sendo uma estrutura que soma uma qualidade a outra. A frase é elogiosa, e \"fria e austera\" qualifica a beleza sem negá-la."},{"id":"2026.1-2","ed":"2026.1","n":2,"mat":"Português","gab":"B","stem":[{"t":"p","x":"Nem sempre os números indicam uma quantidade precisa. Assinale a frase em que há precisão."}],"opts":["Os especialistas em contagem de público dizem que havia mais de um milhão de pessoas na passeata.","O mesmo motorista envolvido no acidente de ontem já havia passado por três outras ocorrências semelhantes.","Perto de mil veículos passaram pelo pedágio, no mesmo dia, em função do feriado.","O vídeo mostrava cerca de 50 automóveis que estavam parados por causa do desmoronamento."],"gabStatus":"Definitivo","exp":"\"Três outras ocorrências\" é número exato. \"Mais de um milhão\", \"perto de mil\" e \"cerca de 50\" são aproximações."},{"id":"2026.1-3","ed":"2026.1","n":3,"mat":"Mat. Financeira / Estatística","gab":"C","stem":[{"t":"p","x":"Uma empresa decidiu renovar parte de sua frota adquirindo novos veículos. Para não descapitalizar o caixa da empresa, a diretoria decidiu financiar R$ 240.000,00 junto a um banco. O contrato de financiamento prevê que a dívida seja quitada por meio de 30 pagamentos mensais, postecipados e consecutivos, de acordo com a tabela SAC (Sistema de Amortização Constante). Fica firmado que a taxa efetiva de juros permanecerá fixa em 4% ao mês, ao longo de toda a vigência do contrato. Considerando estritamente as condições descritas acima, é correto afirmar que o valor do quinto pagamento será de"}],"opts":["R$ 8.320,00.","R$ 16.000,00.","R$ 16.320,00.","R$ 17.600,00."],"gabStatus":"Definitivo","exp":"No SAC, a amortização é constante: 240.000 ÷ 30 = 8.000. Antes do 5º pagamento, o saldo é 240.000 − 4 × 8.000 = 208.000. Juros: 4% × 208.000 = 8.320. Parcela = 8.000 + 8.320 = 16.320."},{"id":"2026.1-4","ed":"2026.1","n":4,"mat":"Mat. Financeira / Estatística","gab":"A","stem":[{"t":"p","x":"Um contador trabalha em uma firma de auditoria e foi alocado na equipe de Data Analytics. Sua tarefa é analisar o comportamento das vendas de uma rede varejista, para definir parâmetros de risco e identificar dias com faturamentos atípicos. Após extrair os dados, o contador constata que o faturamento diário da rede segue perfeitamente uma distribuição normal, com média igual a R$ 40.000,00. O contador também verifica que a probabilidade de que, em um dia aleatório, o faturamento esteja entre R$ 38.000,00 e R$ 42.000,00 é de 52%. Com base nessas informações, o contador conclui corretamente que a probabilidade de a rede varejista registrar faturamento diário inferior a R$ 38.000,00 é de"}],"opts":["24%.","26%.","48%.","76%."],"gabStatus":"Definitivo","exp":"Na normal simétrica em torno da média, 52% ficam entre 38.000 e 42.000, então 48% estão fora, divididos igualmente nas duas pontas: 24% abaixo de 38.000."},{"id":"2026.1-5","ed":"2026.1","n":5,"mat":"Direito","gab":"C","stem":[{"t":"p","x":"Após a observância das formalidades constitucionais e legais, o Estado Alfa celebrou contrato administrativo com a sociedade empresária Beta, visando à construção de um prédio público moderno que atenderá, com eficiência e celeridade, aos anseios da coletividade. Registre-se, contudo, que a Administração Pública anteviu a necessidade de proceder à modificação do contrato administrativo em fase de execução, para melhor adequação às finalidades de interesse público. Nesse cenário, considerando as disposições da Lei nº 14.133/2021, é correto afirmar que o Estado Alfa"}],"opts":["não poderá modificar o contrato administrativo, o qual, estando em fase de execução, é considerado lei entre as partes contratantes.","poderá modificar o contrato administrativo, desde que haja concordância expressa ou tácita da sociedade empresária Beta.","poderá modificar unilateralmente o contrato administrativo, respeitados os direitos do contratado.","não poderá modificar o contrato administrativo, salvo em caso de autorização judicial."],"gabStatus":"Definitivo","exp":"Na Lei 14.133, a Administração pode alterar unilateralmente o contrato para melhor adequação às finalidades de interesse público, respeitados os direitos do contratado."},{"id":"2026.1-6","ed":"2026.1","n":6,"mat":"Direito","gab":"D","stem":[{"t":"p","x":"O Município Alfa e o Estado Beta, em observância às formalidades legais, pretendem utilizar o sistema de registro de preços, procedimento auxiliar das licitações e contratações públicas. Busca-se, assim, a formalização, no âmbito das respectivas competências, de atas de registro de preços. Trata-se de documento vinculativo e obrigacional, com característica de compromisso para futura contratação, no qual são registrados o objeto, os preços, os fornecedores, os órgãos participantes e as condições a serem praticadas, conforme as disposições contidas no edital da licitação, no aviso ou instrumento de contratação direta e nas propostas apresentadas. Ao tomar conhecimento das pretensões dos referidos entes da Federação, o órgão público Charlie, integrante da Administração Pública Federal, demonstrou interesse em aderir, futuramente, às referidas atas de registro de preços, a serem gerenciadas pelo Município Alfa e pelo Estado Beta. Nesse cenário, considerando as disposições da Lei n o 14.133/2021, é correto afirmar que o órgão público Charlie, integrante da Administração Pública Federal,"}],"opts":["não poderá aderir às atas de registro de preços a serem gerenciadas pelo Município Alfa e pelo Estado Beta, salvo se houver a concordância expressa dos referidos entes federativos.","poderá aderir à ata de registro de preços a ser gerenciada pelo Estado Beta, mas não à ata de registro de preços que será gerenciada pelo Município Alfa.","poderá aderir à ata de registro de preços a ser gerenciada pelo Município Alfa, mas não à ata de registro de preços que será gerenciada pelo Estado Beta.","não poderá aderir às atas de registro de preços a serem gerenciadas pelo Município Alfa e pelo Estado Beta."],"gabStatus":"Definitivo","exp":"A Lei 14.133 veda aos órgãos e entidades da Administração federal aderir a ata de registro de preços gerenciada por órgão estadual, distrital ou municipal, exceto em execução descentralizada de programa federal. Por isso Charlie não pode aderir a nenhuma das duas."},{"id":"2026.1-7","ed":"2026.1","n":7,"mat":"Direito","gab":"B","stem":[{"t":"p","x":"A sociedade empresária Alfa, concessionária de serviços públicos no Município Beta, deparou-se com a necessidade, em um sábado, de proceder à interrupção do serviço prestado à coletividade residente e domiciliada no bairro Gama, sem aviso prévio, em razão de situação de emergência constatada na localidade. Nesse cenário, considerando as disposições da Lei nº 8.987/1995, é correto afirmar que"}],"opts":["não se está diante de hipótese de descontinuidade do serviço, pois a interrupção, em caso de emergência ou motivada por razões de ordem técnica, independe de aviso prévio.","não se está diante de hipótese de descontinuidade do serviço, pois a interrupção ocorreu em situação de emergência, dispensando aviso prévio.","se está diante de hipótese de descontinuidade do serviço, pois a interrupção, ainda que em situação de emergência, não pode se iniciar no final de semana.","se está diante de hipótese de descontinuidade do serviço, pois a interrupção, ainda que em situação de emergência, pressupõe aviso prévio."],"gabStatus":"Definitivo","exp":"Pela Lei 8.987/1995, interrupção em situação de emergência, ou após aviso por razões de ordem técnica ou segurança, não é descontinuidade do serviço. Em emergência, o aviso prévio é dispensado."},{"id":"2026.1-8","ed":"2026.1","n":8,"mat":"Ética","gab":"D","stem":[{"t":"p","x":"Durante o encerramento do exercício, o contador da empresa “Q” Ltda. foi pressionado pela administração para postergar o reconhecimento de uma despesa relevante, com o objetivo de melhorar artificialmente o resultado do período. Considerando as disposições da NBC PG 01 – CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR, a conduta profissional adequada é"}],"opts":["atender à solicitação da administração, desde que o ajuste não gere impacto tributário relevante.","ajustar temporariamente o resultado, caso a administração formalize por escrito a responsabilidade pela decisão.","negociar a postergação da despesa para o exercício seguinte, buscando conciliar interesses empresariais e profissionais.","manter a escrituração conforme as normas contábeis vigentes, preservando a integridade e a objetividade profissional, mesmo diante de pressões internas."],"gabStatus":"Definitivo","exp":"Postergar despesa para melhorar o resultado distorce a informação. O contador deve manter a escrituração conforme as normas, com integridade e objetividade, mesmo sob pressão. Nem termo de responsabilidade da administração nem o argumento tributário legitimam o ajuste."},{"id":"2026.1-9","ed":"2026.1","n":9,"mat":"Ética","gab":"D","stem":[{"t":"p","x":"Uma firma de auditoria fora contratada para emitir relatório de asseguração sobre informações financeiras de determinada entidade e, posteriormente, ainda no mesmo exercício social, aceitou assumir decisões administrativas relacionadas à elaboração dessas mesmas informações. Considerando o papel da Contabilidade na sociedade e as disposições da NBC PG 100 (R1) – CUMPRIMENTO DO CÓDIGO, DOS PRINCÍPIOS FUNDAMENTAIS E DA ESTRUTURA CONCEITUAL e da NBC PG 01 – CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR, a atuação adequada da firma de auditoria deve refletir a ideia de que"}],"opts":["a independência pode ser relativizada se houver confiança mútua entre auditor e administração.","a assunção de responsabilidade gerencial é aceitável quando não houver impacto financeiro relevante.","a firma pode assumir funções administrativas desde que posteriormente reveja tecnicamente seu próprio trabalho.","a firma não deve assumir responsabilidade de gestão, pois isso gera ameaças à independência e compromete o interesse público que fundamenta a atuação do contador."],"gabStatus":"Definitivo","exp":"Assumir responsabilidade de gestão sobre a informação que ele mesmo vai assegurar cria ameaça à independência (autorrevisão e interesse próprio) e fere o interesse público. Revisar depois o próprio trabalho não resolve."},{"id":"2026.1-10","ed":"2026.1","n":10,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"De acordo com a NBC TG ESTRUTURA CONCEITUAL (R2) – ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO, ativo é um recurso econômico presente, controlado pela entidade como resultado de eventos passados. Um recurso econômico representa"}],"opts":["um bem ou um direito que pertence à entidade.","uma obrigação de transferir benefícios econômicos.","um direito que tem o potencial de produzir benefícios econômicos.","uma obrigação que resulta em aumento no patrimônio líquido, exceto quando referente a contribuições de detentores de direitos sobre o patrimônio."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Recurso econômico é um direito que tem o potencial de produzir benefícios econômicos. Não é o bem físico em si nem a propriedade, e obrigação é passivo, não recurso."},{"id":"2026.1-11","ed":"2026.1","n":11,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Em 2024, uma empresa de varejo estimava inadimplência de 2% sobre o saldo de Clientes. Em 2025, buscando aumentar as vendas, a empresa reduziu as suas exigências para concessão de crédito aos clientes. Assim, uma análise criteriosa indicava que a inadimplência seria muito próxima de 5% nesse ano. No entanto, uma vez que os administradores da empresa são avaliados de acordo com o resultado operacional, eles escolheram continuar utilizando a estimativa anterior, de 2%. Ao avaliar se a informação contábil pode ser considerada representação fidedigna, é correto concluir que"}],"opts":["pode ser, uma vez que é comparável.","pode ser, uma vez que é tempestiva.","não pode ser, uma vez que não é neutra.","não pode ser, uma vez que não é verificável."],"gabStatus":"Definitivo","ass":"Outras normas (AVP, arrendamento, instr. financeiros, tributos diferidos, câmbio, segmentos, manti
