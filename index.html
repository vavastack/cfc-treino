<style>
:root{--bg:#F4F3EE;--card:#FFFFFF;--bd:#E3E0D7;--tx:#1F1E1D;--mut:#6B6A66;--ac:#D97757;--ac2:#E9A07F;--act:#A64B2A;--onac:#1F1E1D;--ok:#077157;--er:#C0303A;--onok:#FFFFFF;--okbg:#E5F3EC;--erbg:#FBE9EA;--acbg:#FBEDE7;--bar:#E3E0D7;--sh:0 6px 22px rgba(31,30,29,.08);--glow:rgba(217,119,87,.30);--r:22px;--ease:cubic-bezier(.2,.8,.2,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1F1E1D;--card:#262624;--bd:#3A3936;--tx:#F4F3EE;--mut:#A6A39B;--ac:#E08A6D;--ac2:#F0B39B;--act:#E08A6D;--onac:#1F1E1D;--ok:#2FD3A8;--er:#FF6B6B;--onok:#1F1E1D;--okbg:#1F3A31;--erbg:#3F2325;--acbg:#3A2A24;--bar:#3A3936;--sh:0 6px 22px rgba(0,0,0,.4);--glow:rgba(224,138,109,.22)}}
:root[data-theme="dark"]{--bg:#1F1E1D;--card:#262624;--bd:#3A3936;--tx:#F4F3EE;--mut:#A6A39B;--ac:#E08A6D;--ac2:#F0B39B;--act:#E08A6D;--onac:#1F1E1D;--ok:#2FD3A8;--er:#FF6B6B;--onok:#1F1E1D;--okbg:#1F3A31;--erbg:#3F2325;--acbg:#3A2A24;--bar:#3A3936;--sh:0 6px 22px rgba(0,0,0,.4);--glow:rgba(224,138,109,.22)}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
#app{max-width:720px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:22px;font-weight:600;margin:0 0 4px}
h2{font-size:18px;font-weight:600;margin:20px 0 8px}
h3{font-size:16px;font-weight:600;margin:0 0 6px}
p{margin:0 0 10px}
.mut{color:var(--mut)}
.sm{font-size:13px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.row{display:flex;gap:10px;align-items:center}
.sp{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
button,.btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent;font:inherit;font-size:15px;font-weight:600;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:12px 14px;min-height:46px;cursor:pointer;text-align:center}
button:active{transform:scale(.98)}
button.pri{background:var(--ac);border-color:var(--ac);color:var(--onac)}
button.ghost{background:transparent}
button.full{width:100%}
button:disabled{opacity:.45;cursor:not-allowed}
button.sel{border-color:var(--ac);background:var(--acbg);color:var(--ac)}
button.sm{min-height:36px;padding:6px 10px;font-size:13px}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{height:8px;border-radius:4px;background:var(--bar);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:4px}
.bar.ok i{background:var(--ok)}
.bar.er i{background:var(--er)}
.chip{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;background:var(--acbg);color:var(--ac);font-weight:600}
.chip.g{background:var(--bar);color:var(--mut)}
.big{font-size:34px;font-weight:700;line-height:1.1}
select{font:inherit;font-size:15px;width:100%;padding:11px 10px;min-height:46px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
label.l{display:block;font-size:13px;color:var(--mut);margin:12px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:40px;padding:8px 12px;font-size:14px}
.stem p{margin:0 0 10px;font-size:16.5px;line-height:1.6}
.stem pre{margin:0 0 12px;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--card);overflow-x:auto;font:12.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;font-weight:400;font-size:15.5px;line-height:1.5;padding:12px;margin:8px 0;border-radius:12px;border:1px solid var(--bd);background:var(--card)}
.opt .lt{flex:0 0 28px;height:28px;border-radius:50%;border:1px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--mut)}
.opt.sel{border-color:var(--ac);background:var(--acbg)}
.opt.sel .lt{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--er);background:var(--erbg)}
.opt.bad .lt{background:var(--er);border-color:var(--er);color:#fff}
.fb{border-radius:12px;padding:12px;margin:12px 0;font-size:15px}
.fb.ok{background:var(--okbg);border:1px solid var(--ok)}
.fb.bad{background:var(--erbg);border:1px solid var(--er)}
.fb.neutral{background:var(--acbg);border:1px solid var(--ac)}
nav#nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--bd);padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:10}
nav#nav button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mut);min-height:48px;padding:4px}
nav#nav button.on{color:var(--ac)}
nav#nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:900px){nav#nav{top:0;right:auto;bottom:0;width:190px;flex-direction:column;justify-content:flex-start;gap:4px;border-top:0;border-right:1px solid var(--bd);padding:20px 10px}nav#nav button{flex:0 0 auto;flex-direction:row;gap:10px;font-size:15px;padding:10px 12px;justify-content:flex-start;border-radius:10px}nav#nav button.on{background:var(--acbg)}#app{margin-left:210px;max-width:760px;padding-bottom:40px}}
.list button.item{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;margin:8px 0;font-weight:500}
.ql{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:6px}
.ql button{min-height:40px;padding:0;font-size:14px}
.ql button.a{background:var(--acbg);border-color:var(--ac);color:var(--ac)}
.ql button.f{box-shadow:inset 0 -3px 0 #e0a100}
.ql button.cur{outline:2px solid var(--tx)}
ul.pts{margin:0 0 6px;padding-left:20px}
ul.pts li{margin:0 0 8px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:20;max-width:90%}
.day{display:flex;gap:12px;align-items:flex-start}
.day.today{border-color:var(--ac)}
.day.done{opacity:.6}
.ck{flex:0 0 28px;height:28px;border-radius:8px;border:2px solid var(--bd);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--onac);background:transparent;padding:0;min-height:28px}
.ck.on{background:var(--ok);border-color:var(--ok)}
.hid{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* Tema Argila (Pista): degradê, brilho, vidro e movimento curto */
body{background:var(--bg);background-image:radial-gradient(520px 420px at 92% -6%,var(--glow),transparent 70%),radial-gradient(460px 380px at -8% 38%,var(--glow),transparent 72%);background-attachment:fixed;background-repeat:no-repeat}
h1{font-weight:800;letter-spacing:-.01em;background:linear-gradient(90deg,var(--tx) 40%,var(--act));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.card{border-radius:var(--r);box-shadow:var(--sh);background:linear-gradient(180deg,var(--card),var(--card));animation:rise .28s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
button,.btn{border-radius:16px;transition:transform .15s var(--ease),box-shadow .2s var(--ease),filter .2s var(--ease),background-color .2s var(--ease)}
button:hover{box-shadow:0 4px 14px var(--glow)}
button:active{transform:scale(.97)}
button.pri{background:linear-gradient(135deg,var(--ac2),var(--ac));border-color:transparent;box-shadow:0 6px 18px var(--glow),inset 0 1px 0 rgba(255,255,255,.35);color:var(--onac)}
button.pri:hover{filter:brightness(1.05);box-shadow:0 8px 22px var(--glow),inset 0 1px 0 rgba(255,255,255,.4)}
button.sel,.ql button.a,.chip,nav#nav button.on{color:var(--act)}
button.sel{background:var(--acbg);border-color:var(--ac);box-shadow:0 0 0 3px var(--glow)}
.chip{background:var(--acbg)}
.chip.g{color:var(--mut)}
:focus-visible{outline:2px solid var(--tx);outline-offset:2px}
.bar{height:10px;border-radius:999px}
.bar i{background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:999px;transition:width .5s var(--ease)}
.bar.ok i{background:var(--ok)}.bar.er i{background:var(--er)}
.big{background:linear-gradient(90deg,var(--ac),var(--act));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.opt{border-radius:18px;transition:transform .15s var(--ease),box-shadow .2s var(--ease),border-color .2s var(--ease),background-color .2s var(--ease)}
.opt:hover{box-shadow:0 4px 14px var(--glow)}
.opt.sel{box-shadow:0 0 0 3px var(--glow);transform:translateY(-1px)}
.opt.sel .lt{background:linear-gradient(135deg,var(--ac2),var(--ac));color:var(--onac)}
.opt.ok .lt,.ck.on{color:var(--onok)}
.opt.bad .lt{color:var(--onok)}
.fb{border-radius:18px;animation:rise .28s var(--ease) both}
nav#nav{background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
nav#nav button.on{background:var(--acbg);border-radius:14px}
select{border-radius:16px}
.toast{border-radius:16px;box-shadow:var(--sh)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<script>
"use strict";
var BANK=[{"id":"2024.1-1","ed":"2024.1","n":1,"mat":"Português","gab":"B","stem":[{"t":"p","x":"O escritor Érico Veríssimo falou sobre o consumidor: O objetivo do consumidor não é o de possuir coisas, mas de consumir cada vez mais e mais, a fim de com isso compensar seu vácuo interior, sua passividade, sua solidão, seu tédio e sua ansiedade. Seguindo a opinião do autor, o consumidor inveterado"}],"opts":["pretende possuir cada vez mais.","procura compensar algumas deficiências.","mostra tendência a economizar exageradamente.","vive permanentemente com dificuldades econômicas."],"gabStatus":"Definitivo","exp":"Segundo o autor, o consumidor consome mais para compensar vazio interior, passividade, solidão, tédio e ansiedade. Ou seja, busca compensar deficiências pessoais. Ele diz que o objetivo não é possuir."},{"id":"2024.1-2","ed":"2024.1","n":2,"mat":"Português","gab":"C","stem":[{"t":"p","x":"Os adjetivos podem representar estados, características, qualidades ou relações. Assinale a frase em que o adjetivo sublinhado indica um estado."}],"opts":["Profetizar o futuro não é difícil, mas é perigoso.","Para o homem trabalhador, o tempo é elástico.","Estamos sempre preocupados com o que vai acontecer.","O futuro é a mais valiosa fonte de renda da imaginação."],"gabStatus":"Definitivo","exp":"Estado é condição passageira. \"Preocupados\" indica como estamos agora. Nas outras frases os adjetivos indicam qualidade ou característica (difícil, perigoso, elástico, valiosa)."},{"id":"2024.1-3","ed":"2024.1","n":3,"mat":"Mat. Financeira / Estatística","gab":"C","stem":[{"t":"p","x":"Um determinado investimento foi realizado em 31/12/20X1, sob o regime de juros compostos, cuja taxa era de 2% ao mês. O aporte inicial foi de R$ 12.000. O valor total dos juros obtidos na operação, se ela for liquidada em 31/12/20X2, é de"}],"opts":["R$ 15.218,90.","R$ 14.880,00.","R$ 3.218,90.","R$ 2.880,00."],"gabStatus":"Definitivo","exp":"Montante: 12.000 × 1,02^12 = 12.000 × 1,26824 = 15.218,90. Juros = 15.218,90 − 12.000 = 3.218,90."},{"id":"2024.1-4","ed":"2024.1","n":4,"mat":"Mat. Financeira / Estatística","gab":"B","stem":[{"t":"p","x":"Uma firma de auditoria foi contratada para realizar um trabalho em uma empresa do ramo automobilístico. Os auditores independentes definiram, em seu processo de amostragem, que irão selecionar a partir do método aleatório (disposto como um dos principais pela NBC TA 530 – Amostragem) apenas uma nota fiscal de venda por mês para sua posterior análise. Para o mês de novembro de 20X1, as notas fiscais de venda foram assim distribuídas: Câmbio Câmbio Cor do veículo / Tipo de câmbio manual automático"},{"t":"pre","x":"Preto                                  5               7\nPrateado                               7               6"},{"t":"p","x":"Considerando o exposto, a probabilidade de que seja selecionada uma nota fiscal referente à venda de um veículo de cor preta e de câmbio manual na amostragem de novembro de 20X1 é igual a"}],"opts":["5%.","20%.","25%.","50%."],"gabStatus":"Definitivo","exp":"Total de notas: 5 + 7 + 7 + 6 = 25. Preto com câmbio manual: 5 notas. Probabilidade = 5 ÷ 25 = 20%."},{"id":"2024.1-5","ed":"2024.1","n":5,"mat":"Direito","gab":"C","stem":[{"t":"p","x":"João comunicou a Maria que:"},{"t":"p","x":"I. a Lei nº X, editada pela União, disciplinou as situações em que poderia ocorrer a renúncia a determinada posição jurídica;"},{"t":"p","x":"II. a renúncia, para ser válida, deveria observar os estritos termos legais;"},{"t":"p","x":"III. Pedro renunciou a um direito que deixou de integrar a sua esfera jurídica e, automaticamente, passou a integrar a esfera jurídica de Maria. Nas situações descritas por João em I, II e III, estamos perante, respectivamente, os denominados:"}],"opts":["poder estatal, direito positivo e direito natural.","direito objetivo, direito natural e faculdade jurídica.","direito positivo, direito objetivo e direito subjetivo.","direito subjetivo, direito natural e dinâmica relacional."],"gabStatus":"Definitivo","exp":"I: a lei editada pela União que disciplina a renúncia é direito positivo (o conjunto de normas postas). II: a regra que a renúncia deve seguir é direito objetivo (norma). III: o direito de Pedro que passa à esfera de Maria é direito subjetivo (prerrogativa do titular)."},{"id":"2024.1-6","ed":"2024.1","n":6,"mat":"Direito","gab":"D","stem":[{"t":"p","x":"Pedro é empregado, há exatos três anos, da sociedade empresária Alfa, que cumpria todas as suas obrigações, a começar pelo rigoroso pagamento do salário mensal dos seus empregados. No entanto, Maria, sua superior hierárquica, decidiu que Pedro não vinha cumprindo a contento suas obrigações, logo, deveria ser demitido. À luz desse quadro, Maria consultou o Departamento de Recursos Humanos em relação à concessão de aviso prévio a Pedro, sendo-lhe corretamente informado que"}],"opts":["cabe a Alfa optar pela concessão de aviso prévio ou pela permanência de Pedro em casa, sem remuneração.","o aviso prévio a ser dado a Pedro é de 30 (trinta) dias.","é necessário o pagamento de indenização correspondente a um mês de trabalho.","o aviso prévio a ser dado a Pedro é de 39 (trinta e nove) dias."],"gabStatus":"Definitivo","exp":"Aviso prévio proporcional (Lei 12.506/2011): 30 dias + 3 dias por ano completo de serviço. Três anos: 30 + 9 = 39 dias."},{"id":"2024.1-7","ed":"2024.1","n":7,"mat":"Direito","gab":"C","stem":[{"t":"p","x":"A sociedade empresária Delta acabou de ser constituída, o que foi feito com estrita observância da sistemática legal, tendo por objeto a venda de livros. No dia imediatamente anterior ao início de suas atividades, os sócios da Delta questionaram o seu contador sobre a respectiva carga tributária, mais especificamente a respeito dos tributos que Delta estava obrigada a recolher. O contador respondeu corretamente que Delta, em razão do seu objeto social,"}],"opts":["não recolheria nenhum tributo.","somente recolheria impostos.","recolheria taxas.","somente recolheria contribuições de melhoria."],"gabStatus":"Definitivo","exp":"Livros têm imunidade de impostos, mas a sociedade ainda recolhe taxas (por exemplo, taxa de licença e fiscalização) e também contribuições. Então \"somente impostos\" ou \"nenhum tributo\" estão errados."},{"id":"2024.1-8","ed":"2024.1","n":8,"mat":"Ética","gab":"C","stem":[{"t":"p","x":"Na aplicação das sanções éticas, avalie os itens a seguir:"},{"t":"p","x":"I. A gravidade da infração."},{"t":"p","x":"II. A punição ética anterior transitada em julgado."},{"t":"p","x":"III. A aplicação de salvaguardas."},{"t":"p","x":"IV. A ação ou omissão que macule publicamente a imagem do contador. Podem ser considerados agravantes os itens"}],"opts":["I e II, apenas.","I, II e III.","I, II e IV.","II, III e IV."],"gabStatus":"Definitivo","exp":"Agravantes: gravidade da infração, punição ética anterior transitada em julgado e ação ou omissão que macule publicamente a imagem do contador. Salvaguardas são medidas para reduzir ameaças, e não agravam."},{"id":"2024.1-9","ed":"2024.1","n":9,"mat":"Ética","gab":"D","stem":[{"t":"p","x":"Avalie, com base no Código de Ética do contador, se os deveres do contador incluem, entre outros:"},{"t":"p","x":"I. exercer a profissão com zelo, diligência, honestidade e capacidade técnica, observando as Normas Brasileiras de Contabilidade e a legislação vigente, resguardando o interesse público, os interesses de seus clientes ou empregadores, sem prejuízo da dignidade e independência profissionais;"},{"t":"p","x":"II. recusar sua indicação em trabalho quando reconheça não se achar capacitado para a especialização requerida;"},{"t":"p","x":"III. guardar sigilo sobre o que souber em razão do exercício profissional, inclusive no âmbito do serviço público, ressalvados os casos previstos em lei ou quando solicitado por autoridades competentes, entre estas os Conselhos Federal e Regionais de Contabilidade. Está correto o que se afirma em:"}],"opts":["I e II, apenas.","I e III, apenas.","II e III, apenas.","I, II e III."],"gabStatus":"Definitivo","exp":"Os três itens descrevem deveres do contador no Código de Ética: zelo e capacidade técnica, recusar trabalho para o qual não está capacitado e guardar sigilo (com as ressalvas legais)."},{"id":"2024.1-10","ed":"2024.1","n":10,"mat":"Ética","gab":"A","stem":[{"t":"p","x":"A ética pode ser aplicada em praticamente todas as nossas ações. Em algumas, ela terá um peso maior que em outras e o importante é buscar agir de acordo com princípios morais e valores alinhados ao que consideramos mais justo para nós e para os outros. Isto é, pensar no que faz mais sentido para o contexto e a melhoria de todos e não apenas em nosso próprio ganho pessoal. https://mariaceciliagomes.com.br/entendendo-etica-e-sua-importancia-na-vida-de-cada-um/ Com base na reflexão, avalie se as afirmativas a seguir são falsas (F) ou verdadeiras (V):"},{"t":"p","x":"( ) No ambiente de trabalho, a ética é fundamental para garantir um ambiente saudável e produtivo entre as pessoas."},{"t":"p","x":"( ) Agir de forma ética pode ser ter uma postura respeitosa em relação aos colegas, clientes e fornecedores; manter a confidencialidade das informações e evitar conflitos de interesse."},{"t":"p","x":"( ) A ética envolve tomar decisões justas, cumprindo as leis e normas regulatórias e considerando o impacto de nossas ações em relação aos outros. As afirmativas são, respectivamente,"}],"opts":["V – V – V.","V – F – F.","F – V – V.","F – F – F."],"gabStatus":"Definitivo","exp":"As três afirmativas são verdadeiras: a ética é fundamental no trabalho, inclui respeito, confidencialidade e evitar conflito de interesses, e envolve decisões justas e cumprimento de leis e normas."},{"id":"2024.1-11","ed":"2024.1","n":11,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Desreconhecimento é a retirada de parte ou da totalidade de ativo ou passivo reconhecido do balanço patrimonial da entidade. O desreconhecimento normalmente ocorre quando esse item não atende mais à definição de ativo ou passivo, que expirou, foi consumido, recebido, executado ou transferido. A máquina utilizada para a produção do principal produto de uma determinada entidade deve ser desreconhecida quando"}],"opts":["perder todo o potencial de produzir benefícios econômicos para a entidade.","estiver parcialmente depreciado.","sofrer perda de valor recuperável.","estiver sob controle da entidade."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Um ativo só continua no balanço enquanto tem potencial de gerar benefícios econômicos. Quando a máquina perde todo esse potencial, deixa de atender à definição de ativo e é desreconhecida. Estar parcialmente depreciada ou sofrer perda por impairment só reduz o valor, e estar sob controle é justamente o que mantém o item como ativo."},{"id":"2024.1-12","ed":"2024.1","n":12,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Conforme a NBC TG – ESTRUTURA CONCEITUAL, uma Receita reflete aumento nos ativos, ou redução nos passivos, que resultam em aumentos no patrimônio líquido, exceto aqueles referentes a contribuições de detentores de direitos sobre o patrimônio. Avalie se são reconhecidos como Receita, nesse contexto, os seguintes itens:"},{"t":"p","x":"I. Ganho de aplicação financeira."},{"t":"p","x":"II. Transferência de estoques a clientes."},{"t":"p","x":"III. Ganho na venda de imobilizado."},{"t":"p","x":"IV. Entrada de recursos pela emissão/venda de debêntures."},{"t":"p","x":"V. Entrada de recursos pela integralização do capital social."},{"t":"p","x":"VI. Ganho na venda de ações em tesouraria. São considerados receitas os itens"}],"opts":["IV, V e VI.","II, III e VI.","I, III e IV.","I, II e III."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Receita é aumento de ativo (ou redução de passivo) que aumenta o patrimônio líquido, sem vir de sócios. Entram: ganho de aplicação financeira, entrega de estoques a clientes (venda) e ganho na venda de imobilizado. Debêntures criam passivo, integralização de capital é aporte de sócios e venda de ações em tesouraria é transação de capital que vai para o PL. Esses três não são receita."},{"id":"2024.1-13","ed":"2024.1","n":13,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"O conceito de Capital é adotado pela maioria das entidades na elaboração das Demonstrações Contábeis. A seleção do conceito apropriado de Capital pela entidade deve ser baseada nas necessidades dos seus usuários, principalmente, os preocupados com a manutenção de capital nominal investido ou com o poder de compra do capital investido. A manutenção do Capital em que o lucro é auferido somente se o montante dos ativos líquidos no final do período exceder o montante dos ativos líquidos no início do período, após excluir quaisquer distribuições para, e contribuições de, sócios durante o período, é a Manutenção do"}],"opts":["Capital Físico.","Capital Financeiro.","Capital Social.","Capital Integralizado."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Na manutenção do capital financeiro, há lucro só se os ativos líquidos finais superam os iniciais, descontados aportes e distribuições a sócios. Capital físico olha para a capacidade operacional, e capital social e integralizado são contas, não conceitos de manutenção."},{"id":"2024.1-14","ed":"2024.1","n":14,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"As demonstrações contábeis são normalmente elaboradas com base na suposição de que a entidade que reporta está em continuidade operacional. Desse modo, presume-se que a entidade não tem a intenção e nem a necessidade de"}],"opts":["tornar-se internacional.","modificar a sua atividade-fim.","entrar em liquidação ou deixar de negociar.","expandir os seus negócios para outras localidades."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Continuidade operacional é o pressuposto de que a entidade seguirá operando. Por isso se presume que ela não tem intenção nem necessidade de entrar em liquidação ou deixar de negociar. Expandir, mudar de atividade ou se internacionalizar não contradizem esse pressuposto."},{"id":"2024.1-15","ed":"2024.1","n":15,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Conforme a NBC TG 04 (R4) – ATIVO INTANGÍVEL, não são exemplos de gastos a serem reconhecidos como despesa aqueles incorridos com"}],"opts":["atividades pré-operacionais destinadas a constituir a empresa.","treinamento do pessoal próprio.","publicidade e atividades promocionais.","o desenvolvimento de ativos intangíveis gerados internamente."],"gabStatus":"Definitivo","ass":"Intangível","exp":"São despesas: gastos pré-operacionais, treinamento de pessoal, publicidade e promoção. Já o desenvolvimento de intangível gerado internamente pode ser capitalizado quando cumpre os requisitos, então não é despesa obrigatória."},{"id":"2024.1-16","ed":"2024.1","n":16,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"A Sociedade A possui 65% de ações com direito a voto sobre a Sociedade B, cujo Patrimônio Líquido equivale a R$2.000.000. Com essa participação a Sociedade A exerce o controle da sociedade B. Durante o exercício de 2023, a Sociedade “B” apresentou um lucro de R$200.000. Diante dos dados apresentados, e de acordo com a NBC TG 18 (R3) – INVESTIMENTO EM COLIGADA, em Controlada e em Empreendimento Controlado em Conjunto, a Sociedade A efetuará, em suas demonstrações contábeis individuais, um registro de"}],"opts":["débito em Caixa e crédito em Investimentos na Sociedade B no valor de R$130.000.","débito em Investimentos na Sociedade B e crédito em Receita de equivalência patrimonial no valor de R$200.000.","débito em Receita de equivalência patrimonial e crédito em Investimentos na Sociedade B no valor de R$200.000.","débito em Investimentos na Sociedade B e crédito em Receita de equivalência patrimonial no valor de R$130.000."],"gabStatus":"Definitivo","ass":"Investimentos, equivalência, consolidação, combinação","exp":"Na controladora, o investimento em controlada é avaliado pela equivalência patrimonial: 65% do lucro de 200.000 = 130.000. Débito em Investimentos e crédito em Receita de equivalência patrimonial. O 100% do lucro entra só na consolidação."},{"id":"2024.1-17","ed":"2024.1","n":17,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Sem observar as exceções previstas no item 4.1.5 da NBC TG 48 – INSTRUMENTOS FINANCEIROS, um ativo financeiro que, para a entidade que reporta a informação, é mantido dentro de modelo de negócios, cujo objetivo seja atingido tanto pelo recebimento de fluxos de caixa contratuais quanto pela venda de ativos financeiros, e se os termos contratuais do ativo financeiro derem origem, em datas especificadas, a fluxos de caixa que constituam exclusivamente pagamentos de principal e juros sobre o valor do principal em aberto, deve ser mensurado no momento subsequente ao"}],"opts":["Custo Amortizado.","Valor Justo Por Meio de Outros Resultados Abrangentes.","Valor Justo Por Meio de Resultado.","Valor Realizável Líquido."],"gabStatus":"Definitivo","ass":"Outras normas (AVP, arrendamento, instr. financeiros, tributos diferidos, câmbio, segmentos, mantido p/ venda)","exp":"Ativo financeiro cujo modelo de negócio é receber fluxos contratuais e também vender, com fluxos que são só principal e juros, é medido ao valor justo por meio de outros resultados abrangentes. Custo amortizado é para quem só mantém para receber, e valor justo por resultado é o resíduo."},{"id":"2024.1-18","ed":"2024.1","n":18,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"No ano de 2023, a Sociedade Empresária XXX foi autuada por um órgão fiscal que alegava o não recolhimento de determinado imposto no valor de R$7.000.000. Com base na análise de seu departamento jurídico, a Sociedade Empresária constituiu uma provisão no valor de R$5.000.000 nas demonstrações de 2023 e impetrou recurso administrativo ao referido órgão. Em 15/03/2024, o recurso da Sociedade Empresária foi julgado e o órgão fiscal determinou que a Sociedade Empresária recolhesse a quantia de R$6.000.000. A Sociedade Empresária optou por não recorrer da decisão. A elaboração das demonstrações contábeis foi finalizada pelo Departamento Contábil em 28/02/2024 e o Conselho de Administração autorizou a emissão de tais demonstrações em 25/03/2024. Instado a decidir se a Sociedade Empresária XXX deve ajustar as Demonstrações Contábeis de 2023 e por qual valor, você declara, corretamente, que a Sociedade Empresária XXX"}],"opts":["deve ajustar as Demonstrações Contábeis de 2023, reduzindo o lucro do período e aumentando o passivo em R$1.000.000.","deve ajustar as Demonstrações Contábeis de 2023, reduzindo o lucro do período e aumentando o passivo em R$2.000.000.","não deve ajustar as Demonstrações Contábeis de 2023, sendo a determinação do órgão fiscal ocorrida depois de 31/12/2023.","não deve ajustar as Demonstrações Contábeis de 2023, sendo a determinação do órgão fiscal ocorrida depois da data de finalização das Demonstrações Contábeis por parte do Departamento Contábil."],"gabStatus":"Definitivo","ass":"Provisões e contingências (TG 25)","exp":"A decisão do órgão fiscal em 15/03/2024 saiu antes da autorização de emissão (25/03/2024) e confirma uma obrigação que já existia em 31/12/2023. É evento subsequente que exige ajuste: provisão de 6.000.000 − 5.000.000 já registrados = 1.000.000 a mais, reduzindo o lucro. A data de finalização pelo departamento contábil não é o que conta."},{"id":"2024.1-19","ed":"2024.1","n":19,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Em 31/12/2022, uma companhia tinha seu capital social dividido em 40.000 ações ordinárias (ON). Naquela data, todas estavam em poder dos acionistas. As seguintes operações com ações foram registradas durante o exercício de 2023: Data Operação 30/04/2023 Emissão de 1.000 novas ações ON, imediatamente subscritas e integralizadas pelos acionistas."},{"t":"pre","x":"30/09/2023     Recompra de 2.000 ações, mantidas em tesouraria.\n30/11/2023     Venda de 1.000 ações que estavam em tesouraria."},{"t":"p","x":"Ao final do exercício de 2023, a companhia apurou Lucro Líquido de R$202.110. Os valores do Resultado Básico por ação e do Resultado Diluído por ação, a serem divulgados pela companhia, são, respectivamente,"}],"opts":["5,05275 e 5,02137.","5,02137 e 5,02137.","5,05275 e 4,92951.","5,05275 e 5,0275."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"O lucro por ação básico divide o lucro pela média ponderada de ações em circulação. Ações: 40.000, mais 1.000 emitidas por 8 meses (666,67), menos 2.000 recompradas por 3 meses (500), mais 1.000 vendidas por 1 mês (83,33). Média: 40.250. Lucro 202.110 ÷ 40.250 = 5,02137. Como não há instrumentos diluidores, o diluído é igual ao básico."},{"id":"2024.1-20","ed":"2024.1","n":20,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"A Sociedade Empresária A possui estoque de um mix de mercadorias para revenda e deseja mensurar as mercadorias da categoria b de acordo com a NORMA BRASILEIRA DE CONTABILIDADE NBC TG 16 (R2) – ESTOQUES. Em termos unitários, o valor de custo das mercadorias dessa categoria é de R$20; o valor realizável líquido é de R$15 e o preço de venda é de R$30. Considerando a quantidade de mil unidades, o seguinte valor dessas mercadorias deve ser apresentado no balanço patrimonial:"}],"opts":["R$15.","R$15.000.","R$20.000.","R$30.000."],"gabStatus":"Definitivo","ass":"Estoques (custo, PEPS, VRL)","exp":"Estoque é medido pelo menor valor entre custo e valor realizável líquido. Aqui o VRL (15) é menor que o custo (20), então 1.000 unidades × 15 = 15.000. O preço de venda de 30 não entra."},{"id":"2024.1-21","ed":"2024.1","n":21,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Em janeiro de 2024, uma companhia aérea anunciou uma promoção especial de Dia das Mães e vendeu, em fevereiro, 200 passagens aéreas do Rio de Janeiro para Porto Alegre, por R$300 cada, recebidos à vista. Em maio de 2024, os aeroportos de Porto Alegre foram fechados, de modo que a companhia aérea comunicou aos clientes que as passagens poderiam ser utilizadas em junho, sem pagamento de taxas e penalidades. Suponha que todos os clientes viajem em junho de 2024. Nesse caso, de acordo com a NBC TG 47 – Receita de Contratos com Clientes, a receita da companhia aérea relativa à venda das 200 passagens deve ser reconhecida no mês de"}],"opts":["janeiro.","fevereiro.","maio.","junho."],"gabStatus":"Definitivo","ass":"DRE, receitas (TG 47), DRA","exp":"A receita é reconhecida quando a obrigação de desempenho é cumprida. Para passagem aérea, é quando o serviço de transporte é prestado, ou seja, em junho. O recebimento antecipado em fevereiro é passivo (receita diferida), e o adiamento do voo só muda o mês do reconhecimento."},{"id":"2024.1-22","ed":"2024.1","n":22,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Em 01/07/2021, uma loja de roupas adquiriu uma máquina de costura por R$840. Na data, estimou que iria usar a máquina durante 4 anos e vendê-la pelo equivalente à vista de R$200 após esse período. Em 01/01/2023, a loja constatou que poderia utilizar a máquina por mais 3 anos, a partir dessa data, mas seu valor residual seria zero. Assinale a opção que indica o valor contábil da máquina de costura em 31/12/2023, conforme a NBC TG 27 – Ativo Imobilizado."}],"opts":["R$400.","R$440.","R$320.","R$210."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Depreciação inicial: (840 − 200) ÷ 4 anos = 160 por ano. De 01/07/2021 a 01/01/2023 são 1,5 ano, ou seja, 240, e o valor contábil era 600. Com a mudança de estimativa (3 anos e residual zero), a depreciação passa a 600 ÷ 3 = 200 por ano. Em 31/12/2023 o valor contábil é 600 − 200 = 400. Mudança de estimativa vale daqui para frente."},{"id":"2024.1-23","ed":"2024.1","n":23,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Em 01/01/2022, uma fábrica de cosméticos adquiriu, por R$180.000, um terreno para a construção de um estacionamento para seus empregados. Em 31/12/2022, a fábrica realizou o teste de recuperabilidade desse terreno e constatou que seu valor em uso era de R$170.000, enquanto o seu valor justo era de R$190.000. Para vender o terreno, a fábrica deveria incorrer em despesas legais de alienação no valor de R$15.000. Assinale o valor do terreno no balanço patrimonial da fábrica após o teste de recuperabilidade, conforme a NBC TG 01 – REDUÇÃO AO VALOR RECUPERÁVEL DE ATIVOS."}],"opts":["R$170.000.","R$175.000.","R$180.000.","R$190.000."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Valor recuperável é o maior entre o valor em uso (170.000) e o valor justo líquido de despesas de venda (190.000 − 15.000 = 175.000). Fica 175.000. Como o custo era 180.000, a perda é 5.000 e o terreno passa a 175.000."},{"id":"2024.1-24","ed":"2024.1","n":24,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"De acordo com a Lei no 6.404/76, em uma sociedade empresária, as Reservas de Capital poderão ser utilizadas para absorver prejuízos quando"}],"opts":["não houver ações em tesouraria.","estes estiverem acumulados há no mínimo três exercícios sociais.","estes ultrapassarem os lucros acumulados e as reservas de lucros.","houver garantia de que os dividendos mínimos obrigatórios serão pagos em conformidade."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"Pela Lei 6.404, as reservas de capital só podem absorver prejuízos que ultrapassarem os lucros acumulados e as reservas de lucros. A ordem é: lucros acumulados, reservas de lucros e depois reservas de capital."},{"id":"2024.1-25","ed":"2024.1","n":25,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Em dezembro de 2023, uma empresa de consultoria comprou, à vista, aparelhos de ar condicionado, para o seu escritório, por R$6.000. Na data, pagou o frete no valor de R$200 e a instalação no valor de R$2.000. Os caixas consumidos, reconhecidos na Demonstração dos Fluxos de Caixa da empresa, elaborada pelo método direto, pelas atividades operacional e de investimento, de acordo com a NBCTG 03 (R3) – DEMONSTRAÇÕES DOS FLUXOS DE CAIXA, ATIVIDADES DE INVESTIMENTOS, são, respectivamente:"}],"opts":["zero e R$8.200.","R$200 e R$8.000.","R$2.000 e R$6.200.","R$2.200 e R$6.000."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Frete e instalação fazem parte do custo do ativo, então a compra toda é 6.000 + 200 + 2.000 = 8.200, e sai como investimento na DFC. Operacional fica zero. Pagar imobilizado nunca é caixa operacional."},{"id":"2024.1-26","ed":"2024.1","n":26,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Uma joalheria reconheceu as seguintes receitas em 2023 com:"},{"t":"p","x":"• vendas de mercadorias: R$800.000;"},{"t":"p","x":"• financeira: R$400.000;"},{"t":"p","x":"• equivalência patrimonial: R$200.000;"},{"t":"p","x":"• venda de ativo imobilizado: R$170.000;"},{"t":"p","x":"• aluguel de imóvel a terceiros: R$120.000. De acordo cm a NBC TG 09 (R1) – DEMONSTRAÇÃO DO VALOR ADICIONADO, na Demonstração do Valor Adicionado da joalheria, em 31/12/2023, o valor adicionado recebido em transferência apresenta o seguinte montante:"}],"opts":["R$490.000.","R$600.000.","R$720.000.","R$890.000."],"gabStatus":"Definitivo","ass":"DRE, receitas (TG 47), DRA","exp":"Na DVA, o valor adicionado recebido em transferência é o que a entidade recebe de fora: receita financeira 400.000 + equivalência patrimonial 200.000 + aluguel recebido 120.000 = 720.000. Vendas de mercadorias e venda de imobilizado ficam na primeira parte, como receita da própria atividade."},{"id":"2024.1-27","ed":"2024.1","n":27,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Uma sociedade empresária apresenta a seus usuários externos as informações sobre a base de preparação das demonstrações financeiras e das práticas contábeis específicas selecionadas e aplicadas para negócios e eventos significativos. Conforme a Lei nº 6.404/76, essa informação deve ser incluída"}],"opts":["nas Notas Explicativas.","no Relatório do Auditor.","no Relatório da Administração.","na Carta de Responsabilidade da Administração."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"A base de preparação das demonstrações e as práticas contábeis específicas ficam nas notas explicativas, que complementam o balanço, a DRE e as demais demonstrações."},{"id":"2024.1-28","ed":"2024.1","n":28,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"De acordo com a NBC TG 02 (R3) – EFEITOS DAS MUDANÇAS NAS TAXAS DE CÂMBIO E CONVERSÃO DE DEMONSTRAÇÕES CONTÁBEIS, os elementos do balanço patrimonial podem ser classificados como monetários e não monetários. Assinale a opção que indica um ativo classificado como ativo não monetário em uma papelaria."}],"opts":["Estoques.","Contas a receber.","Aplicações financeiras.","Adiantamento de clientes."],"gabStatus":"Definitivo","ass":"Outras normas (AVP, arrendamento, instr. financeiros, tributos diferidos, câmbio, segmentos, mantido p/ venda)","exp":"Item monetário é dinheiro ou direito/obrigação em moeda com valor fixado (contas a receber, aplicações, adiantamento de clientes). Estoques não têm valor fixo em moeda, então são não monetários."},{"id":"2024.1-29","ed":"2024.1","n":29,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Conforme a Lei no 6.404/76, no Balanço Patrimonial, as contas do ativo são apresentadas de acordo com a ordem decrescente de grau de"}],"opts":["liquidez.","relevância.","objetividade.","valor monetário."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"Na Lei 6.404, as contas do ativo vão em ordem decrescente de grau de liquidez (das mais líquidas, como caixa, para as menos líquidas), e as do passivo em ordem decrescente de exigibilidade."},{"id":"2024.1-30","ed":"2024.1","n":30,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Em 2023, a Demonstração do Resultado do Exercício de uma entidade apresentou Receita Líquida de R$200.000 e Lucro Bruto de R$150.000. Pode-se constatar que, na demonstração, a seguinte conta apresenta saldo de R$50.000:"}],"opts":["despesas de vendas.","despesas operacionais.","deduções da receita.","custo das mercadorias vendidas."],"gabStatus":"Definitivo","ass":"DRE, receitas (TG 47), DRA","exp":"Lucro bruto = receita líquida − custo das mercadorias vendidas. Então 200.000 − CMV = 150.000, logo CMV = 50.000."},{"id":"2024.1-31","ed":"2024.1","n":31,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Uma livraria utiliza o critério PEPS (Primeiro a Entrar, Primeiro a Sair) para mensurar os seus estoques. Em 01/01/2024, havia 20 livros de Contabilidade Avançada em estoque, que foram comprados por R$100 cada. Em 05/01/2024, a livraria adquiriu mais 30 unidades desse mesmo título, por R$120 cada. Já em 10/01/2024, a livraria vendeu 35 exemplares desse livro a um grupo de estudantes, por R$200 cada. De acordo com a NBC TG 16 (R2) – ESTOQUES, o custo das mercadorias vendidas reconhecido em janeiro foi de"}],"opts":["R$3.500.","R$3.800.","R$4.100.","R$4.200."],"gabStatus":"Definitivo","ass":"Estoques (custo, PEPS, VRL)","exp":"No PEPS saem primeiro as unidades mais antigas. Das 35 vendidas, 20 saem a 100 (2.000) e 15 saem a 120 (1.800), total de CMV de 3.800. O preço de venda de 200 não afeta o custo."},{"id":"2024.1-32","ed":"2024.1","n":32,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Uma sociedade empresária apresenta saldo de R$80.000 na conta “Despesas antecipadas”. Nas Demonstrações contábeis, essa conta é apresentada como"}],"opts":["ativo, no balanço patrimonial.","passivo, no balanço patrimonial.","outras despesas, na demonstração do resultado do exercício.","despesas operacionais, na demonstração do resultado do exercício."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"Despesas antecipadas são gastos pagos por serviços que ainda serão usufruídos, então são ativo (normalmente circulante) no balanço patrimonial. Só viram despesa na DRE quando o benefício é consumido."},{"id":"2024.1-33","ed":"2024.1","n":33,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Em abril de 2024, uma empresa de consultoria adquiriu 10 cadeiras para seus funcionários por R$400 cada. Metade do valor foi pago à vista e o restante tem pagamento previsto para junho do mesmo ano. No momento da compra, observam-se as seguintes modificações nos saldos de seus elementos patrimoniais:"}],"opts":["aumento de R$2.000 no ativo e no passivo.","aumento de R$4.000 no ativo e no passivo.","aumento de R$4.000 no ativo e no patrimônio líquido.","diminuição de R$2.000 no ativo, aumento de R$2.000 no passivo e diminuição de R$4.000 no patrimônio líquido."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"A compra foi 10 × 400 = 4.000. Pagou 2.000 à vista e deixou 2.000 a pagar. O ativo líquido sobe 2.000 (imobilizado +4.000 e caixa −2.000) e o passivo sobe 2.000. O PL não muda."},{"id":"2024.1-34","ed":"2024.1","n":34,"mat":"Contabilidade Geral","gab":"B","stem":[{"t":"p","x":"Uma sociedade empresária oferece serviços de entrega de documentos. Para realizar as entregas, possui cinco motos, sendo que cada uma apresentava, em 31/12/2023, valor contábil de R$30.000. Além disso, a sociedade empresária possui duas motos que são utilizadas exclusivamente para a locomoção de seus diretores. Cada uma dessas motos apresentava, em 31/12/2023, valor contábil de R$50.000. Assinale a opção que indica a apresentação das motos no balanço patrimonial da sociedade empresária em 31/12/2023."}],"opts":["Investimentos: R$250.000.","Ativo Imobilizado: R$250.000.","Investimentos: R$100.000 e Ativo Imobilizado: R$150.000.","Investimentos: R$150.000 e Ativo Imobilizado: R$100.000."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Moto usada na operação e moto usada por diretores são itens de uso da entidade, logo ativo imobilizado. Não são propriedade para investimento. Total: 5 × 30.000 + 2 × 50.000 = 250.000."},{"id":"2024.1-35","ed":"2024.1","n":35,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Considere os seguintes elementos das demonstrações contábeis:"},{"t":"p","x":"I. Ativo."},{"t":"p","x":"II. Despesa."},{"t":"p","x":"III. Receita."},{"t":"p","x":"IV. Passivo."},{"t":"p","x":"V. Patrimônio Líquido. Desses elementos os que apresentam natureza devedora são:"}],"opts":["I e II, apenas.","I e III, apenas.","II e IV, apenas.","I, III e V, apenas."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Natureza devedora: ativo e despesa. Natureza credora: passivo, receita e patrimônio líquido. Regra prática: o que aumenta com débito (ativo e despesa) é devedor, o resto é credor."},{"id":"2024.1-36","ed":"2024.1","n":36,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Uma farmácia apresentava os seguintes saldos em seu ativo, em 31/12/2023:"},{"t":"p","x":"• Aplicação financeira com vencimento em 380 dias: R$200.000;"},{"t":"p","x":"• Clientes com recebimento previsto para 180 dias: R$140.000;"},{"t":"p","x":"• Disponibilidades: R$50.000;"},{"t":"p","x":"• Estoque com venda prevista para até 60 dias: R$120.000;"},{"t":"p","x":"• Imóvel onde funciona a farmácia: R$600.000;"},{"t":"p","x":"• Móveis e utensílios utilizados em suas lojas: R$300.000. O ativo circulante da farmácia em 31/12/2023 foi de"}],"opts":["R$170.000.","R$190.000.","R$310.000.","R$510.000."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"Ativo circulante: clientes 140.000 (180 dias) + disponibilidades 50.000 + estoque 120.000 (60 dias) = 310.000. A aplicação com vencimento em 380 dias passa de 12 meses e fica no não circulante. Imóvel e móveis são imobilizado."},{"id":"2024.1-37","ed":"2024.1","n":37,"mat":"Custos","gab":"B","stem":[{"t":"p","x":"A Euza Batista Modas é uma indústria têxtil que confecciona apenas calças. No mês de maio de 2024, apresentou os seguintes dados a respeito da sua produção:"},{"t":"p","x":"Tecido Jeans: Padrão = quantidade 1,50, custo unitário 45,00, custo total 67,50; Real = quantidade 2,00, custo unitário 55,00, custo total 110,00."},{"t":"p","x":"Botão: Padrão = quantidade 3,00, custo unitário 6,55, custo total 19,65; Real = quantidade 6,00, custo unitário 5,47, custo total 32,82."},{"t":"p","x":"Linha: Padrão = quantidade 220,00, custo unitário 0,15, custo total 33,00; Real = quantidade 290,00, custo unitário 0,11, custo total 31,90."},{"t":"p","x":"A gestora da companhia tem por costume utilizar o método de custo padrão para tomar suas decisões. A partir dos dados apresentados, assinale a principal conclusão a respeito da variação dos insumos de produção."}],"opts":["Todas as variações foram desfavoráveis.","Todas as variações de quantidade foram desfavoráveis.","As variações de custo unitário dos itens botão e linha foram desfavoráveis.","O tecido jeans foi o único insumo da produção que teve variações favoráveis."],"gabStatus":"Definitivo","exp":"Comparando padrão e real: tecido, botão e linha usaram mais quantidade do que o padrão (todas desfavoráveis). Já os preços unitários de botão (5,47 contra 6,55) e linha (0,11 contra 0,15) ficaram abaixo do padrão, ou seja, favoráveis. O tecido teve preço desfavorável (55 contra 45). Por isso a única afirmação correta para todos é que as variações de quantidade foram desfavoráveis."},{"id":"2024.1-38","ed":"2024.1","n":38,"mat":"Custos","gab":"B","stem":[{"t":"p","x":"Observe a seguinte definição: Conceito fundamental de finanças e economia que diz respeito aos benefícios que podem ser perdidos quando uma opção é escolhida em detrimento de outra; em outras palavras, ele representa o valor da melhor opção a ser considerada após a tomada de decisão. A definição é referente a"}],"opts":["Custo Controlável.","Custo de Oportunidade.","Custo Perdido.","Custos Imputados."],"gabStatus":"Definitivo","exp":"Custo de oportunidade é o benefício da melhor alternativa que se abre mão ao escolher uma opção. Não é um desembolso contábil, mas entra na tomada de decisão."},{"id":"2024.1-39","ed":"2024.1","n":39,"mat":"Análise / Gerencial / Controladoria","gab":"D","stem":[{"t":"p","x":"A Sociedade Empresária Alegria Alegria Ltda. apresentou o seguinte Balanço Patrimonial em 31/12/20X1:"},{"t":"p","x":"Balanço Patrimonial – ALEGRIA ALEGRIA Ltda. 31/12/20X1"},{"t":"pre","x":"Ativo                      31/12/20X1     31/12/20X0       Passivo                 31/12/20X1 31/12/20X0\nCirculante                  145.000,00        290.000,00   Circulante               34.000,00     68.000,00\nBanco                        25.000,00         50.000,00   Fornecedores             12.000,00     24.000,00\nCaixa                        40.000,00         80.000,00   Duplicatas a pagar       22.000,00     44.000,00\nEstoque                      80.000,00        160.000,00\nNão Circulante              270.000,00        540.000,00   Não Circulante          145.000,00    290.000,00\nRealizável a Longo Prazo     35.000,00         70.000,00\nImobilizado                 145.000,00        290.000,00   Patrimônio Líquido      236.000,00    472.000,00\nInvestimentos                55.000,00        110.000,00   Capital Social          236.000,00    472.000,00\nIntangível                   35.000,00         70.000,00\nTotal Ativo                 415.000,00        830.000,00   Total Passivo           415.000,00    830.000,00"},{"t":"p","x":"A partir dos dados apresentados é correto afirmar que"}],"opts":["o percentual dos ativos financiados por capital de terceiros corresponde a 8,19% em 20X1.","a liquidez corrente em 20X1 é 111.000,00 e em 20X0 é -68.000,00.","a empresa não tem capacidade de pagamento a curto prazo em 20X0 e em 20X1, sem considerar os seus estoques.","a empresa possui mais que 50% dos seus recursos aplicados no ativo não circulante em 20X0."],"gabStatus":"Definitivo","exp":"Em 20X0: Ativo não circulante = 540.000 de 830.000 = 65%, mais que 50%. As outras estão erradas: capital de terceiros em 20X1 é (34.000 + 145.000) ÷ 415.000 ≈ 43%; liquidez corrente é 145 ÷ 34 ≈ 4,26 (não 111.000); e a empresa tem caixa e banco (65.000) acima do passivo circulante (34.000), então paga a curto prazo mesmo sem estoque."},{"id":"2024.1-40","ed":"2024.1","n":40,"mat":"Custos","gab":"A","stem":[{"t":"p","x":"Uma fábrica de brinquedos produz dois tipos de carrinhos: com quatro portas e com duas portas. A demanda mensal de cada tipo de carrinho é de 200 e de 250 unidades, respectivamente. Além disso, o preço de venda e o custo variável unitário de cada tipo de carrinho são os seguintes:"},{"t":"pre","x":"Tipo de carrinho      Preço de venda   Custo variável\nQuatro portas               100             40\nDuas portas                  70             30"},{"t":"p","x":"Em janeiro de 2024, a fábrica tinha 900 portas para a produção dos carrinhos que seriam vendidos em fevereiro e não era possível realizar compras adicionais. Com o objetivo de maximização do resultado, assinale a opção que indica, respectivamente, o número de carrinhos de quatro e de duas portas que devem ser produzidos."}],"opts":["100 e 250.","200 e 250.","225 e zero.","800 e 50."],"gabStatus":"Definitivo","exp":"Com recurso escasso (900 portas), priorize a maior margem por porta. Quatro portas: (100 − 40) ÷ 4 = 15 por porta. Duas portas: (70 − 30) ÷ 2 = 20 por porta. Produza primeiro os de duas portas (demanda 250, usando 500 portas) e use as 400 restantes para 100 carrinhos de quatro portas."},{"id":"2024.1-41","ed":"2024.1","n":41,"mat":"Análise / Gerencial / Controladoria","gab":"C","stem":[{"t":"p","x":"Um contador realizou uma análise completa das demonstrações contábeis de uma empresa, efetuando as análises horizontal, vertical e por indicadores. O contador constatou que as seguintes metodologias de análise traziam o mesmo resultado:"}],"opts":["análise vertical do Balanço Patrimonial e indicadores de prazos médios.","análise horizontal do Balanço Patrimonial e indicadores de liquidez.","análise vertical da Demonstração do Resultado do Exercício e indicadores de lucratividade.","análise horizontal da Demonstração do Resultado do Exercício e indicadores de rentabilidade."],"gabStatus":"Definitivo","exp":"Análise vertical da DRE expressa cada linha como percentual da receita, que é exatamente o que mostram os indicadores de lucratividade (margem bruta, operacional, líquida). Os demais pares medem coisas diferentes."},{"id":"2024.1-42","ed":"2024.1","n":42,"mat":"Análise / Gerencial / Controladoria","gab":"C","stem":[{"t":"p","x":"Uma sociedade empresária apresentou os seguintes saldos em seu Balanço Patrimonial em 31/12/2023:"},{"t":"p","x":"• Capital Social: 180.000;"},{"t":"p","x":"• Disponibilidades: 80.000;"},{"t":"p","x":"• Empréstimos a pagar a Longo Prazo: 150.000;"},{"t":"p","x":"• Estoques: 20.000;"},{"t":"p","x":"• Fornecedores a pagar: 70.000;"},{"t":"p","x":"• Imobilizado: 130.000;"},{"t":"p","x":"• Realizável a Longo Prazo: 170.000."},{"t":"p","x":"Considerando apenas os saldos dessas contas, a liquidez corrente aproximada da sociedade empresária em 31/12/2023 foi"}],"opts":["1,14.","1,23.","1,43.","1,82."],"gabStatus":"Definitivo","exp":"Liquidez corrente = Ativo circulante ÷ Passivo circulante. AC = disponibilidades 80.000 + estoques 20.000 = 100.000. PC = fornecedores 70.000. 100 ÷ 70 ≈ 1,43. O empréstimo é de longo prazo, então não entra."},{"id":"2024.1-43","ed":"2024.1","n":43,"mat":"Setor Público","gab":"C","stem":[{"t":"p","x":"O setor de contabilidade de um determinado ente público estadual identificou que, em janeiro de 2024, parte dos benefícios a serem pagos aos servidores ativos não foram processados em época própria, quando foi observado o direito ao recebimento, em outubro de 2023. Ao proceder com a emissão de empenho, considerando que o orçamento do referido ano consignava crédito próprio, com saldo suficiente para atendê-los, os benefícios foram classificados contabilmente como"}],"opts":["despesa corrente.","despesa de capital.","despesa de exercícios anteriores.","despesa extraordinária."],"gabStatus":"Definitivo","exp":"Benefício reconhecido em 2023 e não empenhado na época própria, pago em 2024 à conta de dotação do orçamento corrente, é despesa de exercícios anteriores."},{"id":"2024.1-44","ed":"2024.1","n":44,"mat":"Setor Público","gab":"A","stem":[{"t":"p","x":"Nas eleições realizadas em outubro de 2022, uma escola do setor público funcionou como seção eleitoral para a realização da votação. A escola geralmente recebe R$5.000 ao ceder o seu espaço para a realização de outras atividades, no entanto, como se tratava de eleições, a escola cobrou R$4.500. Em outubro de 2022, a escola reconheceu uma receita"}],"opts":["com contraprestração de R$4.500.","com contraprestração de R$5.000.","sem contraprestração de R$4.500.","sem contraprestração de R$5.000."],"gabStatus":"Definitivo","exp":"Foi uma troca: a escola cedeu o espaço e recebeu em contrapartida 4.500, que é o valor efetivamente cobrado. Receita com contraprestação pelo valor da transação, e não pelo preço de tabela de 5.000."},{"id":"2024.1-45","ed":"2024.1","n":45,"mat":"Setor Público","gab":"A","stem":[{"t":"p","x":"Em relação às despesas orçamentárias, avalie se as despesas a seguir são classificadas como despesas correntes:"},{"t":"p","x":"I. Despesas de custeio."},{"t":"p","x":"II. Investimentos."},{"t":"p","x":"III. Inversões Financeiras. Está correto o que se apresenta em"}],"opts":["I, apenas.","I e II, apenas.","I e III, apenas.","II e III, apenas."],"gabStatus":"Definitivo","exp":"Despesas correntes são as de custeio e as transferências correntes. Investimentos e inversões financeiras são despesas de capital."},{"id":"2024.1-46","ed":"2024.1","n":46,"mat":"Análise / Gerencial / Controladoria","gab":"D","stem":[{"t":"p","x":"No ambiente empresarial, é cada vez mais relevante a criação de regras claras e de consciência sobre a importância do combate às irregularidades e aos desvios de conduta. Uma cultura de integridade é pautada por ética e transparência nos negócios e nas relações de trabalho e se baseia em um conjunto de regras, normas, políticas, processos e ferramentas voltado a prevenir, detectar e corrigir eventuais desvios. Além disso, deve-se incentivar a implantação de boas práticas de governança, programas de compliance, mecanismos de gerenciamento de riscos e controles internos. Em relação ao tema, analise as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa."},{"t":"p","x":"( ) A governança corporativa se resume em mitigar prejuízos causados pelos conflitos de interesses entre acionistas e gestores."},{"t":"p","x":"( ) O compliance é o instrumento de comprovação de aderência a normas e requerimentos estabelecidos, tanto o alinhamento a regras internas como o atendimento a normas externas decorrentes de leis e regulamentos."},{"t":"p","x":"( ) Risco de compliance é o risco de sanções legais ou regulatórias, perdas financeiras ou danos reputacionais, medidas administrativas ou criminais aplicadas à empresa, decorrentes da falta de cumprimento de disposições legais, regulamentares, normas, autorregulações, padrões técnicos ou códigos de conduta."},{"t":"p","x":"( ) Assédios, bullying, discriminação, conduta trabalhista ilícita e outros tipos de comportamentos abusivos não causam danos à reputação da empresa, ao clima organizacional e aos colaboradores, nem geram impacto nos resultados. As afirmativas são, respectivamente,"}],"opts":["V – F – F – F.","F – V – V – V.","F – F – V – V.","F – V – V – F."],"gabStatus":"Definitivo","exp":"Governança não se resume a conflitos entre acionistas e gestores (F). Compliance é a aderência a normas internas e externas (V). A definição de risco de compliance está correta (V). Assédio e condutas abusivas causam danos à reputação, ao clima e aos resultados (F). Sequência: F – V – V – F."},{"id":"2024.1-47","ed":"2024.1","n":47,"mat":"Auditoria","gab":"D","stem":[{"t":"p","x":"Joaquim, auditor renomado, foi consultado pela firma de auditoria Novos Auditores ABC, com a seguinte problemática: ao realizarem a análise do Balanço Patrimonial de um de seus clientes, foi constatado um valor substancial de Fornecedores em seu Passivo em todos os meses, caracterizando um acordo firmado de maneira recorrente; apesar disso, não foi encontrado na documentação de seu cliente o contrato que assegurasse essa relação contratual. De acordo com a NBC TA 500 - EVIDÊNCIA DE AUDITORIA, nessa situação hipotética, assinale o procedimento mais adequado que Joaquim deveria indicar à firma Novos Auditores ABC, para que eles confirmassem tal relação."}],"opts":["Observação.","Recálculo.","Análise Recombinante.","Confirmação Externa."],"gabStatus":"Definitivo","exp":"Para confirmar saldo e relação contratual com fornecedor sem contrato na documentação, o procedimento adequado é a confirmação externa, que obtém evidência direto de terceiros."},{"id":"2024.1-48","ed":"2024.1","n":48,"mat":"Auditoria","gab":"B","stem":[{"t":"p","x":"Com base na NBC TA 705 – MODIFICAÇÕES NA OPINIÃO DO AUDITOR INDEPENDENTE, o tipo de parecer que o Auditor deve emitir quando, tendo obtido evidência de auditoria apropriada e suficiente, conclui que as distorções, individualmente ou em conjunto, são relevantes e generalizadas para as demonstrações contábeis é"}],"opts":["a opinião com ressalva.","a opinião adversa.","a abstenção de opinião.","o parágrafo de ênfase."],"gabStatus":"Definitivo","exp":"Distorções relevantes e generalizadas, com evidência suficiente obtida, levam à opinião adversa. A abstenção ocorre quando não se obtém evidência suficiente, e a ressalva é para relevantes mas não generalizadas."},{"id":"2024.1-49","ed":"2024.1","n":49,"mat":"Perícia","gab":"D","stem":[{"t":"p","x":"Acerca dos procedimentos periciais, julgue as afirmativas a seguir, considerando as disposições da NBC TP 01 (R1) – PERÍCIA CONTÁBIL:"},{"t":"p","x":"I. Indagação é a busca de informações mediante entrevista com conhecedores do objeto ou de fato relacionado à perícia."},{"t":"p","x":"II. Arbitramento é a determinação de valores e quantidades ou a solução de controvérsia por critério técnico-científico."},{"t":"p","x":"III. Vistoria é a análise de livros, registros de transações e documentos. Está correto apenas o que se afirma em"}],"opts":["II.","I e III.","III.","I e II."],"gabStatus":"Definitivo","exp":"I (indagação) e II (arbitramento) estão corretas. III errada: o que descreve é exame, e vistoria é a diligência para examinar pessoas, bens ou locais."},{"id":"2024.1-50","ed":"2024.1","n":50,"mat":"Perícia","gab":"A","stem":[{"t":"p","x":"No que tange ao conceito de honorários da perícia contábil, é correto afirmar, com base na NBC PP 01 (R1) – PERITO CONTÁBIL, que"}],"opts":["os honorários periciais fixados ou arbitrados e não quitados podem ser executados, judicialmente, pelo perito em conformidade com os dispositivos do Código de Processo Civil.","ainda que a perícia seja considerada inconclusiva ou ineficiente, não há hipótese prevista em lei que determine a devolução parcial ou total dos valores recebidos.","o perito nomeado pode requerer a liberação de até 30% dos honorários depositados, quando julgar necessário para o custeio antes do início dos trabalhos.","na elaboração da proposta de honorários, o perito deve considerar, entre outros fatores: quem será o magistrado da causa; quem são as partes da causa; a complexidade da matéria e o prazo estabelecido para o recebimento dos honorários. ESPAÇO PARA RASCUNHO ESPAÇO PARA RASCUNHO ESPAÇO PARA RASCUNHO ESPAÇO PARA RASCUNHO Realização"],"gabStatus":"Definitivo","exp":"Honorários periciais fixados ou arbitrados e não pagos podem ser cobrados judicialmente pelo perito. As demais alternativas contradizem a norma (por exemplo, a devolução de valores é prevista em certos casos, e os fatores da proposta não incluem quem é o juiz nem quem são as partes)."},{"id":"2024.2-1","ed":"2024.2","n":1,"mat":"Português","gab":"C","stem":[{"t":"p","x":"Um famoso escritor falou sobre a leitura: A leitura é para a mente o que a ginástica é para o corpo. Com essa frase, o autor quer dizer que"}],"opts":["exercícios físicos devem ser feitos todos os dias.","a leitura, como a ginástica, deve ser feita diariamente.","a leitura enriquece o nosso conhecimento.","exercícios físicos e leitura fortalecem o corpo."],"gabStatus":"Definitivo","exp":"A frase compara leitura e ginástica: assim como a ginástica fortalece o corpo, a leitura fortalece (enriquece) a mente e o conhecimento. Não fala de frequência diária."},{"id":"2024.2-2","ed":"2024.2","n":2,"mat":"Português","gab":"A","stem":[{"t":"p","x":"Assinale a frase que mostra uma expressão de causa devidamente explicada."}],"opts":["“De tanto que comeu, acabou passando mal”. / A expressão “De tanto que” apresenta a causa de algo como resultado da insistência de uma ação.","“Graças à chuva, as ruas ficaram alagadas”. / A expressão “Graças a” apresenta a causa como algo positivo.","“Ficou rico à custa de muito sacrifício”. / A expressão “à custa de” indica a causa de algo conhecido pelo interlocutor.","“Como haviam viajado bastante, eram bastante informados”. / O termo “Como” indica a causa como algo posterior ao acontecimento."],"gabStatus":"Definitivo","exp":"\"De tanto que comeu\" expressa causa por intensidade/insistência da ação, e a explicação está correta. Em B, \"graças a\" não tem a função de apontar só algo positivo do modo como a alternativa explica a frase (a chuva causou alagamento). Em C e D, as explicações dadas não correspondem ao sentido das expressões."},{"id":"2024.2-3","ed":"2024.2","n":3,"mat":"Mat. Financeira / Estatística","gab":"B","stem":[{"t":"p","x":"Um povoado tem 50 habitantes, dos quais 30 são do sexo feminino. Se duas pessoas diferentes desse povoado forem aleatoriamente escolhidas, a probabilidade de que ambas sejam do sexo feminino é aproximadamente igual a"}],"opts":["25%","35%","43%","60%"],"gabStatus":"Definitivo","exp":"Primeira escolhida: 30/50. Segunda, sem reposição: 29/49. Probabilidade = 30/50 × 29/49 = 870/2.450 ≈ 35,5%, ou seja, cerca de 35%."},{"id":"2024.2-4","ed":"2024.2","n":4,"mat":"Mat. Financeira / Estatística","gab":"A","stem":[{"t":"p","x":"Um capital inicial foi investido por um período. Ao fim da aplicação, o rendimento nominal foi de 80%, do qual deduziu-se imposto sobre o ganho de capital. A inflação acumulada nesse período foi de 5%. Se o ganho real dessa operação foi de 60%, é correto afirmar que a alíquota do imposto foi de"}],"opts":["15%","17,5%","20%","22,5%"],"gabStatus":"Definitivo","exp":"Ganho real de 60% com inflação de 5%: (1 + rendimento líquido) = 1,60 × 1,05 = 1,68, então o rendimento líquido foi 68%. O imposto tirou 80% − 68% = 12 pontos, que sobre 80% é 12 ÷ 80 = 15%."},{"id":"2024.2-5","ed":"2024.2","n":5,"mat":"Direito","gab":"C","stem":[{"t":"p","x":"João vendera determinada mercadoria para Pedro, mas não recebeu o respectivo pagamento. Em razão da amizade que os unia, João estava relutante em ingressar com uma ação judicial para a cobrança do respectivo valor, mas, com a proximidade do prazo prescricional, ficou preocupado. Ao conversar com Pedro, foi dito a João que ele não deveria se preocupar, pois ele, Pedro, renunciaria à prescrição. Ao analisar a disciplina estabelecida no Código Civil brasileiro, João concluiu corretamente que a renúncia que Pedro se propôs a realizar:"}],"opts":["não é admitida pela sistemática legal.","deve ser expressa, sendo vedada a renúncia tácita.","só pode ser realizada depois que a prescrição se consumar.","pode ser realizada antes ou após a consumação da prescrição, sendo expressa ou tácita."],"gabStatus":"Definitivo","exp":"Pelo Código Civil, a renúncia à prescrição só vale depois que a prescrição se consuma, e pode ser expressa ou tácita. Antes disso, não se admite."},{"id":"2024.2-6","ed":"2024.2","n":6,"mat":"Direito","gab":"C","stem":[{"t":"p","x":"João e Maria, únicos sócios da sociedade empresária Alfa, da qual Pedro era o contador responsável, faleceram em um acidente automobilístico quando se dirigiam para Alfa, não se podendo averiguar qual deles faleceu primeiro. Como João e Maria mantinham uma relação de parentesco, o momento da morte influenciaria na vocação hereditária de um e outro, o que, por via reflexa, também teria reflexos na transmissão das cotas do capital social. Nesse caso, ao analisar a sistemática estabelecida no Código Civil, Pedro concluiu corretamente que, na definição da ordem de falecimento de João e Maria, deve-se presumir que"}],"opts":["o mais velho faleceu primeiro.","o mais jovem faleceu primeiro.","faleceram ao mesmo tempo.","o que teve o inventário aberto antes faleceu primeiro."],"gabStatus":"Definitivo","exp":"Comoriência: se não se pode saber quem morreu primeiro entre pessoas que seriam herdeiras uma da outra, presume-se que faleceram simultaneamente."},{"id":"2024.2-7","ed":"2024.2","n":7,"mat":"Direito","gab":"B","stem":[{"t":"p","x":"Joana, contabilista, tomou ciência de que certo órgão colegiado de jurisdição administrativa, com competência para processar e julgar recursos interpostos contra decisões administrativas que tenham por objeto o imposto X, proferiu determinada decisão à qual a lei atribui eficácia normativa. Após analisar o Código Tributário Nacional em relação à entrada em vigor dos efeitos normativos da referida decisão, Joana concluiu corretamente que tais efeitos devem ocorrer, salvo disposição em contrário,"}],"opts":["na data da sua publicação.","trinta dias após a data da sua publicação.","noventa dias após a data da sua publicação.","no exercício financeiro seguinte à data da sua publicação."],"gabStatus":"Definitivo","exp":"Pelo CTN, as decisões administrativas com eficácia normativa entram em vigor 30 dias após a publicação, salvo disposição em contrário."},{"id":"2024.2-8","ed":"2024.2","n":8,"mat":"Ética","gab":"D","stem":[{"t":"p","x":"Considerando o CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR, em seu item 7, o contador deve estabelecer, por escrito, o valor dos serviços em suas propostas de prestação de serviços profissionais, considerando os elementos abaixo, à exceção de um. Assinale-o."}],"opts":["O tempo que será consumido para a realização do trabalho.","A possibilidade de ficar impedido da realização de outros serviços.","O resultado lícito favorável que, para o contratante, advirá com o serviço prestado.","A peculiaridade de tratar-se de cliente imprevisto."],"gabStatus":"Definitivo","exp":"A proposta de honorários considera tempo, possibilidade de ficar impedido de outros serviços, resultado lícito favorável ao contratante e a peculiaridade de o cliente ser eventual, habitual ou permanente. \"Cliente imprevisto\" não está na lista."},{"id":"2024.2-9","ed":"2024.2","n":9,"mat":"Ética","gab":"D","stem":[{"t":"p","x":"Considerando o CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR, em seu item 8, avalie se nas propostas para a prestação de serviços profissionais devem constar explicitamente:"},{"t":"p","x":"I. todos os serviços cobrados individualmente."},{"t":"p","x":"II. o valor de cada serviço."},{"t":"p","x":"III. a periodicidade."},{"t":"p","x":"IV. a forma de reajuste. Estão corretos os itens:"}],"opts":["I e II, apenas.","III e IV, apenas.","I, II e III, apenas.","I, II, III e IV."],"gabStatus":"Definitivo","exp":"Na proposta, devem constar explicitamente os serviços cobrados individualmente, o valor de cada um, a periodicidade e a forma de reajuste."},{"id":"2024.2-10","ed":"2024.2","n":10,"mat":"Ética","gab":"B","stem":[{"t":"p","x":"Avalie se o CÓDIGO DE ÉTICA PROFISSIONAL DO CONTADOR, em seu item 20, prevê as seguintes penalidades:"},{"t":"p","x":"I. Advertência reservada;"},{"t":"p","x":"II. Advertência pública;"},{"t":"p","x":"III. Censura reservada;"},{"t":"p","x":"IV. Censura pública. Estão corretos os itens"}],"opts":["I e II, apenas.","I, III e IV.","I, II e III.","II, III e IV."],"gabStatus":"Definitivo","exp":"As penalidades éticas previstas são advertência reservada, censura reservada e censura pública. Não existe advertência pública."},{"id":"2024.2-11","ed":"2024.2","n":11,"mat":"Ética","gab":"A","stem":[{"t":"p","x":"A ética é fundamental no exercício da contabilidade, pois garante a integridade, a transparência e a confiança nas informações financeiras divulgadas, aspectos essenciais para o bom funcionamento das empresas e a estabilidade econômica. O papel da contabilidade na sociedade vai além do simples registro de transações, pois ela atua como um mecanismo de"}],"opts":["controle.","auditoria.","manutenção.","aproximação."],"gabStatus":"Definitivo","exp":"A contabilidade vai além do registro de transações: atua como mecanismo de controle."},{"id":"2024.2-12","ed":"2024.2","n":12,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Considerado um fato relevante divulgado por uma empresa de capital aberto, a perspectiva de alto potencial de entrada de benefícios econômicos futuros na aquisição de um novo ativo operacional resultou em um aumento (de R$ 4,50 para R$ 60,50 no valor nominal) de suas ações negociadas em Bolsa de Valores no país e no exterior. Dois meses depois, verificou-se que tal fato relevante era falso e que o acionista majoritário tinha conhecimento disso, o que resultou em prejuízo de bilhões de reais para entidade e foi tratado como crime contra o mercado financeiro. Na divulgação inicial do fato relevante, a característica qualitativa fundamental que deixou de ser observada pela entidade foi a"}],"opts":["comparabilidade.","prudência.","verificabilidade.","representação fidedigna."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Divulgar como fato algo que era falso e que o controlador sabia ser falso fere a representação fidedigna, que exige informação completa, neutra e isenta de erros. Prudência, comparabilidade e verificabilidade são características de melhoria, e a que falhou aqui é uma característica fundamental."},{"id":"2024.2-13","ed":"2024.2","n":13,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"Um investidor está analisando as demonstrações contábeis de uma sociedade empresária. O investidor tem disponível, para a sua análise, as demonstrações referentes a 31/12/2023, mas não as dos exercícios anteriores. Nesse caso, o investidor não poderá verificar a seguinte característica qualitativa:"}],"opts":["relevância.","tempestividade.","comparabilidade.","compreensibilidade."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Comparabilidade é poder comparar a entidade com ela mesma em períodos diferentes ou com outras entidades. Sem as demonstrações de exercícios anteriores, o investidor não consegue ver a evolução, então não pode avaliar essa característica."},{"id":"2024.2-14","ed":"2024.2","n":14,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Leia o fragmento a seguir: Passivo é a obrigação _____ da entidade de transferir um recurso econômico como resultado de eventos _____. Assinale a opção cujos itens completam corretamente as lacunas do fragmento acima."}],"opts":["futura / presente","futura / passados","presente / futuros","presente / passados"],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"Passivo é uma obrigação presente da entidade de transferir um recurso econômico, resultante de eventos passados. A obrigação existe hoje, e o fato que a gerou já aconteceu."},{"id":"2024.2-15","ed":"2024.2","n":15,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"A NBC TG Estrutura Conceitual – ESTRUTURA CONCEITUAL PARA RELATÓRIO FINANCEIRO indica o conceito financeiro e o conceito físico de capital. De acordo com a norma, a seleção do conceito apropriado de capital pela entidade deve ser baseada"}],"opts":["na forma jurídica dos atos e fatos contábeis.","na essência econômica dos atos e fatos contábeis.","nas determinações das entidades reguladoras.","nas necessidades dos usuários de suas demonstrações contábeis."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"A norma diz que a escolha entre o conceito financeiro e o físico de capital deve se basear nas necessidades dos usuários das demonstrações. Não depende de forma jurídica, de regulador nem da essência dos fatos."},{"id":"2024.2-16","ed":"2024.2","n":16,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"Com relação à Resolução CFC nº 1.328/11, que dispõe sobre a Estrutura das Normas Brasileiras de Contabilidade, avalie as afirmativas a seguir e assinale (V) para a verdadeira e (F) para a falsa."},{"t":"p","x":"( ) As Normas Brasileiras de Contabilidade classificam-se em Profissionais, Técnicas e Educacionais."},{"t":"p","x":"( ) As Normas Brasileiras de Contabilidade estabelecem preceitos de conduta profissional, procedimentos técnicos necessários para o adequado exercício profissional e metodologia para o ensino adequado das normas."},{"t":"p","x":"( ) As Normas Brasileiras de Contabilidade editadas pelo Conselho Federal de Contabilidade (CFC) devem seguir os mesmos padrões de elaboração e estilo utilizados nas normas internacionais e compreendem as Normas propriamente ditas, as Interpretações Técnicas e os Comunicados Técnicos. As afirmativas são, respectivamente,"}],"opts":["F – V – V.","V – F – V.","V – V – F.","F – F – V."],"gabStatus":"Definitivo","ass":"Estrutura Conceitual e qualidades da informação","exp":"A Resolução 1.328 classifica as NBC em Profissionais e Técnicas, e não em Educacionais, então a primeira é falsa. A segunda é falsa porque as NBC definem conduta e procedimentos técnicos, mas não metodologia de ensino. A terceira é verdadeira: seguem o padrão das normas internacionais e compreendem as normas, as Interpretações e os Comunicados Técnicos. Resposta: F, F, V."},{"id":"2024.2-17","ed":"2024.2","n":17,"mat":"Contabilidade Geral","gab":"C","stem":[{"t":"p","x":"De acordo com a NBC TG 27 (R4) – ATIVO IMOBILIZADO, o custo de um item do ativo imobilizado compreende, entre outros, quaisquer custos diretamente atribuíveis para colocar o ativo no local e as condições necessárias para ele ser capaz de funcionar da forma pretendida pela administração. Entre os custos diretamente atribuíveis estão os custos"}],"opts":["de abertura de nova instalação.","incorridos na introdução de novo produto ou serviço.","com testes para verificar se o ativo está funcionando corretamente.","da transferência das atividades para novo local ou para nova categoria de clientes."],"gabStatus":"Definitivo","ass":"Imobilizado, depreciação, impairment","exp":"Testes para verificar se o ativo funciona corretamente são custo diretamente atribuível e entram no custo do imobilizado. Abertura de nova instalação, introdução de novo produto e transferência de atividades são gastos que a norma manda lançar no resultado."},{"id":"2024.2-18","ed":"2024.2","n":18,"mat":"Contabilidade Geral","gab":"D","stem":[{"t":"p","x":"De acordo com a NBC TG 26 (R5) – APRESENTAÇÃO DAS DEMONSTRAÇÕES CONTÁBEIS, a informação é material se sua omissão, distorção ou obscuridade pode influenciar, de modo razoável, decisões que os usuários primários das demonstrações contábeis de propósito geral tomam como base nessas demonstrações contábeis que fornecem informações financeiras sobre relatório específico da entidade. Com base nesse enunciado, leia o fragmento a seguir. A materialidade depende da _____ ou _____ da informação, ou de ambas. A entidade avalia se a informação, individualmente ou em combinação com outra informação, é material no contexto das suas demonstrações contábeis tomadas como um todo. Assinale a alternativa cujos itens completam corretamente as lacunas do fragmento acima."}],"opts":["rapidez - fonte.","natureza - fonte.","rapidez - magnitude.","natureza - magnitude."],"gabStatus":"Definitivo","ass":"Balanço, Lei 6.404, PL, dividendos, notas","exp":"A materialidade depende da natureza ou da magnitude da informação, ou de ambas. Algo pequeno em valor pode ser material pela natureza (por exemplo, uma fraude), e algo grande pode ser material pela magnitude."},{"id":"2024.2-19","ed":"2024.2","n":19,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"A NBC TG 25 – PROVISÕES, PASSIVOS CONTINGENTES E ATIVOS CONTINGENTES ilustra o tratamento contábil quando uma obrigação presente ou possível da entidade envolve prazos ou valores incertos. Com base na referida norma, relacione o tratamento dado a cada situação a seguir com seu reconhecimento e divulgação."},{"t":"p","x":"I. Há obrigação presente que provavelmente requer uma saída de recursos."},{"t":"p","x":"II. Há obrigação possível ou obrigação presente que pode requerer, mas provavelmente não irá requerer, uma saída de recursos."},{"t":"p","x":"III. Há obrigação possível ou obrigação presente cuja probabilidade de uma saída de recursos é remota."},{"t":"p","x":"( ) Não é reconhecida nenhuma provisão e não há obrigatoriedade de divulgação."},{"t":"p","x":"( ) Deve-se reconhecer a provisão e divulgar em nota explicativa."},{"t":"p","x":"( ) Não é reconhecida a provisão, mas é divulgado o fato em nota explicativa como passivo contingente."},{"t":"p","x":"A relação correta, na ordem apresentada, é"}],"opts":["III – I – II.","III – II – I.","II – I – III.","I – III – II."],"gabStatus":"Definitivo","ass":"Provisões e contingências (TG 25)","exp":"Provável saída de recursos: reconhece provisão e divulga (I). Possível, mas não provável: passivo contingente, só divulga (II). Remota: nem reconhece nem divulga (III). A ordem pedida é a das lacunas: III, I, II."},{"id":"2024.2-20","ed":"2024.2","n":20,"mat":"Contabilidade Geral","gab":"A","stem":[{"t":"p","x":"Uma sociedade empresária po
